<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões de memória — Som: das vibrações à medicina</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciência · Ciclo 4 · Nível 5</div><h1>Cartões de memória</h1><p class="sous">Som: das vibrações à medicina</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "O que é um som?", "r": "Um som é uma vibração que se espalha em um meio."}, {"q": "Como é que um som se espalha?", "r": "Um som espalha-se movendo moléculas do meio para o meio."}, {"q": "Que meio é necessário para que o som se espalhe?", "r": "O som se espalha em um meio material, como ar, água ou metal."}, {"q": "Quão rápido o som se espalha no ar?", "r": "O som espalha-se cerca de 340 metros por segundo no ar."}, {"q": "Quais são as duas magnitudes que descrevem um som?", "r": "O som é descrito pela sua frequência e amplitude."}, {"q": "Qual é o impacto de uma alta frequência no som?", "r": "Uma alta frequência dá um som agudo."}, {"q": "Qual é o impacto da amplitude no som?", "r": "Uma amplitude maior dá um som mais forte."}, {"q": "Qual é o selo?", "r": "O carimbo é a característica distintiva de um som, determinada pelo instrumento ou fonte."}, {"q": "Qual é o papel do tímpano?", "r": "O tímpano começa a vibrar quando recebe um som, transmitindo movimento para três pequenos ossos."}, {"q": "Qual é o espectro auditivo humano?", "r": "O ouvido humano significa entre 20 e 20.000 hertz."}, {"q": "Quais são os infravermelhos e ultra-sons?", "r": "Os infravermelhos são sons de frequência muito baixa, enquanto os ultra-sons são sons de frequência muito alta."}, {"q": "O que é ultra-som ultra-rápido?", "r": "O ultra-som ultra-rápido produz imagens muito mais rápidas do que os ultra-sons convencionais, permitindo que o sangue circule em tempo real."}, {"q": "Quem é Mickael Tanter e qual é o seu papel na área médica?", "r": "Mickael Tanter é um físico que usa o ultrassom para criar imagens médicas sem exposição à radiação nociva, inclusive para diagnosticar e tratar doenças cardíacas."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
