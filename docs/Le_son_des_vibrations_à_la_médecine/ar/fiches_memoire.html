<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطاقات الذاكرة - الصوت: من الاهتزاز إلى الطب</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>بطاقات الذاكرة</h1><p class="sous">الصوت: من الاهتزاز إلى الطب</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "ما هو الصوت؟", "r": "الصوت هو اهتزازات تنتشر في وسط"}, {"q": "كيف ينتشر الصوت؟", "r": "الصوت ينتشر عن طريق نقل الجزيئات من الوسط إلى الوسط"}, {"q": "ما هي الوسيلة اللازمة لنشر الصوت؟", "r": "ينتشر الصوت في وسيط مادي مثل الهواء أو الماء أو المعدن."}, {"q": "ما مدى سرعة انتشار الصوت في الهواء؟", "r": "الصوت ينتشر حوالي 340 متر في الثانية في الهواء"}, {"q": "ما هي الجسامتين التي تصف الصوت؟", "r": "ويصف الصوت تواتره وضخمه."}, {"q": "ما تأثير التردد العالي على الصوت؟", "r": "التردد العالي يعطي صوت حاد"}, {"q": "ما تأثير الضخ على الصوت؟", "r": "الضخ الأكبر يعطي صوتا أقوى."}, {"q": "ما هو الختم؟", "r": "والطابع هو السمة المميزة للصوت، التي يحددها الصك أو المصدر."}, {"q": "ما هو دور الأذن؟", "r": "الأذن تبدأ بالهزاز عندما تتلقى صوتاً، تنقل إلى ثلاثة عظام صغيرة."}, {"q": "ما هو طيف السمع البشري؟", "r": "الأذن البشرية تعني ما بين 20 و000 20 هرتز"}, {"q": "ما هي الصوتيات و الموجات فوق الصوتية؟", "r": "الصوت ضعيف جداً، بينما الموجات فوق الصوتية عالية التردد جداً."}, {"q": "ما هو الموجات فوق الصوتية؟", "r": "تُنتج الموجات فوق الصوتية فوق الصوتية بشكل أسرع بكثير من الموجات فوق الصوتية التقليدية، مما يتيح للدم أن يُعمم في الوقت الحقيقي."}, {"q": "من هو (ميكائيل تانتر) وما دوره في الميدان الطبي؟", "r": "Mickael Tanter is a physicist who uses ultrasound to create medical images without exposure to harmful radiation, including to diagnose and treat heart disease."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
