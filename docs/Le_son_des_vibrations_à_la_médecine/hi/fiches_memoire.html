<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी कार्ड - ध्वनि: कंपन से लेकर दवा तक</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · साइकिल 4 · स्तर 5</div><h1>मेमोरी कार्ड</h1><p class="sous">ध्वनि: कंपन से दवा तक</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "ध्वनि क्या है?", "r": "ध्वनि एक कंपन है जो एक माध्यम में फैलता है।"}, {"q": "ध्वनि कैसे फैलती है?", "r": "एक ध्वनि मध्य से मध्य तक चलती अणुओं से फैलती है।"}, {"q": "ध्वनि के लिए क्या माध्यम की आवश्यकता है?", "r": "ध्वनि एक भौतिक माध्यम जैसे हवा, पानी या धातु में फैलती है।"}, {"q": "कैसे तेजी से ध्वनि हवा में फैलता है?", "r": "ध्वनि हवा में लगभग 340 मीटर प्रति सेकंड फैलती है।"}, {"q": "क्या दो परिमाण हैं जो ध्वनि का वर्णन करते हैं?", "r": "ध्वनि इसकी आवृत्ति और आयाम द्वारा वर्णित है।"}, {"q": "ध्वनि पर उच्च आवृत्ति का प्रभाव क्या है?", "r": "एक उच्च आवृत्ति एक तीव्र ध्वनि देता है।"}, {"q": "ध्वनि पर आयाम का प्रभाव क्या है?", "r": "एक बड़ा आयाम एक मजबूत ध्वनि देता है।"}, {"q": "टिकट क्या है?", "r": "टिकट एक ध्वनि की विशिष्ट विशेषता है, जो साधन या स्रोत द्वारा निर्धारित है।"}, {"q": "इयरड्रम की भूमिका क्या है?", "r": "जब यह एक ध्वनि प्राप्त करता है, आंदोलन को तीन छोटी हड्डियों में संचारित करता है तो इयरड्रम को हिलाना शुरू हो जाता है।"}, {"q": "मानव श्रवण स्पेक्ट्रम क्या है?", "r": "मानव कान का मतलब 20 से 20,000 हेर्ट्ज है।"}, {"q": "Infrasounds और अल्ट्रासाउंड क्या हैं?", "r": "इन्फ्रासन बहुत कम आवृत्ति वाली ध्वनियां हैं, जबकि अल्ट्रासाउंड बहुत उच्च आवृत्ति वाली ध्वनियां हैं।"}, {"q": "अल्ट्राफास्ट अल्ट्रासाउंड क्या है?", "r": "अल्ट्राफास्ट अल्ट्रासाउंड पारंपरिक अल्ट्रासाउंड की तुलना में बहुत तेजी से छवियां पैदा करता है, जिससे रक्त वास्तविक समय में प्रसारित होने की अनुमति मिलती है।"}, {"q": "Mickael Tanter कौन है और चिकित्सा क्षेत्र में उनकी भूमिका क्या है?", "r": "Mickael Tanter एक भौतिक विज्ञानी है जो हानिकारक विकिरण के संपर्क के बिना चिकित्सा छवियों को बनाने के लिए अल्ट्रासाउंड का उपयोग करता है, जिसमें हृदय रोग का निदान और इलाज शामिल है।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
