<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas de memoria — Sonido: de las vibraciones a la medicina</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Tarjetas de memoria</h1><p class="sous">Sonido: de vibraciones a medicina</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Qué es un sonido?", "r": "Un sonido es una vibración que se extiende en un medio."}, {"q": "¿Cómo se propaga un sonido?", "r": "Un sonido se propaga moviendo moléculas de medio a medio."}, {"q": "¿Qué medio se necesita para que el sonido se disemine?", "r": "El sonido se extiende en un medio material como aire, agua o metal."}, {"q": "¿Qué tan rápido se extiende el sonido en el aire?", "r": "El sonido se extiende alrededor de 340 metros por segundo en el aire."}, {"q": "¿Cuáles son las dos magnitudes que describen un sonido?", "r": "El sonido es descrito por su frecuencia y amplitud."}, {"q": "¿Cuál es el impacto de una alta frecuencia en el sonido?", "r": "Una alta frecuencia da un sonido agudo."}, {"q": "¿Cuál es el impacto de la amplitud en el sonido?", "r": "Una amplitud más grande da un sonido más fuerte."}, {"q": "¿Cuál es el sello?", "r": "El sello es la característica distintiva de un sonido, determinada por el instrumento o fuente."}, {"q": "¿Cuál es el papel del tímpano?", "r": "El tímpano comienza a vibrar cuando recibe un sonido, transmitiendo el movimiento a tres pequeños huesos."}, {"q": "¿Cuál es el espectro auditivo humano?", "r": "El oído humano significa entre 20 y 20.000 hertz."}, {"q": "¿Cuáles son los infrasonidos y los ultrasonidos?", "r": "Los infrasonidos son sonidos de baja frecuencia, mientras que los ultrasonidos son sonidos de alta frecuencia."}, {"q": "¿Qué es ultrarrápida?", "r": "El ultrasonido ultrarrápido produce imágenes mucho más rápido que los ultrasonidos convencionales, permitiendo que la sangre circula en tiempo real."}, {"q": "¿Quién es Mickael Tanter y cuál es su papel en el campo médico?", "r": "Mickael Tanter es un físico que utiliza ultrasonido para crear imágenes médicas sin exposición a la radiación nociva, incluyendo diagnosticar y tratar enfermedades cardíacas."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
