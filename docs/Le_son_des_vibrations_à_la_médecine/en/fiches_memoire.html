<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fact Sheets — Sound: From Vibration to Medicine</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · level 5ème</div><h1>Memory Sheets</h1><p class="sous">Sound: From Vibration to Medicine</p><p class="sous">Read the question, answer in your head, then click on the card to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide All</button></p><div id="c"></div></main><script>const C=[{"q": "What is a sound?", "r": "A sound is a vibration that propagates in a medium."}, {"q": "How does a sound propagate?", "r": "A sound propagates by moving the molecules in the middle from one side to the other."}, {"q": "What medium is needed for the sound to propagate?", "r": "Sound propagates in a material medium such as air, water or metal."}, {"q": "How fast does sound travel through the air?", "r": "The sound propagates at about 340 meters per second through the air."}, {"q": "What are the two magnitudes that describe a sound?", "r": "Sound is described by its frequency and amplitude."}, {"q": "What is the impact of high frequency on sound?", "r": "A high frequency gives a high-pitched sound."}, {"q": "What is the impact of amplitude on sound?", "r": "A larger amplitude gives a louder sound."}, {"q": "What is the stamp?", "r": "Timbre is the distinctive feature of a sound, determined by the instrument or source."}, {"q": "What is the role of the eardrum in the ear?", "r": "The eardrum begins to vibrate when it receives a sound, transmitting the movement to three tiny bones."}, {"q": "What is the human hearing spectrum?", "r": "The human ear hears between 20 and 20,000 hertz."}, {"q": "What are infrasound and ultrasound?", "r": "Infrasound is very low frequency sound, while ultrasound is very high frequency sound."}, {"q": "What is ultrafast ultrasound?", "r": "Ultrafast ultrasound produces images much faster than conventional ultrasounds, allowing blood to flow in real time."}, {"q": "Who is Mickael Tanter and what is his role in the medical field?", "r": "Mickael Tanter is a physicist who uses ultrasound to create medical images without exposure to harmful radiation, including to diagnose and treat heart disease."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
