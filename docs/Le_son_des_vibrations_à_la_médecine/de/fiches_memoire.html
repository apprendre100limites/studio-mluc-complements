<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherkarten - Sound: Von Vibrationen bis Medizin</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Wissenschaft · Zyklus 4 · Level 5</div><h1>Speicherkarten</h1><p class="sous">Sound: Von Vibrationen zur Medizin</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Was ist ein Sound?", "r": "Ein Klang ist eine Vibration, die sich in einem Medium ausbreitet."}, {"q": "Wie verbreitet sich ein Sound?", "r": "Ein Geräusch breitet sich aus, indem es Moleküle von Mitte zu Mitte bewegt."}, {"q": "Welches Medium wird benötigt, damit sich Ton ausbreitet?", "r": "Schall breitet sich in einem materiellen Medium wie Luft, Wasser oder Metall aus."}, {"q": "Wie schnell verbreitet sich der Schall in der Luft?", "r": "Der Schall breitet sich etwa 340 Meter pro Sekunde in der Luft aus."}, {"q": "Was sind die zwei Größen, die einen Klang beschreiben?", "r": "Der Klang wird durch seine Frequenz und Amplitude beschrieben."}, {"q": "Welche Auswirkungen hat eine hohe Frequenz auf den Klang?", "r": "Eine hohe Frequenz gibt einen spitzen Ton."}, {"q": "Welche Auswirkungen hat die Amplitude auf den Klang?", "r": "Eine größere Amplitude ergibt einen stärkeren Klang."}, {"q": "Was ist der Stempel?", "r": "Der Stempel ist das charakteristische Merkmal eines Klangs, das durch das Instrument oder die Quelle bestimmt wird."}, {"q": "Welche Rolle spielt das Trommelfell?", "r": "Das Trommelfell beginnt zu vibrieren, wenn es ein Geräusch empfängt und Bewegung auf drei winzige Knochen überträgt."}, {"q": "Was ist das menschliche Hörspektrum?", "r": "Das menschliche Ohr bedeutet zwischen 20 und 20.000 Hertz."}, {"q": "Was sind Infraschall und Ultraschall?", "r": "Infrasonen sind sehr niederfrequente Geräusche, während Ultraschall sehr hochfrequente Geräusche sind."}, {"q": "Was ist ultraschneller Ultraschall?", "r": "Ultraschneller Ultraschall erzeugt Bilder viel schneller als herkömmliche Ultraschallgeräte, so dass Blut in Echtzeit zirkulieren kann."}, {"q": "Wer ist Mickael Tanter und was ist seine Rolle im medizinischen Bereich?", "r": "Mickael Tanter ist ein Physiker, der Ultraschall verwendet, um medizinische Bilder ohne schädliche Strahlung zu erstellen, einschließlich zur Diagnose und Behandlung von Herzerkrankungen."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
