<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Le son : des vibrations à la médecine</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Fiches mémoire</h1><p class="sous">Le son : des vibrations à la médecine</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Qu'est-ce qu'un son ?", "r": "Un son est une vibration qui se propage dans un milieu."}, {"q": "Comment se propage un son ?", "r": "Un son se propage en faisant bouger les molécules du milieu d'un côté à l'autre."}, {"q": "Quel milieu est nécessaire pour que le son se propage ?", "r": "Le son se propage dans un milieu matériel comme l'air, l'eau ou le métal."}, {"q": "À quelle vitesse se propage le son dans l'air ?", "r": "Le son se propage à environ 340 mètres par seconde dans l'air."}, {"q": "Quelles sont les deux grandeurs qui décrivent un son ?", "r": "Le son est décrit par sa fréquence et son amplitude."}, {"q": "Quel est l'impact d'une fréquence élevée sur le son ?", "r": "Une fréquence élevée donne un son aigu."}, {"q": "Quel est l'impact de l'amplitude sur le son ?", "r": "Une amplitude plus grande donne un son plus fort."}, {"q": "Qu'est-ce que le timbre ?", "r": "Le timbre est la particularité distinctive d'un son, déterminée par l'instrument ou la source."}, {"q": "Quel est le rôle du tympan dans l'oreille ?", "r": "Le tympan se met à vibrer lorsqu'il reçoit un son, transmettant le mouvement à trois os minuscules."}, {"q": "Quel est le spectre d'audition humain ?", "r": "L'oreille humaine entend entre 20 et 20 000 hertz."}, {"q": "Quels sont les infrasons et les ultrasons ?", "r": "Les infrasons sont des sons très bas en fréquence, tandis que les ultrasons sont des sons très hauts en fréquence."}, {"q": "Qu'est-ce que l'échographie ultrarapide ?", "r": "L'échographie ultrarapide produit des images beaucoup plus rapidement que les échographies classiques, permettant de voir le sang circuler en temps réel."}, {"q": "Qui est Mickael Tanter et quel est son rôle dans le domaine médical ?", "r": "Mickael Tanter est un physicien qui utilise les ultrasons pour créer des images médicales sans exposition à des rayonnements nocifs, notamment pour diagnostiquer et traiter les maladies cardiaques."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
