<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas de memoria — Introducción a la velocidad y el movimiento</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Tarjetas de memoria</h1><p class="sous">Introducción a la velocidad y el movimiento</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Cuál es la trayectoria?", "r": "La trayectoria es el conjunto de posiciones sucesivas de un objeto en movimiento."}, {"q": "¿Cuál es la fórmula para calcular la velocidad promedio?", "r": "La velocidad promedio es la distancia dividida por duración."}, {"q": "¿Cuál es la unidad de velocidad internacional?", "r": "La unidad internacional de velocidad es el metro por segundo."}, {"q": "¿Qué es la velocidad instantánea?", "r": "La velocidad instantánea es la indicada por el medidor en un momento preciso."}, {"q": "¿Cuáles son las tres características de la velocidad instantánea?", "r": "Una velocidad instantánea tiene valor, dirección y dirección."}, {"q": "¿Qué es un movimiento uniforme?", "r": "Un movimiento uniforme es un movimiento donde el valor de la velocidad sigue siendo constante, incluso si la dirección cambia."}, {"q": "¿Por qué deberíamos frenar antes de un giro?", "r": "Acelerar antes de un giro reduce el riesgo de salida en caso de alta velocidad."}, {"q": "¿Cuál es el efecto de la alta velocidad en un giro?", "r": "A alta velocidad, un vehículo tiende a continuar recto a su vez."}, {"q": "¿Cómo pasar de kilómetros por hora a metros por segundo?", "r": "Partimos a través de 3.6 para pasar de kilómetros por hora a metros por segundo."}, {"q": "¿Cómo pasar de metros por segundo a kilómetros por hora?", "r": "Nos multiplicamos por 3.6 para pasar de metros por segundo a kilómetros por hora."}, {"q": "¿Por qué es importante frenar antes de un giro?", "r": "Acelerar antes de un giro reduce la velocidad y minimiza el riesgo de salida."}, {"q": "¿Para qué es la velocidad de la aviación?", "r": "La velocidad de la aviación es importante para garantizar la seguridad del vuelo y optimizar el rendimiento de las aeronaves."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
