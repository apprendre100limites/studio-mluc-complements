<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Introducción a la velocidad y al movimiento</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Quiz</h1><p class="sous">Introducción a la velocidad y el movimiento</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Qué es una trayectoria?", "choix": ["La dirección del movimiento", "Tiempo para viajar a distancia", "Todas las posiciones sucesivas ocupadas por objeto en movimiento", "La distancia total viajó"], "bonne": 2, "explication": "Según el texto, la trayectoria es \"el conjunto de posiciones que ocupa sucesivamente\"."}, {"question": "¿Qué ejemplo corresponde a un movimiento recto?", "choix": ["Un viaje regular de velocidad", "Luces de coche en un camino derecho", "Una gran vaina de rueda", "Un coche que se acelera en una línea recta"], "bonne": 1, "explication": "El texto indica que los faros del coche, por la noche, en un camino derecho corresponden a un movimiento recto."}, {"question": "¿Cómo calculamos la velocidad media?", "choix": ["Multiplicando distancia por duración", "Añadiendo distancia y duración", "Al restar la longitud de la distancia", "Dividiendo distancia por duración"], "bonne": 3, "explication": "El texto dice que la velocidad promedio es \"la distancia viajada dividida por duración\"."}, {"question": "En un movimiento recto, ¿qué elemento puede cambiar?", "choix": ["Gestión", "La distancia viajó", "El valor de la velocidad", "La dirección del movimiento"], "bonne": 2, "explication": "El texto explica que en un movimiento recto, \"la dirección no cambia, pero el valor puede cambiar\"."}, {"question": "¿Por qué es mejor frenar antes de entrar en un giro que frenar en el medio?", "choix": ["Porque es más económico.", "Porque arriesgamos la salida de la carretera", "Porque las ruedas pierden su agarre", "Porque la dirección cambia más rápido"], "bonne": 1, "explication": "El texto dice que al frenar en el medio, \"usted arriesga la salida\"."}, {"question": "¿Qué mide un radar de carretera?", "choix": ["Distancia entre vehículos", "Velocidad del vehículo", "Tiempo de aceleración", "Gestión del tráfico"], "bonne": 1, "explication": "El texto indica que una \"radar mide la velocidad del vehículo\"."}, {"question": "Un ciclista viaja 30 kilómetros en una hora y treinta. ¿Cuál es su velocidad promedio?", "choix": ["Treinta kilómetros por hora", "Cuarenta kilómetros por hora", "Veinte kilómetros por hora", "Diez kilómetros por hora"], "bonne": 2, "explication": "El texto muestra que treinta divididos por un decimal cinco da veinte, por lo que la velocidad media es de veinte kilómetros por hora."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
