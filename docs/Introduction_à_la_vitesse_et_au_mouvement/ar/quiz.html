<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Introduction to speed and movement</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>Quiz</h1><p class="sous">التعريف بالسرعة والحركة</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ما هو مسار؟", "choix": ["اتجاه الحركة", "وقت السفر", "جميع المواقع المتعاقبة التي يشغلها الجسم المتحرك", "المسافة الإجمالية التي قطعت"], "bonne": 2, "explication": "وفقاً للنص، المسار هو \"مجموعة المواقف التي تشغلها متتالية\""}, {"question": "أي مثال يطابق حركة مستقيمة؟", "choix": ["ركوب سريع منتظم", "أضواء السيارة على الطريق الصحيح", "علبة عجلات كبيرة", "سيارة تتسارع في خط مستقيم"], "bonne": 1, "explication": "ويشير النص إلى أن الأضواء الأمامية للسيارة، في الليل، على الطريق الصحيح تقابل حركة مستقيمة."}, {"question": "كيف نحسب متوسط السرعة؟", "choix": ["عن طريق مضاعفة المسافة حسب المدة", "إضافة المسافة والمدة", "بطرح طول المسافة", "عن طريق تقسيم المسافة حسب المدة"], "bonne": 3, "explication": "النص يقول أن متوسط السرعة هو \"المسافة المقطعة مقسمة حسب المدة\""}, {"question": "في حركة مستقيمة، أي عنصر يمكن أن يتغير؟", "choix": ["الإدارة", "المسافة التي قطعت", "قيمة السرعة", "اتجاه الحركة"], "bonne": 2, "explication": "النص يُوضّحُ بأنّ في a إقتراح مستقيم، \"الإتجاه لا يَتغيّرُ، لكن القيمة يُمْكِنُ أَنْ تَتغيّرَ.\""}, {"question": "لماذا من الأفضل أن تتباطأ قبل أن تتحول من أن تتفاخر في الوسط؟", "choix": ["لأنه أكثر اقتصاداً", "لأننا نخاطر بالخروج من الطريق", "لأن العجلات تفقد قبضتها", "لأن الاتجاه يتغير بسرعة"], "bonne": 1, "explication": "النص يقول أنه بالتفاخر في الوسط \"تخاطر بالخروج\""}, {"question": "ما هو قياس الرادار؟", "choix": ["المسافة بين المركبات", "سرعة المركبات", "وقت التعجيل", "إدارة المرور"], "bonne": 1, "explication": "النص يُشير إلى أنّ \"الدار يُقيس سرعة السيارة\""}, {"question": "يسافر الدراجة على بعد 30 كيلومترا في ساعة و ثلاثين. ما هو متوسط سرعته؟", "choix": ["30 كيلومترا في الساعة", "أربعون كيلومترا في الساعة", "٢٠ كيلومترا في الساعة", "عشرة كيلومترات في الساعة"], "bonne": 2, "explication": "ويبين النص أن ثلاثين مقسماً بعشرة عشرية وخمسة تعطي عشرين، وبذلك يبلغ متوسط السرعة 20 كيلومتراً في الساعة."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
