<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Introduction to Speed and Movement</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Quiz</h1><p class="sous">Introduction to speed and movement</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What is a trajectory?", "choix": ["The direction of the movement", "The time it takes to travel a distance", "All successive positions occupied by a moving object", "The total distance traveled"], "bonne": 2, "explication": "According to the text, the trajectory is \"the set of positions it successively occupies\"."}, {"question": "Which example corresponds to a rectilinear movement?", "choix": ["A steady speed merry-go-round", "Car headlights on a straight road", "A ferris wheel nacelle", "A car that accelerates in a straight line"], "bonne": 1, "explication": "The text indicates that the car headlights, at night, on a straight road correspond to a rectilinear movement."}, {"question": "How is the average speed calculated?", "choix": ["By multiplying the distance by the duration", "Adding distance and time", "By subtracting the duration from the distance", "By dividing the distance by the duration"], "bonne": 3, "explication": "The text says that the average speed is “the distance travelled divided by the duration”."}, {"question": "In a rectilinear movement, which element can change?", "choix": ["Management", "The distance traveled", "The speed value", "The sense of movement"], "bonne": 2, "explication": "The text explains that in a rectilinear movement, “the direction does not change, but the value can change”."}, {"question": "Why is it better to slow down before entering a corner than to brake in the middle?", "choix": ["Because it's more economical", "Because we risk getting off the road", "Because the wheels lose their grip", "Because the direction changes faster"], "bonne": 1, "explication": "The text says that by braking in the middle, \"you then risk the exit of\"."}, {"question": "What does a road radar measure?", "choix": ["Distance between vehicles", "The speed of the vehicles", "Acceleration time", "Traffic management"], "bonne": 1, "explication": "The text indicates that a “radar measures the speed of vehicles”."}, {"question": "A cyclist travels thirty kilometers in an hour and a half. What is its average speed?", "choix": ["Thirty kilometers per hour", "Forty kilometers per hour", "Twenty kilometers per hour", "Ten kilometers per hour"], "bonne": 2, "explication": "The text shows that thirty divided by a comma five gives twenty, so the average speed is twenty kilometers per hour."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Fair. '+q.explication}else{e.innerHTML='❌ The correct answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
