<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fact Sheets — Introduction to Speed and Movement</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Memory Sheets</h1><p class="sous">Introduction to speed and movement</p><p class="sous">Read the question, answer in your head, then click on the card to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide All</button></p><div id="c"></div></main><script>const C=[{"q": "What is the trajectory?", "r": "The trajectory is the set of successive positions of a moving object."}, {"q": "What is the formula for calculating the average speed?", "r": "The average speed is the distance divided by the duration."}, {"q": "What is the international unit of speed?", "r": "The international unit of speed is the meter per second."}, {"q": "What is instantaneous speed?", "r": "The instantaneous speed is that indicated by the meter at a specific time."}, {"q": "What are the three characteristics of an instantaneous speed?", "r": "An instant speed has a value, a direction and a direction."}, {"q": "What is a uniform movement?", "r": "A uniform motion is a motion where the speed value remains constant even if the direction changes."}, {"q": "Why do you have to slow down before a turn?", "r": "Slowing down before a turn reduces the risk of off-roading at high speeds."}, {"q": "What is the effect of high speed in a turn?", "r": "At high speed, a vehicle tends to continue straight into a curve."}, {"q": "How do you go from kilometers per hour to meters per second?", "r": "We divide by 3.6 to go from kilometers per hour to meters per second."}, {"q": "How to go from meters per second to kilometers per hour?", "r": "Multiply by 3.6 to go from meters per second to kilometers per hour."}, {"q": "Why is it important to slow down before a turn?", "r": "Slowing down before a turn reduces speed and minimizes the risk of off-roading."}, {"q": "What is the purpose of speed in aviation?", "r": "Aviation speed is important to ensure flight safety and optimize aircraft performance."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
