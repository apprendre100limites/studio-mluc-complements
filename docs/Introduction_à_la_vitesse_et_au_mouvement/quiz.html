<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Introduction à la vitesse et au mouvement</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Quiz</h1><p class="sous">Introduction à la vitesse et au mouvement</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Qu'est-ce qu'une trajectoire ?", "choix": ["La direction du mouvement", "Le temps mis pour parcourir une distance", "L'ensemble des positions successives occupées par un objet en mouvement", "La distance totale parcourue"], "bonne": 2, "explication": "Selon le texte, la trajectoire est « l'ensemble des positions qu'il occupe successivement »."}, {"question": "Quel exemple correspond à un mouvement rectiligne ?", "choix": ["Un manège à vitesse régulière", "Des phares de voiture sur une route droite", "Une nacelle de grande roue", "Une voiture qui accélère en ligne droite"], "bonne": 1, "explication": "Le texte indique que les phares de voiture, de nuit, sur une route droite correspondent à un mouvement rectiligne."}, {"question": "Comment calcule-t-on la vitesse moyenne ?", "choix": ["En multipliant la distance par la durée", "En additionnant la distance et la durée", "En soustrayant la durée de la distance", "En divisant la distance par la durée"], "bonne": 3, "explication": "Le texte dit que la vitesse moyenne est « la distance parcourue divisée par la durée »."}, {"question": "Dans un mouvement rectiligne, quel élément peut changer ?", "choix": ["La direction", "La distance parcourue", "La valeur de la vitesse", "Le sens du mouvement"], "bonne": 2, "explication": "Le texte explique que dans un mouvement rectiligne, « la direction ne change pas, mais la valeur peut changer »."}, {"question": "Pourquoi vaut-il mieux ralentir avant d'entrer dans un virage que de freiner en plein milieu ?", "choix": ["Parce que c'est plus économique", "Parce que l'on risque la sortie de route", "Parce que les roues perdent leur adhérence", "Parce que la direction change plus vite"], "bonne": 1, "explication": "Le texte dit qu'en freinant en plein milieu, « tu risques alors la sortie de »."}, {"question": "Que mesure un radar routier ?", "choix": ["La distance entre les véhicules", "La vitesse des véhicules", "Le temps d'accélération", "La direction du trafic"], "bonne": 1, "explication": "Le texte indique qu'un « radar mesure la vitesse des véhicules »."}, {"question": "Un cycliste parcourt trente kilomètres en une heure trente. Quelle est sa vitesse moyenne ?", "choix": ["Trente kilomètres par heure", "Quarante kilomètres par heure", "Vingt kilomètres par heure", "Dix kilomètres par heure"], "bonne": 2, "explication": "Le texte montre que trente divisé par un virgule cinq donne vingt, donc la vitesse moyenne est de vingt kilomètres par heure."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
