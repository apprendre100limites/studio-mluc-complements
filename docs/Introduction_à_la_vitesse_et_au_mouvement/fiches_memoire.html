<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Introduction à la vitesse et au mouvement</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Fiches mémoire</h1><p class="sous">Introduction à la vitesse et au mouvement</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Qu'est-ce que la trajectoire ?", "r": "La trajectoire est l'ensemble des positions successives d'un objet en mouvement."}, {"q": "Quelle est la formule pour calculer la vitesse moyenne ?", "r": "La vitesse moyenne est la distance divisée par la durée."}, {"q": "Quelle est l'unité internationale de vitesse ?", "r": "L'unité internationale de vitesse est le mètre par seconde."}, {"q": "Qu'est-ce que la vitesse instantanée ?", "r": "La vitesse instantanée est celle indiquée par le compteur à un instant précis."}, {"q": "Quelles sont les trois caractéristiques d'une vitesse instantanée ?", "r": "Une vitesse instantanée a une valeur, une direction et un sens."}, {"q": "Qu'est-ce qu'un mouvement uniforme ?", "r": "Un mouvement uniforme est un mouvement où la valeur de la vitesse reste constante, même si la direction change."}, {"q": "Pourquoi faut-il ralentir avant un virage ?", "r": "Faire ralentir avant un virage réduit le risque de sortie de route en cas de forte vitesse."}, {"q": "Quel est l'effet d'une grande vitesse dans un virage ?", "r": "À grande vitesse, un véhicule a tendance à continuer tout droit dans un virage."}, {"q": "Comment passer de kilomètres par heure à mètres par seconde ?", "r": "On divise par 3,6 pour passer de kilomètres par heure à mètres par seconde."}, {"q": "Comment passer de mètres par seconde à kilomètres par heure ?", "r": "On multiplie par 3,6 pour passer de mètres par seconde à kilomètres par heure."}, {"q": "Pourquoi est-il important de ralentir avant un virage ?", "r": "Ralentir avant un virage permet de réduire la vitesse et de minimiser le risque de sortie de route."}, {"q": "À quoi sert la vitesse en aviation ?", "r": "La vitesse en aviation est importante pour assurer la sécurité des vols et optimiser les performances des avions."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
