<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherkarten - Einführung in Geschwindigkeit und Bewegung</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Speicherkarten</h1><p class="sous">Einführung in Geschwindigkeit und Bewegung</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Was ist die Trajektorie?", "r": "Die Trajektorie ist die Menge aufeinanderfolgender Positionen eines Objekts in Bewegung."}, {"q": "Wie lautet die Formel zur Berechnung der Durchschnittsgeschwindigkeit?", "r": "Die Durchschnittsgeschwindigkeit ist der Abstand geteilt durch die Dauer."}, {"q": "Was ist die internationale Speed Unit?", "r": "Die internationale Einheit der Geschwindigkeit ist der Meter pro Sekunde."}, {"q": "Was ist Instant Speed?", "r": "Die momentane Geschwindigkeit ist die, die vom Messgerät zu einem genauen Zeitpunkt angezeigt wird."}, {"q": "Was sind die drei Merkmale der Instant Speed?", "r": "Eine sofortige Geschwindigkeit hat Wert, Richtung und Richtung."}, {"q": "Was ist eine einheitliche Bewegung?", "r": "Eine gleichmäßige Bewegung ist eine Bewegung, bei der der Wert der Geschwindigkeit konstant bleibt, auch wenn sich die Richtung ändert."}, {"q": "Warum sollten wir vor einer Wende langsamer werden?", "r": "Eine Verlangsamung vor einer Kurve verringert das Ausstiegsrisiko bei hoher Geschwindigkeit."}, {"q": "Was ist die Wirkung von hoher Geschwindigkeit in einer Runde?", "r": "Bei hoher Geschwindigkeit neigt ein Fahrzeug dazu, in einer Kurve geradeaus zu fahren."}, {"q": "Wie kann man von Kilometern pro Stunde zu Metern pro Sekunde gelangen?", "r": "Wir teilen durch 3,6, um von Kilometern pro Stunde zu Metern pro Sekunde zu gelangen."}, {"q": "Wie kann man von Metern pro Sekunde zu Kilometern pro Stunde gelangen?", "r": "Wir multiplizieren mit 3,6, um von Metern pro Sekunde zu Kilometern pro Stunde zu gelangen."}, {"q": "Warum ist es wichtig, vor einer Wende zu verlangsamen?", "r": "Das Verlangsamen vor einer Kurve reduziert die Geschwindigkeit und minimiert das Risiko eines Ausstiegs."}, {"q": "Wofür ist Fluggeschwindigkeit?", "r": "Die Fluggeschwindigkeit ist wichtig, um die Flugsicherheit zu gewährleisten und die Flugleistung zu optimieren."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
