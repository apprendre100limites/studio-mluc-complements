<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Einführung in Geschwindigkeit und Bewegung</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Quiz</h1><p class="sous">Einführung in Geschwindigkeit und Bewegung</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Was ist eine Trajektorie?", "choix": ["Bewegungsrichtung", "Zeit für eine Strecke", "Alle aufeinanderfolgenden Positionen, die von sich bewegenden Objekten eingenommen werden", "Die gesamte zurückgelegte Strecke"], "bonne": 2, "explication": "Laut dem Text ist die Flugbahn \"die Reihe von Positionen, die sie nacheinander einnimmt\"."}, {"question": "Welches Beispiel entspricht einer geraden Bewegung?", "choix": ["Eine regelmäßige Geschwindigkeitsfahrt", "Autoleuchten auf einer richtigen Straße", "Ein großer Wheel Pod", "Ein Auto, das in gerader Linie beschleunigt"], "bonne": 1, "explication": "Der Text zeigt an, dass die Autoscheinwerfer nachts auf einer rechten Straße einer geraden Bewegung entsprechen."}, {"question": "Wie berechnen wir die Durchschnittsgeschwindigkeit?", "choix": ["Durch Multiplikation der Distanz mit der Dauer", "Hinzufügen von Distanz und Dauer", "Durch Subtraktion der Länge der Entfernung", "Durch Division der Distanz durch die Dauer"], "bonne": 3, "explication": "Der Text sagt, dass die durchschnittliche Geschwindigkeit \"die zurückgelegte Strecke geteilt durch die Dauer\" ist."}, {"question": "In einer geraden Bewegung, welches Element kann sich ändern?", "choix": ["Verwaltung", "Die zurückgelegte Strecke", "Der Geschwindigkeitswert", "Bewegungsrichtung"], "bonne": 2, "explication": "Der Text erklärt, dass sich in einer geraden Bewegung \"die Richtung nicht ändert, aber der Wert kann sich ändern\"."}, {"question": "Warum ist es besser, vor einer Kurve zu verlangsamen, als in der Mitte zu bremsen?", "choix": ["Weil es wirtschaftlicher ist.", "Weil wir den Ausstieg aus der Straße riskieren", "Weil die Räder ihren Grip verlieren", "Weil sich die Richtung schneller ändert"], "bonne": 1, "explication": "Der Text sagt, dass durch Bremsen in der Mitte, \"Sie riskieren den Ausgang von\"."}, {"question": "Was misst ein Straßenradar?", "choix": ["Abstand zwischen Fahrzeugen", "Fahrzeuggeschwindigkeit", "Beschleunigungszeit", "Verkehrssteuerung"], "bonne": 1, "explication": "Der Text zeigt an, dass ein \"Radar die Fahrzeuggeschwindigkeit misst\"."}, {"question": "Ein Radfahrer fährt 30 Kilometer in einer Stunde und dreißig. Wie hoch ist seine Durchschnittsgeschwindigkeit?", "choix": ["30 Kilometer pro Stunde", "Vierzig Kilometer pro Stunde", "20 Kilometer pro Stunde", "Zehn Kilometer pro Stunde"], "bonne": 2, "explication": "Der Text zeigt, dass dreißig geteilt durch eine Dezimalstelle fünf zwanzig ergibt, so dass die Durchschnittsgeschwindigkeit zwanzig Kilometer pro Stunde beträgt."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
