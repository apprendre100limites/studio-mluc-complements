<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी कार्ड - गति और आंदोलन का परिचय</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>मेमोरी कार्ड</h1><p class="sous">गति और आंदोलन का परिचय</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "ट्रेजेक्टरी क्या है?", "r": "ट्रेजेक्टरी गति में किसी वस्तु की लगातार स्थिति का सेट है।"}, {"q": "औसत गति की गणना के लिए सूत्र क्या है?", "r": "औसत गति अवधि से विभाजित दूरी है।"}, {"q": "अंतर्राष्ट्रीय गति इकाई क्या है?", "r": "गति की अंतर्राष्ट्रीय इकाई प्रति सेकंड मीटर है।"}, {"q": "तत्काल गति क्या है?", "r": "तत्काल गति यह है कि मीटर द्वारा सटीक क्षण पर संकेत दिया गया है।"}, {"q": "तत्काल गति की तीन विशेषताएं क्या हैं?", "r": "एक त्वरित गति मूल्य, दिशा और दिशा है।"}, {"q": "एक समान आंदोलन क्या है?", "r": "एक समान आंदोलन एक आंदोलन है जहां गति का मूल्य स्थिर रहता है, भले ही दिशा बदल जाती है।"}, {"q": "हमें क्यों रुकना चाहिए?", "r": "एक मोड़ से पहले धीमा होने से उच्च गति के मामले में बाहर निकलने का जोखिम कम हो जाता है।"}, {"q": "एक बारी में उच्च गति का क्या प्रभाव है?", "r": "उच्च गति पर, एक वाहन सीधे एक बारी में जारी रखने के लिए जाता है।"}, {"q": "प्रति घंटे मीटर से दूसरे मीटर तक कैसे गुजरना है?", "r": "हम 3.6 मीटर प्रति घंटे से मीटर प्रति सेकंड तक गुजरते हैं।"}, {"q": "मीटर प्रति सेकंड से प्रति घंटे किलोमीटर तक कैसे गुजरना है?", "r": "हम 3.6 मीटर प्रति सेकंड से प्रति घंटे किलोमीटर तक गुजरते हैं।"}, {"q": "क्यों एक बारी से पहले धीमा करने के लिए महत्वपूर्ण है?", "r": "एक मोड़ से पहले धीमा गति को कम कर देता है और निकास के जोखिम को कम करता है।"}, {"q": "विमानन की गति क्या है?", "r": "विमानन गति उड़ान सुरक्षा सुनिश्चित करने और विमान प्रदर्शन को अनुकूलित करने के लिए महत्वपूर्ण है।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
