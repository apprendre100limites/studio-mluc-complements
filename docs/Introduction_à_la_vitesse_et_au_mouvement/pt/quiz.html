<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionário — Introdução à velocidade e ao movimento</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Quiz</h1><p class="sous">Introdução à velocidade e ao movimento</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "O que é uma trajetória?", "choix": ["A direcção do movimento", "Tempo para viajar a distância", "Todas as posições sucessivas ocupadas por objeto móvel", "A distância total percorrida"], "bonne": 2, "explication": "Segundo o texto, a trajetória é \"o conjunto de posições que ocupa sucessivamente\"."}, {"question": "Que exemplo corresponde a um movimento reto?", "choix": ["Um passeio de velocidade regular", "Luzes do carro em uma estrada direita", "Uma grande vagem de roda", "Um carro que acelera em linha reta"], "bonne": 1, "explication": "O texto indica que os faróis do carro, à noite, em uma estrada direita correspondem a um movimento reto."}, {"question": "Como calculamos a velocidade média?", "choix": ["Multiplicando a distância pela duração", "Adicionando distância e duração", "Subtraindo o comprimento da distância", "Dividindo distância por duração"], "bonne": 3, "explication": "O texto diz que a velocidade média é \"a distância percorrida dividida pela duração\"."}, {"question": "Em um movimento reto, que elemento pode mudar?", "choix": ["Gestão", "A distância percorrida", "O valor da velocidade", "A direcção do movimento"], "bonne": 2, "explication": "O texto explica que em um movimento reto, \"a direção não muda, mas o valor pode mudar\"."}, {"question": "Por que é melhor abrandar antes de entrar numa curva do que frear no meio?", "choix": ["Porque é mais económico.", "Porque arriscamos a saída da estrada.", "Porque as rodas perdem a aderência", "Porque a direção muda mais rápido"], "bonne": 1, "explication": "O texto diz que, freando no meio, \"você arrisca a saída\"."}, {"question": "O que é que um radar de estrada mede?", "choix": ["Distância entre veículos", "Velocidade do veículo", "Tempo de aceleração", "Gestão do tráfego"], "bonne": 1, "explication": "O texto indica que um \"radar mede a velocidade do veículo\"."}, {"question": "Um ciclista viaja 30 quilômetros em uma hora e trinta. Qual é a velocidade média dele?", "choix": ["Trinta quilómetros por hora", "Quarenta quilómetros por hora", "Vinte quilómetros por hora", "Dez quilómetros por hora"], "bonne": 2, "explication": "O texto mostra que trinta dividido por um decimal cinco dá vinte, de modo que a velocidade média é de vinte quilômetros por hora."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
