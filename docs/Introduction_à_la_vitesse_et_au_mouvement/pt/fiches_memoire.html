<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões de memória — Introdução à velocidade e ao movimento</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Cartões de memória</h1><p class="sous">Introdução à velocidade e ao movimento</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "Qual é a trajetória?", "r": "A trajetória é o conjunto de posições sucessivas de um objeto em movimento."}, {"q": "Qual é a fórmula para calcular a velocidade média?", "r": "A velocidade média é a distância dividida pela duração."}, {"q": "O que é a unidade de velocidade internacional?", "r": "A unidade internacional de velocidade é o metro por segundo."}, {"q": "O que é velocidade instantânea?", "r": "A velocidade instantânea é aquela indicada pelo medidor em um momento preciso."}, {"q": "Quais são as três características da velocidade instantânea?", "r": "Uma velocidade instantânea tem valor, direção e direção."}, {"q": "O que é um movimento uniforme?", "r": "Um movimento uniforme é um movimento onde o valor da velocidade permanece constante, mesmo que a direção mude."}, {"q": "Porque devemos abrandar antes de uma curva?", "r": "A desaceleração antes de uma volta reduz o risco de saída em caso de alta velocidade."}, {"q": "Qual é o efeito da alta velocidade numa curva?", "r": "Em alta velocidade, um veículo tende a continuar reto em uma curva."}, {"q": "Como passar de quilômetros por hora para metros por segundo?", "r": "Dividimos por 3.6 para passar de quilômetros por hora para metros por segundo."}, {"q": "Como passar de metros por segundo para quilômetros por hora?", "r": "Multiplicamos por 3,6 para passar de metros por segundo para quilômetros por hora."}, {"q": "Porque é que é importante abrandar antes de uma curva?", "r": "A desaceleração antes de um giro reduz a velocidade e minimiza o risco de saída."}, {"q": "Para que serve a velocidade da aviação?", "r": "A velocidade da aviação é importante para garantir a segurança do voo e otimizar o desempenho das aeronaves."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
