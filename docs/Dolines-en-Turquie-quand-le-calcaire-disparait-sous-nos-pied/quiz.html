<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Dolines en Turquie : quand le calcaire disparaît sous nos pieds</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Quiz</h1><p class="sous">Dolines en Turquie : quand le calcaire disparaît sous nos pieds</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Quel type de roche est le plus souvent impliqué dans la formation des dolines ?", "choix": ["Basalte", "Granite", "Quartz", "Calcaire"], "bonne": 3, "explication": "Cette roche, c'est très souvent le calcaire."}, {"question": "Quel composant de l'air rend la pluie légèrement acide ?", "choix": ["Dioxyde de carbone", "Azote", "Sodium", "Oxygène"], "bonne": 0, "explication": "La pluie traverse l'air et surtout le sol, où elle se charge en dioxyde de carbone."}, {"question": "Quel gaz s'échappe lorsqu’on verse du vinaigre sur du calcaire ?", "choix": ["Hydrogène", "Oxygène", "Azote", "Dioxyde de carbone"], "bonne": 3, "explication": "des bulles se forment aussitôt. C'est du dioxyde de carbone qui s'échappe."}, {"question": "Combien de dolines ont été recensées dans l'ensemble du bassin de Konya ?", "choix": ["Environ sept cents", "Environ cinq cents", "Environ six cents", "Environ huit cents"], "bonne": 0, "explication": "les chercheurs ... ont recensé environ sept cents dans le bassin fermé de Konya."}, {"question": "Quelle est la profondeur maximale des dolines observées à Karapınar ?", "choix": ["3 à 10 mètres", "10 à 100 mètres", "50 à 200 mètres", "3 à 50 mètres"], "bonne": 3, "explication": "leur profondeur de trois à cinquante mètres."}, {"question": "Combien de marches y a-t-il pour descendre dans la doline Cennet ?", "choix": ["452", "500", "300", "350"], "bonne": 0, "explication": "on y descend par quatre cent cinquante-deux marches."}, {"question": "Quelle est la longueur approximative de la doline Cennet ?", "choix": ["150 mètres", "450 mètres", "250 mètres", "350 mètres"], "bonne": 2, "explication": "Le Paradis mesure environ deux cent cinquante mètres de long."}, {"question": "Quelle technique d’irrigation est citée comme économisant de l’eau à Konya ?", "choix": ["Irrigation par inondation", "Irrigation goutte-à-goutte", "Irrigation par sillons", "Irrigation au sprinkler"], "bonne": 1, "explication": "les méthodes d'irrigation économes, comme le goutte-à-goutte."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
