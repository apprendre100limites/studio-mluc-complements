<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Dolines en Turquie : quand le calcaire disparaît sous nos pieds</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Fiches mémoire</h1><p class="sous">Dolines en Turquie : quand le calcaire disparaît sous nos pieds</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Qu'est-ce qu'une doline ?", "r": "Une doline est une dépression fermée, plus ou moins circulaire, qui se forme dans une roche que l'eau peut dissoudre, souvent du calcaire."}, {"q": "Quelle roche forme le plus souvent les dolines ?", "r": "Le calcaire, qui est composé de carbonate de calcium."}, {"q": "Quelle réaction chimique dissout le calcaire ?", "r": "L'eau qui contient du dioxyde de carbone forme de l'acide carbonique, qui attaque le carbonate de calcium pour former des ions calcium et des ions hydrogénocarbonate."}, {"q": "Comment le vinaigre montre-t-il la même réaction ?", "r": "Le vinaigre contient de l'acide éthanoïque, qui réagit avec le carbonate de calcium et libère des bulles de dioxyde de carbone."}, {"q": "Pourquoi le quartz ou le granite ne réagissent-ils pas avec le vinaigre ?", "r": "Ils ne contiennent pas de carbonate de calcium, donc l'acide ne les attaque pas."}, {"q": "Quelles sont les deux causes principales accélérant la formation d'obruks à Konya ?", "r": "La sécheresse et le pompage excessif d'eau pour des cultures exigeantes comme le maïs et le tournesol."}, {"q": "De combien le niveau de la nappe phréatique a-t-il baissé près de Karapınar depuis les années 1980 ?", "r": "Environ vingt-quatre mètres entre 1983 et 2008, dont huit mètres au cours des quatre dernières années de cette période."}, {"q": "Quel est le taux actuel de baisse de la nappe phréatique à Konya ?", "r": "Quatre à cinq mètres par an, contre environ un demi-mètre par an au début des années 2000."}, {"q": "Que se passe-t-il lorsque l'eau quitte les cavités karstiques ?", "r": "Le toit perd son soutien et finit par s'effondrer, créant un obruk ou une doline."}, {"q": "Quels sont les noms des deux célèbres dolines sur la côte méditerranéenne turque ?", "r": "« Cennet » (Paradis) et « Cehennem » (Enfer), toutes deux des dolines d'effondrement dans le calcaire."}, {"q": "Quelle est la taille du doline « Paradis » et que trouve-t-on à son fond ?", "r": "Environ deux cent cinquante mètres de long et près de soixante-dix mètres de profondeur, avec une petite église du cinquième siècle atteinte par 452 marches."}, {"q": "Pourquoi les régions karstiques sont-elles importantes pour la gestion de l'eau ?", "r": "Les eaux souterraines alimentent des sources et des nappes qui fournissent de l'eau potable, mais la pollution se propage rapidement dans les fissures."}, {"q": "Quels sont les exemples quotidiens de la réaction acide-calcaire ?", "r": "Le vinaigre qui enlève le tartre d'une bouilloire, la pluie qui abîme les statues en calcaire, et la formation des stalactites dans les grottes."}, {"q": "Pourquoi comprendre les dolines est-il utile pour les gens ?", "r": "Cela permet de cartographier les zones à risque pour éviter de construire au-dessus de cavités fragiles et guide l'utilisation économe de l'eau pour ralentir la baisse de la nappe phréatique."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
