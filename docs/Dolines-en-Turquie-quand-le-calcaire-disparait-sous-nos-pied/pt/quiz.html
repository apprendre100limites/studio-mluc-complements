<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionário — Dolines na Turquia: quando o calcário desaparece sob nossos pés</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências </div><h1>Quiz</h1><p class="sous">Dolines na Turquia: quando o calcário desaparece sob nossos pés</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Que tipo de rocha está mais frequentemente envolvida na formação de dolines?", "choix": ["Basalt", "Granito", "Quartzo", "Calcary"], "bonne": 3, "explication": "Esta rocha é muitas vezes calcária."}, {"question": "Que componente de ar torna a chuva ligeiramente ácida?", "choix": ["Dióxido de carbono", "Azote", "Sódio", "Oxigénio"], "bonne": 0, "explication": "A chuva passa pelo ar e especialmente pelo solo, onde carrega dióxido de carbono."}, {"question": "Que gás escapa quando o vinagre é derramado em calcário?", "choix": ["Hidrogénio", "Oxigénio", "Azote", "Dióxido de carbono"], "bonne": 3, "explication": "as bolhas formam-se imediatamente. O dióxido de carbono está a escapar."}, {"question": "Quantos dolines foram identificados em toda a bacia de Konya?", "choix": ["Cerca de 700.", "Cerca de quinhentos.", "Cerca de seiscentos", "Cerca de 800."], "bonne": 0, "explication": "pesquisadores... registraram cerca de setecentos na bacia fechada de Konya."}, {"question": "Qual é a profundidade máxima de dolines observada em Karapınar?", "choix": ["3 a 10 metros", "10 a 100 metros", "50 a 200 metros", "3 a 50 metros"], "bonne": 3, "explication": "a sua profundidade de três a cinquenta metros."}, {"question": "Quantos passos há para entrar na linha Cennet?", "choix": ["452", "500", "300", "350"], "bonne": 0, "explication": "Descemos por quatrocentos e cinquenta e dois degraus."}, {"question": "Qual é o comprimento aproximado da linha Cennet?", "choix": ["150 metros", "450 metros", "250 metros", "350 metros"], "bonne": 2, "explication": "O Paraíso tem cerca de duzentos e cinquenta metros de comprimento."}, {"question": "Que técnica de irrigação é citada como economia de água em Konya?", "choix": ["Irrigação por inundação", "Irrigação por gotejamento", "Irrigação por sulcos", "Irrigação por aspersão"], "bonne": 1, "explication": "métodos eficientes de irrigação, tais como gotejamento."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
