<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folhas de memória — Dolines na Turquia: quando o calcário desaparece sob nossos pés</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências </div><h1>Cartões de memória</h1><p class="sous">Dolines na Turquia: quando o calcário desaparece sob nossos pés</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "O que é um doline?", "r": "Um doline é uma depressão fechada, mais ou menos circular, que se forma em uma rocha que a água pode dissolver, muitas vezes calcário."}, {"q": "Que rocha mais frequentemente forma dolines?", "r": "Calcário, composto por carbonato de cálcio."}, {"q": "Que reação química dissolve calcário?", "r": "Água que contém dióxido de carbono forma ácido carbônico, que ataca o carbonato de cálcio para formar íons de cálcio e íons de hidrogenocarbonato."}, {"q": "Como o vinagre mostra a mesma reação?", "r": "Vinagre contém ácido etanóico, que reage com carbonato de cálcio e liberta bolhas de dióxido de carbono."}, {"q": "Porque é que o quartzo ou o granito não reagem com vinagre?", "r": "Não contêm carbonato de cálcio, por isso o ácido não os ataca."}, {"q": "Quais são as duas principais causas que aceleram a formação de obúvios em Konya?", "r": "Seca e excesso de água bombeando para culturas exigentes, como milho e girassol."}, {"q": "Quanto caiu o nível das águas subterrâneas perto de Karapınar desde os anos 80?", "r": "Aproximadamente 24 metros entre 1983 e 2008, incluindo oito metros nos últimos quatro anos deste período."}, {"q": "Qual é a taxa actual de declínio das águas subterrâneas em Konya?", "r": "Quatro a cinco metros por ano, em comparação com cerca de meio metro por ano no início dos anos 2000."}, {"q": "O que acontece quando a água deixa a cavidade cárstica?", "r": "O telhado perde seu apoio e, eventualmente, colapsa, criando um obruk ou um doline."}, {"q": "Quais são os nomes das duas famosas dolinhas na costa mediterrânica turca?", "r": "\"Cennet\" (Paradis) e \"Cehenem\" (Enfer), ambos dolines colapso em calcário."}, {"q": "Qual é o tamanho do doline \"Paraíso\" e o que está em seu fundo?", "r": "Cerca de duzentos e cinqüenta metros de comprimento e quase setenta metros de profundidade, com uma pequena igreja do quinto século alcançado por 452 passos."}, {"q": "Por que as regiões cársicas são importantes para a gestão da água?", "r": "As águas subterrâneas fornecem fontes e aquíferos que fornecem água potável, mas a poluição se espalha rapidamente pelas fissuras."}, {"q": "Quais são os exemplos diários da reação cálcio-ácido?", "r": "O vinagre que remove o tártaro de uma chaleira, a chuva que danifica as estátuas de calcário, e a formação de estalactites nas cavernas."}, {"q": "Por que entender dolines é útil para as pessoas?", "r": "Isso permite mapear áreas de risco para evitar a construção de cavidades frágeis e orienta o uso eficiente da água para retardar o declínio da tabela de águas subterrâneas."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
