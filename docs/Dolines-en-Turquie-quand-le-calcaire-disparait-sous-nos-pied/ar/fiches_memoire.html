<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صحائف تذكارية - دولين في تركيا: عندما يختفي الحجر الجيري تحت أقدامنا</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>بطاقات الذاكرة</h1><p class="sous">عندما يختفي الحجر الجيري تحت أقدامنا</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "ما هو الدلاين؟", "r": "الدلاين هو الاكتئاب المغلقة، أكثر أو أقل تعميما، التي تشكل في صخرة يمكن أن تذوبها المياه، وفي كثير من الأحيان الحجر الجيري."}, {"q": "أيّ صخرة غالباً ما تُشكّل (دولين)؟", "r": "Limestone, which is composed of calcium carbonate."}, {"q": "أي ردة فعل كيميائية تحل حجر الجير؟", "r": "وتشكل المياه التي تحتوي على ثاني أكسيد الكربون حامض الكربون، الذي يهاجم كربونات الكالسيوم لتشكل أيون الكالسيوم وأيون الهيدروجينوكربونات."}, {"q": "كيف يظهر (فينجار) نفس ردة الفعل؟", "r": "ويحتوي فينيغار على حمض الإيثانويك الذي يتفاعل مع كربونات الكالسيوم ويطلق فقاعات ثاني أكسيد الكربون."}, {"q": "لمَ لا يردّ (كورتز) أو (غرانيت) على (فينغار)؟", "r": "لا تحتوي على كربونات الكالسيوم لذا لا يهاجمها الحمض"}, {"q": "ما السببان الرئيسيان للتعجيل بتشكيل الأورام في كونيا؟", "r": "الجفاف وضخ المياه المفرطة في الطلب على المحاصيل مثل الذرة وزهرة الشمس."}, {"q": "كم انخفض مستوى المياه الجوفية قرب كارابيانر منذ الثمانينات؟", "r": "وحوالي 24 مترا بين عامي 1983 و 2008، بما في ذلك ثمانية أمتار في السنوات الأربع الأخيرة من هذه الفترة."}, {"q": "ما هو المعدل الحالي للانخفاض في المياه الجوفية في كونيا؟", "r": "أربعة إلى خمسة أمتار في السنة، مقارنة بحوالي نصف متر في السنة في أوائل العقد الأول."}, {"q": "ماذا يحدث عندما يترك الماء التجويف الكارست؟", "r": "ويفقد السقف دعمه وينهار في نهاية المطاف، ويخلق طابور أو دولين."}, {"q": "ما هي أسماء السلطتين المشهورتين على ساحل البحر الأبيض المتوسط التركي؟", "r": "\"سينيت\" و \"سينم\" كلاهما ينهاران في الحجر الجيري"}, {"q": "ما هو حجم الدلاين \"بارادايس\" وما هو في قاعه؟", "r": "حوالي مئتين وخمسين متراً وحوالي سبعين متراً، مع وصول كنيسة صغيرة في القرن الخامس إلى 452 خطوة."}, {"q": "لماذا مناطق الكارست مهمة لإدارة المياه؟", "r": "إمدادات المياه الجوفية ومستودعات المياه الجوفية التي توفر مياه الشرب، ولكن التلوث ينتشر بسرعة في الشقوق."}, {"q": "ما هي الأمثلة اليومية لرد فعل الكالسيوم - الخبيث؟", "r": "الفينجار الذي يزيل القطران من كتلة، المطر الذي يلحق الضرر بتمثال الحجر الجيري، وتشكيل المواد البكتيرية في الكهوف."}, {"q": "لماذا الفهم مفيد للناس؟", "r": "هذا يسمح برسم خرائط للمناطق الخطرة لتجنب البناء فوق التجاويف الهشة ويُرشد الاستخدام الاقتصادي للمياه لتقليل انخفاض طبقة المياه الجوفية."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
