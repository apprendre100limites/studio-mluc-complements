<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كويز - دولين في تركيا: عندما يختفي الحجر الجيري تحت أقدامنا</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>Quiz</h1><p class="sous">عندما يختفي الحجر الجيري تحت أقدامنا</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "أي نوع من الصخور غالباً ما يكون متورطاً في تكوين الدونات؟", "choix": ["باس", "Granite", "Quartz", "الجدول الزمني"], "bonne": 3, "explication": "هذه الصخرة غالباً ما تكون حجراً"}, {"question": "أي عنصر هوائي يجعل المطر محمض قليلا؟", "choix": ["ثاني أكسيد الكربون", "Azote", "Sodium", "Oxygen"], "bonne": 0, "explication": "المطر يمر عبر الهواء وخاصة التربة حيث يحمّل ثاني أكسيد الكربون"}, {"question": "أي غاز يهرب عندما يصب (فينجار) على الحجر الجيري؟", "choix": ["Hydrogen", "Oxygen", "Azote", "ثاني أكسيد الكربون"], "bonne": 3, "explication": "الفقاعات تتشكل على الفور ثاني أكسيد الكربون يهرب"}, {"question": "كم عدد الدونات التي تم تحديدها في جميع أنحاء حوض كونيا؟", "choix": ["حوالي سبعمائة", "حوالي خمسمائة", "حوالي ستمائة", "حوالي ثمانيمائة"], "bonne": 0, "explication": "الباحثون ... سجلوا حوالي سبعمائة في حوض كونيا المغلقة."}, {"question": "ما هو أقصى عمق من الدونات التي لوحظت في كارابيانر؟", "choix": ["3 إلى 10 أمتار", "10 إلى 100 متر", "50 إلى 200 متر", "3 إلى 50 مترا"], "bonne": 3, "explication": "عمقهم من 3 إلى 50 متراً"}, {"question": "كم عدد الخطوات التي ستصل إلى (سنيت دولين)؟", "choix": ["452", "٥٠٠", "300", "350"], "bonne": 0, "explication": "نحن نهبط بأربعمائة واثنان وخمسون خطوة"}, {"question": "ما هو الطول التقريبي لـ (سنيت دولين)؟", "choix": ["150 مترا", "450 مترا", "250 مترا", "350 مترا"], "bonne": 2, "explication": "الجنة طولها حوالي 200 متر و 50 متر"}, {"question": "ما هي تقنية الري التي يشار إليها على أنها توفير المياه في كونيا؟", "choix": ["الري بالفيضان", "الري بالتنقيط", "الري بالخنادق", "الري بالرشّاش"], "bonne": 1, "explication": "طرق الري الموفرة للمياه، مثل الري بالتنقيط."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الإجابة الصحيحة : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
