<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी शीट - तुर्की में डोलिन: जब चूना पत्थर हमारे पैरों के नीचे गायब हो जाता है</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान </div><h1>मेमोरी कार्ड</h1><p class="sous">तुर्की में Dolines: जब चूना पत्थर हमारे पैरों के नीचे गायब हो जाता है</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "क्या है?", "r": "एक डोलिन एक बंद अवसाद, अधिक या कम परिपत्र है, जो एक चट्टान में बनाता है जो पानी भंग कर सकता है, अक्सर चूना पत्थर।"}, {"q": "कौन सा रॉक अक्सर dolines बनाता है?", "r": "लिमस्टोन, जो कैल्शियम कार्बोनेट से बना है।"}, {"q": "क्या रासायनिक प्रतिक्रिया चूना पत्थर को भंग कर देती है?", "r": "पानी जिसमें कार्बन डाइऑक्साइड कार्बनिक एसिड होता है, जो कैल्शियम कार्बोनेट पर कैल्शियम आयनों और हाइड्रोजन कार्बोनेट आयनों का निर्माण करने के लिए हमला करता है।"}, {"q": "सिरका एक ही प्रतिक्रिया कैसे दिखाता है?", "r": "सिरका में एथेनोइक एसिड होता है, जो कैल्शियम कार्बोनेट के साथ प्रतिक्रिया करता है और कार्बन डाइऑक्साइड बुलबुले जारी करता है।"}, {"q": "क्यों क्वार्ट्ज या ग्रेनाइट सिरका के साथ प्रतिक्रिया नहीं करते?", "r": "उनमें कैल्शियम कार्बोनेट नहीं होता है, इसलिए एसिड उन पर हमला नहीं करता है।"}, {"q": "कोन्या में obruks के गठन को तेज करने के दो मुख्य कारण क्या हैं?", "r": "मकई और सूरजमुखी जैसी फसलों की मांग के लिए सूखे और अत्यधिक पानी पंप।"}, {"q": "1980 के दशक के बाद से कैरापिनार के पास भूजल का स्तर कितना कम हो गया?", "r": "1983 और 2008 के बीच लगभग 24 मीटर, इस अवधि के अंतिम चार वर्षों में आठ मीटर शामिल हैं।"}, {"q": "कोन्या में भूजल में गिरावट की वर्तमान दर क्या है?", "r": "वर्ष में चार से पांच मीटर की तुलना में 2000 के दशक में लगभग आधे मीटर की तुलना में।"}, {"q": "क्या होता है जब पानी कर्स्ट गुहा को छोड़ देता है?", "r": "छत अपने समर्थन खो देता है और अंततः गिर जाता है, एक obruk या एक doline बनाने।"}, {"q": "तुर्की भूमध्य तट पर दो प्रसिद्ध डोलिन्स के नाम क्या हैं?", "r": "\"Cennet\" (Paradis) और \"Cehennem\" (Enfer), दोनों चूना पत्थर में ढहते हैं।"}, {"q": "\"Paradise\" का आकार क्या है और इसके नीचे क्या है?", "r": "लगभग दो सौ पचास मीटर लंबा और लगभग सत्तर मीटर गहरा, एक छोटे से पांचवीं सदी के चर्च 452 चरणों तक पहुंच गया।"}, {"q": "जल प्रबंधन के लिए महत्वपूर्ण क्षेत्रों क्यों हैं?", "r": "भूजल उन स्रोतों और aquifers की आपूर्ति करता है जो पेयजल प्रदान करते हैं, लेकिन प्रदूषण तेजी से दरारों में फैलता है।"}, {"q": "कैल्शियम-एसिड प्रतिक्रिया के दैनिक उदाहरण क्या हैं?", "r": "सिरका जो एक केतली से टार्टर को हटा देता है, बारिश जो चूना पत्थर की मूर्तियों को नुकसान पहुंचाती है, और गुफाओं में stalactites का गठन करती है।"}, {"q": "क्यों लोगों के लिए उपयोगी है?", "r": "यह जोखिम क्षेत्रों के मानचित्रण को नाजुक गुहाओं पर निर्माण से बचने और भूजल तालिका में गिरावट को धीमा करने के लिए पानी के कुशल उपयोग का मार्गदर्शन करने की अनुमति देता है।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
