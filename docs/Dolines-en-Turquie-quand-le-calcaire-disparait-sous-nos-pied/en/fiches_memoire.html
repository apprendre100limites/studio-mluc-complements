<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory sheets — Dolines in Turkey: when limestone disappears under our feet</title><style>

</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Memory cards</h1><p class="sous">Dolines in Turkey: when limestone disappears under our feet</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "What is a doline?", "r": "A doline is a closed depression, more or less circular, that forms in a rock that water can dissolve, often limestone."}, {"q": "Which rock most often forms dolines?", "r": "Limestone, which is composed of calcium carbonate."}, {"q": "What chemical reaction dissolves limestone?", "r": "Water that contains carbon dioxide forms carbonic acid, which attacks calcium carbonate to form calcium ions and hydrogenocarbonate ions."}, {"q": "How does vinegar show the same reaction?", "r": "Vinegar contains ethanoic acid, which reacts with calcium carbonate and releases carbon dioxide bubbles."}, {"q": "Why don't quartz or granite react with vinegar?", "r": "They do not contain calcium carbonate, so the acid does not attack them."}, {"q": "What are the two main causes accelerating the formation of obruks in Konya?", "r": "Drought and excessive water pumping for demanding crops such as corn and sunflower."}, {"q": "How much has the groundwater level dropped near Karapınar since the 1980s?", "r": "Approximately 24 metres between 1983 and 2008, including eight metres in the last four years of this period."}, {"q": "What is the current rate of decline in groundwater in Konya?", "r": "Four to five metres a year, compared to about half a metre a year in the early 2000s."}, {"q": "What happens when the water leaves the karst cavity?", "r": "The roof loses its support and eventually collapses, creating an obruk or a doline."}, {"q": "What are the names of the two famous dolines on the Turkish Mediterranean coast?", "r": "\"Cennet\" (Paradis) and \"Cehennem\" (Enfer), both collapse dolines in limestone."}, {"q": "What is the size of the doline \"Paradise\" and what is at its bottom?", "r": "About two hundred and fifty meters long and nearly seventy meters deep, with a small fifth century church reached by 452 steps."}, {"q": "Why are karst regions important for water management?", "r": "Groundwater supplies sources and aquifers that provide drinking water, but pollution spreads rapidly in cracks."}, {"q": "What are the daily examples of the calcium-acid reaction?", "r": "The vinegar that removes the tartar from a kettle, the rain that damages the limestone statues, and the formation of stalactites in the caves."}, {"q": "Why is understanding dolines useful for people?", "r": "This allows mapping of risk zones to avoid building over fragile cavities and guides water‑saving use to slow the decline of the groundwater table."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
