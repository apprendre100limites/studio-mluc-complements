<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherblätter - Dolinen in der Türkei: Wenn Kalkstein unter unseren Füßen verschwindet</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften </div><h1>Speicherkarten</h1><p class="sous">Dolinen in der Türkei: Wenn Kalkstein unter unseren Füßen verschwindet</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Was ist eine Doline?", "r": "Eine Doline ist eine geschlossene Vertiefung, mehr oder weniger kreisförmig, die sich in einem Gestein bildet, das Wasser auflösen kann, oft Kalkstein."}, {"q": "Welcher Stein bildet am häufigsten Dolines?", "r": "Kalkstein, der aus Calciumcarbonat besteht."}, {"q": "Welche chemische Reaktion löst Kalkstein auf?", "r": "Wasser, das Kohlendioxid enthält, bildet Kohlensäure, die Calciumcarbonat angreift, um Calciumionen und Hydrogencarbonationen zu bilden."}, {"q": "Wie zeigt Essig die gleiche Reaktion?", "r": "Essig enthält Ethansäure, die mit Calciumcarbonat reagiert und Kohlendioxidblasen freisetzt."}, {"q": "Warum reagieren Quarz oder Granit nicht mit Essig?", "r": "Sie enthalten kein Calciumcarbonat, so dass die Säure sie nicht angreift."}, {"q": "Was sind die beiden Hauptursachen, die die Bildung von Obruks in Konya beschleunigen?", "r": "Dürre und übermäßiges Wasserpumpen für anspruchsvolle Kulturen wie Mais und Sonnenblumen."}, {"q": "Wie stark ist der Grundwasserspiegel in der Nähe von Karapınar seit den 1980er Jahren gesunken?", "r": "Etwa 24 Meter zwischen 1983 und 2008, davon acht Meter in den letzten vier Jahren dieses Zeitraums."}, {"q": "Wie hoch ist die derzeitige Abnahmerate des Grundwassers in Konya?", "r": "Vier bis fünf Meter pro Jahr, verglichen mit etwa einem halben Meter pro Jahr in den frühen 2000er Jahren."}, {"q": "Was passiert, wenn das Wasser die Karsthöhle verlässt?", "r": "Das Dach verliert seine Unterstützung und kollabiert schließlich, wodurch ein Obruk oder eine Doline entsteht."}, {"q": "Wie heißen die beiden berühmten Dolinen an der türkischen Mittelmeerküste?", "r": "\"Cennet\" (Paradis) und \"Cehennem\" (Enfer), beide Zusammenbruch Dolinen in Kalkstein."}, {"q": "Wie groß ist die Doline \"Paradies\" und was ist an ihrem Grund?", "r": "Etwa zweihundertfünfzig Meter lang und fast siebzig Meter tief, mit einer kleinen Kirche aus dem fünften Jahrhundert, die von 452 Stufen erreicht wurde."}, {"q": "Warum sind Karstregionen wichtig für das Wassermanagement?", "r": "Grundwasser liefert Quellen und Grundwasserleiter, die Trinkwasser liefern, aber die Verschmutzung breitet sich schnell in Rissen aus."}, {"q": "Was sind die täglichen Beispiele für die Calcium-Säure-Reaktion?", "r": "Der Essig, der den Zahnstein aus einem Kessel entfernt, der Regen, der die Kalksteinstatuen beschädigt, und die Bildung von Stalaktiten in den Höhlen."}, {"q": "Warum ist das Verständnis von Dolines für Menschen nützlich?", "r": "Damit können Risikozonen kartiert werden, um den Bau über empfindlichen Hohlräumen zu vermeiden, und es leitet einen sparsamen Wasserverbrauch, um den Rückgang des Grundwasserspiegels zu verlangsamen."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
