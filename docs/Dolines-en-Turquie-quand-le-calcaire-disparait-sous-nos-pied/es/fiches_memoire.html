<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hojas de memoria — Dolines in Turkey: cuando la piedra caliza desaparece bajo nuestros pies</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Tarjetas de memoria</h1><p class="sous">Dolines en Turquía: cuando la piedra caliza desaparece bajo nuestros pies</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Qué es un doline?", "r": "Un doline es una depresión cerrada, más o menos circular, que forma en una roca que el agua puede disolver, a menudo caliza."}, {"q": "¿Qué roca más a menudo forma dolines?", "r": "Limestone, que se compone de carbonato de calcio."}, {"q": "¿Qué reacción química disuelve la piedra caliza?", "r": "El agua que contiene dióxido de carbono forma ácido carbónico, que ataca el carbonato de calcio para formar iones de calcio y iones de hidrógeno."}, {"q": "¿Cómo muestra el vinagre la misma reacción?", "r": "El vinagre contiene ácido etnoico, que reacciona con carbonato de calcio y libera burbujas de dióxido de carbono."}, {"q": "¿Por qué no reaccionan cuarzo o granito con vinagre?", "r": "No contienen carbonato de calcio, por lo que el ácido no los ataca."}, {"q": "¿Cuáles son las dos causas principales que aceleran la formación de obruks en Konya?", "r": "La sequía y el excesivo bombeo de agua para cultivos exigentes como el maíz y el girasol."}, {"q": "¿Cuánto ha bajado el nivel de las aguas subterráneas cerca de Karapınar desde la década de 1980?", "r": "Aproximadamente 24 metros entre 1983 y 2008, incluidos ocho metros en los últimos cuatro años de este período."}, {"q": "¿Cuál es la tasa actual de disminución de las aguas subterráneas en Konya?", "r": "Cuatro a cinco metros al año, en comparación con aproximadamente medio metro al año a principios del decenio de 2000."}, {"q": "¿Qué pasa cuando el agua deja la cavidad del karst?", "r": "El techo pierde su apoyo y finalmente colapsa, creando un obruk o un doline."}, {"q": "¿Cuáles son los nombres de los dos famosos dolines en la costa mediterránea turca?", "r": "\"Cennet\" (Paradis) y \"Cehennem\" (Enfer), ambos colapsan en piedra caliza."}, {"q": "¿Cuál es el tamaño de la línea \"Paradise\" y qué está en su parte inferior?", "r": "Cerca de doscientos cincuenta metros de largo y casi setenta metros de profundidad, con una pequeña iglesia del siglo quinto alcanzada en 452 pasos."}, {"q": "¿Por qué son importantes las regiones karst para la gestión del agua?", "r": "Las fuentes de agua subterránea y los acuíferos que proporcionan agua potable, pero la contaminación se extiende rápidamente en las grietas."}, {"q": "¿Cuáles son los ejemplos diarios de la reacción de calcio-ácido?", "r": "El vinagre que quita el tartar de un hervidor, la lluvia que daña las estatuas de piedra caliza, y la formación de estalactitas en las cuevas."}, {"q": "¿Por qué la comprensión de los dolines es útil para la gente?", "r": "Esto permite cartografiar las zonas de riesgo para evitar construir sobre cavidades frágiles y guía el uso eficiente del agua para ralentizar la disminución del nivel freático."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
