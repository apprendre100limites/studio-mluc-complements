<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Dolines en Turquía: cuando la piedra caliza desaparece bajo nuestros pies</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}

ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Quiz</h1><p class="sous">Dolines en Turquía: cuando la piedra caliza desaparece bajo nuestros pies</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Qué tipo de roca está más a menudo involucrada en la formación de dolines?", "choix": ["Basalt", "Granito", "Quartz", "Calcary"], "bonne": 3, "explication": "Esta roca es muy a menudo caliza."}, {"question": "¿Qué componente de aire hace que la lluvia sea ligeramente ácido?", "choix": ["Dióxido de carbono", "Azote", "Sodium", "Oxygen"], "bonne": 0, "explication": "La lluvia pasa por el aire y sobre todo el suelo, donde carga dióxido de carbono."}, {"question": "¿Qué escape de gas cuando el vinagre se derrama en piedra caliza?", "choix": ["Hidrogen", "Oxygen", "Azote", "Dióxido de carbono"], "bonne": 3, "explication": "Las burbujas se forman inmediatamente. El dióxido de carbono está escapando."}, {"question": "¿Cuántos dolines se han identificado a lo largo de la Cuenca de Konya?", "choix": ["Cerca de 700.", "Alrededor de quinientos", "Alrededor de seiscientos", "Alrededor de ochocientos"], "bonne": 0, "explication": "investigadores ... han registrado cerca de setecientos en la cuenca cerrada de Konya."}, {"question": "¿Cuál es la profundidad máxima de las líneas observadas en Karapınar?", "choix": ["3 a 10 metros", "10 a 100 metros", "50 a 200 metros", "3 a 50 metros"], "bonne": 3, "explication": "su profundidad de tres a cincuenta metros."}, {"question": "¿Cuántos pasos hay para entrar en la línea de Cennet?", "choix": ["452", "500", "300", "350"], "bonne": 0, "explication": "Bajamos en cuatrocientos cincuenta y dos pasos."}, {"question": "¿Cuál es la longitud aproximada de la línea Cennet?", "choix": ["150 metros", "450 metros", "250 metros", "350 metros"], "bonne": 2, "explication": "El Paraíso tiene unos doscientos cincuenta metros de largo."}, {"question": "¿Qué técnica de riego se cita como agua salvífica en Konya?", "choix": ["Riego por inundación", "Riego por goteo", "Riego por surcos", "Riego por aspersión"], "bonne": 1, "explication": "los métodos de riego eficientes, como el goteo."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Justo. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
