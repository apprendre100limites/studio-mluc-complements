<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Die mikroskopische Skala der Materie</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Quiz</h1><p class="sous">Die mikroskopische Skala der Materie</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Was ist der Charakter eines Festkörpers nach dem Text?", "choix": ["eine saubere Form", "Partikel sind sehr weit entfernt", "nimmt allen verfügbaren Platz ein", "hat die Form des Behälters"], "bonne": 0, "explication": "Deshalb hat ein Feststoff seine eigene Form."}, {"question": "Was erzeugt Gasdruck?", "choix": ["Gaswärme", "Partikelgröße", "Anzahl der Partikel", "Aufprall seiner Partikel auf die Wände"], "bonne": 3, "explication": "Der Druck eines Gases kommt von den Stößen seiner Partikel gegen die Wände."}, {"question": "Was passiert mit Zuckerpartikeln, wenn sie sich in Wasser auflösen?", "choix": ["Sie verwandeln sich in Wassermoleküle", "Sie rutschen zwischen denen des Wassers", "Sie bleiben gruppiert", "Sie verschwinden"], "bonne": 1, "explication": "Wenn sich Zucker in Wasser auflöst, rutschen seine Partikel zwischen denen von Wasser."}, {"question": "In welchem Zustand sind die Partikel sehr weit entfernt und bewegen sich schnell in alle Richtungen?", "choix": ["fest", "Plasma", "gasförmig", "Flüssig"], "bonne": 2, "explication": "Im gasförmigen Zustand sind die Partikel sehr weit entfernt und bewegen sich schnell in alle Richtungen."}, {"question": "Wenn ein Gas komprimiert wird, welche Veränderungen machen wir?", "choix": ["Art der Partikel", "Nur Raum zwischen ihnen", "Gasmasse", "Anzahl der Partikel"], "bonne": 1, "explication": "Die Anzahl der Partikel ändert sich nicht, nur der Raum zwischen ihnen."}, {"question": "Unter den folgenden Prozessen, die als physikalische Transformation bezeichnet wird?", "choix": ["Auflösen", "Verbrennung", "Kombi", "chemisch reagieren"], "bonne": 0, "explication": "Auflösen, Schmelzen oder Kochen sind physikalische Veränderungen."}, {"question": "Wie viele Moleküle zeigt das Video einen Tropfen Wasser?", "choix": ["mehr als 1 Billion Milliarden Moleküle", "1 Million Moleküle", "etwa 100 Moleküle", "Eine Milliarde Moleküle"], "bonne": 0, "explication": "In einem einzigen Tropfen Wasser gibt es mehr als eine Billion Milliarden Moleküle."}, {"question": "Warum erhöht eine höhere Temperatur den Druck eines Gases?", "choix": ["Partikel vermehren sich", "Partikel kommen näher", "Die Partikel gehen schneller", "Partikel werden größer"], "bonne": 2, "explication": "Und je höher die Temperatur, desto schneller gehen die Partikel."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
