<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherkarten — Die mikroskopische Skala der Materie</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Speicherkarten</h1><p class="sous">Die mikroskopische Skala der Materie</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Was ist das Partikelmodell?", "r": "Es ist ein Modell, das von Wissenschaftlern verwendet wird, um die Realität der Materie zu vereinfachen, indem es in Partikel unterteilt wird."}, {"q": "Welches Phänomen hat zur Entwicklung des Partikelmodells beigetragen?", "r": "Die Brownsche Bewegung, die Robert Brown 1827 beobachtete, half bei der Entwicklung dieses Modells."}, {"q": "Wie ist der Zustand der Materie in einem Feststoff?", "r": "Die Partikel sind eng und ordentlich, jeder vibriert, während er an seinem Platz bleibt."}, {"q": "Wie verhält sich Materie in einer Flüssigkeit?", "r": "Die Partikel sind eng, aber sie gleiten aufeinander und lassen die Flüssigkeit fließen."}, {"q": "Wie ist der Zustand der Materie in einem Gas?", "r": "Die Partikel sind sehr weit entfernt und bewegen sich schnell, in alle Richtungen."}, {"q": "Warum ist das Gas komprimierbar?", "r": "Da es zwischen den Partikeln eines Gases viel Leere gibt, können sie leicht zusammengebracht werden."}, {"q": "Was ist Gasdruck?", "r": "Der Druck eines Gases kommt von den Stößen seiner Partikel gegen die Wände."}, {"q": "Welche Veränderungen im Zustand treten auf, wenn Wasser gekocht wird?", "r": "Wasserpartikel in flüssigem Wasser bewegen sich schneller und verwandeln sich schließlich in Dampf."}, {"q": "Was sind die Veränderungen in der Materie, wenn sie in einer Flüssigkeit gelöst werden?", "r": "Die Partikel des gelösten Stoffes rutschen zwischen denen des Lösungsmittels und bilden eine Lösung."}, {"q": "Was sind die Zustandsänderungen, die die Partikel nicht verändern?", "r": "Veränderungen im Zustand der Materie, wie Fusion oder Verdunstung, verändern nicht die Teilchen, sondern nur ihre Organisation."}, {"q": "Welche Bedeutung hat das Partikelmodell?", "r": "Es ermöglicht uns, das Verhalten der Materie zu verstehen und vorherzusagen, ohne alles testen zu müssen, was möglich ist."}, {"q": "Auf was kann das Partikelmodell angewendet werden?", "r": "Es kann in Industrie, Gesundheit und Forschung verwendet werden, um neue Materialien zu schaffen oder physikalische Phänomene zu verstehen."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
