<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — La matière à l&#x27;échelle microscopique</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Fiches mémoire</h1><p class="sous">La matière à l&#x27;échelle microscopique</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Qu'est-ce que le modèle particulaire ?", "r": "C'est un modèle utilisé par les scientifiques pour simplifier la réalité de la matière en la divisant en particules."}, {"q": "Quel phénomène a aidé à développer le modèle particulaire ?", "r": "Le mouvement brownien, observé par Robert Brown en 1827, a aidé à développer ce modèle."}, {"q": "Quel est l'état de la matière dans un solide ?", "r": "Les particules sont serrées et rangées, chacune vibre en restant à sa place."}, {"q": "Comment se comporte la matière dans un liquide ?", "r": "Les particules sont serrées mais elles glissent les unes sur les autres, ce qui permet au liquide de couler."}, {"q": "Quel est l'état de la matière dans un gaz ?", "r": "Les particules sont très éloignées et se déplacent vite, dans toutes les directions."}, {"q": "Pourquoi est-ce que le gaz est compressible ?", "r": "Parce qu'il y a beaucoup de vide entre les particules d'un gaz, on peut les rapprocher facilement."}, {"q": "Qu'est-ce que la pression d'un gaz ?", "r": "La pression d'un gaz vient des chocs de ses particules contre les parois."}, {"q": "Quels sont les changements d'état qui se produisent lorsqu'on fait bouillir de l'eau ?", "r": "Les particules d'eau dans l'eau liquide se déplacent plus vite et finissent par se transformer en vapeur."}, {"q": "Quels sont les changements de la matière lorsqu'elle est dissoute dans un liquide ?", "r": "Les particules du soluté se glissent entre celles du solvant, formant une solution."}, {"q": "Quels sont les changements d'état qui ne changent pas les particules ?", "r": "Les changements de l'état de la matière, comme la fusion ou l'évaporation, ne changent pas les particules, seulement leur organisation."}, {"q": "Quel est l'importance du modèle particulaire ?", "r": "Il permet de comprendre et prédire le comportement de la matière sans avoir à tester tout ce qui est possible."}, {"q": "À quoi peut-on appliquer le modèle particulaire ?", "r": "Il peut être utilisé dans l'industrie, la santé et la recherche pour créer de nouveaux matériaux ou comprendre les phénomènes physiques."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
