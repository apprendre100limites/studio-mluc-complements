<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी — विषय का सूक्ष्म पैमाने</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>प्रश्नोत्तरी</h1><p class="sous">विषय का सूक्ष्म पैमाने</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "पाठ के अनुसार ठोस का चरित्र क्या है?", "choix": ["स्वच्छ रूप", "कण बहुत दूर हैं", "सभी उपलब्ध स्थान पर कब्जा", "कंटेनर का रूप लेता है"], "bonne": 0, "explication": "यही कारण है कि एक ठोस का अपना आकार क्यों है।"}, {"question": "गैस का दबाव क्या बनाता है?", "choix": ["गैस गर्मी", "कण आकार", "कणों की संख्या", "दीवारों के खिलाफ इसके कणों का प्रभाव"], "bonne": 3, "explication": "गैस का दबाव दीवारों के खिलाफ इसके कणों के झटके से आता है।"}, {"question": "जब यह पानी में घुल जाता है तो चीनी कण क्या होता है?", "choix": ["वे पानी के अणुओं में बदल जाते हैं", "वे पानी के उन लोगों के बीच आते हैं", "वे समूह में रहते हैं", "वे गायब हो गए"], "bonne": 1, "explication": "जब चीनी पानी में घुल जाती है, तो उसके कण पानी के बीच आते हैं।"}, {"question": "किस राज्य में कण बहुत दूर होते हैं और सभी दिशाओं में जल्दी से चलते हैं?", "choix": ["ठोस", "प्लाज्मा", "गैसीय", "तरल"], "bonne": 2, "explication": "गैसीय अवस्था में, कण बहुत दूर होते हैं और सभी दिशाओं में जल्दी से चलते हैं।"}, {"question": "जब गैस संकुचित हो जाती है, तो हम क्या करते हैं?", "choix": ["कणों की प्रकृति", "उनके बीच केवल अंतरिक्ष", "गैस द्रव्यमान", "कणों की संख्या"], "bonne": 1, "explication": "कणों की संख्या में परिवर्तन नहीं होता है, केवल उनके बीच की जगह।"}, {"question": "निम्नलिखित प्रक्रियाओं में से, जो भौतिक परिवर्तन के रूप में इंगित किया जाता है?", "choix": ["विघटन", "जलाना", "गठबंधन", "रासायनिक रूप से प्रतिक्रिया"], "bonne": 0, "explication": "भंग, पिघल या फोड़ा भौतिक परिवर्तन हैं।"}, {"question": "वीडियो में कितने अणु पानी की बूंद दिखाई देते हैं?", "choix": ["1 ट्रिलियन अरब से अधिक अणु", "एक लाख अणु", "लगभग 100 अणु", "एक अरब अणु"], "bonne": 0, "explication": "पानी की एक बूंद में एक ट्रिलियन अरब से अधिक अणु होते हैं।"}, {"question": "उच्च तापमान एक गैस के दबाव को क्यों बढ़ाता है?", "choix": ["कण गुणा", "कण करीब हो रहे हैं", "कणों तेजी से जाना", "कण बड़े हो जाते हैं"], "bonne": 2, "explication": "और उच्च तापमान, तेजी से कणों जाना।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
