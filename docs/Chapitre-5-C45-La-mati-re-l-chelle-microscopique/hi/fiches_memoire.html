<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी कार्ड — विषय का सूक्ष्म पैमाने</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>मेमोरी कार्ड</h1><p class="sous">विषय का सूक्ष्म पैमाने</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "आंशिक मॉडल क्या है?", "r": "यह वैज्ञानिकों द्वारा प्रयुक्त एक मॉडल है जो इसे कणों में विभाजित करके पदार्थ की वास्तविकता को सरल बनाने के लिए उपयोग किया जाता है।"}, {"q": "किस घटना ने पार्टिकुलेट मॉडल को विकसित करने में मदद की?", "r": "1827 में रॉबर्ट ब्राउन द्वारा मनाया गया ब्राउनियन आंदोलन ने इस मॉडल को विकसित करने में मदद की।"}, {"q": "एक ठोस अवस्था क्या है?", "r": "कण तंग और सुव्यवस्थित होते हैं, जबकि इसके स्थान पर रहते हैं।"}, {"q": "तरल पदार्थ कैसे व्यवहार करता है?", "r": "कण तंग होते हैं लेकिन वे एक दूसरे पर स्लाइड करते हैं, जिससे तरल प्रवाह की अनुमति मिलती है।"}, {"q": "गैस में क्या मायने रखता है?", "r": "कण बहुत दूर होते हैं और सभी दिशाओं में जल्दी से चलते हैं।"}, {"q": "गैस संपीड़न क्यों है?", "r": "क्योंकि गैस के कणों के बीच बहुत अधिक अनुभव होता है, उन्हें आसानी से एक साथ लाया जा सकता है।"}, {"q": "गैस का दबाव क्या है?", "r": "गैस का दबाव दीवारों के खिलाफ इसके कणों के झटके से आता है।"}, {"q": "जब पानी उबला हुआ होता है तो स्थिति में क्या परिवर्तन होता है?", "r": "तरल पानी में पानी के कण तेजी से चलते हैं और अंततः भाप में बदल जाते हैं।"}, {"q": "तरल में भंग होने पर क्या परिवर्तन होते हैं?", "r": "विलायक के उन लोगों के बीच सोल्यूट स्लिप के कण, एक समाधान बनाते हैं।"}, {"q": "क्या राज्य परिवर्तन है जो कणों को नहीं बदलता है?", "r": "पदार्थ की स्थिति में परिवर्तन, जैसे कि संलयन या वाष्पीकरण, कणों को नहीं बदल सकते हैं, केवल उनके संगठन।"}, {"q": "कण मॉडल का क्या महत्व है?", "r": "यह हमें उन सभी चीजों का परीक्षण करने के बिना किसी विषय के व्यवहार को समझने और भविष्यवाणी करने की अनुमति देता है जो संभव है।"}, {"q": "पार्टिकुलेट मॉडल को किस प्रकार लागू किया जा सकता है?", "r": "इसका उपयोग उद्योग, स्वास्थ्य और अनुसंधान में नई सामग्री बनाने या भौतिक घटनाओं को समझने के लिए किया जा सकता है।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
