<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas de memoria La escala microscópica de la materia</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Tarjetas de memoria</h1><p class="sous">La escala microscópica de la materia</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Cuál es el modelo de partículas?", "r": "Es un modelo utilizado por los científicos para simplificar la realidad de la materia dividiéndola en partículas."}, {"q": "¿Qué fenómeno ayudó a desarrollar el modelo de partículas?", "r": "El movimiento Browniano, observado por Robert Brown en 1827, ayudó a desarrollar este modelo."}, {"q": "¿Cuál es el estado de la materia en un sólido?", "r": "Las partículas son tensas y ordenadas, cada vibra mientras permanece en su lugar."}, {"q": "¿Cómo se comporta en un líquido?", "r": "Las partículas son estrechas pero se deslizan entre sí, permitiendo que el líquido fluya."}, {"q": "¿Cuál es el estado de la materia en un gas?", "r": "Las partículas son muy distantes y se mueven rápidamente, en todas direcciones."}, {"q": "¿Por qué el gas es compresible?", "r": "Debido a que hay mucha vacuidad entre las partículas de un gas, se pueden reunir fácilmente."}, {"q": "¿Qué es la presión de gas?", "r": "La presión de un gas proviene de los choques de sus partículas contra las paredes."}, {"q": "¿Qué cambios en las condiciones ocurren cuando el agua está hervida?", "r": "Las partículas de agua en agua líquida se mueven más rápido y eventualmente se convierten en vapor."}, {"q": "¿Cuáles son los cambios en la materia cuando se disuelve en un líquido?", "r": "Las partículas del soluto se deslizan entre las del solvente, formando una solución."}, {"q": "¿Cuáles son los cambios estatales que no cambian las partículas?", "r": "Los cambios en el estado de la materia, como la fusión o la evaporación, no cambian las partículas, sólo su organización."}, {"q": "¿Cuál es la importancia del modelo de partículas?", "r": "Nos permite comprender y predecir el comportamiento de la materia sin tener que probar todo lo que es posible."}, {"q": "¿A qué se puede aplicar el modelo de partículas?", "r": "Se puede utilizar en la industria, la salud y la investigación para crear nuevos materiales o comprender fenómenos físicos."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
