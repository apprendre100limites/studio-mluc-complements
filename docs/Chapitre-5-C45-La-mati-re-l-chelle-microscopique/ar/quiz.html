<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كروز - النطاق المجهري للمسألة</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>Quiz</h1><p class="sous">النطاق المجهري للمسألة</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ما هي طبيعة صلبة وفقا للنص؟", "choix": ["شكل نظيف", "الجسيمات بعيدة جدا", "تحتل جميع الأماكن المتاحة", "تتخذ شكل الحاوية"], "bonne": 0, "explication": "هذا هو السبب في أن الصلب له شكله الخاص."}, {"question": "ما الذي يخلق ضغط الغاز؟", "choix": ["حرارة الغاز", "حجم الجسيمات", "عدد الجسيمات", "أثر جسيماتها على الجدران"], "bonne": 3, "explication": "ضغط الغاز يأتي من صدمات جزيئاته ضد الجدران"}, {"question": "ماذا يحدث لجسيمات السكر عندما يحل في الماء؟", "choix": ["يتحولون إلى جزيئات مائية", "ينزلقون بين الماء", "تبقى مجمّعة", "يختفيان"], "bonne": 1, "explication": "عندما يذوب السكر في الماء تنزلق جزيئاته بين الماء"}, {"question": "في أي حالة الجسيمات بعيدة جداً وتتحرك بسرعة في جميع الاتجاهات؟", "choix": ["صلب", "البلازما", "البنزين", "سائل"], "bonne": 2, "explication": "في الحالة الغازية، الجسيمات بعيدة جدا والتحرك بسرعة، في جميع الاتجاهات."}, {"question": "عندما يضغط الغاز، ما التغييرات التي نصنعها؟", "choix": ["طبيعة الجسيمات", "المكان الوحيد بينهم", "الغاز", "عدد الجسيمات"], "bonne": 1, "explication": "عدد الجسيمات لا يتغير، فقط الفضاء بينها."}, {"question": "ومن بين العمليات التالية، التي يشار إليها على أنها تحول مادي؟", "choix": ["حل", "حريق", "معا", "رد الفعل الكيميائي"], "bonne": 0, "explication": "الإنحلال أو الذباب أو الغلاية تغيرات مادية"}, {"question": "كم عدد الجزيئات التي تظهر قطرة من الماء؟", "choix": ["أكثر من تريليون بليون جزيئ", "مليون جزيئ", "حوالي 100 جزمة", "مليار جزيئ"], "bonne": 0, "explication": "في قطرة واحدة من الماء، هناك أكثر من تريليون بليون جزيئ."}, {"question": "لماذا ارتفاع درجة الحرارة يزيد ضغط الغاز؟", "choix": ["الجسيمات متعددة", "الجسيمات تقترب", "الجسيمات أسرع", "تصبح الجسيمات أكبر"], "bonne": 2, "explication": "وكلما ارتفعت درجة الحرارة كلما أسرعت الجسيمات"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
