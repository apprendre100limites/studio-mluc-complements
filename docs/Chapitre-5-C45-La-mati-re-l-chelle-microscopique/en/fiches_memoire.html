<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory cards — The microscopic scale of matter</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Memory cards</h1><p class="sous">The microscopic scale of matter</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "What is the particulate model?", "r": "It is a model used by scientists to simplify the reality of matter by dividing it into particles."}, {"q": "What phenomenon helped develop the particulate model?", "r": "The Brownian movement, observed by Robert Brown in 1827, helped develop this model."}, {"q": "What is the state of matter in a solid?", "r": "The particles are tight and tidy, each vibrates while remaining in its place."}, {"q": "How does matter behave in a liquid?", "r": "The particles are tight but they slide on each other, allowing the liquid to flow."}, {"q": "What is the state of matter in a gas?", "r": "The particles are very distant and move quickly, in all directions."}, {"q": "Why is the gas compressible?", "r": "Because there is a lot of emptiness between the particles of a gas, they can be easily brought together."}, {"q": "What is gas pressure?", "r": "The pressure of a gas comes from the shocks of its particles against the walls."}, {"q": "What changes in condition occur when water is boiled?", "r": "Water particles in liquid water move faster and eventually turn into steam."}, {"q": "What are the changes in matter when dissolved in a liquid?", "r": "The particles of the solute slip between those of the solvent, forming a solution."}, {"q": "What are the state changes that do not change the particles?", "r": "Changes in the state of matter, such as fusion or evaporation, do not change particles, only their organization."}, {"q": "What is the importance of the particulate model?", "r": "It allows us to understand and predict the behaviour of matter without having to test everything that is possible."}, {"q": "What can the particulate model be applied to?", "r": "It can be used in industry, health and research to create new materials or understand physical phenomena."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
