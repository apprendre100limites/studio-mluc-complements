<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — The microscopic scale of matter</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Quiz</h1><p class="sous">The microscopic scale of matter</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What is the character of a solid according to the text?", "choix": ["a clean form", "particles are very distant", "occupies all available space", "takes the form of the container"], "bonne": 0, "explication": "That's why a solid has its own shape."}, {"question": "What creates gas pressure?", "choix": ["gas heat", "particle size", "the number of particles", "impact of its particles against the walls"], "bonne": 3, "explication": "The pressure of a gas comes from the shocks of its particles against the walls."}, {"question": "What happens to sugar particles when it dissolves in water?", "choix": ["they turn into water molecules", "they slip between those of water", "they remain grouped", "they disappear"], "bonne": 1, "explication": "When sugar dissolves in water, its particles slip between those of water."}, {"question": "In what state the particles are very distant and move quickly in all directions?", "choix": ["solid", "plasma", "gaseous", "Liquid"], "bonne": 2, "explication": "In the gaseous state, the particles are very distant and move quickly, in all directions."}, {"question": "When a gas is compressed, what changes do we make?", "choix": ["nature of particles", "only space between them", "gas mass", "the number of particles"], "bonne": 1, "explication": "the number of particles does not change, only the space between them."}, {"question": "Among the following processes, which is indicated as physical transformation?", "choix": ["Dissolve", "burn", "combine", "chemically react"], "bonne": 0, "explication": "Dissolve, melt or boil are physical changes."}, {"question": "How many molecules does the video show a drop of water?", "choix": ["more than 1 trillion billion molecules", "one million molecules", "about 100 molecules", "a billion molecules"], "bonne": 0, "explication": "In a single drop of water, there are more than a trillion billion molecules."}, {"question": "Why does a higher temperature increase the pressure of a gas?", "choix": ["particles multiply", "particles are getting closer", "the particles go faster", "particles become larger"], "bonne": 2, "explication": "And the higher the temperature, the faster the particles go."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
