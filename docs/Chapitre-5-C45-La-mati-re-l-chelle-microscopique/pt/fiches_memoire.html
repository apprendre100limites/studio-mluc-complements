<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões de memória — A escala microscópica da matéria</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Cartões de memória</h1><p class="sous">A escala microscópica da matéria</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "Qual é o modelo de partículas?", "r": "É um modelo utilizado pelos cientistas para simplificar a realidade da matéria dividindo-a em partículas."}, {"q": "Que fenômeno ajudou a desenvolver o modelo de partículas?", "r": "O movimento Browniano, observado por Robert Brown em 1827, ajudou a desenvolver este modelo."}, {"q": "Qual é o estado da matéria em um sólido?", "r": "As partículas são apertadas e arrumadas, cada vibra enquanto permanece em seu lugar."}, {"q": "Como se comporta a matéria num líquido?", "r": "As partículas são apertadas, mas deslizam umas sobre as outras, permitindo que o líquido flua."}, {"q": "Qual é o estado da matéria num gás?", "r": "As partículas são muito distantes e movem-se rapidamente, em todas as direções."}, {"q": "Porque é que o gás é compressível?", "r": "Como há muito vazio entre as partículas de um gás, elas podem ser facilmente reunidas."}, {"q": "O que é pressão de gás?", "r": "A pressão de um gás vem dos choques de suas partículas contra as paredes."}, {"q": "Que mudanças na condição ocorrem quando a água é fervida?", "r": "As partículas de água na água líquida movem-se mais rapidamente e eventualmente transformam-se em vapor."}, {"q": "Quais são as mudanças na matéria quando dissolvidos em um líquido?", "r": "As partículas do soluto deslizam entre as do solvente, formando uma solução."}, {"q": "Quais são as mudanças de estado que não alteram as partículas?", "r": "Mudanças no estado da matéria, como fusão ou evaporação, não mudam partículas, apenas sua organização."}, {"q": "Qual é a importância do modelo de partículas?", "r": "Permite-nos compreender e prever o comportamento da matéria sem ter de testar tudo o que é possível."}, {"q": "A que se pode aplicar o modelo de partículas?", "r": "Ele pode ser usado na indústria, saúde e pesquisa para criar novos materiais ou entender fenômenos físicos."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
