<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — A escala microscópica da matéria</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Quiz</h1><p class="sous">A escala microscópica da matéria</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Qual é o caráter de um sólido de acordo com o texto?", "choix": ["uma forma limpa", "partículas são muito distantes", "ocupa todo o espaço disponível", "assume a forma de recipiente"], "bonne": 0, "explication": "É por isso que um sólido tem a sua própria forma."}, {"question": "O que cria pressão de gás?", "choix": ["calor gasoso", "granulometria", "o número de partículas", "impacto das suas partículas contra as paredes"], "bonne": 3, "explication": "A pressão de um gás vem dos choques de suas partículas contra as paredes."}, {"question": "O que acontece às partículas de açúcar quando se dissolve na água?", "choix": ["transformam-se em moléculas de água", "escorregam entre os da água", "permanecem agrupados", "eles desaparecem"], "bonne": 1, "explication": "Quando o açúcar se dissolve na água, suas partículas deslizam entre as da água."}, {"question": "Em que estado as partículas são muito distantes e movem-se rapidamente em todas as direções?", "choix": ["sólido", "plasma", "gás", "Líquido"], "bonne": 2, "explication": "No estado gasoso, as partículas são muito distantes e movem-se rapidamente, em todas as direções."}, {"question": "Quando um gás é comprimido, que mudanças fazemos?", "choix": ["natureza das partículas", "apenas espaço entre eles", "massa de gás", "o número de partículas"], "bonne": 1, "explication": "o número de partículas não muda, apenas o espaço entre elas."}, {"question": "Dentre os seguintes processos, qual é indicado como transformação física?", "choix": ["Dissolver", "queimar", "combinar", "reacção química"], "bonne": 0, "explication": "Dissolver, derreter ou ferver são mudanças físicas."}, {"question": "Quantas moléculas o vídeo mostra uma gota de água?", "choix": ["mais de 1 bilhão de moléculas", "um milhão de moléculas", "cerca de 100 moléculas", "um bilhão de moléculas"], "bonne": 0, "explication": "Em uma única gota de água, há mais de um trilhão de bilhões de moléculas."}, {"question": "Por que uma temperatura mais alta aumenta a pressão de um gás?", "choix": ["partículas multiplicar", "as partículas estão a aproximar-se", "as partículas vão mais rápido", "partículas se tornam maiores"], "bonne": 2, "explication": "E quanto maior a temperatura, mais rápido as partículas vão."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
