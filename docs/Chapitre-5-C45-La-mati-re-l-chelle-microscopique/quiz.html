<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — La matière à l&#x27;échelle microscopique</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Quiz</h1><p class="sous">La matière à l&#x27;échelle microscopique</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Quel est le caractère d'un solide selon le texte ?", "choix": ["une forme propre", "les particules sont très éloignées", "occupe tout l'espace disponible", "prend la forme du récipient"], "bonne": 0, "explication": "C'est pour ça qu'un solide a une forme propre."}, {"question": "Qu'est-ce qui crée la pression d'un gaz ?", "choix": ["la chaleur du gaz", "la taille des particules", "le nombre de particules", "les chocs de ses particules contre les parois"], "bonne": 3, "explication": "La pression d'un gaz vient des chocs de ses particules contre les parois."}, {"question": "Que se passe-t-il aux particules de sucre lorsqu'il se dissout dans l'eau ?", "choix": ["elles se transforment en molécules d'eau", "elles se glissent entre celles de l'eau", "elles restent groupées", "elles disparaissent"], "bonne": 1, "explication": "Quand du sucre se dissout dans l'eau, ses particules se glissent entre celles de l'eau."}, {"question": "Dans quel état les particules sont très éloignées et se déplacent vite dans toutes les directions ?", "choix": ["solide", "plasma", "gazeux", "liquide"], "bonne": 2, "explication": "À l'état gazeux, les particules sont très éloignées et se déplacent vite, dans toutes les directions."}, {"question": "Lorsque l'on comprime un gaz, que change-t-on ?", "choix": ["la nature des particules", "seulement l'espace entre elles", "la masse du gaz", "le nombre de particules"], "bonne": 1, "explication": "le nombre de particules ne change pas, seulement l'espace entre elles."}, {"question": "Parmi les procédés suivants, lequel est indiqué comme une transformation physique ?", "choix": ["dissoudre", "brûler", "combiner", "réagir chimiquement"], "bonne": 0, "explication": "Dissoudre, fondre ou bouillir sont des transformations physiques."}, {"question": "Combien de molécules contient une goutte d'eau selon la vidéo ?", "choix": ["plus de mille milliards de milliards de molécules", "un million de molécules", "une centaine de molécules", "un milliard de molécules"], "bonne": 0, "explication": "Dans une seule goutte d'eau, il y a plus de mille milliards de milliards de molécules."}, {"question": "Pourquoi une température plus élevée augmente-t-elle la pression d'un gaz ?", "choix": ["les particules se multiplient", "les particules se rapprochent davantage", "les particules vont plus vite", "les particules deviennent plus grosses"], "bonne": 2, "explication": "Et plus la température est élevée, plus les particules vont vite."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
