<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Affaire Pharos 2/4 : Le portrait-robot</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Fiches mémoire</h1><p class="sous">Affaire Pharos 2/4 : Le portrait-robot</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Qui est le premier témoin décrit dans la vidéo et que dit-il du phare ?", "r": "Strabon, un géographe grec du Ier siècle avant J.-C., le décrit comme une tour à plusieurs étages en pierre blanche, utilisant le mot grec signifiant « admirablement »."}, {"q": "Que nous apprennent les pièces de monnaie sur l'apparence du phare ?", "r": "Les monnaies montrent un socle avec une rampe à degrés, une section carrée avec des tritons, une section à plusieurs côtés, une section ronde et une statue au sommet."}, {"q": "Où peut-on trouver des copies ou modèles réduits du phare d'Alexandrie ?", "r": "À Taposiris Magna, à quarante kilomètres à l'ouest, un petit phare de trente mètres, ainsi qu'une lanterne en terre cuite trouvée dans le Fayoum."}, {"q": "Qui est considéré comme le témoin le plus précis et complet et comment a-t-il procédé ?", "r": "Ibn al-Shaykh, un savant espagnol, qui a visité le phare en 1165-1166 et l'a mesuré étage par étage avec une corde graduée."}, {"q": "Comment était constituée la première section du phare selon le récit d'Ibn al-Shaykh ?", "r": "La première section était en pierres de taille et on la parcourait par une rampe."}, {"q": "Quelles questions les chercheurs posent-ils pour juger la fiabilité d'un témoin ?", "r": "Ils se demandent si le témoin a vu le phare, s'il l'a mesuré, ou s'il a simplement recopié le récit d'une autre personne."}, {"q": "Quelle est l'énigme concernant le feu et la statue au sommet du phare ?", "r": "La tradition arabe place un feu tout en haut, mais les monnaies montrent une grande statue, et il est difficile d'imaginer comment ils coexistaient."}, {"q": "Quels blocs ont été retrouvés au fond de l'eau par les archéologues ?", "r": "Des blocs de granite, quartzite, marbre et calcaire, certains pesant jusqu'à quarante tonnes, ainsi que des morceaux de plomb, fer et bronze pour les sceller."}, {"q": "Quels sont les trois volumes géométriques imposés pour la modélisation 3D ?", "r": "Un pavé (parallélépipède), un prisme à huit côtés (octogonal) et un cylindre."}, {"q": "Quelle est la contrainte principale de la modélisation 3D pour les élèves ?", "r": "Respecter l'échelle donnée, suivre les témoignages historiques et justifier la position de chaque volume."}, {"q": "À quoi sert la modélisation 3D dans les métiers de la construction ?", "r": "Permet de dessiner un bâtiment ou un objet en trois dimensions avec une échelle précise pour vérifier son assemblage avant de le construire."}, {"q": "Comment les archéologues utilisent-ils la modélisation 3D ?", "r": "Ils utilisent la méthode à l'envers : ils partent des pièces retrouvées pour reconstruire ce qui a disparu au fil du temps."}, {"q": "Quel est le rôle d'Al-Bakri en tant que témoin du phare ?", "r": "Al-Bakri a écrit sur le phare en 1067, mais il est probablement jamais venu à Alexandrie, bien qu'il ait rassemblé des informations très utiles."}, {"q": "Que représentent les deux lignes de points sur certaines monnaies ?", "r": "Elles rappellent peut-être une inscription gravée sur la façade du phare, comme celle dont parle Pline l'Ancien."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
