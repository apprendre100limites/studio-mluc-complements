<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Pharos 2/4: El retrato-robot</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}

h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}

@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Quiz</h1><p class="sous">Pharos 2/4 caso: El retrato-robot</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Quién es el primer testigo llamado en la investigación?", "choix": ["Strabon", "Al-Bakri", "Ibn al-Shaykh", "Pline el Viejo"], "bonne": 0, "explication": "Primer testigo: Strabon, un geógrafo griego."}, {"question": "¿De qué material dice Strabon que el faro está construido?", "choix": ["piedra blanca", "ladrillo y yeso", "madera y bronce", "granito y mármol"], "bonne": 0, "explication": "Describe el faro como una torre de piedra blanca y multi plantas."}, {"question": "¿Qué vemos en la parte superior del faro en las monedas?", "choix": ["una luz", "una estatua", "un espejo", "a dome"], "bonne": 1, "explication": "Una segunda sección con varios lados, luego una tercera sección redonda, y en la parte superior, una estatua."}, {"question": "¿Dónde está el pequeño faro de Taposiris Magna?", "choix": ["en Fayoum", "unos 40 kilómetros al oeste de Alejandría", "en el sur de Egipto", "en Málaga"], "bonne": 1, "explication": "A unos 40 kilómetros al oeste de Alejandría, en Taposiris Magna, un pequeño faro del siglo II a.C. ocupa el mismo patrón."}, {"question": "¿Qué herramienta mide Ibn al-Shaykh el faro con?", "choix": ["una norma", "una brújula", "una cuerda de grado", "una calculadora"], "bonne": 2, "explication": "Sube al faro, piso tras piso, con una cuerda graduada, una hoja y una pluma, y mide cada esquina."}, {"question": "¿Qué evidencia consideran los investigadores la más precisa y completa?", "choix": ["monedas", "Strabon", "de Al-Bakri", "de Ibn al-Shaykh"], "bonne": 3, "explication": "Los investigadores consideran su historia como la más exacta y completa de todos."}, {"question": "¿Qué tres volúmenes deben contener el modelo 3D del faro?", "choix": ["un cubo, una esfera y una pirámide", "una piedra caliza, un prisma de seis caras y un cono", "un pavimento, un prisma de ocho caras y un cilindro", "un cilindro, un cubo y una cúpula"], "bonne": 2, "explication": "Constraint one: a pavement, an eight-sided prism and a cilindro."}, {"question": "¿Para qué se encontraron las piezas de plomo, hierro y bronce en el agua?", "choix": ["para mantener el fuego", "para decorar la fachada", "haciendo estatuas", "para sellar los bloques entre ellos"], "bonne": 3, "explication": "También había piezas de plomo, hierro y bronce, que se utilizaban para sellar los bloques entre ellos."}, {"question": "¿Qué aprendemos sobre la segunda sección del faro en el momento de Ibn al-Shaykh?", "choix": ["estaba con una cúpula", "Era piedra blanca.", "estaba hecho de ladrillos y yeso, con una escalera", "Estaba hecho de madera."], "bonne": 2, "explication": "la segunda sección, en su tiempo, estaba hecha de ladrillos y yeso, con una escalera."}, {"question": "¿Qué preguntas se hacen los investigadores para juzgar a un testigo?", "choix": ["¿Vio el fuego? ¿Vio la estatua? ¿Vio el espejo?", "¿Escribió en griego? ¿Viajó a Egipto? ¿Ha dibujado el faro?", "¿Vivió antes de Jesucristo? ¿Vivió después de Jesucristo? ¿Escribió en obras de teatro?", "¿Lo vio? ¿Lo midió? ¿O copió a alguien más?"], "bonne": 3, "explication": "¿Lo vio? ¿Lo midió? ¿O copió a alguien más?"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
