<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fichas de datos — Caso Pharos 2/4: El retrato-robot</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Tarjetas de memoria</h1><p class="sous">Pharos 2/4 caso: El retrato-robot</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Quién es el primer testigo descrito en el video y qué dice sobre el faro?", "r": "Strabon, un geógrafo griego del siglo 1 a.C., lo describe como una torre de piedra blanca de varias plantas, utilizando la palabra griega que significa \"admirablemente\"."}, {"q": "¿Qué nos cuentan las monedas sobre la apariencia del faro?", "r": "Las monedas muestran una base con una rampa de grado, una sección cuadrada con tritones, una sección con varios lados, una sección redonda y una estatua en la parte superior."}, {"q": "¿Dónde podemos encontrar copias o modelos reducidos de Alexandria Lighthouse?", "r": "En Taposiris Magna, a 40 kilómetros al oeste, un pequeño faro de treinta metros, así como una linterna de terracota que se encuentra en el Fayoum."}, {"q": "¿Quién es considerado el testigo más exacto y completo y cómo procedió?", "r": "Ibn al-Shaykh, un científico español, que visitó el faro en 1165-1166 y lo midió piso por piso con una cuerda de grado."}, {"q": "¿Cómo fue la primera sección del faro formado según la cuenta de Ibn al-Shaykh?", "r": "La primera sección estaba hecha de piedras cortadas y estaba cubierta por una rampa."}, {"q": "¿Qué preguntas hacen los investigadores para juzgar la fiabilidad de un testigo?", "r": "Se preguntan si el testigo vio el faro, lo midió o simplemente copió la cuenta de otra persona."}, {"q": "¿Cuál es el enigma sobre el fuego y la estatua en la parte superior del faro?", "r": "La tradición árabe coloca un fuego en la parte superior, pero las monedas muestran una gran estatua, y es difícil imaginar cómo convivieron."}, {"q": "¿Qué bloques fueron encontrados en el fondo del agua por arqueólogos?", "r": "Bloques de granito, cuarcita, mármol y piedra caliza, algunos que pesan hasta cuarenta toneladas, así como piezas de plomo, hierro y bronce para sellarlos."}, {"q": "¿Cuáles son los tres volúmenes geométricos impuestos para el modelado 3D?", "r": "Un pavimento (paralepípedo), un prisma de ocho caras (octogonal) y un cilindro."}, {"q": "¿Cuál es la principal limitación de modelado 3D para estudiantes?", "r": "Respetar la escala dada, seguir evidencia histórica y justificar la posición de cada volumen."}, {"q": "¿Qué es el modelado 3D para la construcción?", "r": "Le permite dibujar un edificio o objeto tridimensional con una escala precisa para comprobar su montaje antes de construirlo."}, {"q": "¿Cómo usan los arqueólogos el modelado 3D?", "r": "Usan el método inverso: dejan partes encontradas para reconstruir lo que ha desaparecido con el tiempo."}, {"q": "¿Cuál es el papel de Al-Bakri como testigo del faro?", "r": "Al-Bakri escribió sobre el faro en 1067, pero probablemente nunca llegó a Alejandría, aunque recogió información muy útil."}, {"q": "¿Qué representan los dos puntos en ciertas monedas?", "r": "Pueden recordar una inscripción grabada en la fachada del faro, como la de Pline el Viejo."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
