<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>तथ्य पत्रक - Pharos 2/4 मामले: चित्र-रोबोट</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान </div><h1>मेमोरी कार्ड</h1><p class="sous">Pharos 2/4 मामले: चित्र-रोबोट</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "वीडियो में वर्णित पहला गवाह कौन है और वह लाइटहाउस के बारे में क्या कहता है?", "r": "Strabon, 1st सदी B.C. से एक ग्रीक भूगोलकार, उसे बहुमंजिला सफेद पत्थर टॉवर के रूप में वर्णित करता है, जिसका अर्थ ग्रीक शब्द \"admirably\" है।"}, {"q": "क्या सिक्के हमें प्रकाशघर की उपस्थिति के बारे में बताते हैं?", "r": "सिक्के एक डिग्री रैंप के साथ एक आधार दिखाते हैं, tritons के साथ एक वर्ग अनुभाग, कई पक्षों के साथ एक अनुभाग, एक गोल अनुभाग और शीर्ष पर एक प्रतिमा।"}, {"q": "हम अलेक्जेंड्रिया लाइटहाउस की प्रतियां या कम मॉडल कहां देख सकते हैं?", "r": "तापोसिरिस मैग्ना में, 40 किलोमीटर पश्चिम में, तीस मीटर का एक छोटा सा लाइटहाउस, साथ ही साथ एक टेराकोटा लालटेन फाउम में पाया गया।"}, {"q": "कौन सबसे सटीक और पूर्ण गवाह माना जाता है और वह कैसे आगे बढ़ रहा है?", "r": "इब्न अल-शेख, एक स्पेनिश वैज्ञानिक, जिन्होंने 1165-1166 में लाइटहाउस का दौरा किया और इसे एक ग्रेड रस्सी के साथ फर्श से मापा।"}, {"q": "Ibn al-Shaykh's account के अनुसार बनाई गई लाइटहाउस का पहला भाग कैसे था?", "r": "पहला खंड कट पत्थरों से बना था और एक रैंप द्वारा कवर किया गया था।"}, {"q": "क्या प्रश्न शोधकर्ता गवाह की विश्वसनीयता का न्याय करने के लिए पूछते हैं?", "r": "वे आश्चर्य करते हैं कि अगर गवाह ने लाइटहाउस को देखा है, तो इसे मापा जाता है, या सिर्फ किसी अन्य व्यक्ति के खाते की नकल की जाती है।"}, {"q": "आग के बारे में पहेली क्या है और प्रकाशघर के शीर्ष पर मूर्ति?", "r": "अरब परंपरा शीर्ष पर एक आग रखता है, लेकिन सिक्के एक बड़ी मूर्ति दिखाते हैं, और यह कल्पना करना मुश्किल है कि वे कैसे सह-अस्तित्व करते हैं।"}, {"q": "पुरातत्वविदों द्वारा पानी के नीचे कौन से ब्लॉक पाए गए थे?", "r": "ग्रेनाइट, क्वार्ट्जाइट, संगमरमर और चूना पत्थर के ब्लॉक, कुछ का वजन चालीस टन तक होता है, साथ ही साथ उन्हें सील करने के लिए लीड, आयरन और कांस्य के टुकड़े भी होते हैं।"}, {"q": "3D मॉडलिंग के लिए लगाए गए तीन ज्यामितीय वॉल्यूम क्या हैं?", "r": "एक फुटपाथ (parallelepiped), एक आठ पक्षीय प्रिज्म (अष्टकोणीय) और एक सिलेंडर।"}, {"q": "छात्रों के लिए 3 डी मॉडलिंग की मुख्य बाधा क्या है?", "r": "दिए गए पैमाने का निरीक्षण करें, ऐतिहासिक साक्ष्यों का पालन करें और प्रत्येक मात्रा की स्थिति को सही ठहराएं।"}, {"q": "निर्माण के लिए 3 डी मॉडलिंग क्या है?", "r": "आपको इमारत बनाने से पहले अपनी असेंबली की जांच करने के लिए एक सटीक पैमाने के साथ तीन आयामी इमारत या वस्तु को आकर्षित करने की अनुमति देता है।"}, {"q": "कैसे पुरातत्वविद 3 डी मॉडलिंग का उपयोग करते हैं?", "r": "वे रिवर्स विधि का उपयोग करते हैं: वे उन हिस्सों को फिर से बनाने के लिए छोड़ देते हैं जो समय के साथ गायब हो गए हैं।"}, {"q": "अल-बकरी की भूमिका क्या है?", "r": "अल-बकरी ने 1067 में लाइटहाउस के बारे में लिखा, लेकिन वह शायद कभी अलेक्जेंड्रिया में नहीं आया, हालांकि उन्होंने बहुत उपयोगी जानकारी एकत्र की।"}, {"q": "कुछ मुद्राओं पर दो बिंदुओं का प्रतिनिधित्व करते हैं?", "r": "वे प्रकाशघर के मुखिया पर उत्कीर्ण एक शिलालेख को याद कर सकते हैं, जैसे कि Pline the Elder द्वारा बोली जाने वाली।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
