<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी - Pharos 2/4: चित्र-रोबोट</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान </div><h1>प्रश्नोत्तरी</h1><p class="sous">Pharos 2/4 मामले: चित्र-रोबोट</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "जांच में पहला गवाह कौन कहता है?", "choix": ["Strabon", "अल-बकरी", "इब्न अल-शेख", "पुराने Pline"], "bonne": 0, "explication": "पहला गवाह: Strabon, एक ग्रीक भूगोलकार।"}, {"question": "Strabon किस सामग्री का कहना है कि लाइटहाउस से बनाया गया है?", "choix": ["सफेद पत्थर", "ईंट और प्लास्टर", "लकड़ी और कांस्य", "ग्रेनाइट और संगमरमर"], "bonne": 0, "explication": "वह एक बहुमंजिला, सफेद पत्थर टॉवर के रूप में lighthouse का वर्णन करता है।"}, {"question": "हम सिक्कों पर हेडलाइट के शीर्ष पर क्या देखते हैं?", "choix": ["एक प्रकाश", "एक मूर्ति", "दर्पण", "एक गुंबद"], "bonne": 1, "explication": "कई पक्षों के साथ एक दूसरा खंड, फिर एक तीसरा दौर अनुभाग, और शीर्ष पर, एक मूर्ति।"}, {"question": "Taposiris Magna के छोटे lighthouse कहाँ है?", "choix": ["फाउम में", "अलेक्जेंड्रिया के लगभग 40 किलोमीटर पश्चिम", "दक्षिणी मिस्र में", "मालागा में"], "bonne": 1, "explication": "अलेक्जेंड्रिया के लगभग 40 किलोमीटर पश्चिम में, तापोसिरिस मैग्ना में, दूसरी सदी का एक छोटा सा लाइटहाउस।"}, {"question": "इब्न अल-शेख किस उपकरण के साथ लाइटहाउस को मापने के लिए?", "choix": ["नियम", "एक कम्पास", "एक ग्रेड रस्सी", "कैलकुलेटर"], "bonne": 2, "explication": "वह फर्श के बाद, एक स्नातक रस्सी, एक पत्ती और पंख के साथ लाइटहाउस में चढ़ता है, और वह हर कोने को मापता है।"}, {"question": "क्या सबूत शोधकर्ताओं ने सबसे सटीक और पूर्ण विचार किया?", "choix": ["सिक्के", "स्ट्राबोन", "अल-बकरी", "Ibn al-Shaykh"], "bonne": 3, "explication": "शोधकर्ता अपनी कहानी को सबसे सटीक और पूरी तरह से मानते हैं।"}, {"question": "किस तीन संस्करणों में लाइटहाउस का 3 डी मॉडल होना चाहिए?", "choix": ["एक घन, एक क्षेत्र और पिरामिड", "एक cobblestone, एक छह पक्षीय प्रिज्म और एक शंकु", "एक फुटपाथ, एक आठ पक्षीय प्रिज्म और एक सिलेंडर", "एक सिलेंडर, एक घन और एक गुंबद"], "bonne": 2, "explication": "एक बाधा: एक फुटपाथ, एक आठ पक्षीय प्रिज्म और एक सिलेंडर।"}, {"question": "क्या है?", "choix": ["अग्नि को बनाए रखने के लिए", "मुखौटा को सजाने के लिए", "मूर्तियां बनाना", "उनके बीच ब्लॉकों को सील करने के लिए"], "bonne": 3, "explication": "लीड, आयरन और कांस्य के टुकड़े भी थे, जिनका उपयोग उनके बीच ब्लॉकों को सील करने के लिए किया जाता था।"}, {"question": "क्या हम इब्न अल-शेख के समय प्रकाशघर के दूसरे खंड के बारे में जानते हैं?", "choix": ["वह एक गुंबद के साथ गोल थी", "यह सफेद पत्थर था", "यह ईंटों और प्लास्टर से बना था, एक सीढ़ी के साथ", "यह लकड़ी से बना था।"], "bonne": 2, "explication": "दूसरा खंड, अपने समय में, ईंटों और प्लास्टर से बना था, एक सीढ़ी के साथ।"}, {"question": "क्या सवाल शोधकर्ता खुद को गवाही देने के लिए पूछते हैं?", "choix": ["क्या उसने आग देखी? क्या वह मूर्ति को देख रहा था? क्या वह दर्पण देख रहा था?", "क्या वह ग्रीक में लिखते थे? क्या उसने मिस्र की यात्रा की? क्या वह लाइटहाउस को आकर्षित करता है?", "क्या वह यीशु मसीह के सामने रहते थे? क्या वह यीशु मसीह के बाद रहते थे? क्या वह नाटकों पर लिखते थे?", "क्या वह उसे देख रहा था? क्या वह इसे मापता है? क्या वह किसी और की नकल करता है?"], "bonne": 3, "explication": "क्या वह उसे देख रहा था? क्या वह इसे मापता है? क्या वह किसी और की नकल करता है?"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
