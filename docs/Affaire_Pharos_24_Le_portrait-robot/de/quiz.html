<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Pharos 2/4: Der Porträt-Roboter</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften </div><h1>Quiz</h1><p class="sous">Pharos 2/4 Fall: Der Porträt-Roboter</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Wer ist der erste Zeuge, der bei der Untersuchung angerufen wird?", "choix": ["Strabon", "Al-Bakri", "Ibn al-Shaykh", "Pline der Alte"], "bonne": 0, "explication": "Erster Zeuge: Strabon, ein griechischer Geograph."}, {"question": "Welches Material sagt Strabon, aus dem der Leuchtturm gebaut ist?", "choix": ["weißer Stein", "Ziegelsteine und Gips", "Holz und Bronze", "Granit und Marmor"], "bonne": 0, "explication": "Er beschreibt den Leuchtturm als einen mehrstöckigen, weißen Steinturm."}, {"question": "Was sehen wir oben auf dem Scheinwerfer auf Münzen?", "choix": ["1 Licht", "eine Statue", "einem Spiegel", "eine Kuppel"], "bonne": 1, "explication": "Ein zweiter Abschnitt mit mehreren Seiten, dann ein dritter runder Abschnitt und oben eine Statue."}, {"question": "Wo ist Taposiris Magnas kleiner Leuchtturm?", "choix": ["in Fayoum", "etwa 40 Kilometer westlich von Alexandria", "im Süden Ägyptens", "in Malaga"], "bonne": 1, "explication": "Etwa 40 Kilometer westlich von Alexandria, in Taposiris Magna, nimmt ein kleiner Leuchtturm aus dem zweiten Jahrhundert v. Chr. das gleiche Muster auf."}, {"question": "Mit welchem Werkzeug misst Ibn al-Shaykh den Leuchtturm?", "choix": ["eine Regel", "ein Kompass", "ein abgestuftes Seil", "einem Rechner"], "bonne": 2, "explication": "Er klettert in den Leuchtturm, Boden für Boden, mit einem abgestuften Seil, einem Blatt und einer Feder, und er misst jede Ecke."}, {"question": "Welche Beweise betrachten Forscher als die genauesten und vollständigsten?", "choix": ["Münzen", "Strabon", "die von Al-Bakri", "die von Ibn al-Shaykh"], "bonne": 3, "explication": "Die Forscher betrachten seine Geschichte als die genaueste und vollständigste von allen."}, {"question": "Welche drei Bände sollten das 3D-Modell des Leuchtturms enthalten?", "choix": ["ein Würfel, eine Kugel und eine Pyramide", "einem Kopfsteinpflaster, einem sechsseitigen Prisma und einem Kegel", "ein Pflaster, ein achtseitiges Prisma und ein Zylinder", "ein Zylinder, ein Würfel und ein Dom"], "bonne": 2, "explication": "Beschränken Sie einen: einen Bürgersteig, ein achtseitiges Prisma und einen Zylinder."}, {"question": "Wofür wurden die Stücke Blei, Eisen und Bronze im Wasser gefunden?", "choix": ["um das Feuer zu erhalten", "Um die Fassade zu dekorieren", "Statuen machen", "Um die Blöcke zwischen ihnen zu versiegeln"], "bonne": 3, "explication": "Es gab auch Stücke von Blei, Eisen und Bronze, die verwendet wurden, um die Blöcke zwischen ihnen zu versiegeln."}, {"question": "Was erfahren wir über den zweiten Abschnitt des Leuchtturms zur Zeit von Ibn al-Shaykh?", "choix": ["Sie war rund mit einer Kuppel", "Es war weißer Stein", "Es war aus Ziegeln und Gips, mit einer Treppe", "Es war aus Holz."], "bonne": 2, "explication": "Der zweite Abschnitt bestand zu seiner Zeit aus Ziegeln und Gips mit einer Treppe."}, {"question": "Welche Fragen stellen sich Forscher, um einen Zeugen zu beurteilen?", "choix": ["Hat er das Feuer gesehen? Hat er die Statue gesehen? Hat er den Spiegel gesehen?", "Hat er auf Griechisch geschrieben? Ist er nach Ägypten gereist? Hat er den Leuchtturm gezeichnet?", "Lebte er vor Jesus Christus? Lebte er nach Jesus Christus? Hat er über Theaterstücke geschrieben?", "Hat er ihn gesehen? Hat er es gemessen? Oder hat er jemand anderen kopiert?"], "bonne": 3, "explication": "Hat er ihn gesehen? Hat er es gemessen? Oder hat er jemand anderen kopiert?"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
