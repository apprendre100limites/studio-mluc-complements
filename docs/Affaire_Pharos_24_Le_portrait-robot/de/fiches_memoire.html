<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faktenblätter — Pharos 2/4 Fall: Der Porträt-Roboter</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften </div><h1>Speicherkarten</h1><p class="sous">Pharos 2/4 Fall: Der Porträt-Roboter</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Wer ist der erste Zeuge, der im Video beschrieben wird und was sagt er über den Leuchtturm?", "r": "Strabon, ein griechischer Geograph aus dem 1. Jahrhundert v. Chr., beschreibt ihn als einen mehrstöckigen weißen Steinturm, wobei das griechische Wort \"bewundernswert\" bedeutet."}, {"q": "Was sagen uns die Münzen über das Aussehen des Leuchtturms?", "r": "Die Münzen zeigen eine Basis mit einer Gradrampe, einen quadratischen Abschnitt mit Tritonen, einen Abschnitt mit mehreren Seiten, einen runden Abschnitt und eine Statue oben."}, {"q": "Wo finden wir Kopien oder reduzierte Modelle von Alexandria Lighthouse?", "r": "In Taposiris Magna, 40 Kilometer westlich, ein kleiner Leuchtturm von dreißig Metern, sowie eine Terrakotta Laterne im Fayoum gefunden."}, {"q": "Wer ist der genaueste und vollständigste Zeuge und wie ist er vorgegangen?", "r": "Ibn al-Shaykh, ein spanischer Wissenschaftler, der den Leuchtturm 1165-1166 besuchte und ihn Boden für Boden mit einem abgestuften Seil maß."}, {"q": "Wie wurde der erste Abschnitt des Leuchtturms nach Ibn al-Shaykhs Bericht gebildet?", "r": "Der erste Abschnitt bestand aus geschnittenen Steinen und wurde von einer Rampe abgedeckt."}, {"q": "Welche Fragen stellen sich Forscher, um die Zuverlässigkeit eines Zeugen zu beurteilen?", "r": "Sie fragen sich, ob der Zeuge den Leuchtturm gesehen, ihn gemessen oder einfach das Konto einer anderen Person kopiert hat."}, {"q": "Was ist das Rätsel über das Feuer und die Statue an der Spitze des Leuchtturms?", "r": "Die arabische Tradition stellt ein Feuer an der Spitze, aber die Münzen zeigen eine große Statue, und es ist schwer vorstellbar, wie sie koexistierten."}, {"q": "Welche Blöcke wurden von Archäologen am Grund des Wassers gefunden?", "r": "Blöcke aus Granit, Quarzit, Marmor und Kalkstein, einige mit einem Gewicht von bis zu vierzig Tonnen, sowie Stücke von Blei, Eisen und Bronze, um sie zu versiegeln."}, {"q": "Was sind die drei geometrischen Volumen für die 3D-Modellierung auferlegt?", "r": "Ein Pflaster (parallelepiped), ein achtseitiges Prisma (oktogonal) und ein Zylinder."}, {"q": "Was ist die Haupteinschränkung der 3D-Modellierung für Studenten?", "r": "Respektieren Sie die gegebene Skala, folgen Sie historischen Beweisen und rechtfertigen Sie die Position jedes Bandes."}, {"q": "Was ist 3D-Modellierung für die Konstruktion?", "r": "Ermöglicht es Ihnen, ein dreidimensionales Gebäude oder Objekt mit einem präzisen Maßstab zu zeichnen, um seine Montage vor dem Bau zu überprüfen."}, {"q": "Wie nutzen Archäologen 3D-Modellierung?", "r": "Sie verwenden die umgekehrte Methode: Sie lassen gefundene Teile zurück, um das wieder aufzubauen, was im Laufe der Zeit verschwunden ist."}, {"q": "Welche Rolle spielt Al-Bakri als Zeuge des Leuchtturms?", "r": "Al-Bakri schrieb 1067 über den Leuchtturm, aber er kam wahrscheinlich nie nach Alexandria, obwohl er sehr nützliche Informationen sammelte."}, {"q": "Was bedeuten die beiden Punkte in bestimmten Währungen?", "r": "Sie erinnern sich vielleicht an eine Inschrift, die auf der Fassade des Leuchtturms eingraviert ist, wie die von Pline dem Älteren."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
