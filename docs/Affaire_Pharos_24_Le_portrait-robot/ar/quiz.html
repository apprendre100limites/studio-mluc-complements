<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Pharos 2/4: The portrait-robot</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>Quiz</h1><p class="sous">Pharos 2/4 case: The portrait-robot</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "من الشاهد الأول الذي تم استدعاؤه في التحقيق؟", "choix": ["Strabon", "Al-Bakri", "بن الشيخ", "الخط القديم"], "bonne": 0, "explication": "الشاهد الأول: Strabon, a Greek geographer."}, {"question": "ما المادة التي تقول (سترابون) أن المنارة مبنية من؟", "choix": ["حجر أبيض", "الطوب والبلاستر", "الخشب والبرونز", "الغرانيت والرخام"], "bonne": 0, "explication": "يصف المنارة برج حجر أبيض متعدد الطوابق"}, {"question": "ماذا نرى في قمة ضوء الرأس على العملات؟", "choix": ["ضوء واحد", "تمثال", "مرآة", "القبة"], "bonne": 1, "explication": "قسم ثان مع عدة جوانب، ثم قسم الجولة الثالثة، وعلى القمة، تمثال."}, {"question": "أين منزل (تيريس ماغنا) الصغير؟", "choix": ["in Fayoum", "حوالي 40 كيلومترا غرب أليكساندريا", "جنوب مصر", "في مالاغا"], "bonne": 1, "explication": "حوالي 40 كيلومترا غرب الأسكندرية، في تيريس ماغنا، وهي منارة صغيرة في القرن الثاني B.C."}, {"question": "ما هي الأداة التي يقيس بها إيبن الشيخ المنارة؟", "choix": ["قاعدة", "بوصلة", "حبل مرتب", "حاسب"], "bonne": 2, "explication": "يصعد إلى المنارة، أرضاً بعد الأرض، مع حبل مُتخرج، ورقة وريشة، وهو يُقيس كل زاوية."}, {"question": "أي دليل يعتبره الباحثون أدق وأكمل؟", "choix": ["العملات", "Strabon's", "ملك البكري", "ابن الشيخ"], "bonne": 3, "explication": "ويعتبر الباحثون قصته أدق وأكمل من أي شيء."}, {"question": "أي ثلاثة مجلدات يجب أن تحتوي على نموذج 3D من المنارة؟", "choix": ["مكعب وهرم", "كبلستون، نجوم من ستة أحواض، وكون", "رصيف، نوبة من ثمانية جوانب، وأسطوانة", "أسطوانة واحدة، مكعب واحد ودمية واحدة"], "bonne": 2, "explication": "مضيق واحد: رصيف، نوبة من ثمانية جوانب، وأسطوانة."}, {"question": "ما هي قطع الرصاص، الحديد والبرونز وجدت في الماء؟", "choix": ["للحفاظ على النار", "لتزيين واجهة", "صنع التماثيل", "لإغلاق المباني بينهما"], "bonne": 3, "explication": "وكانت هناك أيضاً أجزاء من الرصاص والحديد والبرونز التي استخدمت لإغلاق المباني بينهما."}, {"question": "ما الذي نتعلمه عن الجزء الثاني من المنارة في وقت إبن الشيخ؟", "choix": ["كانت تدور مع القبة", "كان حجر أبيض", "كانت مصنوعة من الطوب والبلاستر مع الدرج", "كانت مصنوعة من الخشب"], "bonne": 2, "explication": "أما الفرع الثاني، فقد كان في وقته مصنوعاً من الطوب واللباس، مع سلم."}, {"question": "أي أسئلة يطلبها الباحثون أن يحكموا على شاهد؟", "choix": ["هل رأى النار؟ هل رأى التمثال؟ هل رأى المرآة؟", "هل كتب باللغة اليونانية؟ هل سافر إلى مصر؟ هل رسم المنارة؟", "هل عاش قبل المسيح؟ هل عاش بعد المسيح؟ هل كتب على المسرحيات؟", "هل رآه؟ هل قام بقياسها؟ أم أنه نسخ شخص آخر؟"], "bonne": 3, "explication": "هل رآه؟ هل قام بقياسها؟ أم أنه نسخ شخص آخر؟"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
