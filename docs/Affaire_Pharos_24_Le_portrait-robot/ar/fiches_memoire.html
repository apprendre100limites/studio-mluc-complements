<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صحيفة وقائع - قضية Pharos 2/4: الصورة - روبوت</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>بطاقات الذاكرة</h1><p class="sous">Pharos 2/4 case: The portrait-robot</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "من هو الشاهد الأول الموصوف في الفيديو وماذا يقول عن المنارة؟", "r": "Strabon, a Greek geographer from the 1st century B.C., describes him as a multi-storey white stone tower, using the Greek word meaning \"admirably\"."}, {"q": "ماذا تخبرنا العملات عن ظهور المنارة؟", "r": "العملات تظهر قاعدة مع منحدر درجة، وقسم مربع مع ثلاثيات، وقسم مع عدة جوانب، وقسم دائري وتمثال في القمة."}, {"q": "أين يمكن أن نجد نسخا أو نماذج منخفضة من أليكساندريا لايتهاوس؟", "r": "في تيريس ماغنا، 40 كيلومترا إلى الغرب، منارة صغيرة من ثلاثين مترا، فضلا عن شعلة تيراكوتا وجدت في الفيوم."}, {"q": "من يُعتبر الشاهد الأكثر دقة واكتمالاً وكيف سار؟", "r": "Ibn al-Shaykh, a Spanish scientist, who visited the lighthouse in 1165-1166 and measured it floor by floor with a graded rope."}, {"q": "كيف كان القسم الأول من المنارة تم تشكيله وفقاً لحساب (إبن الشيخ)؟", "r": "القسم الأول كان مصنوعاً من الحجارة المقطعة وكان مغطى بمنحدر"}, {"q": "ما هي الأسئلة التي يطلبها الباحثون للحكم على موثوقية الشاهد؟", "r": "يتساءلون إذا شاهد الشاهد المنارة، قيسها، أو نسخ حساب شخص آخر."}, {"q": "ما هو اللغز حول النار والتمثال في قمة المنارة؟", "r": "التقليد العربي يضع النار على القمة لكن العملات تظهر تمثالاً كبيراً ومن الصعب تخيل كيف تتعايش"}, {"q": "أي لبنات وجدت في قاع الماء من قبل علماء الآثار؟", "r": "كتل من الغرانيت و الهروط و الرخام و الحجر الجيري وبعضها يزن 40 طناً بالإضافة إلى قطع من الرصاص و الحديد و البرونز لإغلاقها"}, {"q": "ما هي المجلدات الأرضية الثلاثة التي فرضت لنمذجة 3D؟", "r": "A pavement (parallelepiped), an eight-sided prism (octogonal) and a cylinder."}, {"q": "ما هو القيد الرئيسي لنموذج 3D للطلاب؟", "r": "احترام الجدول المعين، ومتابعة الأدلة التاريخية، وتبرير موقف كل مجلد."}, {"q": "ما هو نموذج 3D للبناء؟", "r": "يسمح لك برسم مبنى ثلاثي الأبعاد أو جسم مع جدول دقيق للتحقق من تجمعه قبل بناءه"}, {"q": "كيف يستخدم علماء الآثار نمذجة 3D؟", "r": "They use the reverse method: they leave found parts to rebuild what has disappeared over time."}, {"q": "ما هو دور البكري كشاهد على المنارة؟", "r": "وكتب البوكري عن المنارة في عام 1067، لكنه ربما لم يأتي أبدا إلى الاسكندرية، رغم أنه جمع معلومات مفيدة جدا."}, {"q": "ماذا تمثل النقطتين على عملات معينة؟", "r": "They may recall an inscription engraved on the facade of the lighthouse, such as the one spoken of by Pline the elder."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
