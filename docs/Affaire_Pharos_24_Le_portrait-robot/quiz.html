<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Affaire Pharos 2/4 : Le portrait-robot</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Quiz</h1><p class="sous">Affaire Pharos 2/4 : Le portrait-robot</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Qui est le premier témoin cité dans l'enquête ?", "choix": ["Strabon", "Al-Bakri", "Ibn al-Shaykh", "Pline l'Ancien"], "bonne": 0, "explication": "Premier témoin : Strabon, un géographe grec."}, {"question": "De quel matériau Strabon dit-il que le phare est construit ?", "choix": ["pierre blanche", "brique et plâtre", "bois et bronze", "granite et marbre"], "bonne": 0, "explication": "Il décrit le phare comme une tour à plusieurs étages, en pierre blanche."}, {"question": "Que voit-on tout en haut du phare sur les pièces de monnaie ?", "choix": ["un feu", "une statue", "un miroir", "un dôme"], "bonne": 1, "explication": "Une deuxième section à plusieurs côtés, puis une troisième section ronde, et tout en haut, une statue."}, {"question": "Où se trouve le petit phare de Taposiris Magna ?", "choix": ["dans le Fayoum", "à une quarantaine de kilomètres à l'ouest d'Alexandrie", "dans le sud de l'Égypte", "à Malaga"], "bonne": 1, "explication": "À une quarantaine de kilomètres à l'ouest d'Alexandrie, à Taposiris Magna, un petit phare du deuxième siècle avant Jésus-Christ reprend le même schéma."}, {"question": "Avec quel outil Ibn al-Shaykh mesure-t-il le phare ?", "choix": ["une règle", "un compas", "une corde graduée", "une calculatrice"], "bonne": 2, "explication": "il monte dans le phare, étage après étage, avec une corde graduée, une feuille et une plume, et il mesure chaque recoin."}, {"question": "Quel témoignage les chercheurs considèrent-ils comme le plus précis et le plus complet ?", "choix": ["celui des pièces de monnaie", "celui de Strabon", "celui d'Al-Bakri", "celui d'Ibn al-Shaykh"], "bonne": 3, "explication": "Les chercheurs considèrent son récit comme le plus précis et le plus complet de tous."}, {"question": "Quels trois volumes doit contenir la maquette 3D du phare ?", "choix": ["un cube, une sphère et une pyramide", "un pavé, un prisme à six côtés et un cône", "un pavé, un prisme à huit côtés et un cylindre", "un cylindre, un cube et un dôme"], "bonne": 2, "explication": "Contrainte un : un pavé, un prisme à huit côtés et un cylindre."}, {"question": "À quoi servaient les morceaux de plomb, de fer et de bronze retrouvés dans l'eau ?", "choix": ["à entretenir le feu", "à décorer la façade", "à fabriquer des statues", "à sceller les blocs entre eux"], "bonne": 3, "explication": "On y a aussi retrouvé des morceaux de plomb, de fer et de bronze, qui servaient à sceller les blocs entre eux."}, {"question": "Que nous apprend-on sur la deuxième section du phare à l'époque d'Ibn al-Shaykh ?", "choix": ["elle était ronde avec un dôme", "elle était en pierre blanche", "elle était faite de briques et de plâtre, avec un escalier", "elle était en bois"], "bonne": 2, "explication": "la deuxième section, à son époque, était faite de briques et de plâtre, avec un escalier."}, {"question": "Quelles questions les chercheurs se posent-ils pour juger un témoin ?", "choix": ["A-t-il vu le feu ? A-t-il vu la statue ? A-t-il vu le miroir ?", "A-t-il écrit en grec ? A-t-il voyagé en Égypte ? A-t-il dessiné le phare ?", "A-t-il vécu avant Jésus-Christ ? A-t-il vécu après Jésus-Christ ? A-t-il écrit sur des pièces ?", "L'a-t-il vu ? L'a-t-il mesuré ? Ou a-t-il recopié quelqu'un d'autre ?"], "bonne": 3, "explication": "L'a-t-il vu ? L'a-t-il mesuré ? Ou a-t-il recopié quelqu'un d'autre ?"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
