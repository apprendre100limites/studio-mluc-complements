</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Memory Sheets</h1><p class="sous">Pharos Case 2/4: The Robot Portrait</p><p class="sous">Read the question, answer in your head, then click on the card to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide All</button></p><div id="c"></div></main><script>const C=[{"q": "Who is the first witness described in the video and what does he say about the lighthouse?", "r": "Strabo, a Greek geographer from the 1st century BC.-C., describes it as a multi-story white stone tower, using the Greek word meaning \"admirably\"."}, {"q": "What do the coins tell us about the appearance of the lighthouse?", "r": "The coins show a base with a step ramp, a square section with newts, a multi-sided section, a round section and a statue at the top."}, {"q": "Where can I find copies or scale models of the Alexandria Lighthouse?", "r": "In Taposiris Magna, forty kilometers to the west, a small lighthouse of thirty meters, as well as a terracotta lantern found in the Fayoum."}, {"q": "Who is considered the most accurate and complete witness and how did he proceed?", "r": "Ibn al-Shaykh, a Spanish scholar, who visited the lighthouse in 1165-1166 and measured it floor by floor with a graduated rope."}, {"q": "How was the first section of the lighthouse built according to Ibn al-Shaykh's account?", "r": "The first section was made of stone and was covered by a ramp."}, {"q": "What questions do researchers ask to judge the reliability of a witness?", "r": "They wonder if the witness saw the lighthouse, if he measured it, or if he simply copied another person's story."}, {"q": "What is the riddle about the fire and the statue at the top of the lighthouse?", "r": "Arab tradition places a fire at the very top, but the coins show a large statue, and it's hard to imagine how they coexisted."}, {"q": "Which blocks have been found at the bottom of the water by archaeologists?", "r": "Blocks of granite, quartzite, marble and limestone, some weighing up to forty tons, as well as pieces of lead, iron and bronze to seal them."}, {"q": "What are the three imposed geometric volumes for 3D modeling?", "r": "A block (parallelepiped), an eight-sided prism (octagonal) and a cylinder."}, {"q": "What is the main constraint of 3D modeling for students?", "r": "Respect the given scale, follow the historical testimonies and justify the position of each volume."}, {"q": "What is 3D modeling used for in the construction trades?", "r": "Allows you to draw a building or object in three dimensions with a precise scale to check its assembly before building it."}, {"q": "How do archaeologists use 3D modeling?", "r": "They use the upside-down method: they start from the pieces found to rebuild what has disappeared over time."}, {"q": "What is Al-Bakri's role as a lighthouse witness?", "r": "Al-Bakri wrote about the lighthouse in 1067, but he probably never came to Alexandria, although he gathered some very useful information."}, {"q": "What do the two lines of dots on some currencies represent?", "r": "They may recall an inscription engraved on the facade of the lighthouse, like the one mentioned by Pliny the Elder."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
