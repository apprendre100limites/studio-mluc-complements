</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Quiz</h1><p class="sous">Pharos Case 2/4: The Robot Portrait</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Who is the first witness called in the investigation?", "choix": ["Strabo", "Al-Bakri", "Ibn al-Shaykh", "Pliny the Elder"], "bonne": 0, "explication": "First witness: Strabo, a Greek geographer."}, {"question": "What material does Strabo say the lighthouse is made of?", "choix": ["white stone", "brick and plaster", "wood and bronze", "granite and marble"], "bonne": 0, "explication": "He describes the lighthouse as a multi-story, white stone tower."}, {"question": "What do you see at the top of the lighthouse on the coins?", "choix": ["a fire", "a statue", "a mirror", "a dome"], "bonne": 1, "explication": "A second section with several sides, then a third round section, and at the very top, a statue."}, {"question": "Where is the small lighthouse of Taposiris Magna?", "choix": ["in Fayoum", "about forty kilometers west of Alexandria", "in southern Egypt", "in Malaga"], "bonne": 1, "explication": "About forty kilometers west of Alexandria, in Taposiris Magna, a small lighthouse from the second century BC resumes the same pattern."}, {"question": "With which tool does Ibn al-Shaykh measure the lighthouse?", "choix": ["a rule", "a compass", "a graduated rope", "a calculator"], "bonne": 2, "explication": "he climbs into the lighthouse, floor after floor, with a graduated rope, a sheet and a feather, and he measures every nook and cranny."}, {"question": "What testimony do researchers consider to be the most accurate and comprehensive?", "choix": ["that of coins", "that of Strabo", "that of Al-Bakri", "that of Ibn al-Shaykh"], "bonne": 3, "explication": "Scholars regard his account as the most accurate and complete of all."}, {"question": "What three volumes should contain the 3D model of the lighthouse?", "choix": ["a cube, a sphere and a pyramid", "a cobblestone, a six-sided prism and a cone", "a pavement, an eight-sided prism and a cylinder", "one cylinder, one cube and one dome"], "bonne": 2, "explication": "Constraint one: a pavement, an eight-sided prism and a cylinder."}, {"question": "What were the pieces of lead, iron and bronze found in the water for?", "choix": ["to maintain the fire", "to decorate the facade", "making statues", "to seal the blocks between them"], "bonne": 3, "explication": "There were also pieces of lead, iron and bronze, which were used to seal the blocks between them."}, {"question": "What do we learn about the second section of the lighthouse at the time of Ibn al-Shaykh?", "choix": ["she was round with a dome", "it was white stone", "it was made of bricks and plaster, with a staircase", "It was made of wood."], "bonne": 2, "explication": "the second section, in its time, was made of bricks and plaster, with a staircase."}, {"question": "What questions do researchers ask themselves to judge a witness?", "choix": ["Did he see the fire? Did he see the statue? Did he see the mirror?", "Did he write in Greek? Did he travel to Egypt? Did he draw the lighthouse?", "Did he live before Jesus Christ? Did he live after Jesus Christ? Did he write on plays?", "Did he see him? Did he measure it? Or did he copy someone else?"], "bonne": 3, "explication": "Did he see him? Did he measure it? Or did he copy someone else?"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
