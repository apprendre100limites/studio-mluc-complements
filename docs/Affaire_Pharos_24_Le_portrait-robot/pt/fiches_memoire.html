<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folhas de factos — Processo Pharos 2/4: O retrato-robô</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências </div><h1>Cartões de memória</h1><p class="sous">Caso Pharos 2/4: O retrato-robô</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "Quem é a primeira testemunha descrita no vídeo e o que ele diz sobre o farol?", "r": "Strabon, um geógrafo grego do século I a.C., descreve-o como uma torre de pedra branca de vários andares, usando a palavra grega que significa \"admiravelmente\"."}, {"q": "O que nos dizem as moedas sobre o aparecimento do farol?", "r": "As moedas mostram uma base com uma rampa de grau, uma seção quadrada com tritões, uma seção com vários lados, uma seção redonda e uma estátua no topo."}, {"q": "Onde podemos encontrar cópias ou modelos reduzidos de Alexandria Lighthouse?", "r": "Em Taposiris Magna, 40 quilômetros a oeste, um pequeno farol de trinta metros, bem como uma lanterna terracota encontrada no Fayoum."}, {"q": "Quem é considerado o testemunho mais exato e completo e como ele agiu?", "r": "Ibn al-Shaykh, um cientista espanhol, que visitou o farol em 1165-1166 e mediu-o chão por chão com uma corda graduada."}, {"q": "Como foi formada a primeira seção do farol de acordo com o relato de Ibn al-Shaykh?", "r": "A primeira seção foi feita de pedras cortadas e foi coberta por uma rampa."}, {"q": "Que perguntas fazem os pesquisadores para julgar a confiabilidade do testemunho?", "r": "Perguntam-se se a testemunha viu o farol, mediu-o ou apenas copiou o relato de outra pessoa."}, {"q": "Qual é o enigma sobre o fogo e a estátua no topo do farol?", "r": "A tradição árabe coloca um fogo no topo, mas as moedas mostram uma grande estátua, e é difícil imaginar como elas coexistiram."}, {"q": "Que blocos foram encontrados no fundo da água pelos arqueólogos?", "r": "Blocos de granito, quartzito, mármore e calcário, alguns pesando até quarenta toneladas, bem como pedaços de chumbo, ferro e bronze para selá-los."}, {"q": "Quais são os três volumes geométricos impostos para modelagem 3D?", "r": "Um pavimento (paralelepiped), um prisma de oito lados (octogonal) e um cilindro."}, {"q": "Qual é a principal restrição da modelagem 3D para os alunos?", "r": "Respeitar a escala dada, seguir evidências históricas e justificar a posição de cada volume."}, {"q": "O que é modelagem 3D para construção?", "r": "Permite desenhar um edifício ou objeto tridimensional com uma escala precisa para verificar sua montagem antes de construí-lo."}, {"q": "Como os arqueólogos usam modelagem 3D?", "r": "Eles usam o método inverso: eles deixam partes encontradas para reconstruir o que desapareceu ao longo do tempo."}, {"q": "Qual é o papel do Al-Bakri como testemunha do farol?", "r": "Al-Bakri escreveu sobre o farol em 1067, mas ele provavelmente nunca veio para Alexandria, embora ele coletou informações muito úteis."}, {"q": "O que representam os dois pontos relativos a determinadas moedas?", "r": "Talvez se lembrem de uma inscrição gravada na fachada do farol, como a de Pline, o Velho."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
