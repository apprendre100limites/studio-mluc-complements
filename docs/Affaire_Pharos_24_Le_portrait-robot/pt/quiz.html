<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionário — Pharos 2/4: O retrato-robô</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências </div><h1>Quiz</h1><p class="sous">Caso Pharos 2/4: O retrato-robô</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Quem é a primeira testemunha chamada na investigação?", "choix": ["Trevo", "Al-Bakri", "Ibn al-Shaykh", "Pline o Velho"], "bonne": 0, "explication": "Primeira testemunha: Strabon, um geógrafo grego."}, {"question": "De que material diz Strabon que o farol foi construído?", "choix": ["pedra branca", "tijolos e gesso", "madeira e bronze", "granito e mármore"], "bonne": 0, "explication": "Ele descreve o farol como uma torre de pedra branca de vários andares."}, {"question": "O que vemos no topo do farol das moedas?", "choix": ["uma luz", "uma estátua", "um espelho", "uma cúpula"], "bonne": 1, "explication": "Uma segunda seção com vários lados, depois uma terceira seção redonda, e no topo, uma estátua."}, {"question": "Onde está o pequeno farol de Taposiris Magna?", "choix": ["em Fayoum", "cerca de 40 quilômetros a oeste de Alexandria", "no sul do Egito", "em Málaga"], "bonne": 1, "explication": "Cerca de 40 quilômetros a oeste de Alexandria, em Taposiris Magna, um pequeno farol do segundo século A.C. assume o mesmo padrão."}, {"question": "Com que ferramenta Ibn al-Shaykh mede o farol?", "choix": ["uma regra", "uma bússola", "uma corda graduada", "uma calculadora"], "bonne": 2, "explication": "sobe ao farol, piso após chão, com uma corda graduada, uma folha e uma pena, e mede cada canto."}, {"question": "Que evidência consideram os pesquisadores os mais exatos e completos?", "choix": ["moedas", "Strabon's", "a de Al-Bakri", "a de Ibn al-Shaykh"], "bonne": 3, "explication": "Os pesquisadores consideram sua história a mais precisa e completa de todas."}, {"question": "Que três volumes devem conter o modelo 3D do farol?", "choix": ["um cubo, uma esfera e uma pirâmide", "um paralelepípedo, um prisma de seis lados e um cone", "um pavimento, um prisma de oito lados e um cilindro", "um cilindro, um cubo e uma cúpula"], "bonne": 2, "explication": "Restrição um: um pavimento, um prisma de oito lados e um cilindro."}, {"question": "Para que foram encontrados os pedaços de chumbo, ferro e bronze na água?", "choix": ["para manter o fogo", "para decorar a fachada", "fazendo estátuas", "para selar os blocos entre eles"], "bonne": 3, "explication": "Havia também pedaços de chumbo, ferro e bronze, que eram usados para selar os blocos entre eles."}, {"question": "O que aprendemos sobre a segunda seção do farol na época de Ibn al-Shaykh?", "choix": ["Ela estava redonda com uma cúpula", "Era pedra branca.", "era feito de tijolos e gesso, com uma escada", "Era feito de madeira."], "bonne": 2, "explication": "a segunda seção, em seu tempo, foi feita de tijolos e gesso, com uma escadaria."}, {"question": "Que perguntas fazem os pesquisadores a si mesmos para julgar um testemunho?", "choix": ["Ele viu o fogo? Ele viu a estátua? Ele viu o espelho?", "Escreveu em grego? Ele viajou para o Egipto? Ele desenhou o farol?", "Viveu ele antes de Jesus Cristo? Viveu depois de Jesus Cristo? Ele escreveu em peças?", "Ele viu-o? Ele mediu? Ou ele copiou outra pessoa?"], "bonne": 3, "explication": "Ele viu-o? Ele mediu? Ou ele copiou outra pessoa?"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
