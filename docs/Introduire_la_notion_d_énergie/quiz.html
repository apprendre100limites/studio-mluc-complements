<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Introduire la notion d&#x27;énergie</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Quiz</h1><p class="sous">Introduire la notion d&#x27;énergie</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Qu'a un pendule qui se balance ?", "choix": ["Du froid", "Du silence", "De la lumière", "De l'énergie"], "bonne": 3, "explication": "Un pendule qui se balance a de l'énergie."}, {"question": "Quand le pendule est en haut de sa course, qu'est-ce qui est nulle un instant ?", "choix": ["Sa température", "Son altitude", "Sa vitesse", "Sa masse"], "bonne": 2, "explication": "En haut de sa course, le pendule est à son altitude maximale et sa vitesse est nulle un instant."}, {"question": "D'où provient l'apport d'énergie du corps ?", "choix": ["Du sommeil", "Des aliments", "Du vent", "Du soleil"], "bonne": 1, "explication": "L'apport, c'est l'énergie des aliments."}, {"question": "Que fait une machine avec l'énergie d'une source ?", "choix": ["Elle la détruit", "Elle la crée", "Elle l'évapore", "Elle la convertit"], "bonne": 3, "explication": "Une machine ne crée pas d'énergie : elle convertit celle d'une source."}, {"question": "Laquelle de ces listes contient uniquement des sources renouvelables ?", "choix": ["Le charbon, le fioul et le soleil", "Le pétrole, le charbon et le gaz", "Le soleil, le vent et l'eau", "Le gaz, l'eau et le pétrole"], "bonne": 2, "explication": "Certaines sources se renouvellent aussi vite qu'on les utilise, comme le soleil, le vent ou l'eau : elles sont renouvelables."}, {"question": "Dans le texte, de quel type est l'énergie des aliments ?", "choix": ["Électrique", "Chimique", "Solaire", "Nucléaire"], "bonne": 1, "explication": "L'énergie des aliments, chimique, devient énergie de mouvement dans tes muscles."}, {"question": "Quand le pendule s'arrête à cause des frottements, que devient son énergie ?", "choix": ["Elle se transforme en lumière", "Elle est transférée à l'air, qui chauffe très légèrement", "Elle s'évapore dans l'air", "Elle disparaît complètement"], "bonne": 1, "explication": "À cause des frottements, elle a été transférée à l'air, qu'elle a chauffé très légèrement."}, {"question": "Pour quoi le corps dépense-t-il de l'énergie ?", "choix": ["Pour stocker des aliments et produire de la lumière", "Pour créer de nouvelles sources d'énergie", "Pour bouger, réfléchir et garder sa température", "Pour grandir, dormir et respirer uniquement"], "bonne": 2, "explication": "Les besoins, c'est l'énergie que ton corps dépense pour bouger, réfléchir et garder sa température."}, {"question": "Pourquoi une éolienne utilise-t-elle une source d'énergie renouvelable ?", "choix": ["Parce qu'elle ne fait aucun bruit", "Parce qu'elle est faite de métal", "Parce qu'elle produit de la chaleur", "Parce que le vent se renouvelle aussi vite qu'on l'utilise"], "bonne": 3, "explication": "Parce que le vent se renouvelle aussi vite qu'on l'utilise."}, {"question": "Selon la conclusion, que se passe-t-il avec l'énergie ?", "choix": ["Elle s'évapore avec le temps", "Elle est détruite par les frottements", "Elle est créée par les machines", "Elle se transfère et se convertit, sans disparaître"], "bonne": 3, "explication": "L'énergie se transfère et se convertit, sans disparaître."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
