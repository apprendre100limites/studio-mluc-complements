<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Introduire la notion d&#x27;énergie</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Fiches mémoire</h1><p class="sous">Introduire la notion d&#x27;énergie</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Un pendule a de l'énergie dans quels deux cas ?", "r": "Il a de l'énergie quand il est en mouvement ou quand il est en hauteur."}, {"q": "Que se passe-t-il en haut de la course d'un pendule ?", "r": "Il est à son altitude maximale et sa vitesse est nulle un instant."}, {"q": "Que se passe-t-il en bas de la course d'un pendule ?", "r": "Il est à son altitude minimale et il va le plus vite."}, {"q": "Pourquoi un pendule finit-il par s'arrêter ?", "r": "À cause des frottements, son énergie est transférée à l'air, qu'elle chauffe très légèrement."}, {"q": "L'énergie d'un pendule qui s'arrête a-t-elle disparu ?", "r": "Non, elle n'a pas disparu : elle a été transférée à l'air."}, {"q": "Quel est l'apport énergétique du corps humain ?", "r": "L'apport, c'est l'énergie des aliments."}, {"q": "À quoi le corps dépense-t-il son énergie ?", "r": "Le corps dépense de l'énergie pour bouger, réfléchir et garder sa température."}, {"q": "Quels sont les besoins énergétiques quotidiens d'un adulte ?", "r": "Ils sont de l'ordre de huit mille trois cent soixante-huit à dix mille quatre cent soixante kilojoules par jour."}, {"q": "Les besoins énergétiques sont-ils plus élevés à l'adolescence ?", "r": "Oui, ils sont souvent plus élevés si on est actif."}, {"q": "Que se passe-t-il si l'alimentation apporte trop peu d'énergie ?", "r": "Tu es fatigué."}, {"q": "Que se passe-t-il si l'alimentation apporte trop d'énergie ?", "r": "Le corps stocke l'énergie en trop."}, {"q": "Une machine crée-t-elle de l'énergie ?", "r": "Non, une machine ne crée pas d'énergie : elle convertit celle d'une source."}, {"q": "Donne deux exemples de conversion d'énergie par une machine.", "r": "Un moteur convertit l'énergie du carburant, et un panneau solaire convertit celle de la lumière."}, {"q": "Qu'est-ce qu'une source d'énergie renouvelable ?", "r": "C'est une source qui se renouvelle aussi vite qu'on l'utilise, comme le soleil, le vent ou l'eau."}, {"q": "Cite deux sources d'énergie non renouvelables.", "r": "Le pétrole et le charbon sont des sources non renouvelables car elles existent en stock limité."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
