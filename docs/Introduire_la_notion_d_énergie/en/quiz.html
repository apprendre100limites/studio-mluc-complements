<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Introduce the concept of energy</title><style>

</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Quiz</h1><p class="sous">Introduce the concept of energy</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What's wrong with a pendulum?", "choix": ["Cold", "Silence", "Light", "Energy"], "bonne": 3, "explication": "A swinging clock has energy."}, {"question": "When the pendulum is at the top of his race, what's sucking for a moment?", "choix": ["Temperature", "Its altitude", "Speed", "Its mass"], "bonne": 2, "explication": "At the top of the race, the pendulum is at its maximum altitude and its speed is zero for a moment."}, {"question": "Where does the body's energy come from?", "choix": ["Sleep", "Food", "Wind", "From the sun"], "bonne": 1, "explication": "The input is the energy of food."}, {"question": "What does a machine do with the energy of a source?", "choix": ["It destroys it.", "She creates it.", "She evaporates it.", "She converts it"], "bonne": 3, "explication": "A machine does not create energy: it converts that of a source."}, {"question": "Which of these lists contains only renewable sources?", "choix": ["Coal, oil and the sun", "Oil, coal and gas", "Sun, wind and water", "Gas, water and oil"], "bonne": 2, "explication": "Some sources are renewed as quickly as they are used, such as the sun, wind or water: they are renewable."}, {"question": "In the text, what type of energy is food?", "choix": ["Electrical", "Chemical", "Solar", "Nuclear"], "bonne": 1, "explication": "The energy of food, chemical, becomes energy of movement in your muscles."}, {"question": "When the pendulum stops because of friction, what happens to its energy?", "choix": ["It turns into light", "It is transferred to the air, which heats very slightly", "It evaporates into the air", "She disappears completely."], "bonne": 1, "explication": "Because of the friction, it was transferred to the air, which it heated very slightly."}, {"question": "What does the body spend energy for?", "choix": ["To store food and produce light", "To create new energy sources", "To move, think and keep its temperature", "To grow, sleep and breathe only"], "bonne": 2, "explication": "Needs are the energy your body spends to move, think and keep its temperature."}, {"question": "Why does a wind turbine use a renewable energy source?", "choix": ["Because it makes no noise", "Because it's made of metal", "Because it produces heat", "'Cause the wind is changing as fast as we use it."], "bonne": 3, "explication": "Because the wind is changing as fast as we use it."}, {"question": "According to the conclusion, what happens with energy?", "choix": ["It evaporates with time", "It is destroyed by friction", "It is created by machines", "It transfers and converts, without disappearing"], "bonne": 3, "explication": "Energy is transferred and converted, without disappearing."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
