<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory sheets — Introducing the concept of energy</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Memory cards</h1><p class="sous">Introduce the concept of energy</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "A pendulum has energy in what two cases?", "r": "He has energy when he's in motion or when he's high."}, {"q": "What happens at the top of a pendulum race?", "r": "It is at its maximum altitude and its speed is zero for a moment."}, {"q": "What happens at the bottom of a pendulum race?", "r": "He's at his minimum altitude and he's moving faster."}, {"q": "Why does a pendulum end up stopping?", "r": "Due to friction, its energy is transferred to the air, which it heats very slightly."}, {"q": "Has the energy of a pendulum that stops disappeared?", "r": "No, she didn't disappear: she was transferred to the air."}, {"q": "What is the energy supply of the human body?", "r": "The input is the energy of food."}, {"q": "What does the body spend its energy on?", "r": "The body spends energy to move, reflect and keep its temperature."}, {"q": "What are the daily energy needs of an adult?", "r": "They are of the order of eight thousand three hundred and sixty-eight to ten thousand four hundred and sixty kilojoules a day."}, {"q": "Are energy needs higher in adolescence?", "r": "Yes, they are often higher if you are active."}, {"q": "What happens if the power supply brings too little energy?", "r": "You're tired."}, {"q": "What happens if the power supply brings too much energy?", "r": "The body stores the excess energy."}, {"q": "Does a machine create energy?", "r": "No, a machine does not create energy: it converts that of a source."}, {"q": "Gives two examples of machine energy conversion.", "r": "An engine converts fuel energy, and a solar panel converts light energy."}, {"q": "What is a renewable energy source?", "r": "It is a source that renews as quickly as it is used, such as the sun, wind or water."}, {"q": "Cite two non-renewable sources of energy.", "r": "Oil and coal are non-renewable sources because they exist in limited stocks."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
