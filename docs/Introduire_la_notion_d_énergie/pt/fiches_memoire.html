<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folhas de memória — Introdução do conceito de energia</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Cartões de memória</h1><p class="sous">Introdução do conceito de energia</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "Um pêndulo tem energia em que dois casos?", "r": "Ele tem energia quando está em movimento ou quando está pedrado."}, {"q": "O que acontece no topo de uma corrida de pêndulo?", "r": "Está em sua altitude máxima e sua velocidade é zero por um momento."}, {"q": "O que acontece no fundo de uma corrida de pêndulo?", "r": "Está na altitude mínima e está a andar mais depressa."}, {"q": "Porque é que um pêndulo acaba por parar?", "r": "Devido ao atrito, sua energia é transferida para o ar, que aquece muito ligeiramente."}, {"q": "A energia de um pêndulo que pára desapareceu?", "r": "Não, ela não desapareceu: foi transferida para o ar."}, {"q": "Qual é o suprimento de energia do corpo humano?", "r": "A entrada é a energia dos alimentos."}, {"q": "Em que gasta o corpo a sua energia?", "r": "O corpo gasta energia para se mover, refletir e manter sua temperatura."}, {"q": "Quais são as necessidades diárias de energia de um adulto?", "r": "São da ordem de oito mil trezentos e sessenta e oito a dez mil quatrocentos e sessenta quilojoules por dia."}, {"q": "As necessidades energéticas são maiores na adolescência?", "r": "Sim, muitas vezes são maiores se você estiver ativo."}, {"q": "O que acontece se a fonte de energia trouxer pouca energia?", "r": "Estás cansado."}, {"q": "O que acontece se a fonte de energia trouxer muita energia?", "r": "O corpo armazena o excesso de energia."}, {"q": "Uma máquina cria energia?", "r": "Não, uma máquina não cria energia: converte a de uma fonte."}, {"q": "Dá dois exemplos de conversão de energia da máquina.", "r": "Um motor converte energia de combustível, e um painel solar converte energia de luz."}, {"q": "O que é uma fonte de energia renovável?", "r": "É uma fonte que renova tão rapidamente quanto é usada, como o sol, o vento ou a água."}, {"q": "Cite duas fontes de energia não renováveis.", "r": "O petróleo e o carvão são fontes não renováveis porque existem em stocks limitados."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
