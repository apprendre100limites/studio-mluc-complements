<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Introdução do conceito de energia</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Quiz</h1><p class="sous">Introdução do conceito de energia</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "O que há de errado com um pêndulo?", "choix": ["Frio", "Silêncio.", "Luz", "Energia"], "bonne": 3, "explication": "Um relógio girante tem energia."}, {"question": "Quando o pêndulo está no topo da sua raça, o que está a chupar por um momento?", "choix": ["Temperatura", "Sua altitude", "Velocidade", "Sua massa"], "bonne": 2, "explication": "No topo da corrida, o pêndulo está em sua altitude máxima e sua velocidade é zero por um momento."}, {"question": "De onde vem a energia do corpo?", "choix": ["Dormir", "Alimentos", "Vento", "Do sol"], "bonne": 1, "explication": "A entrada é a energia dos alimentos."}, {"question": "O que faz uma máquina com a energia de uma fonte?", "choix": ["Destrui-a.", "Ela cria-o.", "Ela evapora-a.", "Ela converte-o."], "bonne": 3, "explication": "Uma máquina não cria energia: converte a de uma fonte."}, {"question": "Qual destas listas contém apenas fontes renováveis?", "choix": ["Carvão, petróleo e sol", "Óleo, carvão e gás", "Sol, vento e água", "Gás, água e óleo"], "bonne": 2, "explication": "Algumas fontes são renovadas tão rapidamente quanto são utilizadas, como o sol, o vento ou a água: são renováveis."}, {"question": "No texto, que tipo de energia é o alimento?", "choix": ["Eléctrico", "Químico", "Solar", "Nuclear"], "bonne": 1, "explication": "A energia da comida, química, torna-se energia de movimento em seus músculos."}, {"question": "Quando o pêndulo pára por causa do atrito, o que acontece com sua energia?", "choix": ["Transforma-se em luz", "É transferido para o ar, que aquece muito ligeiramente", "Ele evapora no ar", "Ela desaparece completamente."], "bonne": 1, "explication": "Devido ao atrito, foi transferido para o ar, que aqueceu muito ligeiramente."}, {"question": "Para que gasta o corpo energia?", "choix": ["Armazenar alimentos e produzir luz", "Criar novas fontes de energia", "Para mover, pensar e manter a sua temperatura", "Para crescer, dormir e respirar apenas"], "bonne": 2, "explication": "Necessidades são a energia que seu corpo gasta para mover, pensar e manter sua temperatura."}, {"question": "Por que uma turbina eólica usa uma fonte de energia renovável?", "choix": ["Porque não faz barulho.", "Porque é feito de metal", "Porque produz calor", "Porque o vento está a mudar tão rápido quanto o usamos."], "bonne": 3, "explication": "Porque o vento está a mudar tão rápido quanto o usamos."}, {"question": "Segundo a conclusão, o que acontece com a energia?", "choix": ["Ela evapora com o tempo", "É destruído pelo atrito.", "É criado por máquinas", "Ele transfere e converte, sem desaparecer"], "bonne": 3, "explication": "A energia é transferida e convertida, sem desaparecer."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
