<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hojas de memoria — Introducción del concepto de energía</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Tarjetas de memoria</h1><p class="sous">Introducir el concepto de energía</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Un péndulo tiene energía en dos casos?", "r": "Tiene energía cuando está en movimiento o cuando está alto."}, {"q": "¿Qué pasa en la parte superior de una carrera de péndulo?", "r": "Es a su altura máxima y su velocidad es cero por un momento."}, {"q": "¿Qué pasa en el fondo de una carrera de péndulo?", "r": "Está a su altura mínima y se mueve más rápido."}, {"q": "¿Por qué un péndulo termina parando?", "r": "Debido a la fricción, su energía se transfiere al aire, que calienta muy ligeramente."}, {"q": "¿Tiene la energía de un péndulo que deja de desaparecer?", "r": "No, no desapareció: fue transferida al aire."}, {"q": "¿Cuál es el suministro energético del cuerpo humano?", "r": "La entrada es la energía de la comida."}, {"q": "¿En qué gasta el cuerpo su energía?", "r": "El cuerpo gasta energía para moverse, reflexionar y mantener su temperatura."}, {"q": "¿Cuáles son las necesidades diarias de energía de un adulto?", "r": "Son de la orden de ocho mil trescientos sesenta y ocho a diez mil cuatrocientos sesenta kilos al día."}, {"q": "¿Las necesidades energéticas son mayores en la adolescencia?", "r": "Sí, a menudo son más altos si usted está activo."}, {"q": "¿Qué pasa si la fuente de alimentación trae poca energía?", "r": "Estás cansado."}, {"q": "¿Qué pasa si el suministro de energía trae demasiada energía?", "r": "El cuerpo almacena el exceso de energía."}, {"q": "¿Una máquina crea energía?", "r": "No, una máquina no crea energía: convierte la de una fuente."}, {"q": "Da dos ejemplos de conversión de la energía de la máquina.", "r": "Un motor convierte la energía del combustible, y un panel solar convierte la energía ligera."}, {"q": "¿Qué es una fuente de energía renovable?", "r": "Es una fuente que se renueva tan rápido como se utiliza, como el sol, el viento o el agua."}, {"q": "Citar dos fuentes de energía no renovables.", "r": "El petróleo y el carbón son fuentes no renovables porque existen en acciones limitadas."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
