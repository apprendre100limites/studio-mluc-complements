<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Introducir el concepto de energía</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Quiz</h1><p class="sous">Introducir el concepto de energía</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Qué tiene de malo un péndulo?", "choix": ["Cold", "Silencio", "Luz", "Energía"], "bonne": 3, "explication": "Un reloj oscilante tiene energía."}, {"question": "Cuando el péndulo está en la cima de su carrera, ¿qué está chupando por un momento?", "choix": ["Temperatura", "Su altura", "Speed", "Su masa"], "bonne": 2, "explication": "En la parte superior de la carrera, el péndulo está a su altura máxima y su velocidad es cero por un momento."}, {"question": "¿De dónde viene la energía del cuerpo?", "choix": ["Duerme", "Alimentos", "Viento", "Desde el sol"], "bonne": 1, "explication": "La entrada es la energía de la comida."}, {"question": "¿Qué hace una máquina con la energía de una fuente?", "choix": ["Lo destruye.", "Lo crea.", "Se evapora.", "Ella lo convierte."], "bonne": 3, "explication": "Una máquina no crea energía: convierte la de una fuente."}, {"question": "¿Cuál de estas listas contiene sólo fuentes renovables?", "choix": ["Carbón, aceite y sol", "Aceite, carbón y gas", "Sol, viento y agua", "Gas, agua y aceite"], "bonne": 2, "explication": "Algunas fuentes son renovadas tan rápidamente como se utilizan, como el sol, el viento o el agua: son renovables."}, {"question": "En el texto, ¿qué tipo de energía es la comida?", "choix": ["Electrical", "Productos químicos", "Solar", "Nuclear"], "bonne": 1, "explication": "La energía de la comida, química, se convierte en energía de movimiento en sus músculos."}, {"question": "Cuando el péndulo se detiene debido a la fricción, ¿qué pasa con su energía?", "choix": ["Se convierte en luz", "Se transfiere al aire, que se calienta muy ligeramente", "Se evapora en el aire", "Ella desaparece por completo."], "bonne": 1, "explication": "Debido a la fricción, se transfirió al aire, que calentaba muy ligeramente."}, {"question": "¿Para qué gasta el cuerpo energía?", "choix": ["Para almacenar alimentos y producir luz", "Crear nuevas fuentes de energía", "Para moverse, pensar y mantener su temperatura", "Crecer, dormir y respirar sólo"], "bonne": 2, "explication": "Las necesidades son la energía que su cuerpo gasta para moverse, pensar y mantener su temperatura."}, {"question": "¿Por qué una turbina eólica utiliza una fuente de energía renovable?", "choix": ["Porque no hace ruido", "Porque está hecho de metal", "Porque produce calor", "Porque el viento está cambiando tan rápido como lo usamos."], "bonne": 3, "explication": "Porque el viento está cambiando tan rápido como lo usamos."}, {"question": "Según la conclusión, ¿qué pasa con la energía?", "choix": ["Se evapora con el tiempo", "Es destruida por la fricción", "Es creado por máquinas", "Transfiere y convierte, sin desaparecer"], "bonne": 3, "explication": "La energía se transfiere y se convierte, sin desaparecer."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
