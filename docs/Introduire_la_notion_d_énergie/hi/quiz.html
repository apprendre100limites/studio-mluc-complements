<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी — ऊर्जा की अवधारणा का परिचय</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>प्रश्नोत्तरी</h1><p class="sous">ऊर्जा की अवधारणा का परिचय</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "क्या गलत है?", "choix": ["ठंडा", "मौन", "प्रकाश", "ऊर्जा"], "bonne": 3, "explication": "एक स्विंगिंग घड़ी में ऊर्जा होती है।"}, {"question": "जब पेंडुलम अपनी दौड़ के शीर्ष पर है, तो एक पल के लिए क्या चूसने वाला है?", "choix": ["तापमान", "इसकी ऊंचाई", "गति", "इसका द्रव्यमान"], "bonne": 2, "explication": "दौड़ के शीर्ष पर, पेंडुलम इसकी अधिकतम ऊंचाई पर है और इसकी गति एक पल के लिए शून्य है।"}, {"question": "शरीर की ऊर्जा कहाँ से आती है?", "choix": ["नींद लेना", "भोजन", "हवा", "सूर्य से"], "bonne": 1, "explication": "इनपुट भोजन की ऊर्जा है।"}, {"question": "एक मशीन एक स्रोत की ऊर्जा के साथ क्या करती है?", "choix": ["यह इसे नष्ट कर देता है।", "वह इसे बनाता है।", "वह इसे वाष्पीकरण करती है।", "वह इसे परिवर्तित करता है"], "bonne": 3, "explication": "एक मशीन ऊर्जा नहीं बनाती है: यह एक स्रोत के रूप में बदल देती है।"}, {"question": "इन सूचियों में से कौन से केवल अक्षय स्रोत हैं?", "choix": ["कोयला, तेल और सूर्य", "तेल, कोयला और गैस", "सूर्य, हवा और पानी", "गैस, पानी और तेल"], "bonne": 2, "explication": "कुछ स्रोतों को जल्दी से नवीनीकृत किया जाता है क्योंकि उनका उपयोग किया जाता है, जैसे सूर्य, हवा या पानी: वे अक्षय हैं।"}, {"question": "पाठ में, किस प्रकार की ऊर्जा भोजन है?", "choix": ["विद्युत", "रासायनिक", "सौर", "परमाणु"], "bonne": 1, "explication": "भोजन की ऊर्जा, रसायन, आपकी मांसपेशियों में आंदोलन की ऊर्जा बन जाती है।"}, {"question": "जब पेंडुलम घर्षण के कारण रुक जाता है, तो इसकी ऊर्जा क्या होती है?", "choix": ["यह प्रकाश में बदल जाता है", "यह हवा में स्थानांतरित हो जाता है, जो बहुत कम गर्मी करता है", "यह हवा में वाष्पीकरण करता है", "वह पूरी तरह से गायब हो जाती है।"], "bonne": 1, "explication": "घर्षण के कारण इसे हवा में स्थानांतरित कर दिया गया था, जो इसे थोड़ा गर्म किया गया था।"}, {"question": "क्या शरीर के लिए ऊर्जा खर्च करता है?", "choix": ["भोजन को स्टोर करने और प्रकाश का उत्पादन करने के लिए", "नए ऊर्जा स्रोतों को बनाने के लिए", "अपने तापमान को स्थानांतरित करने, सोचने और रखने के लिए", "केवल बढ़ने, नींद और सांस लेने के लिए"], "bonne": 2, "explication": "आवश्यकता ऊर्जा है जो आपके शरीर को स्थानांतरित करने, सोचने और उसके तापमान को बनाए रखने के लिए खर्च करती है।"}, {"question": "पवन टरबाइन एक अक्षय ऊर्जा स्रोत का उपयोग क्यों करता है?", "choix": ["क्योंकि यह शोर नहीं बनाता", "क्योंकि यह धातु से बना है", "क्योंकि यह गर्मी पैदा करता है", "'क्योंकि हवा तेजी से बदल रही है क्योंकि हम इसका उपयोग करते हैं।"], "bonne": 3, "explication": "क्योंकि हवा तेजी से बदल रही है क्योंकि हम इसका उपयोग करते हैं।"}, {"question": "निष्कर्ष के अनुसार, ऊर्जा के साथ क्या होता है?", "choix": ["यह समय के साथ वाष्पीकरण करता है", "यह घर्षण द्वारा नष्ट हो जाता है", "यह मशीनों द्वारा बनाई गई है", "यह स्थानांतरण और परिवर्तित करता है, बिना गायब हो"], "bonne": 3, "explication": "ऊर्जा को स्थानांतरित और परिवर्तित किया जाता है, बिना गायब हो।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
