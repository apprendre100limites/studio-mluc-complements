<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी शीट - ऊर्जा की अवधारणा का परिचय</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>मेमोरी कार्ड</h1><p class="sous">ऊर्जा की अवधारणा का परिचय</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "एक पेंडुलम क्या दो मामलों में ऊर्जा है?", "r": "वह ऊर्जा है जब वह गति में है या जब वह उच्च है।"}, {"q": "एक पेंडुलम दौड़ के शीर्ष पर क्या होता है?", "r": "यह अपनी अधिकतम ऊंचाई पर है और इसकी गति एक पल के लिए शून्य है।"}, {"q": "एक पेंडुलम दौड़ के नीचे क्या होता है?", "r": "वह अपनी न्यूनतम ऊंचाई पर है और वह तेजी से बढ़ रहा है।"}, {"q": "क्यों एक पेंडुलम बंद हो जाता है?", "r": "घर्षण के कारण, इसकी ऊर्जा को हवा में स्थानांतरित कर दिया जाता है, जो इसे थोड़ा गर्म करता है।"}, {"q": "एक पेंडुलम की ऊर्जा है जो गायब हो जाती है?", "r": "नहीं, वह गायब नहीं हुई: वह हवा में स्थानांतरित हो गई थी।"}, {"q": "मानव शरीर की ऊर्जा आपूर्ति क्या है?", "r": "इनपुट भोजन की ऊर्जा है।"}, {"q": "क्या शरीर अपनी ऊर्जा खर्च करता है?", "r": "शरीर अपने तापमान को स्थानांतरित करने, प्रतिबिंबित करने और रखने के लिए ऊर्जा खर्च करता है।"}, {"q": "एक वयस्क की दैनिक ऊर्जा की जरूरत क्या है?", "r": "वे आठ हजार तीन सौ और साठ आठ से दस हजार चार सौ और साठ किलोमीटर प्रतिदिन के क्रम में हैं।"}, {"q": "क्या ऊर्जा को किशोरावस्था में उच्च स्तर की आवश्यकता होती है?", "r": "यदि आप सक्रिय हैं तो वे अक्सर अधिक होते हैं।"}, {"q": "यदि बिजली आपूर्ति बहुत कम ऊर्जा लाता है तो क्या होता है?", "r": "आप थक गए हैं।"}, {"q": "यदि बिजली आपूर्ति बहुत अधिक ऊर्जा लाता है तो क्या होता है?", "r": "शरीर अतिरिक्त ऊर्जा को स्टोर करता है।"}, {"q": "क्या मशीन ऊर्जा पैदा करती है?", "r": "नहीं, एक मशीन ऊर्जा नहीं बनाती है: यह एक स्रोत के रूप में बदलता है।"}, {"q": "मशीन ऊर्जा रूपांतरण के दो उदाहरण देता है।", "r": "एक इंजन ईंधन ऊर्जा को परिवर्तित करता है और एक सौर पैनल प्रकाश ऊर्जा को परिवर्तित करता है।"}, {"q": "अक्षय ऊर्जा स्रोत क्या है?", "r": "यह एक ऐसा स्रोत है जो जल्दी से नवीनीकृत होता है क्योंकि इसका उपयोग सूर्य, हवा या पानी जैसे होता है।"}, {"q": "ऊर्जा के दो गैर नवीकरणीय स्रोतों का हवाला देते हैं।", "r": "तेल और कोयला गैर नवीकरणीय स्रोत हैं क्योंकि वे सीमित स्टॉक में मौजूद हैं।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
