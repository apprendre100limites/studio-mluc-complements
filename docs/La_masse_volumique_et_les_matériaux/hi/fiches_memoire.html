<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी कार्ड - घनत्व और सामग्री</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 9 · आयु 14–15 वर्ष</div><h1>मेमोरी कार्ड</h1><p class="sous">घनत्व और सामग्री</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "घनत्व क्या है?", "r": "यह द्रव्यमान मात्रा से विभाजित है, रिकॉर्ड किए गए रियो, प्रति घन मीटर या प्रति घन सेंटीमीटर ग्राम में व्यक्त किया गया है।"}, {"q": "एल्यूमीनियम के घनत्व की गणना करने के लिए दिए गए उदाहरण क्या हैं?", "r": "एक दो-centimetre पक्ष एल्यूमीनियम घन आठ घन सेंटीमीटर की मात्रा और बीस-एक decimal छह ग्राम का एक द्रव्यमान है। इसलिए इसका घनत्व दो दशमलव सात ग्राम प्रति घन सेंटीमीटर है।"}, {"q": "पानी का घनत्व क्या है?", "r": "एक ग्राम प्रति घन सेंटीमीटर, एक हजार किलोग्राम प्रति घन मीटर के बराबर।"}, {"q": "कैसे एक भौतिक को घनत्व के माध्यम से पहचान सकता है?", "r": "इसकी मात्रा से अपने द्रव्यमान को विभाजित करके एक सामग्री को मान्यता दी जा सकती है। यदि परिणाम सामग्री के घनत्व से मेल खाता है तो यह एक है।"}, {"q": "घनत्व के साथ किसी वस्तु की पहचान को निर्धारित करने के लिए क्या उदाहरण दिया गया है?", "r": "पांच सौ और चालीस ग्राम प्रति दो सौ घन सेंटीमीटर का एक वस्तु दो दशमलव सात ग्राम प्रति घन सेंटीमीटर का घनत्व देता है, जो एल्यूमीनियम से मेल खाती है।"}, {"q": "एक मिश्र धातु क्या है?", "r": "यह अन्य तत्वों के साथ एक धातु का मिश्रण है, अक्सर शुद्ध धातु की तुलना में अधिक प्रतिरोधी होता है।"}, {"q": "वीडियो में उल्लिखित मिश्र धातु का एक उदाहरण देता है।", "r": "स्टील कुछ कार्बन के साथ एक लौह मिश्र धातु है।"}, {"q": "मिश्र धातु में सम्मिलन और प्रतिस्थापन के बीच क्या अंतर है?", "r": "सम्मिलन तब होता है जब अतिरिक्त परमाणु छोटे होते हैं और धातु के परमाणुओं के बीच पर्ची करते हैं, जबकि प्रतिस्थापन तब होता है जब अतिरिक्त परमाणु आकार में करीब होते हैं और धातु के कुछ परमाणुओं का स्थान लेते हैं।"}, {"q": "वीडियो में उल्लिखित समग्र सामग्री का एक उदाहरण देता है।", "r": "प्रबलित कंक्रीट, जो कंक्रीट और इस्पात सलाखों को जोड़ती है।"}, {"q": "उदाहरण के अनुसार मिश्रित सामग्रियों के गुण क्या हैं?", "r": "कंक्रीट क्रशिंग का प्रतिरोध करता है, और स्टील स्ट्रेचिंग का प्रतिरोध करता है। साथ में, वे एक दूसरे से बेहतर करते हैं।"}, {"q": "रोजमर्रा की जिंदगी में घनत्व का क्या उपयोग है?", "r": "यह जांचने के लिए इस्तेमाल किया जा सकता है कि कोई वस्तु उसके आकार के लिए हल्का या भारी है या नहीं।"}, {"q": "उद्योग में घनत्व के उपयोग का एक उदाहरण देता है।", "r": "एक जांच कर सकता है कि एक पिंड इसे पिघलने के बिना सोना है, जैसा कि आर्किमिडीज के इतिहास में है।"}, {"q": "उद्योग में घनत्व का क्या उपयोग है?", "r": "यह आपको उद्योग, निर्माण, आभूषण और अनुसंधान के लिए अपने उपयोग के अनुसार सामग्री के गुणों का चयन करने की अनुमति देता है।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
