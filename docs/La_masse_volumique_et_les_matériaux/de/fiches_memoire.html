<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherkarten — Dichte und Materialien</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Wissenschaft · Zyklus 4 · Level 3</div><h1>Speicherkarten</h1><p class="sous">Dichte und Materialien</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Was ist Dichte?", "r": "Dies ist die nach Volumen geteilte Masse, aufgezeichnete Rho, ausgedrückt in Kilogramm pro Kubikmeter oder Gramm pro Kubikzentimeter."}, {"q": "Was ist das Beispiel, um die Dichte von Aluminium zu berechnen?", "r": "Ein zwei Zentimeter langer Aluminiumwürfel hat ein Volumen von acht Kubikzentimetern und eine Masse von einundzwanzig Dezimalstellen von sechs Gramm. Seine Dichte beträgt daher zwei Dezimalstellen sieben Gramm pro Kubikzentimeter."}, {"q": "Was ist die Dichte von Wasser?", "r": "Ein Gramm pro Kubikzentimeter, das entspricht tausend Kilogramm pro Kubikmeter."}, {"q": "Wie kann man ein Material durch Dichte erkennen?", "r": "Ein Material kann erkannt werden, indem seine Masse durch sein Volumen geteilt wird. Wenn das Ergebnis der Dichte des Materials entspricht, dann ist es dieses."}, {"q": "Welches Beispiel wird gegeben, um die Identität eines Objekts mit Dichte zu bestimmen?", "r": "Ein Objekt von fünfhundertvierzig Gramm pro zweihundert Kubikzentimeter ergibt eine Dichte von zwei Dezimal sieben Gramm pro Kubikzentimeter, was Aluminium entspricht."}, {"q": "Was ist eine Legierung?", "r": "Es ist eine Mischung aus einem Metall mit anderen Elementen, oft widerstandsfähiger als reines Metall."}, {"q": "Gibt ein Beispiel für eine im Video erwähnte Legierung.", "r": "Stahl ist eine Eisenlegierung mit etwas Kohlenstoff."}, {"q": "Was ist der Unterschied zwischen Insertion und Substitution in Legierungen?", "r": "Insertion tritt auf, wenn die hinzugefügten Atome kleiner sind und zwischen den Atomen des Metalls rutschen, während Substitution auftritt, wenn die hinzugefügten Atome in der Größe nahe sind und an die Stelle bestimmter Atome des Metalls treten."}, {"q": "Gibt ein Beispiel für Verbundmaterial, das im Video erwähnt wird.", "r": "Bewehrter Beton, der Beton und Stahlstäbe kombiniert."}, {"q": "Welche Eigenschaften haben Verbundwerkstoffe gemäß dem angegebenen Beispiel?", "r": "Beton widersteht der Zerkleinerung, und Stahl widersteht der Dehnung. Zusammen sind sie besser als einander."}, {"q": "Was nutzt Dichte im Alltag?", "r": "Es kann verwendet werden, um zu überprüfen, ob ein Objekt für seine Größe leicht oder schwer ist."}, {"q": "Gibt ein Beispiel für die Verwendung von Dichte in der Industrie.", "r": "Man kann überprüfen, dass ein Barren Gold ist, ohne es zu schmelzen, wie in der Geschichte von Archimedes."}, {"q": "Welchen Nutzen hat die Dichte in der Industrie?", "r": "Es ermöglicht Ihnen, die Eigenschaften eines Materials nach seiner Verwendung zu wählen, wie für Industrie, Bau, Schmuck und Forschung."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
