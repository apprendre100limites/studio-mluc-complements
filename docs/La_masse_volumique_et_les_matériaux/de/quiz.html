<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Dichte und Materialien</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Wissenschaft · Zyklus 4 · Level 3</div><h1>Quiz</h1><p class="sous">Dichte und Materialien</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Was ist Dichte?", "choix": ["D - Die Einheit der Messung des Volumens", "C - Volumen geteilt durch Masse", "B - Masse geteilt durch Volumen", "A - Masse multipliziert mit Volumen"], "bonne": 2, "explication": "Die Dichte ist die Masse geteilt durch das Volumen."}, {"question": "Was ist die Einheit zur Messung der Dichte?", "choix": ["C - Kilogramm pro Liter", "A - Kilogramm pro Kubikmeter", "B - Gramm pro Kubikzentimeter", "D - Gramm pro Milliliter"], "bonne": 1, "explication": "Die Dichte wird in Kilogramm pro Kubikmeter oder Gramm pro Kubikzentimeter ausgedrückt."}, {"question": "Welches Beispiel wird verwendet, um die Dichte von Aluminium zu berechnen?", "choix": ["C - Ein 3 cm Seitenwürfel mit einer Masse von 63 g", "D - Ein 4 cm Seitenwürfel mit einer Masse von 84 g", "A - 1 cm Seitenwürfel mit einer Masse von 2,7 g", "B - Ein 2 cm Seitenwürfel mit einer Masse von 21,6 g"], "bonne": 3, "explication": "Ein zwei Zentimeter langer Aluminiumwürfel hat ein Volumen von acht Kubikzentimetern und eine Masse von einundzwanzig Dezimalstellen von sechs Gramm."}, {"question": "Welches Material hat eine Dichte von 19,3 Gramm pro Kubikzentimeter?", "choix": ["C - Kupfer", "D - Blei", "B - Gold", "A — Eisen"], "bonne": 2, "explication": "Gold hat eine Dichte von 19 Dezimalen drei Gramm pro Kubikzentimeter."}, {"question": "Welche Legierung wird im Video erwähnt?", "choix": ["D - Blei", "A - Stahl", "B - Kupfer", "C - Gold"], "bonne": 1, "explication": "Stahl zum Beispiel ist Eisen mit etwas Kohlenstoff."}, {"question": "Welche Eigenschaften hat eine Legierung?", "choix": ["C - Es hat andere Eigenschaften als reines Metall", "B - Es ist immer härter als reines Metall", "D - Es ändert sich nicht Dichte", "A - Es ist immer leichter als reines Metall"], "bonne": 0, "explication": "Eine Legierung ist eine Mischung aus einem Metall mit anderen Elementen. Es ist oft widerstandsfähiger als reines Metall."}, {"question": "Wie berechnet sich die Dichte des Objekts von 135 Gramm pro 50 Kubikzentimeter?", "choix": ["C - 2,9 g/cm3", "A - 2,7 g/cm3", "B - 2,8 g/cm3", "D - 3,0 g/cm3"], "bonne": 1, "explication": "Die Dichte wird berechnet, indem die Masse nach Volumen geteilt wird: 135 geteilt durch 50."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
