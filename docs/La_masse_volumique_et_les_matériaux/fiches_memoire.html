<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — La masse volumique et les matériaux</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 3ème</div><h1>Fiches mémoire</h1><p class="sous">La masse volumique et les matériaux</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Qu'est-ce que la masse volumique ?", "r": "C'est la masse divisée par le volume, notée rhô, s'exprimée en kilogrammes par mètre cube ou en grammes par centimètre cube."}, {"q": "Quel est l'exemple donné pour calculer la masse volumique de l'aluminium ?", "r": "Un cube d'aluminium de deux centimètres de côté a un volume de huit centimètres cubes, et une masse de vingt et un virgule six grammes. Sa masse volumique est donc deux virgule sept grammes par centimètre cube."}, {"q": "Quelle est la masse volumique de l'eau ?", "r": "Un gramme par centimètre cube, ce qui équivaut à mille kilogrammes par mètre cube."}, {"q": "Comment peut-on reconnaître un matériau grâce à la masse volumique ?", "r": "On peut reconnaître un matériau en divisant sa masse par son volume. Si le résultat correspond à la masse volumique du matériau, alors c'est bien celui-ci."}, {"q": "Quel est l'exemple donné pour déterminer l'identité d'un objet avec la masse volumique ?", "r": "Un objet de cinq cent quarante grammes pour deux cents centimètres cubes donne une masse volumique de deux virgule sept grammes par centimètre cube, ce qui correspond à de l'aluminium."}, {"q": "Qu'est-ce qu'un alliage ?", "r": "C'est un mélange d'un métal avec d'autres éléments, souvent plus résistant que le métal pur."}, {"q": "Donne un exemple d'alliage mentionné dans la vidéo.", "r": "L'acier est un alliage de fer avec un peu de carbone."}, {"q": "Quelle est la différence entre l'insertion et la substitution dans les alliages ?", "r": "L'insertion se fait lorsque les atomes ajoutés sont plus petits et se glissent entre les atomes du métal, tandis que la substitution se fait lorsque les atomes ajoutés ont une taille proche et prennent la place de certains atomes du métal."}, {"q": "Donne un exemple de matériau composite mentionné dans la vidéo.", "r": "Le béton armé, qui associe du béton et des barres d'acier."}, {"q": "Quelles sont les propriétés des matériaux composites selon l'exemple donné ?", "r": "Le béton résiste à l'écrasement, et l'acier résiste à l'étirement. Ensemble, ils font mieux que chacun seul."}, {"q": "À quoi sert la masse volumique dans la vie quotidienne ?", "r": "On peut s'en servir pour vérifier si un objet est léger ou lourd pour sa taille."}, {"q": "Donne un exemple d'utilisation de la masse volumique dans l'industrie.", "r": "On peut vérifier qu'un lingot est bien en or sans le fondre, comme dans l'histoire d'Archimède."}, {"q": "À quoi sert la masse volumique dans l'industrie ?", "r": "Elle permet de choisir les propriétés d'un matériau selon son utilisation, comme pour l'industrie, la construction, la bijouterie et la recherche."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
