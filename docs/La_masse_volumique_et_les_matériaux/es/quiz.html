<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Densidad y Materiales</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencia · Ciclo 4 · Nivel 3</div><h1>Quiz</h1><p class="sous">Densidad y materiales</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Qué es la densidad?", "choix": ["D - La unidad de medición del volumen", "C - Volumen dividido por masa", "B - Masa dividida por volumen", "A - Masa multiplicada por volumen"], "bonne": 2, "explication": "La densidad es la masa dividida por el volumen."}, {"question": "¿Cuál es la unidad de medición de densidad?", "choix": ["C - Kilograma por litro", "A - Kilograma por metro cúbico", "B - Gramo por centímetro cúbico", "D - Gram per millilitre"], "bonne": 1, "explication": "La densidad se expresa en kilogramos por metro cúbico, o gramo por centímetro cúbico."}, {"question": "¿Cuál es el ejemplo utilizado para calcular la densidad de aluminio?", "choix": ["C - Un cubo lateral de 3 cm con una masa de 63 g", "D - Un cubo lateral de 4 cm con una masa de 84 g", "Un cubo lateral de 1 cm con una masa de 2.7 g", "B - Un cubo lateral de 2 cm con una masa de 21.6 g"], "bonne": 3, "explication": "Un cubo de aluminio lateral de dos centímetros tiene un volumen de ocho centímetros cúbicos y una masa de veintiuno decimales seis gramos."}, {"question": "¿Qué material tiene una densidad de 19,3 gramos por centímetro cúbico?", "choix": ["C - Cobre", "D - Plomo", "B - Oro", "A - Iron"], "bonne": 2, "explication": "El oro tiene una densidad de 19 decimales tres gramos por centímetro cúbico."}, {"question": "¿Qué aleación se menciona en el video?", "choix": ["D - Plomo", "A - Acero", "B - Cobre", "C - Oro"], "bonne": 1, "explication": "El acero, por ejemplo, es hierro con algo de carbono."}, {"question": "¿Qué propiedad tiene una aleación?", "choix": ["C - Tiene propiedades diferentes de las de metal puro", "B - Siempre es más difícil que el metal puro", "D - No cambia la densidad", "A - Siempre es más ligero que el metal puro"], "bonne": 0, "explication": "Una aleación es una mezcla de un metal con otros elementos. A menudo es más resistente que el metal puro."}, {"question": "¿Cuál es el cálculo de la densidad del objeto de 135 gramos por 50 centímetros cúbicos?", "choix": ["C - 2.9 g/cm3", "A - 2.7 g/cm3", "B - 2,8 g/cm3", "D - 3.0 g/cm3"], "bonne": 1, "explication": "La densidad se calcula dividiendo la masa por volumen: 135 divididos por 50."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
