<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas de memoria — Densidad y materiales</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 3.º de ESO · 14-15 años</div><h1>Tarjetas de memoria</h1><p class="sous">Densidad y materiales</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Qué es la densidad?", "r": "Esta es la masa dividida por el volumen, el rho registrado, expresado en kilogramos por metro cúbico o gramo por centímetro cúbico."}, {"q": "¿Cuál es el ejemplo dado para calcular la densidad de aluminio?", "r": "Un cubo de aluminio lateral de dos centímetros tiene un volumen de ocho centímetros cúbicos y una masa de veintiuno decimales seis gramos. Su densidad es por lo tanto dos decimales siete gramos por centímetro cúbico."}, {"q": "¿Cuál es la densidad del agua?", "r": "Un gramo por centímetro cúbico, equivalente a mil kilogramos por metro cúbico."}, {"q": "¿Cómo se puede reconocer un material a través de la densidad?", "r": "Un material puede ser reconocido dividiendo su masa por su volumen. Si el resultado corresponde a la densidad del material, entonces es éste."}, {"q": "¿Cuál es el ejemplo dado para determinar la identidad de un objeto con densidad?", "r": "Un objeto de quinientos cuarenta gramos por doscientos centímetros cúbicos da una densidad de dos siete gramos decimales por centímetros cúbicos, que corresponde al aluminio."}, {"q": "¿Qué es una aleación?", "r": "Es una mezcla de un metal con otros elementos, a menudo más resistente que el metal puro."}, {"q": "Da un ejemplo de una aleación mencionada en el video.", "r": "El acero es una aleación de hierro con algo de carbono."}, {"q": "¿Cuál es la diferencia entre inserción y sustitución en aleaciones?", "r": "La inserción ocurre cuando los átomos añadidos son más pequeños y se deslizan entre los átomos del metal, mientras que la sustitución ocurre cuando los átomos añadidos están cerca de tamaño y toman el lugar de ciertos átomos del metal."}, {"q": "Da un ejemplo de material compuesto mencionado en el vídeo.", "r": "hormigón armado, que combina barras de hormigón y acero."}, {"q": "¿Cuáles son las propiedades de los materiales compuestos según el ejemplo dado?", "r": "El hormigón resiste la trituración, y el acero resiste el estiramiento. Juntos, hacen mejor que el otro."}, {"q": "¿Cuál es el uso de la densidad en la vida cotidiana?", "r": "Se puede utilizar para comprobar si un objeto es ligero o pesado por su tamaño."}, {"q": "Da un ejemplo del uso de la densidad en la industria.", "r": "Uno puede comprobar que un enigma es oro sin fundirlo, como en la historia de Arquímedes."}, {"q": "¿Cuál es el uso de la densidad en la industria?", "r": "Le permite elegir las propiedades de un material según su uso, en cuanto a industria, construcción, joyería e investigación."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
