<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões de memória — Densidade e materiais</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 9.º ano · 14-15 anos</div><h1>Cartões de memória</h1><p class="sous">Densidade e materiais</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "O que é densidade?", "r": "Esta é a massa dividida em volume, rho registado, expressa em quilogramas por metro cúbico ou gramas por centímetro cúbico."}, {"q": "Qual é o exemplo dado para calcular a densidade de alumínio?", "r": "Um cubo de alumínio lateral de dois centímetros tem um volume de oito centímetros cúbicos e uma massa de vinte e um seis gramas decimais. Sua densidade é, portanto, decimal sete gramas por centímetro cúbico."}, {"q": "Qual é a densidade de água?", "r": "Um grama por centímetro cúbico, equivalente a mil quilos por metro cúbico."}, {"q": "Como se pode reconhecer um material através da densidade?", "r": "Um material pode ser reconhecido dividindo sua massa pelo seu volume. Se o resultado corresponde à densidade do material, então é este."}, {"q": "Qual é o exemplo dado para determinar a identidade de um objeto com densidade?", "r": "Um objeto de quinhentos e quarenta gramas por duzentos centímetros cúbicos dá uma densidade de dois decimais sete gramas por centímetro cúbico, que corresponde ao alumínio."}, {"q": "O que é uma liga?", "r": "É uma mistura de um metal com outros elementos, muitas vezes mais resistente do que o metal puro."}, {"q": "Dá um exemplo de uma liga mencionada no vídeo.", "r": "Aço é uma liga de ferro com algum carbono."}, {"q": "Qual é a diferença entre inserção e substituição em ligas?", "r": "A inserção ocorre quando os átomos adicionados são menores e deslizam entre os átomos do metal, enquanto a substituição ocorre quando os átomos adicionados são próximos em tamanho e tomam o lugar de certos átomos do metal."}, {"q": "Dá um exemplo de material composto mencionado no vídeo.", "r": "Concreto reforçado, que combina concreto e barras de aço."}, {"q": "Quais são as propriedades dos materiais compostos de acordo com o exemplo dado?", "r": "O concreto resiste ao esmagamento e o aço resiste ao alongamento. Juntos, fazem melhor do que um ao outro."}, {"q": "Qual é o uso da densidade na vida cotidiana?", "r": "Ele pode ser usado para verificar se um objeto é leve ou pesado para o seu tamanho."}, {"q": "Dá um exemplo do uso da densidade na indústria.", "r": "Pode-se verificar que um lingote é ouro sem derretê-lo, como na história de Arquimedes."}, {"q": "Qual é o uso da densidade na indústria?", "r": "Permite-lhe escolher as propriedades de um material de acordo com o seu uso, como para a indústria, construção, jóias e pesquisa."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
