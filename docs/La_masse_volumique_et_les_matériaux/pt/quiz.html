<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionário — Densidade e Materiais</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 9.º ano · 14-15 anos</div><h1>Quiz</h1><p class="sous">Densidade e materiais</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "O que é densidade?", "choix": ["D - Unidade de medida do volume", "C - Volume dividido por massa", "B - Massa dividida pelo volume", "A - Massa multiplicada por volume"], "bonne": 2, "explication": "A densidade é a massa dividida pelo volume."}, {"question": "Qual é a unidade de medida da densidade?", "choix": ["C - Quilograma por litro", "A - Quilograma por metro cúbico", "B - Grama por centímetro cúbico", "D - Grama por mililitro"], "bonne": 1, "explication": "A densidade é expressa em quilogramas por metro cúbico, ou gramas por centímetro cúbico."}, {"question": "Qual é o exemplo usado para calcular a densidade de alumínio?", "choix": ["C - Um cubo lateral de 3 cm com uma massa de 63 g", "D - Um cubo lateral de 4 cm com uma massa de 84 g", "A - cubo lateral de 1 cm com uma massa de 2,7 g", "B - Um cubo lateral de 2 cm com uma massa de 21,6 g"], "bonne": 3, "explication": "Um cubo de alumínio lateral de dois centímetros tem um volume de oito centímetros cúbicos e uma massa de vinte e um seis gramas decimais."}, {"question": "Que material tem uma densidade de 19,3 gramas por centímetro cúbico?", "choix": ["C - Cobre", "D - Chumbo", "B - Ouro", "A - Ferro"], "bonne": 2, "explication": "O ouro tem uma densidade de 19 decimais três gramas por centímetro cúbico."}, {"question": "Que liga é mencionada no vídeo?", "choix": ["D - Chumbo", "Aço A", "B - Cobre", "C - Ouro"], "bonne": 1, "explication": "O aço, por exemplo, é ferro com algum carbono."}, {"question": "Que propriedade tem uma liga?", "choix": ["C - Tem propriedades diferentes das do metal puro", "B - É sempre mais difícil do que o puro metal", "D - Não muda a densidade", "A - É sempre mais leve do que o metal puro"], "bonne": 0, "explication": "Uma liga é uma mistura de um metal com outros elementos. É muitas vezes mais resistente do que o metal puro."}, {"question": "Qual é o cálculo da densidade do objeto de 135 gramas por 50 centímetros cúbicos?", "choix": ["C - 2,9 g/cm3", "A - 2,7 g/cm3", "B - 2,8 g/cm3", "D - 3,0 g/cm3"], "bonne": 1, "explication": "A densidade é calculada dividindo a massa por volume: 135 dividido por 50."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
