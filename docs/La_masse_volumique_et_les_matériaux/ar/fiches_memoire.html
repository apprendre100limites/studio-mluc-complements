<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطاقات الذاكرة - الكثافة والمواد</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف التاسع · 14–15 سنة</div><h1>بطاقات الذاكرة</h1><p class="sous">الكثافة والمواد</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "ما هو الكثافة؟", "r": "وهذا هو الكتلة المقسومة حسب الحجم، والتشويش المسجل، المعبر عنه بالكيلوغرامات لكل متر مكعب أو غرام لكل سنتيمتر مكعب."}, {"q": "ما هو المثال المعطى لحساب كثافة الألمنيوم؟", "r": "مكعب للألومنيوم الجانبي ذو سنتيمتين يحتوي على 8 سنتيمتر مكعب وكتلة من عشرين جراماً ولذلك فإن كثافة هذه المادة هي مقياسين عشريين وسبع غرامات لكل سنتيمتر مكعب."}, {"q": "ما هي كثافة المياه؟", "r": "غرام واحد لكل سنتيمتر مكعب، يعادل ألف كيلوغرام لكل متر مكعب."}, {"q": "كيف يمكن للمرء التعرف على المواد من خلال الكثافة؟", "r": "ويمكن الاعتراف بالمواد بتقسيم كتلتها بحجمها. إذا كانت النتيجة مطابقة لكثافة المواد، فهي كذلك."}, {"q": "ما هو المثال المعطى لتحديد هوية الجسم بكثافة؟", "r": "ويعطي الجسم الذي يبلغ خمسمائة وأربعون غراماً لكل مئتين من سنتيمترات المكعبة كثافة قدرها سبع غرامات عشرية لكل سنتيمتر مكعب، وهو ما يعادل الألمنيوم."}, {"q": "ما هو الوي؟", "r": "إنه خليط من المعدن مع عناصر أخرى أكثر مقاومة من المعدن النقي"}, {"q": "يعطي مثالاً على السبيكة المذكورة في الفيديو", "r": "الصلب هو سبيكة الحديد مع بعض الكربون."}, {"q": "ما الفرق بين الإدخال والاستعاضة في المحار؟", "r": "Insertion occurs when the added atoms are smaller and slip between the atoms of the metal, while substitution occurs when the added atoms are close in size and take the place of certain atoms of the metal."}, {"q": "يقدم مثالا على المواد المركبة المذكورة في الفيديو.", "r": "خرسانة معززة تجمع بين الخرسانة والفولاذ."}, {"q": "ما هي خصائص المواد المركبة حسب المثال المقدم؟", "r": "مقاومة حقيقية للسحق والفولاذ يقاوم التمدد معاً يفعلون أفضل من بعضهم"}, {"q": "ما هو استخدام الكثافة في الحياة اليومية؟", "r": "ويمكن استخدامه للتحقق إذا كان الجسم خفيفا أو ثقيلا بالنسبة لحجمه."}, {"q": "مثال على استخدام الكثافة في الصناعة.", "r": "يمكن للمرء أن يتحقق من أن الغرور ذهب دون أن يذوبه، كما هو الحال في تاريخ أرشيمدس."}, {"q": "ما هو استخدام الكثافة في الصناعة؟", "r": "يسمح لك باختيار ممتلكات مادة وفقاً لاستخدامها، كما هو الحال بالنسبة للصناعة والبناء والمجوهرات والبحوث."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
