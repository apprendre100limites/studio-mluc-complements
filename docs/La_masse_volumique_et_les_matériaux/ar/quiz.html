<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كروز - الكثافة والمواد</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف التاسع · 14–15 سنة</div><h1>Quiz</h1><p class="sous">الكثافة والمواد</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ما هو الكثافة؟", "choix": ["دال - وحدة قياس الحجم", "C - Volume divided by mass", "B - Mass divided by volume", "A - Mass multiplied by volume"], "bonne": 2, "explication": "الكثافة هي الكتلة التي يقسمها الحجم"}, {"question": "ما هي وحدة قياس الكثافة؟", "choix": ["C - Kilogram per litre", "A - Kilogram per cubic metre", "B - Gram per cubic centimeter", "D - Gram per millilitre"], "bonne": 1, "explication": "The density is expressed in kilograms per cubic metre, or grams per cubic centimeter."}, {"question": "ما هو المثال المستخدم لحساب كثافة الألمنيوم؟", "choix": ["C - A 3 cm side cube with a mass of 63 g", "D - A 4 cm side cube with a mass of 84 g", "A - 1 cm side cube with a mass of 2.7 g", "B - A 2 cm side cube with a mass of 21.6 g"], "bonne": 3, "explication": "مكعب للألومنيوم الجانبي ذو سنتيمتين يحتوي على 8 سنتيمتر مكعب وكتلة من عشرين جراماً"}, {"question": "ما هي المادة التي لديها كثافة قدرها 19.3 غرام لكل سنتيمتر مكعب؟", "choix": ["C - Copper", "D - Lead", "باء - الذهب", "A - Iron"], "bonne": 2, "explication": "الذهب له كثافة قدرها 19 جراماً كل سنتيمتر مكعب"}, {"question": "ما هو الوي الذي ذكر في الفيديو؟", "choix": ["D - Lead", "ألف - الصلب", "B - Copper", "جيم - الذهب"], "bonne": 1, "explication": "الصلب، على سبيل المثال، هو الحديد مع بعض الكربون."}, {"question": "أي ممتلكات تملكها السبيكة؟", "choix": ["C - It has properties different from those of pure metal", "باء - إنه دائماً أصعب من المعدن النقي", "دال - عدم تغيير الكثافة", "إنه دائماً أخف من المعدن النقي"], "bonne": 0, "explication": "السبيكة خليط من معدن مع عناصر أخرى غالبا ما يكون أكثر مقاومة من المعدن النقي"}, {"question": "ما هو حساب كثافة الجسم 135 غراما لكل 50 سنتيمتر مكعب؟", "choix": ["C - 2.9 g/cm3", "A - 2.7 g/cm3", "B - 2.8 g/cm3", "D - 3.0 g/cm3"], "bonne": 1, "explication": "وتحسب الكثافة بتقسيم الكتلة حسب الحجم: 135 مقسمة إلى 50."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
