<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fact Sheets — Density and Materials</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 10 · ages 14–15</div><h1>Memory Sheets</h1><p class="sous">Density and materials</p><p class="sous">Read the question, answer in your head, then click on the card to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide All</button></p><div id="c"></div></main><script>const C=[{"q": "What is density?", "r": "It is the mass divided by the volume, denoted rhô, expressed in kilograms per cubic meter or in grams per cubic centimeter."}, {"q": "What is the example given to calculate the density of aluminum?", "r": "An aluminum cube with a side of two centimeters has a volume of eight cubic centimeters, and a mass of twenty-one decimal six grams. Its density is therefore two point seven grams per cubic centimeter."}, {"q": "What is the density of water?", "r": "One gram per cubic centimeter, which is equivalent to one thousand kilograms per cubic meter."}, {"q": "How can a material be recognized by density?", "r": "A material can be recognized by dividing its mass by its volume. If the result corresponds to the density of the material, then it is this one."}, {"q": "What is the example given to determine the identity of an object with the density?", "r": "An object of five hundred and forty grams per two hundred cubic centimeters gives a density of two point seven grams per cubic centimeter, which corresponds to aluminum."}, {"q": "What is an alloy?", "r": "It is a mixture of a metal with other elements, often stronger than pure metal."}, {"q": "Give an example of an alloy mentioned in the video.", "r": "Steel is an iron alloy with a little carbon."}, {"q": "What is the difference between insertion and substitution in alloys?", "r": "Insertion occurs when the added atoms are smaller and slip between the metal atoms, while substitution occurs when the added atoms are close in size and take the place of certain metal atoms."}, {"q": "Give an example of composite material mentioned in the video.", "r": "Reinforced concrete, which combines concrete and steel bars."}, {"q": "What are the properties of the composite materials according to the example given?", "r": "Concrete resists crushing, and steel resists stretching. Together, they do better than each one alone."}, {"q": "What is density used for in everyday life?", "r": "It can be used to check if an object is light or heavy for its size."}, {"q": "Give an example of the use of density in industry.", "r": "It can be verified that an ingot is indeed made of gold without melting it, as in the story of Archimedes."}, {"q": "What is density used for in industry?", "r": "It allows you to choose the properties of a material according to its use, such as for industry, construction, jewellery and research."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
