<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Density and Materials</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 10 · ages 14–15</div><h1>Quiz</h1><p class="sous">Density and materials</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What is density?", "choix": ["D - The unit of measurement of volume", "C - Volume divided by mass", "B - Mass divided by volume", "A - Mass multiplied by volume"], "bonne": 2, "explication": "The density is the mass divided by the volume."}, {"question": "What is the unit of measurement of density?", "choix": ["C - Kilogram per litre", "A - Kilogram per cubic metre", "B - Gram per cubic centimeter", "D - Gram per millilitre"], "bonne": 1, "explication": "The density is expressed in kilograms per cubic metre, or grams per cubic centimeter."}, {"question": "What is the example used to calculate the density of aluminum?", "choix": ["C - A 3 cm side cube with a mass of 63 g", "D - A 4 cm side cube with a mass of 84 g", "A - 1 cm side cube with a mass of 2.7 g", "B - A 2 cm side cube with a mass of 21.6 g"], "bonne": 3, "explication": "A two-centimetre side aluminum cube has a volume of eight cubic centimeters and a mass of twenty-one decimal six grams."}, {"question": "What material has a density of 19.3 grams per cubic centimeter?", "choix": ["C - Copper", "D - Lead", "B - Gold", "A - Iron"], "bonne": 2, "explication": "Gold has a density of 19 decimal three grams per cubic centimeter."}, {"question": "What alloy is mentioned in the video?", "choix": ["D - Lead", "A - Steel", "B - Copper", "C - Gold"], "bonne": 1, "explication": "Steel, for example, is iron with some carbon."}, {"question": "What property does an alloy have?", "choix": ["C - It has properties different from those of pure metal", "B - It's always harder than pure metal", "D - It does not change density", "A - It is always lighter than pure metal"], "bonne": 0, "explication": "An alloy is a mixture of a metal with other elements. It is often more resistant than pure metal."}, {"question": "What is the calculation of the density of the object of 135 grams per 50 cubic centimeters?", "choix": ["C - 2.9 g/cm3", "A - 2.7 g/cm3", "B - 2.8 g/cm3", "D - 3.0 g/cm3"], "bonne": 1, "explication": "The density is calculated by dividing the mass by volume: 135 divided by 50."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
