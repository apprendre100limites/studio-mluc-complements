<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões de memória — No final de outubro de 2026, o Observatório Vera C. Rubin viu o objeto 2026 ED138, um potencial novo planeta anão no Sistema Solar.</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências </div><h1>Cartões de memória</h1><p class="sous">No final de outubro de 2026, o Observatório Vera C. Rubin viu o objeto 2026 ED138, um potencial novo planeta anão no Sistema Solar.</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "O que é um planeta anão?", "r": "É uma estrela que gira em torno do Sol, menor que um planeta e compartilha sua órbita com outros objetos."}, {"q": "Quais são os três critérios para ser um planeta anão?", "r": "Vire-se ao redor do Sol, seja maciço o suficiente para ser redondo, e não tenha limpado sua órbita."}, {"q": "Que condição distingue um planeta de um planeta anão?", "r": "Um planeta real limpou os objetos de sua órbita, enquanto um planeta anão não."}, {"q": "Desde quando Plutão é considerado um planeta anão?", "r": "Desde 2006."}, {"q": "Onde estava localizado o objeto 2026 ED138?", "r": "Em dados do Observatório Vera C. Rubin no Chile."}, {"q": "Quem identificou 2026 ED138 e quando?", "r": "O astrônomo Matthew Holman o viu em 13 de outubro de 2026."}, {"q": "Quando foi anunciada a descoberta?", "r": "27 de Outubro de 2026."}, {"q": "Quantas vezes o Observatório Rubin fotografou o objeto em 2026?", "r": "Trinta vezes entre março e julho de 2026."}, {"q": "A que distância fica 2026 ED138 do Sol?", "r": "Cerca de 46 unidades astronómicas."}, {"q": "Qual é o intervalo de tamanho estimado de 2026 ED138?", "r": "Entre 600 e 1500 km de diâmetro."}, {"q": "Por que o tamanho preciso de 2026 ED138 é importante?", "r": "Saber se é suficientemente maciço para ser esférico, critério de um planeta anão."}, {"q": "Que instrumento poderia ser utilizado para medir precisamente o seu tamanho?", "r": "O telescópio espacial James Webb, graças às observações no infravermelho."}, {"q": "Qual é a inclinação da órbita de 2026 ED138?", "r": "A cerca de 25 graus do planeta."}, {"q": "Que corpo planetário poderia influenciar a órbita de 2026 ED138?", "r": "Netuno."}, {"q": "Qual é o estado atual de 2026 ED138?", "r": "Ele é um candidato do planeta anão, esperando por medidas que confirmem sua forma esférica."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
