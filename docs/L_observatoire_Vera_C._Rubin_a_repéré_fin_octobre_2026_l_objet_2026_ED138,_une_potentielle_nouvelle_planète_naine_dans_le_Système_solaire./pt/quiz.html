<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — No final de outubro de 2026, o Observatório Vera C. Rubin viu o objeto 2026 ED138, um potencial novo planeta anão no Sistema Solar.</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciência </div><h1>Quiz</h1><p class="sous">No final de outubro de 2026, o Observatório Vera C. Rubin viu o objeto 2026 ED138, um potencial novo planeta anão no Sistema Solar.</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Qual é o nome do objeto descoberto?", "choix": ["Plutão", "Vera C. Rubin", "James Webb", "Dois mil vinte e seis ED138"], "bonne": 3, "explication": "Seu nome é dois mil vinte e seis ED138."}, {"question": "Onde foram retirados os dados que identificaram o objeto?", "choix": ["Observatório Mauna Kea, Havaí", "Observatório de Paris, França", "Observatório Vera C. Rubin, Chile", "Observatório Hubble, EUA"], "bonne": 2, "explication": "O objeto foi encontrado em dados do Observatório Vera C. Rubin no Chile."}, {"question": "Qual é a primeira condição para um corpo ser considerado um planeta anão?", "choix": ["Ter anéis", "Ser menor que a Terra", "Vira-te para o Sol", "Tenha uma atmosfera"], "bonne": 2, "explication": "Primeiro: virar ao redor do Sol."}, {"question": "Que condição os planetas anões não se encontram?", "choix": ["Tenha uma temperatura alta", "Não ter limpo as proximidades da sua órbita", "Vira-te para o Sol", "Ser suficientemente maciço para ser redondo"], "bonne": 1, "explication": "Três: não ter limpo as proximidades de sua órbita."}, {"question": "Que astrónomo viu o objecto em 13 de Outubro de 2026?", "choix": ["Matthew Holman", "Caroline Herschel", "Edwin Hubble", "Neil deGrasse Tyson"], "bonne": 0, "explication": "O astrônomo Matthew Holman do Centro de Astrofísica de Harvard e Smithsonian o viu em 13 de outubro, dois mil vinte e seis."}, {"question": "A que distância do Sol está o objecto?", "choix": ["Cerca de 100 unidades astronômicas", "Cerca de 46 unidades astronômicas", "Cerca de cinco unidades astronômicas", "Cerca de 30 unidades astronômicas"], "bonne": 1, "explication": "É cerca de 46 unidades astronômicas do Sol."}, {"question": "Qual a faixa de tamanho estimada para este objeto?", "choix": ["Entre duzentos e quinhentos quilómetros", "Entre dez e cinquenta quilómetros", "Entre seiscentos e mil quinhentos quilómetros", "Entre dois mil e três mil quilômetros"], "bonne": 2, "explication": "Seu tamanho é estimado entre seiscentos e mil quinhentos quilômetros de largura."}, {"question": "Que instrumento seria útil para medir precisamente o tamanho do objeto?", "choix": ["Telescópio Espacial James Webb", "Observatório de Greenwich", "Telescópio Hubble", "Satélite GPS"], "bonne": 0, "explication": "Isto requer observações no infravermelho, por exemplo com o telescópio espacial James Webb."}, {"question": "Quantos graus é a órbita do objeto inclinado para o plano dos planetas?", "choix": ["Cerca de 25 graus", "Cerca de 50 graus.", "Cerca de 10 graus", "Cerca de zero graus"], "bonne": 0, "explication": "Sua órbita também está inclinada a cerca de vinte e cinco graus do plano do planeta."}, {"question": "Porque é que o objecto ainda não foi confirmado como um planeta anão?", "choix": ["Seu tamanho exato ainda não é conhecido", "Ele é menor que a lua.", "Não gira em torno do Sol", "Ele já está fora de órbita."], "bonne": 0, "explication": "No entanto, para saber se é grande o suficiente para ser esférico, é preciso saber exatamente o seu tamanho."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
