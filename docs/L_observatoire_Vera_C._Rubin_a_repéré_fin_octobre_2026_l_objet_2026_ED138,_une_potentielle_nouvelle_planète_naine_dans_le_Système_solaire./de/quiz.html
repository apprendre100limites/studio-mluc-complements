<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Ende Oktober 2026 entdeckte das Vera C. Rubin Observatory das Objekt 2026 ED138, einen potenziellen neuen Zwergplaneten im Sonnensystem.</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Wissenschaft </div><h1>Quiz</h1><p class="sous">Ende Oktober 2026 entdeckte das Vera C. Rubin Observatory das Objekt 2026 ED138, einen potenziellen neuen Zwergplaneten im Sonnensystem.</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Wie heißt das entdeckte Objekt?", "choix": ["Plutonium", "Vera C. Rubin", "James Webb", "zweitausendsechsundzwanzig ED138"], "bonne": 3, "explication": "Sein Name ist zweitausendsechsundzwanzig ED138."}, {"question": "Wo waren die Daten, die das Objekt identifizierten?", "choix": ["Observatorium Mauna Kea, Hawaii", "Observatoire de Paris, Frankreich", "Observatorium Vera C. Rubin, Chile", "Hubble Observatory, USA"], "bonne": 2, "explication": "Das Objekt wurde in Daten von Vera C. Rubin Observatory in Chile gefunden."}, {"question": "Was ist die erste Bedingung, dass ein Körper als Zwergplanet betrachtet wird?", "choix": ["Ringe haben", "Kleiner als die Erde", "Drehen Sie sich um die Sonne", "Eine Atmosphäre haben"], "bonne": 2, "explication": "Erstens: Drehen Sie sich um die Sonne."}, {"question": "Welche Bedingungen erfüllen die Zwergplaneten nicht?", "choix": ["Haben Sie eine hohe Temperatur", "Nicht die Nähe seiner Umlaufbahn geklärt", "Drehen Sie sich um die Sonne", "Sei massiv genug, um rund zu sein"], "bonne": 1, "explication": "Drittens: die Nähe seines Orbits nicht geklärt zu haben."}, {"question": "Welcher Astronom entdeckte das Objekt am 13. Oktober 2026?", "choix": ["Matthew Holman", "Caroline Herschel", "Edwin Hubble", "Neil deGrasse Tyson"], "bonne": 0, "explication": "Der Astronom Matthew Holman vom Harvard and Smithsonian Astrophysics Center entdeckte ihn am 13. Oktober zweitausendsechsundzwanzig."}, {"question": "Wie weit ist das Objekt von der Sonne entfernt?", "choix": ["Etwa 100 astronomische Einheiten", "Etwa 46 astronomische Einheiten", "Etwa fünf astronomische Einheiten", "Etwa 30 astronomische Einheiten"], "bonne": 1, "explication": "Es ist etwa sechsundvierzig astronomische Einheiten der Sonne."}, {"question": "Welcher Größenbereich wird für dieses Objekt geschätzt?", "choix": ["Zwischen zweihundert und fünfhundert Kilometer", "Zwischen zehn und fünfzig Kilometern", "Zwischen sechshundert und eintausend fünfhundert Kilometer", "Zwischen zweitausend und dreitausend Kilometer"], "bonne": 2, "explication": "Seine Größe wird zwischen sechshundert und eintausendfünfhundert Kilometer breit geschätzt."}, {"question": "Welches Instrument wäre nützlich, um die Größe des Objekts genau zu messen?", "choix": ["James Webb Weltraumteleskop", "Observatorium Greenwich", "Hubble Teleskop", "GPS-Satellit"], "bonne": 0, "explication": "Dies erfordert Beobachtungen im Infrarot, zum Beispiel mit dem James Webb Weltraumteleskop."}, {"question": "Wie viele Grad ist die Umlaufbahn des Objekts zur Ebene der Planeten geneigt?", "choix": ["Etwa 25 Grad", "Etwa 50 Grad", "Etwa 10 Grad", "Etwa Null Grad"], "bonne": 0, "explication": "Seine Umlaufbahn ist auch etwa fünfundzwanzig Grad von der Planetenebene geneigt."}, {"question": "Warum ist das Objekt noch nicht als Zwergplanet bestätigt?", "choix": ["Seine genaue Größe ist noch nicht bekannt", "Er ist kleiner als der Mond.", "Es dreht sich nicht um die Sonne", "Er ist bereits vom Orbit befreit."], "bonne": 0, "explication": "Um jedoch zu wissen, ob es groß genug ist, um kugelförmig zu sein, muss man seine Größe genau kennen."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
