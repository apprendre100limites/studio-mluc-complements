<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherkarten — Ende Oktober 2026 entdeckte das Vera C. Rubin Observatory das Objekt 2026 ED138, einen potenziellen neuen Zwergplaneten im Sonnensystem.</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Wissenschaft </div><h1>Speicherkarten</h1><p class="sous">Ende Oktober 2026 entdeckte das Vera C. Rubin Observatory das Objekt 2026 ED138, einen potenziellen neuen Zwergplaneten im Sonnensystem.</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Was ist ein Zwergplanet?", "r": "Es ist ein Stern, der sich um die Sonne dreht, kleiner als ein Planet und seine Umlaufbahn mit anderen Objekten teilt."}, {"q": "Was sind die drei Kriterien, um ein Zwergplanet zu sein?", "r": "Drehen Sie sich um die Sonne, seien Sie massiv genug, um rund zu sein, und haben Sie ihre Umlaufbahn nicht gelöscht."}, {"q": "Welcher Zustand unterscheidet einen Planeten von einem Zwergplaneten?", "r": "Ein realer Planet reinigte die Objekte seiner Umlaufbahn, während ein Zwergplanet dies nicht tat."}, {"q": "Seit wann gilt Pluto als Zwergplanet?", "r": "Seit 2006."}, {"q": "Wo befand sich das Objekt 2026 ED138?", "r": "In Daten von Vera C. Rubin Observatory in Chile."}, {"q": "Wer hat 2026 ED138 identifiziert und wann?", "r": "Der Astronom Matthew Holman entdeckte es am 13. Oktober 2026."}, {"q": "Wann wurde die Entdeckung angekündigt?", "r": "27. Oktober 2026."}, {"q": "Wie oft hat das Rubin-Observatorium das Objekt 2026 fotografiert?", "r": "30 Mal zwischen März und Juli 2026."}, {"q": "Wie weit ist 2026 ED138 von der Sonne entfernt?", "r": "Etwa 46 astronomische Einheiten."}, {"q": "Was ist der geschätzte Größenbereich von 2026 ED138?", "r": "Zwischen 600 und 1500 Kilometer Durchmesser."}, {"q": "Warum ist die genaue Größe von 2026 ED138 wichtig?", "r": "Zu wissen, ob es massiv genug ist, um kugelförmig zu sein, Kriterium eines Zwergplaneten."}, {"q": "Welches Instrument könnte verwendet werden, um seine Größe genau zu messen?", "r": "Das James Webb Weltraumteleskop dank Beobachtungen im Infrarot."}, {"q": "Was ist die 2026 ED138 Orbit Neigung?", "r": "Etwa 25 Grad von der Planetenebene."}, {"q": "Welcher Planetenkörper könnte die Umlaufbahn von 2026 ED138 beeinflussen?", "r": "Neptun."}, {"q": "Wie ist der aktuelle Stand von 2026 ED138?", "r": "Er ist ein Zwergplanetenkandidat, der auf Maßnahmen wartet, die seine sphärische Form bestätigen."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
