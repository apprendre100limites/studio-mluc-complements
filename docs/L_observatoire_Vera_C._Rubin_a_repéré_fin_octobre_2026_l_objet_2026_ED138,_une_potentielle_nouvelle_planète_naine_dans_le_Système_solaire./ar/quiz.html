<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كروز - At the end of October 2026, the Vera C. Rubin Observatory spotted object 2026 ED138, a potential new dwarf planet in the Solar System.</title><style>

</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>Quiz</h1><p class="sous">At the end of October 2026, the Vera C. Rubin Observatory spotted object 2026 ED138, a potential new dwarf planet in the Solar System.</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ما اسم الجسم المكتشف؟", "choix": ["Pluto", "Vera C. Rubin", "جيمس ويب", "ED138"], "bonne": 3, "explication": "اسمه 2000 26 ED138."}, {"question": "أين كانت البيانات التي حددت الجسم المأخوذ؟", "choix": ["Mauna Kea Observatory, Hawaii", "مرصد باريس، فرنسا", "مرصد روبن، شيلي", "مرصد هبل، الولايات المتحدة الأمريكية"], "bonne": 2, "explication": "The object was found in data from Vera C. Rubin Observatory in Chile."}, {"question": "ما هو الشرط الأول لجسد يعتبر كوكب قزم؟", "choix": ["لديك خواتم", "أن تكون أصغر من الأرض", "استدر الشمس", "تحلى بالغلاف الجوي"], "bonne": 2, "explication": "واحد: حول الشمس."}, {"question": "ما هي الحالة التي لا تلتقي بها كواكب القزم؟", "choix": ["حرارة عالية", "عدم تطهير المنطقة المجاورة لمداره", "استدر الشمس", "كُن ضخماً بما فيه الكفاية ليكون دائرياً"], "bonne": 1, "explication": "ثلاثة: عدم إخلاء المنطقة المحيطة بمداره."}, {"question": "أي عالم فضاء رصد الجسم في 13 أكتوبر 2026؟", "choix": ["ماثيو هولمان", "Caroline Herschel", "Edwin Hubble", "Neil deGrasse Tyson"], "bonne": 0, "explication": "علم الفلك (ماثيو هولمان) من مركز (هارفارد) و(سميثسونيان) للفيزياء الفلكية رصدوه في 13 تشرين الأول/أكتوبر"}, {"question": "كم يبعد عن الشمس هو الجسم؟", "choix": ["حوالي 100 وحدة فلكية", "حوالي 46 وحدة فلكية", "حوالي خمس وحدات فلكية", "حوالي 30 وحدة فلكية"], "bonne": 1, "explication": "إنها حوالي ستة وأربعون وحدة فلكية من الشمس"}, {"question": "ما مدى حجم هذا الجسم؟", "choix": ["بين مئتين وخمسمائة كيلومتر", "بين 10 و 50 كيلومترا", "بين ستمائة وألف وخمسمائة كيلومتر", "بين ألفين وثلاثة آلاف كيلومتر"], "bonne": 2, "explication": "ويقدر حجمها بما يتراوح بين ستمائة وألف وخمسمائة كيلومتر."}, {"question": "أي أداة ستكون مفيدة لقياس حجم الجسم تحديداً؟", "choix": ["James Webb Space Telescope", "مرصد غرينيتش", "المقراب الهبل", "ساتل GPS"], "bonne": 0, "explication": "ويتطلب ذلك رصداً بالأشعة تحت الحمراء، على سبيل المثال مع مقراب جيمس ويب الفضائي."}, {"question": "كم درجة هو مدار الجسم المميل إلى طائرة الكواكب؟", "choix": ["حوالي 25 درجة", "حوالي 50 درجة", "حوالي 10 درجات", "حوالي الصفر"], "bonne": 0, "explication": "كما أن مداره يميل نحو خمسة وعشرين درجة من طائرة الكوكب."}, {"question": "لماذا لم يتأكد الجسم ككوكب قزم بعد؟", "choix": ["حجمها بالضبط لم يعرف بعد", "إنه أصغر من القمر", "لا يدور حول الشمس", "لقد تم تطهيره من المدار"], "bonne": 0, "explication": "على أي حال، لمعرفة ما إذا كان كبيرا بما فيه الكفاية ليكون متقطعا، يجب أن يعرف المرء حجمه بدقة."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
