<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطاقات الذاكرة At the end of October 2026, the Vera C. Rubin Observatory spotted object 2026 ED138, a potential new dwarf planet in the Solar System.</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}

*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}

ul{padding-left:1.2em}li{margin:.35em 0}

a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>بطاقات الذاكرة</h1><p class="sous">At the end of October 2026, the Vera C. Rubin Observatory spotted object 2026 ED138, a potential new dwarf planet in the Solar System.</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "ما هو كوكب القزم؟", "r": "إنها نجمة تدور حول الشمس أصغر من كوكب وتتقاسم مدارها مع أجسام أخرى"}, {"q": "ما هي المعايير الثلاثة لتكون كوكب قزم؟", "r": "إستدر الشمس، كن ضخماً بما فيه الكفاية ليكون دائرياً ولم يُخلي مداره"}, {"q": "أي شرط يميز كوكباً عن كوكب قزم؟", "r": "كوكب حقيقي نظف أجسام مداره بينما كوكب قزم لم يفعل"}, {"q": "منذ متى (بلوتو) يعتبر كوكب قزم؟", "r": "منذ عام 2006"}, {"q": "أين كان الجسم 2026 ED138 موجود؟", "r": "In data from Vera C. Rubin Observatory in Chile."}, {"q": "من حدد 2026 ED138 ومتى؟", "r": "علم الفلك (ماثيو هولمان) رصدها في 13 أكتوبر 2026"}, {"q": "متى تم الإعلان عن الاكتشاف؟", "r": "27 أكتوبر 2026"}, {"q": "كم مرة صور مرصد روبن الجسم في عام 2026؟", "r": "ثلاثون مرة بين آذار/مارس وتموز/يوليه 2026."}, {"q": "كم يبعد 2026 ED138 من الشمس؟", "r": "حوالي 46 وحدة فلكية"}, {"q": "ما هي الكمية المقدرة من 2026 ED138؟", "r": "بين 600 و1500 كيلومتر في قطر"}, {"q": "لماذا الحجم الدقيق لـ2026 ED138 مهم؟", "r": "لمعرفة ما إذا كان ضخماً بما فيه الكفاية ليكون متسرعاً معيار كوكب القزم"}, {"q": "ما هي الأداة التي يمكن استخدامها لقياس حجمها تحديدا؟", "r": "تلسكوب جيمس ويب الفضائي، بفضل الملاحظات في تحت الحمراء."}, {"q": "ما هو الميل المداري لعام 2026؟", "r": "حوالي 25 درجة من طائرة الكوكب"}, {"q": "أي جسم كوكبي يمكن أن يؤثر على مدار 2026 ED138؟", "r": "نبتون"}, {"q": "What is the current status of 2026 ED138?", "r": "إنه مرشح لكوكب القزم ينتظر التدابير التي تؤكد شكله التافه"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
