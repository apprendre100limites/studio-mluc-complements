<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — L&#x27;observatoire Vera C. Rubin a repéré fin octobre 2026 l&#x27;objet 2026 ED138, une potentielle nouvelle planète naine dans le Système solaire.</title><style>

</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Quiz</h1><p class="sous">L&#x27;observatoire Vera C. Rubin a repéré fin octobre 2026 l&#x27;objet 2026 ED138, une potentielle nouvelle planète naine dans le Système solaire.</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Quel est le nom de l'objet découvert ?", "choix": ["Pluton", "Vera C. Rubin", "James Webb", "deux mille vingt-six ED138"], "bonne": 3, "explication": "Il s'appelle deux mille vingt-six ED138."}, {"question": "Où les données qui ont permis de repérer l'objet ont-elles été prises ?", "choix": ["Observatoire de Mauna Kea, Hawaii", "Observatoire de Paris, France", "Observatoire Vera C. Rubin, au Chili", "Observatoire Hubble, aux États-Unis"], "bonne": 2, "explication": "L'objet a été trouvé dans les données de l'observatoire Vera C. Rubin, au Chili."}, {"question": "Quelle est la première condition pour qu'un corps soit considéré comme planète naine ?", "choix": ["Avoir des anneaux", "Être plus petite que la Terre", "Tourner autour du Soleil", "Avoir une atmosphère"], "bonne": 2, "explication": "Un : tourner autour du Soleil."}, {"question": "Quelle condition les planètes naines ne remplissent-elles pas ?", "choix": ["Avoir une température élevée", "Ne pas avoir dégagé les alentours de son orbite", "Tourner autour du Soleil", "Être assez massive pour être ronde"], "bonne": 1, "explication": "Trois : ne pas avoir dégagé les alentours de son orbite."}, {"question": "Quel astronome a repéré l'objet le 13 octobre 2026 ?", "choix": ["Matthew Holman", "Caroline Herschel", "Edwin Hubble", "Neil deGrasse Tyson"], "bonne": 0, "explication": "C'est l'astronome Matthew Holman, du Centre d'astrophysique Harvard et Smithsonian, qui l'a repéré le treize octobre deux mille vingt-six."}, {"question": "À quelle distance approximative du Soleil se trouve l'objet ?", "choix": ["Environ cent unités astronomiques", "Environ quarante-six unités astronomiques", "Environ cinq unités astronomiques", "Environ trente unités astronomiques"], "bonne": 1, "explication": "Il se trouve à environ quarante-six unités astronomiques du Soleil."}, {"question": "Quelle fourchette de taille est estimée pour cet objet ?", "choix": ["Entre deux cents et cinq cents kilomètres", "Entre dix et cinquante kilomètres", "Entre six cents et mille cinq cents kilomètres", "Entre deux mille et trois mille kilomètres"], "bonne": 2, "explication": "Sa taille est estimée entre six cents et mille cinq cents kilomètres de large."}, {"question": "Quel instrument serait utile pour mesurer précisément la taille de l'objet ?", "choix": ["Télescope spatial James Webb", "Observatoire de Greenwich", "Télescope Hubble", "Satellite GPS"], "bonne": 0, "explication": "Il faut pour cela des observations dans l'infrarouge, par exemple avec le télescope spatial James Webb."}, {"question": "De combien de degrés l'orbite de l'objet est-elle inclinée par rapport au plan des planètes ?", "choix": ["Environ vingt-cinq degrés", "Environ cinquante degrés", "Environ dix degrés", "Environ zéro degré"], "bonne": 0, "explication": "Son orbite est aussi inclinée d'environ vingt-cinq degrés par rapport au plan des planètes."}, {"question": "Pourquoi l'objet n'est-il pas encore confirmé comme planète naine ?", "choix": ["Sa taille exacte n'est pas encore connue", "Il est plus petit que la Lune", "Il ne tourne pas autour du Soleil", "Il a déjà dégagé son orbite"], "bonne": 0, "explication": "Or, pour savoir s'il est assez gros pour être sphérique, il faut connaître sa taille précisément."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
