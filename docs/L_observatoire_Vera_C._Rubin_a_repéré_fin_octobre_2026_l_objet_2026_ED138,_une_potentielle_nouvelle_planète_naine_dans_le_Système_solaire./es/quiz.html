<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - A finales de octubre de 2026, el Observatorio Vera C. Rubin observó el objeto 2026 ED138, un potencial nuevo planeta enano en el Sistema Solar.</title><style>

</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Quiz</h1><p class="sous">A finales de octubre de 2026, el Observatorio Vera C. Rubin observó el objeto 2026 ED138, un potencial nuevo planeta enano en el Sistema Solar.</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Cuál es el nombre del objeto descubierto?", "choix": ["Plutón", "Vera C. Rubin", "James Webb", "dos mil veintiséis ED138"], "bonne": 3, "explication": "Su nombre es dos mil veintiséis ED138."}, {"question": "¿Dónde estaban los datos que identificaban el objeto tomado?", "choix": ["Observatorio de Mauna Kea, Hawaii", "Observatorio de París, Francia", "Vera C. Observatorio Rubin, Chile", "Observatorio Hubble, Estados Unidos"], "bonne": 2, "explication": "El objeto fue encontrado en datos del Observatorio Vera C. Rubin en Chile."}, {"question": "¿Cuál es la primera condición para que un cuerpo sea considerado un planeta enano?", "choix": ["Tener anillos", "Ser más pequeño que la Tierra", "Da la vuelta al Sol", "Tener un ambiente"], "bonne": 2, "explication": "Uno: girar alrededor del Sol."}, {"question": "¿Qué condición no encuentran los planetas enanos?", "choix": ["Tener una alta temperatura", "No haber aclarado las proximidades de su órbita", "Da la vuelta al Sol", "Sé lo suficientemente grande para ser redondo"], "bonne": 1, "explication": "Tres: no haber aclarado la proximidad de su órbita."}, {"question": "¿Qué astrónomo vio el objeto el 13 de octubre de 2026?", "choix": ["Matthew Holman", "Caroline Herschel", "Edwin Hubble", "Neil deGrasse Tyson"], "bonne": 0, "explication": "El astrónomo Matthew Holman del Centro de Astrofísica de Harvard y Smithsoniano lo vio el 13 de octubre, dos mil veintiséis."}, {"question": "¿Cuán lejos del Sol está el objeto?", "choix": ["Alrededor de 100 unidades astronómicas", "Alrededor de 46 unidades astronómicas", "Alrededor de cinco unidades astronómicas", "Cerca de 30 unidades astronómicas"], "bonne": 1, "explication": "Son alrededor de cuarenta y seis unidades astronómicas del Sol."}, {"question": "¿Qué rango de tamaño se calcula para este objeto?", "choix": ["Entre doscientos quinientos kilómetros", "Entre diez y cincuenta kilómetros", "Entre seiscientos mil quinientos kilómetros", "Entre dos mil y tres mil kilómetros"], "bonne": 2, "explication": "Su tamaño se estima entre seiscientos y mil quinientos kilómetros de ancho."}, {"question": "¿Qué instrumento sería útil para medir precisamente el tamaño del objeto?", "choix": ["Telescopio Espacial James Webb", "Observatorio de Greenwich", "Telescopio Hubble", "Satélite GPS"], "bonne": 0, "explication": "Esto requiere observaciones en el infrarrojo, por ejemplo con el telescopio espacial James Webb."}, {"question": "¿Cuántos grados es la órbita del objeto inclinado al plano de los planetas?", "choix": ["Cerca de 25 grados", "Unos cincuenta grados", "Cerca de 10 grados", "Acerca de cero grados"], "bonne": 0, "explication": "Su órbita también está inclinada unos veinticinco grados desde el plano planetario."}, {"question": "¿Por qué el objeto no es confirmado como un planeta enano?", "choix": ["Su tamaño exacto todavía no se conoce", "Es más pequeño que la luna.", "No gira alrededor del Sol", "Ya está despejado de la órbita."], "bonne": 0, "explication": "Sin embargo, para saber si es lo suficientemente grande para ser esférico, uno debe saber su tamaño precisamente."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
