<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas de memoria A finales de octubre de 2026, el Observatorio Vera C. Rubin observó el objeto 2026 ED138, un potencial nuevo planeta enano en el Sistema Solar.</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}

.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}

@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencia </div><h1>Tarjetas de memoria</h1><p class="sous">A finales de octubre de 2026, el Observatorio Vera C. Rubin observó el objeto 2026 ED138, un potencial nuevo planeta enano en el Sistema Solar.</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Qué es un planeta enano?", "r": "Es una estrella que gira alrededor del Sol, más pequeña que un planeta y comparte su órbita con otros objetos."}, {"q": "¿Cuáles son los tres criterios para ser un planeta enano?", "r": "Da la vuelta al Sol, sé lo suficientemente grande como para estar alrededor, y no han aclarado su órbita."}, {"q": "¿Qué condición distingue un planeta de un planeta enano?", "r": "Un planeta real limpió los objetos de su órbita, mientras que un planeta enano no lo hizo."}, {"q": "¿Desde cuándo Plutón es considerado un planeta enano?", "r": "Desde 2006."}, {"q": "¿Dónde estaba ubicado el objeto 2026 ED138?", "r": "En datos del Observatorio Vera C. Rubin en Chile."}, {"q": "¿Quién identificó 2026 ED138 y cuándo?", "r": "El astrónomo Matthew Holman lo vio el 13 de octubre de 2026."}, {"q": "¿Cuándo se anunció el descubrimiento?", "r": "27 de octubre de 2026."}, {"q": "¿Cuántas veces el Observatorio Rubin fotografió el objeto en 2026?", "r": "Treinta veces entre Marzo y Julio 2026."}, {"q": "¿Cuán lejos está 2026 ED138 del Sol?", "r": "Alrededor de 46 unidades astronómicas."}, {"q": "¿Cuál es el rango de tamaño estimado de 2026 ED138?", "r": "Entre 600 y 1500 kilómetros de diámetro."}, {"q": "¿Por qué es importante el tamaño preciso de 2026 ED138?", "r": "Saber si es lo suficientemente masivo como para ser esférico, criterio de un planeta enano."}, {"q": "¿Qué instrumento se puede utilizar para medir precisamente su tamaño?", "r": "El telescopio espacial James Webb, gracias a las observaciones en el infrarrojo."}, {"q": "¿Cuál es la inclinación orbital 2026 ED138?", "r": "Unos 25 grados del avión del planeta."}, {"q": "¿Qué cuerpo planetario podría influir en la órbita de 2026 ED138?", "r": "Neptuno."}, {"q": "¿Cuál es el estado actual de 2026 ED138?", "r": "Es un candidato del planeta enano, esperando medidas para confirmar su forma esférica."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
