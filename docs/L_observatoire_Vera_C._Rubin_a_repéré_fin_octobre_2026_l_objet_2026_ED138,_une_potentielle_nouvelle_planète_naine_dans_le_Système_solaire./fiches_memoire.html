<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — L&#x27;observatoire Vera C. Rubin a repéré fin octobre 2026 l&#x27;objet 2026 ED138, une potentielle nouvelle planète naine dans le Système solaire.</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Fiches mémoire</h1><p class="sous">L&#x27;observatoire Vera C. Rubin a repéré fin octobre 2026 l&#x27;objet 2026 ED138, une potentielle nouvelle planète naine dans le Système solaire.</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Qu'est-ce qu'une planète naine ?", "r": "C’est un astre qui tourne autour du Soleil, plus petit qu’une planète et qui partage son orbite avec d’autres objets."}, {"q": "Quels sont les trois critères pour être une planète naine ?", "r": "Tourner autour du Soleil, être assez massive pour être ronde, et ne pas avoir dégagé son orbite."}, {"q": "Quelle condition distingue une planète d’une planète naine ?", "r": "Une vraie planète a nettoyé les objets de son orbite, alors qu’une planète naine ne l’a pas fait."}, {"q": "Depuis quand Pluton est‑elle considérée comme planète naine ?", "r": "Depuis 2006."}, {"q": "Où a été repéré l’objet 2026 ED138 ?", "r": "Dans les données de l’observatoire Vera C. Rubin au Chili."}, {"q": "Qui a identifié 2026 ED138 et quand ?", "r": "L’astronome Matthew Holman l’a repéré le 13 octobre 2026."}, {"q": "Quand l’annonce de la découverte a‑t‑elle été faite ?", "r": "Le 27 octobre 2026."}, {"q": "Combien de fois l’observatoire Rubin a‑t‑il photographié l’objet en 2026 ?", "r": "Trente fois entre mars et juillet 2026."}, {"q": "À quelle distance approximative se trouve 2026 ED138 du Soleil ?", "r": "Environ 46 unités astronomiques."}, {"q": "Quelle est la fourchette estimée de la taille de 2026 ED138 ?", "r": "Entre 600 et 1500 kilomètres de diamètre."}, {"q": "Pourquoi la taille précise de 2026 ED138 est‑elle importante ?", "r": "Pour savoir s’il est assez massif pour être sphérique, critère d’une planète naine."}, {"q": "Quel instrument pourrait permettre de mesurer précisément sa taille ?", "r": "Le télescope spatial James Webb, grâce à des observations dans l’infrarouge."}, {"q": "Quelle est l’inclinaison de l’orbite de 2026 ED138 ?", "r": "Environ 25 degrés par rapport au plan des planètes."}, {"q": "Quel corps planétaire pourrait influencer l’orbite de 2026 ED138 ?", "r": "Neptune."}, {"q": "Quel est le statut actuel de 2026 ED138 ?", "r": "C’est un candidat planète naine, en attente de mesures confirmant sa forme sphérique."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
