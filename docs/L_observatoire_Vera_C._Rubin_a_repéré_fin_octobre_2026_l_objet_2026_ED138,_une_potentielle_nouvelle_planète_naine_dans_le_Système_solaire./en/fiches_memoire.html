</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Memory cards</h1><p class="sous">At the end of October 2026, the Vera C. Rubin Observatory spotted object 2026 ED138, a potential new dwarf planet in the Solar System.</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "What is a dwarf planet?", "r": "It is a star that revolves around the Sun, smaller than a planet and shares its orbit with other objects."}, {"q": "What are the three criteria for being a dwarf planet?", "r": "Turn around the Sun, be massive enough to be round, and have not cleared its orbit."}, {"q": "What condition distinguishes a planet from a dwarf planet?", "r": "A real planet cleaned the objects of its orbit, while a dwarf planet did not."}, {"q": "Since when is Pluto considered a dwarf planet?", "r": "Since 2006."}, {"q": "Where was the object 2026 ED138 located?", "r": "In data from Vera C. Rubin Observatory in Chile."}, {"q": "Who identified 2026 ED138 and when?", "r": "Astronomer Matthew Holman spotted it on October 13, 2026."}, {"q": "When was the discovery announced?", "r": "October 27, 2026."}, {"q": "How many times did the Rubin Observatory photograph the object in 2026?", "r": "Thirty times between March and July 2026."}, {"q": "How far is 2026 ED138 from the Sun?", "r": "About 46 astronomical units."}, {"q": "What is the estimated size range of 2026 ED138?", "r": "Between 600 and 1500 kilometers in diameter."}, {"q": "Why is the precise size of 2026 ED138 important?", "r": "To know if it is massive enough to be spherical, criterion of a dwarf planet."}, {"q": "What instrument could be used to measure precisely its size?", "r": "The James Webb space telescope, thanks to observations in the infrared."}, {"q": "What is the 2026 ED138 orbit inclination?", "r": "About 25 degrees from the planet plane."}, {"q": "What planetary body could influence the orbit of 2026 ED138?", "r": "Neptune."}, {"q": "What is the current status of 2026 ED138?", "r": "He is a dwarf planet candidate, waiting for measures confirming his spherical form."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
