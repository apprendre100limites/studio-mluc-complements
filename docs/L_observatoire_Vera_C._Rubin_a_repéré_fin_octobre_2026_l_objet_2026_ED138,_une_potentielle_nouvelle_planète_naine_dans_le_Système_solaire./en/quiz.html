</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Quiz</h1><p class="sous">At the end of October 2026, the Vera C. Rubin Observatory spotted object 2026 ED138, a potential new dwarf planet in the Solar System.</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What is the name of the object discovered?", "choix": ["Pluto", "Vera C. Rubin", "James Webb", "two thousand twenty-six ED138"], "bonne": 3, "explication": "Its name is two thousand twenty-six ED138."}, {"question": "Where were the data that identified the object taken?", "choix": ["Mauna Kea Observatory, Hawaii", "Observatoire de Paris, France", "Vera C. Rubin Observatory, Chile", "Hubble Observatory, USA"], "bonne": 2, "explication": "The object was found in data from Vera C. Rubin Observatory in Chile."}, {"question": "What is the first condition for a body to be considered a dwarf planet?", "choix": ["Have rings", "Being smaller than Earth", "Turn around the Sun", "Have an atmosphere"], "bonne": 2, "explication": "One: turn around the Sun."}, {"question": "What condition does the dwarf planets not meet?", "choix": ["Have a high temperature", "Not having cleared the vicinity of its orbit", "Turn around the Sun", "Be massive enough to be round"], "bonne": 1, "explication": "Three: not having cleared the vicinity of his orbit."}, {"question": "Which astronomer spotted the object on October 13, 2026?", "choix": ["Matthew Holman", "Caroline Herschel", "Edwin Hubble", "Neil deGrasse Tyson"], "bonne": 0, "explication": "Astronomer Matthew Holman of the Harvard and Smithsonian Astrophysics Centre spotted him on October 13, two thousand twenty-six."}, {"question": "How far from the Sun is the object?", "choix": ["About 100 astronomical units", "About 46 astronomical units", "About five astronomical units", "About 30 astronomical units"], "bonne": 1, "explication": "It is about forty-six astronomical units of the Sun."}, {"question": "What size range is estimated for this object?", "choix": ["Between two hundred and five hundred kilometres", "Between ten and fifty kilometres", "Between six hundred and one thousand five hundred kilometers", "Between two thousand and three thousand kilometers"], "bonne": 2, "explication": "Its size is estimated between six hundred and one thousand five hundred kilometers wide."}, {"question": "Which instrument would be useful to measure precisely the size of the object?", "choix": ["James Webb Space Telescope", "Greenwich Observatory", "Hubble Telescope", "GPS satellite"], "bonne": 0, "explication": "This requires observations in the infrared, for example with the James Webb space telescope."}, {"question": "How many degrees is the orbit of the object inclined to the plane of the planets?", "choix": ["About 25 degrees", "About fifty degrees", "About 10 degrees", "About zero degrees"], "bonne": 0, "explication": "Its orbit is also inclined about twenty-five degrees from the planet plane."}, {"question": "Why isn't the object confirmed as a dwarf planet yet?", "choix": ["Its exact size is not yet known", "He's smaller than the moon.", "It does not revolve around the Sun", "He's already cleared of orbit."], "bonne": 0, "explication": "However, to know whether it is big enough to be spherical, one must know its size precisely."}];const box=document.getElementById('q');let h='';
