<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी कार्ड — अक्टूबर 2026 के अंत में, वेरा सी। रूबिन ऑब्जर्वेटरी स्पॉटेड ऑब्जेक्ट 2026 ED138, सोलर सिस्टम में एक संभावित नया बौना ग्रह।</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान </div><h1>मेमोरी कार्ड</h1><p class="sous">अक्टूबर 2026 के अंत में, वेरा सी। रूबिन ऑब्जर्वेटरी स्पॉटेड ऑब्जेक्ट 2026 ED138, सोलर सिस्टम में एक संभावित नया बौना ग्रह।</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "ग्रह क्या है?", "r": "यह एक ऐसा सितारा है जो सूर्य के चारों ओर घूमता है, एक ग्रह से छोटा और अन्य वस्तुओं के साथ अपनी कक्षा साझा करता है।"}, {"q": "एक बौना ग्रह होने के लिए तीन मानदंड क्या हैं?", "r": "सूर्य के चारों ओर मुड़ें, गोल होने के लिए काफी बड़े पैमाने पर रहें, और इसकी कक्षा को साफ़ नहीं किया है।"}, {"q": "क्या स्थिति एक बौना ग्रह से ग्रह को अलग करती है?", "r": "एक वास्तविक ग्रह ने अपनी कक्षा की वस्तुओं को साफ किया, जबकि एक बौना ग्रह नहीं था।"}, {"q": "चूंकि प्लूटो को एक बौना ग्रह माना जाता है?", "r": "2006 से।"}, {"q": "ऑब्जेक्ट 2026 ED138 कहाँ स्थित था?", "r": "Vera C. Rubin Observatory in Chile."}, {"q": "किसने 2026 ED138 और कब पहचाना?", "r": "एस्ट्रोनॉमर मैथ्यू होलमैन ने इसे 13 अक्टूबर 2026 को देखा।"}, {"q": "जब खोज की घोषणा की थी?", "r": "27 अक्टूबर 2026।"}, {"q": "कितने समय में रूबिन ऑब्जर्वेटरी ने 2026 में ऑब्जेक्ट को तस्वीर दी?", "r": "मार्च और जुलाई 2026 के बीच तीस बार।"}, {"q": "सूर्य से 2026 ED138 कितने दूर है?", "r": "लगभग 46 खगोलीय इकाइयों।"}, {"q": "2026 ED138 की अनुमानित आकार सीमा क्या है?", "r": "व्यास में 600 और 1500 किलोमीटर के बीच।"}, {"q": "2026 ED138 का सटीक आकार क्यों महत्वपूर्ण है?", "r": "यह जानने के लिए कि क्या यह बड़े पैमाने पर एक बौना ग्रह के गोलाकार, मानदंड होने के लिए पर्याप्त है।"}, {"q": "इसके आकार को मापने के लिए कौन से उपकरण का उपयोग किया जा सकता है?", "r": "जेम्स वेब अंतरिक्ष दूरबीन, इन्फ्रारेड में टिप्पणियों के लिए धन्यवाद।"}, {"q": "2026 ED138 कक्षा झुकाव क्या है?", "r": "ग्रह विमान से लगभग 25 डिग्री।"}, {"q": "क्या ग्रह शरीर 2026 ED138 की कक्षा को प्रभावित कर सकता है?", "r": "नेप्च्यून।"}, {"q": "2026 ED138 की वर्तमान स्थिति क्या है?", "r": "वह एक बौना ग्रह उम्मीदवार हैं, जो अपने गोलाकार रूप की पुष्टि करने के उपायों की प्रतीक्षा करते हैं।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
