<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी — अक्टूबर 2026 के अंत में, वेरा सी। रूबिन ऑब्जर्वेटरी स्पॉटेड ऑब्जेक्ट 2026 ED138, सोलर सिस्टम में एक संभावित नया बौना ग्रह।</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science </div><h1>प्रश्नोत्तरी</h1><p class="sous">अक्टूबर 2026 के अंत में, वेरा सी। रूबिन ऑब्जर्वेटरी स्पॉटेड ऑब्जेक्ट 2026 ED138, सोलर सिस्टम में एक संभावित नया बौना ग्रह।</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ऑब्जेक्ट का नाम क्या है?", "choix": ["प्लूटो", "Vera C. Rubin", "जेम्स वेब", "दो हजार पच्चीस ED138"], "bonne": 3, "explication": "इसका नाम दो हजार पच्चीस ED138 है।"}, {"question": "कौन सा डेटा उस वस्तु की पहचान करता है?", "choix": ["Mauna Kea वेधशाला, हवाई", "Observatoire de Paris, France", "Vera C. Rubin Observatory, चिली", "हबल वेधशाला, संयुक्त राज्य अमेरिका"], "bonne": 2, "explication": "वस्तु चिली में Vera C. Rubin पर्यवेक्षक से डेटा में पाया गया था।"}, {"question": "एक शरीर के लिए पहली शर्त क्या है?", "choix": ["छल्ले है", "पृथ्वी से छोटा होना", "सूर्य के चारों ओर मुड़ें", "वातावरण"], "bonne": 2, "explication": "एक: सूर्य के चारों ओर मुड़ें।"}, {"question": "क्या दशा है?", "choix": ["उच्च तापमान है", "अपनी कक्षा की विषाक्तता को साफ़ नहीं करना", "सूर्य के चारों ओर मुड़ें", "गोल होने के लिए काफी बड़े पैमाने पर होना"], "bonne": 1, "explication": "तीन: अपने कक्षा के आसपास के क्षेत्र को साफ़ नहीं किया।"}, {"question": "किस खगोलविद ने 13 अक्टूबर 2026 को ऑब्जेक्ट को देखा?", "choix": ["मैथ्यू होलमैन", "Caroline Herschel", "एडविन हबल", "Neil deGrasse Tyson"], "bonne": 0, "explication": "हार्वर्ड और स्मिथसोनियन एस्ट्रोफिजिक्स सेंटर के एस्ट्रोनॉमर मैथ्यू होलमैन ने उन्हें 13 अक्टूबर, दो हजार बीस-छह पर देखा।"}, {"question": "सूर्य से कितनी दूर वस्तु है?", "choix": ["लगभग 100 खगोलीय इकाइयों", "लगभग 46 खगोलीय इकाइयों", "लगभग पांच खगोलीय इकाइयों", "लगभग 30 खगोलीय इकाइयां"], "bonne": 1, "explication": "यह सूर्य की चालीस-six खगोलीय इकाइयों के बारे में है।"}, {"question": "इस ऑब्जेक्ट के लिए किस आकार की रेंज का अनुमान लगाया गया है?", "choix": ["दो सौ पचास किलोमीटर", "दस से पचास किलोमीटर", "छह सौ हजार पांच सौ किलोमीटर के बीच", "दो हजार किलोमीटर"], "bonne": 2, "explication": "इसका आकार छह सौ हजार पांच सौ किलोमीटर चौड़ा है।"}, {"question": "कौन सा उपकरण वस्तु के आकार को मापने के लिए उपयोगी होगा?", "choix": ["जेम्स वेब स्पेस टेलीस्कोप", "ग्रीनविच वेधशाला", "हबल टेलीस्कोप", "जीपीएस उपग्रह"], "bonne": 0, "explication": "इसके लिए इन्फ्रारेड में अवलोकन की आवश्यकता होती है, उदाहरण के लिए जेम्स वेब अंतरिक्ष दूरबीन के साथ।"}, {"question": "कितने अंश इस वस्तु की कक्षा है जो ग्रह के समतल में शामिल है?", "choix": ["लगभग 25 डिग्री", "लगभग पचास डिग्री", "लगभग 10 डिग्री", "लगभग शून्य डिग्री"], "bonne": 0, "explication": "इसकी कक्षा भी ग्रह विमान से लगभग बीस-पांच डिग्री को शामिल किया गया है।"}, {"question": "क्यों नहीं है?", "choix": ["इसका सटीक आकार अभी तक ज्ञात नहीं है", "वह चंद्रमा से छोटा है।", "यह सूर्य के चारों ओर घूमता नहीं है", "वह पहले से ही कक्षा से स्पष्ट है।"], "bonne": 0, "explication": "हालांकि, यह जानने के लिए कि यह गोलाकार होने के लिए काफी बड़ा है, किसी को इसके आकार को ठीक से जानना चाहिए।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
