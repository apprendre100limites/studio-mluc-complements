<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी — ध्वनि</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>प्रश्नोत्तरी</h1><p class="sous">ध्वनि</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ध्वनि क्या है?", "choix": ["प्रकृति की ध्वनि", "रेडियो संकेत", "कंपन", "एक वस्तु जो प्रकाश उत्पन्न करती है"], "bonne": 2, "explication": "एक ध्वनि एक कंपन है: एक बहुत तेजी से आ रहा है और मामले के कणों की जा रही है।"}, {"question": "क्यों ध्वनि एक वैक्यूम में फैल नहीं है?", "choix": ["वह बहुत कमजोर है।", "ध्वनि संचारित करने के लिए कोई सामग्री नहीं है", "तरंगों को अंतरिक्ष द्वारा अवशोषित किया जाता है", "इसे प्रकाश द्वारा प्रतिस्थापित किया जाता है"], "bonne": 1, "explication": "शून्य में, ध्वनि फैल नहीं जाती है। यह एक भौतिक माध्यम की जरूरत है: हवा, पानी या ठोस।"}, {"question": "किस माध्यम में ध्वनि सबसे तेज यात्रा करती है?", "choix": ["एयर", "वैक्यूम", "पानी", "स्टील"], "bonne": 3, "explication": "ध्वनि हवा की तुलना में पानी में तेजी से चला जाता है, और यहां तक कि तेजी से स्टील में भी।"}, {"question": "20 डिग्री पर, कितनी तेजी से हवा में ध्वनि अग्रिम करता है?", "choix": ["300 m/s", "400 m/s", "340 m/s", "250 m/s"], "bonne": 2, "explication": "हवा में, बीस डिग्री पर, यह प्रति सेकंड लगभग तीन सौ चालीस मीटर तक आगे बढ़ जाता है।"}, {"question": "जब आप पांच सेकंड की गिनती करते हैं तो कितने मीटर बिजली और आपके कान के बीच ध्वनि चलाता है?", "choix": ["2000 मीटर", "1700 मी", "1000 मीटर", "500 मीटर"], "bonne": 1, "explication": "उन्होंने एक हजार सात सौ मीटर की यात्रा की।"}, {"question": "क्या ध्वनि स्तर लंबे समय तक जोखिम आपकी सुनवाई को नुकसान पहुंचा सकता है?", "choix": ["90 डीबी", "100 डीबी", "80 डीबी", "85 डीबी"], "bonne": 3, "explication": "लगभग आठ-पाँच डेसिबलों से, लंबे समय तक जोखिम स्थायी रूप से आपकी सुनवाई को नुकसान पहुंचा सकता है।"}, {"question": "कौन सा उपकरण ध्वनि स्तर को मापता है?", "choix": ["ध्वनि मीटर", "Hygrometer", "थर्मामीटर", "बैरोमीटर"], "bonne": 0, "explication": "ध्वनि स्तर को डेसिबल में मापा जाता है, जिसमें एक sonometer होता है।"}, {"question": "कौन से पेशेवर शरीर के अंदर देखने के लिए अल्ट्रासाउंड का उपयोग करता है?", "choix": ["साउंड इंजीनियर", "Echographist", "डॉक्टर ORL", "ऑडियोप्रोस्थिस्ट"], "bonne": 1, "explication": "एक अल्ट्रासाउंड कलाकार शरीर के अंदर देखने के लिए अल्ट्रासाउंड का उपयोग करता है।"}, {"question": "किस क्षेत्र में ध्वनि का उपयोग किया जाता है?", "choix": ["स्वास्थ्य, संगीत, सिनेमा, काम और नाव सोनार पर सुरक्षा", "सिनेमा", "संगीत", "स्वास्थ्य"], "bonne": 0, "explication": "इन अवधारणाओं का उपयोग स्वास्थ्य, संगीत, सिनेमा, काम और नाव सोनार में सुरक्षा में किया जाता है।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
