<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी कार्ड - साउंड</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>मेमोरी कार्ड</h1><p class="sous">ध्वनि</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "पाठ के अनुसार ध्वनि क्या है?", "r": "एक ध्वनि पदार्थ के कणों का एक बहुत तेजी से कंपन है।"}, {"q": "ध्वनि स्रोत क्या है?", "r": "एक ध्वनि स्रोत एक वस्तु है जो कंपन करता है और ध्वनि उत्पन्न करता है।"}, {"q": "किस माध्यम में ध्वनि फैल गई है?", "r": "ध्वनि एक भौतिक माध्यम जैसे हवा, पानी या ठोस में फैलती है।"}, {"q": "20 डिग्री पर हवा में कितनी तेजी से फैलता है?", "r": "ध्वनि 20 डिग्री पर हवा में लगभग 340 मीटर प्रति सेकंड फैलती है।"}, {"q": "व्हिस्पर का ध्वनि स्तर क्या है?", "r": "एक व्हिस्पर लगभग 30 डेसिबल बनाता है।"}, {"q": "क्या नुकसान शोर स्तर से बनाए रखा जा सकता है?", "r": "लगभग 85 decibels से, लंबे समय तक जोखिम स्थायी रूप से सुनवाई को नुकसान पहुंचा सकता है।"}, {"q": "एक sonometer का उपयोग क्या है?", "r": "एक sonometer decibels में शोर स्तर को मापता है।"}, {"q": "शोर के स्तर पर मात्रा का प्रभाव क्या है?", "r": "ध्वनि स्तर ध्वनि उत्सर्जित की दूरी के साथ गिर जाता है।"}, {"q": "अपनी सुनवाई की रक्षा के तरीके क्या हैं?", "r": "वक्ताओं का पता लगाना, नियमित ब्रेक लेना, हेलमेट की मात्रा को सीमित करना और एक कॉन्सर्ट के दौरान प्लग का उपयोग करना।"}, {"q": "ध्वनि ज्ञान किस क्षेत्र का उपयोग किया जाता है?", "r": "इन अवधारणाओं का उपयोग स्वास्थ्य, संगीत, सिनेमा, काम और नाव सोनार में सुरक्षा में किया जाता है।"}, {"q": "किसी को भी अंतरिक्ष में चिल्लाने की कोशिश क्यों नहीं की?", "r": "क्योंकि अंतरिक्ष में ध्वनि संचारित करने के लिए कोई बात नहीं है।"}, {"q": "कैसे एक थंडर की दूरी की गणना करने के लिए?", "r": "बिजली और कमजोर के बीच सेकंड की गणना करें, फिर इस संख्या को 3 (लगभग 340 मीटर प्रति सेकंड 100 से विभाजित) से विभाजित करें।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
