<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Sonido</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Quiz</h1><p class="sous">Sonido</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Qué es un sonido?", "choix": ["Un sonido de la naturaleza", "Una señal de radio", "Vibración", "Un objeto que produce luz"], "bonne": 2, "explication": "Un sonido es una vibración: una venida muy rápida e ir de las partículas de la materia."}, {"question": "¿Por qué el sonido no se extiende en un vacío?", "choix": ["Es demasiado débil.", "No hay material para transmitir el sonido", "Las olas son absorbidas por el espacio", "Es reemplazado por luz"], "bonne": 1, "explication": "En el vacío, el sonido no se propaga. Necesita un medio material: aire, agua o sólido."}, {"question": "¿En qué medio el sonido viaja más rápido?", "choix": ["Aire", "El vacío", "Agua", "Acero"], "bonne": 3, "explication": "El sonido va más rápido en el agua que en el aire, e incluso más rápido en el acero."}, {"question": "A 20 grados, ¿qué tan rápido avanza el sonido en el aire?", "choix": ["300 m/ s", "400 m/s", "340 m/ s", "250 m/ s"], "bonne": 2, "explication": "En el aire, a veinte grados, avanza a unos trescientos cuarenta metros por segundo."}, {"question": "¿Cuántos metros corre el sonido entre el relámpago y el oído cuando cuenta cinco segundos?", "choix": ["2000 m", "1700 m", "1000 m", "500 m"], "bonne": 1, "explication": "Viajó unos mil setecientos metros."}, {"question": "¿De qué nivel de sonido puede la exposición prolongada dañar su audición?", "choix": ["90 dB", "100 dB", "80 dB", "85 dB"], "bonne": 3, "explication": "De aproximadamente ochenta y cinco decibeles, la exposición prolongada puede dañar permanentemente su audición."}, {"question": "¿Qué instrumento mide el nivel de sonido?", "choix": ["Medidor de sonido", "Higrometro", "Termómetro", "Barómetro"], "bonne": 0, "explication": "El nivel de sonido se mide en decibeles, con un sonómetro."}, {"question": "¿Qué profesional utiliza ultrasonido para ver dentro del cuerpo?", "choix": ["Ingeniero de sonido", "Ecographist", "Doctor ORL", "Audioprosthetist"], "bonne": 1, "explication": "Un artista de ultrasonido utiliza ultrasonido para ver dentro del cuerpo."}, {"question": "¿En qué áreas se utiliza el sonido?", "choix": ["Salud, música, cine, seguridad en el trabajo y sonares de barcos", "Cine", "Música", "Salud"], "bonne": 0, "explication": "Estos conceptos se utilizan en la salud, la música, el cine, la seguridad en el trabajo y los sonares de barcos."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
