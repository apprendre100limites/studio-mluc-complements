<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas de memoria — Sonido</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Tarjetas de memoria</h1><p class="sous">Sonido</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Qué es un sonido según el texto?", "r": "Un sonido es una vibración muy rápida de las partículas de la materia."}, {"q": "¿Qué es una fuente de sonido?", "r": "Una fuente de sonido es un objeto que vibra y produce un sonido."}, {"q": "¿En qué medio se extiende el sonido?", "r": "El sonido se extiende en un medio material como aire, agua o sólido."}, {"q": "¿Qué tan rápido suena en el aire a 20 grados?", "r": "El sonido se extiende a unos 340 metros por segundo en el aire a 20 grados."}, {"q": "¿Cuál es el nivel de sonido de un susurro?", "r": "Un susurro hace unos 30 decibeles."}, {"q": "¿Qué daño se puede soportar a partir de qué nivel de ruido?", "r": "Desde cerca de 85 decibeles, la exposición prolongada puede dañar permanentemente la audiencia."}, {"q": "¿Cuál es el uso de un sonómetro?", "r": "Un sonómetro mide el nivel de ruido en los decibeles."}, {"q": "¿Cuál es el efecto del volumen en los niveles de ruido?", "r": "El nivel de sonido baja con la distancia del sonido emitido."}, {"q": "¿Cuáles son las formas de proteger su audiencia?", "r": "Localizar altavoces, tomar pausas regulares, limitar el volumen del casco y utilizar enchufes durante un concierto."}, {"q": "¿Cuáles son las áreas donde se utiliza el conocimiento de sonido?", "r": "Estos conceptos se utilizan en la salud, la música, el cine, la seguridad en el trabajo y los sonares de barcos."}, {"q": "¿Por qué nadie te oye gritando en el espacio?", "r": "Porque no importa transmitir sonido en el espacio."}, {"q": "¿Cómo calcular la distancia de un trueno?", "r": "Cuenta segundos entre relámpago y trueno, y luego divide este número por 3 (unos 340 metros por segundo divididos por 100)."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
