<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Le son</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Fiches mémoire</h1><p class="sous">Le son</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Qu'est-ce qu'un son selon le texte?", "r": "Un son est une vibration très rapide des particules de la matière."}, {"q": "Qu'est-ce qu'une source sonore?", "r": "Une source sonore est un objet qui vibre et produit un son."}, {"q": "Dans quel milieu se propage le son?", "r": "Le son se propage dans un milieu matériel comme l'air, l'eau ou un solide."}, {"q": "À quelle vitesse se propage le son dans l'air à 20 degrés?", "r": "Le son se propage à environ 340 mètres par seconde dans l'air à 20 degrés."}, {"q": "Quel est le niveau sonore d'un chuchotement?", "r": "Un chuchotement fait environ 30 décibels."}, {"q": "Quels dommages peut-on subir à partir de quel niveau sonore?", "r": "À partir d'environ 85 décibels, une exposition prolongée peut abîmer l'audition de façon définitive."}, {"q": "Quel est l'usage d'un sonomètre?", "r": "Un sonomètre mesure le niveau sonore en décibels."}, {"q": "Quel est l'effet du volume sur le niveau sonore?", "r": "Le niveau sonore baisse avec la distance du son émis."}, {"q": "Quels sont les moyens pour protéger son audition?", "r": "Éloigner des haut-parleurs, faire des pauses régulières, limiter le volume du casque et utiliser des bouchons lors d'un concert."}, {"q": "Quels sont les domaines où l'on utilise les connaissances sur les sons?", "r": "Ces notions sont utilisées dans la santé, la musique, le cinéma, la sécurité au travail et les sonars de bateaux."}, {"q": "Pourquoi personne ne t'entend crier dans l'espace?", "r": "Parce qu'il n'y a pas de matière pour transmettre le son dans l'espace."}, {"q": "Comment calculer la distance d'un tonnerre?", "r": "Compter les secondes entre l'éclair et le tonnerre, puis diviser ce nombre par 3 (environ 340 mètres par seconde divisé par 100)."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
