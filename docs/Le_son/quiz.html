<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Le son</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Quiz</h1><p class="sous">Le son</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Qu’est‑ce qu’un son ?", "choix": ["Un bruit de la nature", "Un signal radio", "Une vibration", "Un objet qui produit de la lumière"], "bonne": 2, "explication": "Un son est une vibration : un va‑et‑vient très rapide des particules de la matière."}, {"question": "Pourquoi le son ne se propage pas dans le vide ?", "choix": ["Il est trop faible", "Il n’y a pas de matière pour transmettre le son", "Les ondes sont absorbées par l’espace", "Il est remplacé par la lumière"], "bonne": 1, "explication": "Dans le vide, le son ne se propage pas. Il lui faut un milieu matériel : de l’air, de l’eau ou un solide."}, {"question": "Dans quel milieu le son voyage le plus vite ?", "choix": ["L’air", "Le vide", "L’eau", "L’acier"], "bonne": 3, "explication": "Le son va plus vite dans l’eau que dans l’air, et encore plus vite dans l’acier."}, {"question": "À vingt degrés, à quelle vitesse le son avance‑t‑il dans l’air ?", "choix": ["300 m/s", "400 m/s", "340 m/s", "250 m/s"], "bonne": 2, "explication": "Dans l’air, à vingt degrés, il avance à environ trois cent quarante mètres par seconde."}, {"question": "Combien de mètres parcourt le son entre l’éclair et ton oreille lorsqu’on compte cinq secondes ?", "choix": ["2000 m", "1700 m", "1000 m", "500 m"], "bonne": 1, "explication": "Il a parcouru environ mille sept cents mètres."}, {"question": "À partir de quel niveau sonore l’exposition prolongée peut abîmer ton audition ?", "choix": ["90 dB", "100 dB", "80 dB", "85 dB"], "bonne": 3, "explication": "À partir d’environ quatre‑vingt‑cinq décibels, une exposition prolongée peut abîmer ton audition, de façon définitive."}, {"question": "Quel instrument mesure le niveau sonore ?", "choix": ["Sonomètre", "Hygromètre", "Thermomètre", "Baromètre"], "bonne": 0, "explication": "Le niveau sonore se mesure en décibels, avec un sonomètre."}, {"question": "Quel professionnel utilise des ultrasons pour voir à l’intérieur du corps ?", "choix": ["Ingénieur du son", "Échographiste", "Médecin ORL", "Audioprothésiste"], "bonne": 1, "explication": "Un échographiste utilise des ultrasons pour voir à l’intérieur du corps."}, {"question": "Dans quels domaines le son est‑il utilisé ?", "choix": ["Santé, musique, cinéma, sécurité au travail et sonars de bateaux", "Cinéma", "Musique", "Santé"], "bonne": 0, "explication": "Ces notions servent dans la santé, la musique, le cinéma, la sécurité au travail et les sonars de bateaux."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
