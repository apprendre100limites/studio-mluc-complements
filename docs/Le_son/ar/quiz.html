<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كويز - صوت</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>Quiz</h1><p class="sous">الصوت</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ما هو الصوت؟", "choix": ["صوت الطبيعة", "إشارة إذاعية", "اليقظة", "جسم ينتج الضوء"], "bonne": 2, "explication": "الصوت هو اهتزازات سريعة جدا قادمة وذهاب الجسيمات"}, {"question": "لماذا لا ينتشر الصوت في الفراغ؟", "choix": ["إنه ضعيف جداً", "لا توجد مادة لإحالة الصوت", "الامواج تمتص من الفضاء", "يستعاض عنه بالضوء"], "bonne": 1, "explication": "في الفراغ الصوت لا ينتشر وهو يحتاج إلى وسيط مادي: الهواء أو الماء أو الصلب."}, {"question": "في أي وسط يسافر الصوت أسرع؟", "choix": ["الهواء", "الفراغ", "المياه", "الصلب"], "bonne": 3, "explication": "الصوت يذهب أسرع في الماء من الهواء وحتى أسرع في الفولاذ"}, {"question": "عند 20 درجة، ما مدى سرعة الصوت في الهواء؟", "choix": ["٠٠٣ متر", "400 m/s", "340 m/ s", "250 متراً"], "bonne": 2, "explication": "في الهواء، بعشرين درجة، يرتفع إلى حوالي ثلاثمائة وأربعون متراً في الثانية."}, {"question": "كم عدد الأمتار التي تدور بين البرق وأذنك عندما تحسب خمس ثواني؟", "choix": ["2000م", "1700 m", "1000 m", "500 متر"], "bonne": 1, "explication": "لقد سافر حوالي سبعمائة متر"}, {"question": "من أي مستوى يمكن أن يتلف التعرض المطول سمعك؟", "choix": ["90 دي بي", "100 دي بي", "80 دي بي", "85 dB"], "bonne": 3, "explication": "من حوالي خمسة وثمانون ديسيبل، التعرض المطوّل يمكن أن يضر بشكل دائم جلسة الاستماع الخاصة بك."}, {"question": "أي صك يقيس مستوى الصوت؟", "choix": ["متر الصوت", "Hygrometer", "مقياس الحرارة", "البارومتر"], "bonne": 0, "explication": "ويقاس المستوى الصوتي بعلامات الديسيبل، بمسدس الصوت."}, {"question": "أيّ محترف يستخدم الموجات فوق الصوتية ليرى داخل الجسم؟", "choix": ["مهندس صوت", "Echographist", "دكتور أورل", "Audioprothetist"], "bonne": 1, "explication": "فنان الموجات فوق الصوتية يستخدم الموجات فوق الصوتية ليرى داخل الجسم"}, {"question": "في أي مجال يستخدم الصوت؟", "choix": ["الصحة والموسيقى والسينما والسلامة في العمل والقارب", "سينما", "الموسيقى", "الصحة"], "bonne": 0, "explication": "وتستخدم هذه المفاهيم في مجالات الصحة، والموسيقى، والسينما، والسلامة في العمل، والسوارق."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
