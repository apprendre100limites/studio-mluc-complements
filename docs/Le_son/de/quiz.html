<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Sound</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Quiz</h1><p class="sous">Sound</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Was ist ein Sound?", "choix": ["Ein Klang der Natur", "Funksignal", "Vibration", "Ein Objekt, das Licht erzeugt"], "bonne": 2, "explication": "Ein Klang ist eine Vibration: ein sehr schnelles Kommen und Gehen der Teilchen der Materie."}, {"question": "Warum breitet sich der Klang nicht im Vakuum aus?", "choix": ["Er ist zu schwach.", "Es gibt kein Material, um den Ton zu übertragen", "Die Wellen werden vom Weltraum absorbiert", "Ersetzt durch Licht"], "bonne": 1, "explication": "In der Leere breitet sich der Klang nicht aus. Es braucht ein materielles Medium: Luft, Wasser oder Feststoff."}, {"question": "In welchem Medium bewegt sich der Sound am schnellsten?", "choix": ["Luft", "Das Vakuum", "Wasser", "Stahl"], "bonne": 3, "explication": "Der Klang geht schneller in Wasser als in Luft, und noch schneller in Stahl."}, {"question": "Wie schnell bewegt sich der Schall bei 20 Grad in der Luft?", "choix": ["300 m/s", "400 m/s", "340 m/s", "250 m/s"], "bonne": 2, "explication": "In der Luft, bei zwanzig Grad, bewegt es sich auf etwa dreihundertvierzig Meter pro Sekunde."}, {"question": "Wie viele Meter läuft das Geräusch zwischen Blitz und Ohr, wenn Sie fünf Sekunden zählen?", "choix": ["2000 m", "1700 m", "1000 m", "500 m"], "bonne": 1, "explication": "Er reiste etwa tausendsiebenhundert Meter."}, {"question": "Ab welchem Schallpegel kann eine längere Exposition Ihr Gehör schädigen?", "choix": ["90 dB", "100 dB", "80 dB", "85 dB"], "bonne": 3, "explication": "Ab etwa 85 Dezibel kann eine längere Exposition Ihr Gehör dauerhaft schädigen."}, {"question": "Welches Instrument misst den Schallpegel?", "choix": ["Schalldämpfer", "Hygrometer", "Thermometer", "Barometer"], "bonne": 0, "explication": "Der Schallpegel wird mit einem Sonometer in Dezibel gemessen."}, {"question": "Welcher Fachmann verwendet Ultraschall, um in den Körper zu sehen?", "choix": ["Tontechniker", "Echographist", "Arzt ORL", "Audioprothetiker"], "bonne": 1, "explication": "Ein Ultraschallkünstler verwendet Ultraschall, um in den Körper zu sehen."}, {"question": "In welchen Bereichen wird Sound verwendet?", "choix": ["Gesundheit, Musik, Kino, Sicherheit am Arbeitsplatz und Bootssonare", "Kino", "Musik", "Gesundheit"], "bonne": 0, "explication": "Diese Konzepte werden in den Bereichen Gesundheit, Musik, Kino, Sicherheit am Arbeitsplatz und Bootssonare eingesetzt."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
