<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory cards — Sound</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Memory cards</h1><p class="sous">Sound</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "What is a sound according to the text?", "r": "A sound is a very fast vibration of the particles of matter."}, {"q": "What is a sound source?", "r": "A sound source is an object that vibrates and produces a sound."}, {"q": "In what medium is the sound spread?", "r": "Sound spreads in a material medium such as air, water or solid."}, {"q": "How fast does sound spread in the air at 20 degrees?", "r": "The sound spreads at about 340 meters per second in the air at 20 degrees."}, {"q": "What is the sound level of a whisper?", "r": "A whisper makes about 30 decibels."}, {"q": "What damage can be sustained from what noise level?", "r": "From about 85 decibels, prolonged exposure can permanently damage the hearing."}, {"q": "What is the use of a sonometer?", "r": "A sonometer measures the noise level in decibels."}, {"q": "What is the effect of volume on noise levels?", "r": "The sound level drops with the distance of the sound emitted."}, {"q": "What are the ways to protect his hearing?", "r": "Elocating speakers, taking regular breaks, limiting the volume of the helmet and using plugs during a concert."}, {"q": "What are the areas where sound knowledge is used?", "r": "These concepts are used in health, music, cinema, safety at work and boat sonars."}, {"q": "Why can't anyone hear you screaming in space?", "r": "Because there is no matter to transmit sound in space."}, {"q": "How to calculate the distance of a thunder?", "r": "Count seconds between lightning and thunder, then divide this number by 3 (about 340 meters per second divided by 100)."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
