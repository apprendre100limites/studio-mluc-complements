<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionário — Som</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Quiz</h1><p class="sous">Som</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "O que é um som?", "choix": ["Um som de natureza", "Um sinal de rádio", "Vibração", "Um objeto que produz luz"], "bonne": 2, "explication": "Um som é uma vibração: uma muito rápida vinda e saída das partículas da matéria."}, {"question": "Porque é que o som não se espalha no vácuo?", "choix": ["Ele é muito fraco.", "Não há material para transmitir o som", "As ondas são absorvidas pelo espaço", "É substituído por luz"], "bonne": 1, "explication": "No vazio, o som não se espalha. Precisa de um meio material: ar, água ou sólido."}, {"question": "Em que meio o som viaja mais rápido?", "choix": ["Ar", "O vácuo", "Água", "Aço"], "bonne": 3, "explication": "O som vai mais rápido na água do que no ar, e ainda mais rápido no aço."}, {"question": "A 20 graus, quão rápido o som avança no ar?", "choix": ["300 m/ s", "400 m/s", "340 m/ s", "250 m/ s"], "bonne": 2, "explication": "No ar, a vinte graus, avança para cerca de trezentos e quarenta metros por segundo."}, {"question": "Quantos metros corre o som entre o raio e a tua orelha quando contas cinco segundos?", "choix": ["2000 m", "1700 m", "1000 m", "500 m"], "bonne": 1, "explication": "Ele viajou cerca de mil setecentos metros."}, {"question": "De que nível sonoro pode a exposição prolongada danificar sua audição?", "choix": ["90 dB", "100 dB", "80 dB", "85 dB"], "bonne": 3, "explication": "De cerca de 85 decibéis, a exposição prolongada pode danificar permanentemente a sua audição."}, {"question": "Que instrumento mede o nível sonoro?", "choix": ["Medidor de som", "Higrómetro", "Termómetro", "Barómetro"], "bonne": 0, "explication": "O nível sonoro é medido em decibéis, com um sonômetro."}, {"question": "Que profissional usa ultra-som para ver dentro do corpo?", "choix": ["Engenheiro de som", "Ecografista", "Doutor ORL", "Protetista de Áudio"], "bonne": 1, "explication": "Um ultra-som usa o ultra-som para ver dentro do corpo."}, {"question": "Em que áreas é usado o som?", "choix": ["Saúde, música, cinema, segurança no trabalho e sonares de barco", "Cinema", "Música", "Saúde"], "bonne": 0, "explication": "Esses conceitos são utilizados em saúde, música, cinema, segurança no trabalho e sonar de barco."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
