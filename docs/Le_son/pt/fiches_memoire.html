<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões de memória — Som</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Cartões de memória</h1><p class="sous">Som</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "O que é um som de acordo com o texto?", "r": "Um som é uma vibração muito rápida das partículas da matéria."}, {"q": "O que é uma fonte de som?", "r": "Uma fonte sonora é um objeto que vibra e produz um som."}, {"q": "Em que meio se espalha o som?", "r": "O som se espalha em um meio material, como ar, água ou sólido."}, {"q": "Quão rápido o som se espalha no ar a 20 graus?", "r": "O som se espalha a cerca de 340 metros por segundo no ar a 20 graus."}, {"q": "Qual é o nível sonoro de um sussurro?", "r": "Um sussurro faz cerca de 30 decibéis."}, {"q": "Que danos podem ser sofridos a partir de que nível de ruído?", "r": "De cerca de 85 decibéis, a exposição prolongada pode danificar permanentemente a audição."}, {"q": "Para que serve um sonômetro?", "r": "Um sonômetro mede o nível de ruído em decibéis."}, {"q": "Qual é o efeito do volume nos níveis de ruído?", "r": "O nível sonoro cai com a distância do som emitido."}, {"q": "Quais são as maneiras de proteger sua audição?", "r": "Elocando alto-falantes, fazendo pausas regulares, limitando o volume do capacete e usando plugues durante um concerto."}, {"q": "Quais são as áreas em que se utiliza o bom conhecimento?", "r": "Esses conceitos são utilizados em saúde, música, cinema, segurança no trabalho e sonar de barco."}, {"q": "Porque é que ninguém te ouve a gritar no espaço?", "r": "Porque não importa transmitir som no espaço."}, {"q": "Como calcular a distância de um trovão?", "r": "Contar segundos entre relâmpago e trovão, em seguida, dividir este número por 3 (cerca de 340 metros por segundo dividido por 100)."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
