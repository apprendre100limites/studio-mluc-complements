<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas de memoria ¿El agua que bebemos es pura?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Tarjetas de memoria</h1><p class="sous">¿El agua que bebemos es pura?</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿El agua en los alimentos contiene agua?", "r": "Sí, casi todo lo que comes o bebes contiene agua."}, {"q": "¿Cómo podemos probar el agua en un tomate?", "r": "Sulfato de cobre anhydrous, que se vuelve azul en contacto con el agua, se puede utilizar."}, {"q": "¿Qué es el agua destilada?", "r": "El agua destilada es el agua más pura obtenida por destilación, que contiene casi nada disuelto."}, {"q": "¿Cuáles son los componentes principales disueltos en agua de mar?", "r": "El agua de mar contiene unos treinta y cinco gramos de sal disuelta por litro."}, {"q": "¿Qué gas está presente en agua brillante?", "r": "El agua chispeante contiene dióxido de carbono, también conocido como dióxido de carbono."}, {"q": "¿Cómo se detecta dióxido de carbono en el agua?", "r": "Se utiliza agua de limón que es nublada y se convierte en blanca y láctea."}, {"q": "¿Qué es PH?", "r": "El pH mide acidez, desde cero hasta diez, con cero para ácido, siete para ácido neutro y más de siete para ácido básico."}, {"q": "¿El agua del grifo es pura?", "r": "No, el agua del grifo es una mezcla de agua, sales y gas disuelto."}, {"q": "¿Cuáles son las herramientas utilizadas para analizar el agua?", "r": "Pruebas como el sulfato de cobre, la evaporación y el agua de limón se utilizan para analizar el agua."}, {"q": "¿Quién revisa la calidad del agua del grifo?", "r": "Técnicos, laboratorios e hidrologistas verifican la calidad del agua del grifo."}, {"q": "¿En qué situación se utiliza el agua destilada?", "r": "El agua destilada se utiliza en el laboratorio o los hierros."}, {"q": "¿Cuál es el propósito de este vídeo?", "r": "Este video explica cómo probar lo que se disuelve en el agua y por qué el agua que bebemos es una mezcla."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
