<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - ¿El agua que bebemos es pura?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Quiz</h1><p class="sous">¿El agua que bebemos es pura?</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Qué color sulfato de cobre anhydrous cuando está en contacto con el agua?", "choix": ["Blanco", "Verde", "Rojo", "Azul"], "bonne": 3, "explication": "Según el texto, en contacto con el agua, se vuelve azul."}, {"question": "¿Cuánto agua hay en un tomate según el texto?", "choix": ["Casi todo", "Menos de la mitad", "Más de nueve décimas", "Alrededor de dos tercios"], "bonne": 2, "explication": ""}, {"question": "¿Cuál es el pH de una solución?", "choix": ["Concentración de oxígeno", "Volumen de sal disuelta", "Temperatura del agua", "Acididad de la solución"], "bonne": 3, "explication": "El pH mide acidez. Entre cero y siete, es ácido, siete neutral, más de siete básicos."}, {"question": "¿Por qué no bebemos agua destilada todos los días?", "choix": ["Está muy buena.", "No es una mezcla.", "Falta minerales", "Es ácido."], "bonne": 2, "explication": "El agua destilada no contiene casi nada disuelto, por lo que carece de minerales para beber todos los días."}, {"question": "¿Qué líquido puede detectar dióxido de carbono en agua gaseosa?", "choix": ["Agua mineral", "Agua mineral", "Seawater", "Agua destilada"], "bonne": 1, "explication": "El agua de limón se usa para detectar el dióxido de carbono; Ella está molesta cuando pasas ese gas."}, {"question": "¿Cuál es el principio de encontrar lo que fue disuelto en el agua?", "choix": ["Calienta el agua para vaporizar y mantener las sales", "Añadir polvo blanco", "Calienta el agua para que se vuelva azul", "Medida pH"], "bonne": 0, "explication": "El principio es calentar: el agua sale en vapor, y las sales permanecen en su lugar como un depósito."}, {"question": "¿Qué significa el término \"residuos secos\" en una etiqueta de bebida suave?", "choix": ["Residuos de azúcar", "Lo que queda cuando todo el agua se ha evaporado", "Residuo de calcio", "El residuo gaseoso"], "bonne": 1, "explication": "La etiqueta también indica el residuo seco, que es lo que queda cuando todo el agua se ha evaporado."}, {"question": "¿Por qué los peces necesitan oxígeno disuelto en el agua?", "choix": ["Para recuperar la sal", "Para beber agua", "Para quemar en agua", "Para respirar"], "bonne": 3, "explication": "El texto indica que el pescado respira."}, {"question": "¿Es el agua mineral un cuerpo puro?", "choix": ["Sí, porque tiene un pH a las siete.", "No, porque es una mezcla de agua, sales minerales y gas disuelto.", "No, porque es gaseoso.", "Sí, porque está clara."], "bonne": 1, "explication": "El texto concluye que es una mezcla de agua, sales minerales y gas disuelto."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
