<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherkarten — Ist das Wasser, das wir trinken, rein?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Speicherkarten</h1><p class="sous">Ist das Wasser, das wir trinken, rein?</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Enthält Wasser in Lebensmitteln Wasser?", "r": "Ja, fast alles, was Sie essen oder trinken, enthält Wasser."}, {"q": "Wie können wir Wasser in einer Tomate nachweisen?", "r": "Es kann wasserfreies Kupfersulfat verwendet werden, das im Kontakt mit Wasser blau wird."}, {"q": "Was ist destilliertes Wasser?", "r": "Destilliertes Wasser ist das reinste durch Destillation gewonnene Wasser, das fast nichts gelöst enthält."}, {"q": "Was sind die Hauptkomponenten, die im Meerwasser gelöst sind?", "r": "Meerwasser enthält etwa 35 Gramm gelöstes Salz pro Liter."}, {"q": "Welches Gas ist in Mineralwasser vorhanden?", "r": "Schaumwasser enthält Kohlendioxid, auch bekannt als Kohlendioxid."}, {"q": "Wie wird Kohlendioxid im Wasser nachgewiesen?", "r": "Kalkwasser wird verwendet, das trüb ist und weiß und milchig wird."}, {"q": "Was ist pH?", "r": "Der pH-Wert misst den Säuregehalt von null bis zehn, mit Null für Säure, sieben für neutrale Säure und mehr als sieben für basische Säure."}, {"q": "Ist das Leitungswasser rein?", "r": "Nein, Leitungswasser ist eine Mischung aus Wasser, Salzen und gelöstem Gas."}, {"q": "Welche Werkzeuge werden verwendet, um Wasser zu analysieren?", "r": "Tests wie Kupfersulfat, Verdunstung und Kalkwasser werden verwendet, um Wasser zu analysieren."}, {"q": "Wer kontrolliert die Qualität des Leitungswassers?", "r": "Techniker, Labore und Hydrologen überprüfen die Qualität von Leitungswasser."}, {"q": "In welcher Situation wird destilliertes Wasser verwendet?", "r": "Destilliertes Wasser wird im Labor oder Eisen verwendet."}, {"q": "Was ist der Zweck dieses Videos?", "r": "Dieses Video erklärt, wie man beweist, was in Wasser gelöst ist und warum das Wasser, das wir trinken, eine Mischung ist."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
