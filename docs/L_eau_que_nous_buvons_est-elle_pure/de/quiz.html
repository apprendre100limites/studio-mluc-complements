<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Ist das Wasser, das wir trinken, rein?</title><style>

</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Quiz</h1><p class="sous">Ist das Wasser, das wir trinken, rein?</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Welche Farbe hat wasserfreies Kupfersulfat im Kontakt mit Wasser?", "choix": ["Weiß", "Grün", "rot", "Blau"], "bonne": 3, "explication": "Laut dem Text wird es im Kontakt mit Wasser blau."}, {"question": "Wie viel Wasser ist laut Text in einer Tomate?", "choix": ["Fast alles", "Weniger als die Hälfte", "Mehr als neun Zehntel", "Etwa zwei Drittel"], "bonne": 2, "explication": ""}, {"question": "Was ist der pH-Wert einer Lösung?", "choix": ["Sauerstoffkonzentration", "Volumen gelöstes Salz", "Wassertemperatur", "Säuregehalt der Lösung"], "bonne": 3, "explication": "Der pH-Wert misst die Säure. Zwischen null und sieben ist es sauer, sieben neutral, über sieben Grundlagen."}, {"question": "Warum trinken wir nicht jeden Tag destilliertes Wasser?", "choix": ["Sie ist zu heiß.", "Sie ist kein Mix", "Es fehlen Mineralien", "Sie ist sauer."], "bonne": 2, "explication": "Destilliertes Wasser enthält fast nichts gelöstes, daher fehlen täglich Mineralien zum Trinken."}, {"question": "Welche Flüssigkeit kann Kohlendioxid in gasförmigem Wasser nachweisen?", "choix": ["Mineralwasser", "Kalkwasser", "Meerwasser", "Destilliertes Wasser"], "bonne": 1, "explication": "Kalkwasser wird verwendet, um Kohlendioxid zu erkennen; Sie ist beunruhigt, wenn Sie dieses Gas passieren."}, {"question": "Was ist das Prinzip zu finden, was in Wasser gelöst wurde?", "choix": ["Erhitzen Sie das Wasser zu verdampfen und halten Sie die Salze", "Weißes Pulver hinzufügen", "Erhitzen Sie das Wasser, damit es blau wird", "pH-Messung"], "bonne": 0, "explication": "Das Prinzip ist zu erhitzen: Das Wasser verlässt in Dampf, und die Salze bleiben an Ort und Stelle als Ablagerung."}, {"question": "Was bedeutet der Begriff \"trockener Rückstand\" auf einem Softdrink-Etikett?", "choix": ["Zuckerrückstand", "Was bleibt, wenn das ganze Wasser verdunstet ist", "Calciumrückstand", "Der gasförmige Rückstand"], "bonne": 1, "explication": "Das Etikett zeigt auch den trockenen Rückstand an, der verbleibt, wenn das gesamte Wasser verdampft ist."}, {"question": "Warum brauchen Fische Sauerstoff, der im Wasser gelöst ist?", "choix": ["Um das Salz zurückzugewinnen", "Wasser trinken", "Verbrennen in Wasser", "Atmen"], "bonne": 3, "explication": "Der Text zeigt an, dass Fische atmen."}, {"question": "Ist Mineralwasser ein reiner Körper?", "choix": ["Ja, weil es einen pH-Wert von sieben hat.", "Nein, weil es eine Mischung aus Wasser, Mineralsalzen und gelöstem Gas ist.", "Nein, weil es gasförmig ist.", "Ja, weil sie klar ist."], "bonne": 1, "explication": "Der Text kommt zu dem Schluss, dass es sich um eine Mischung aus Wasser, Mineralsalzen und gelöstem Gas handelt."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
