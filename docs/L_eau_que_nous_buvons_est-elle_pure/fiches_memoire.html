<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — L&#x27;eau que nous buvons est-elle pure ?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Fiches mémoire</h1><p class="sous">L&#x27;eau que nous buvons est-elle pure ?</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "L'eau dans les aliments contient-elle de l'eau ?", "r": "Oui, presque tout ce qu'on mange ou boit contient de l'eau."}, {"q": "Comment peut-on prouver l'eau dans une tomate ?", "r": "On peut utiliser le sulfate de cuivre anhydre qui devient bleue au contact de l'eau."}, {"q": "Qu'est-ce que l'eau distillée ?", "r": "L'eau distillée est l'eau la plus pure, obtenue par distillation, qui ne contient presque rien de dissous."}, {"q": "Quels sont les principaux éléments dissous dans l'eau de mer ?", "r": "L'eau de mer contient environ trente-cinq grammes de sel dissout par litre."}, {"q": "Quel gaz est présent dans l'eau pétillante ?", "r": "L'eau pétillante contient du dioxyde de carbone, aussi appelé gaz carbonique."}, {"q": "Comment détecte-t-on le dioxyde de carbone dans l'eau ?", "r": "On utilise l'eau de chaux qui se trouble et devient blanche et laiteuse."}, {"q": "Qu'est-ce que le pH ?", "r": "Le pH mesure l'acidité, allant de zéro à dix, avec zéro pour l'acide, sept pour l'acide neutre et plus de sept pour le basique."}, {"q": "L'eau du robinet est-elle pure ?", "r": "Non, l'eau du robinet est un mélange d'eau, de sels et de gaz dissous."}, {"q": "Quels sont les outils utilisés pour analyser l'eau ?", "r": "Des tests comme le sulfate de cuivre, l'évaporation et l'eau de chaux sont utilisés pour analyser l'eau."}, {"q": "Qui vérifie la qualité de l'eau du robinet ?", "r": "Des techniciens, des laborantins et des hydrologues vérifient la qualité de l'eau du robinet."}, {"q": "Dans quelle situation l'eau distillée est-elle utilisée ?", "r": "L'eau distillée est utilisée au laboratoire ou dans les fers à repasser."}, {"q": "Quel est l'objet de cette vidéo ?", "r": "Cette vidéo explique comment prouver ce qui est dissous dans l'eau et pourquoi l'eau que nous buvons est un mélange."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
