<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطاقات الذاكرة هل الماء نقي؟</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>بطاقات الذاكرة</h1><p class="sous">هل الماء نقي؟</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "هل الماء في الطعام يحتوي على الماء؟", "r": "نعم، تقريبا كل شيء تأكله أو تشربه يحتوي على الماء"}, {"q": "كيف يمكننا إثبات الماء في طماطم؟", "r": "ويمكن استخدام الكبريتات النحاسية التي تصبح زرقاء على اتصال بالماء."}, {"q": "ما هو الماء المختل؟", "r": "المياه المزروعة هي المياه النقية التي يتم الحصول عليها عن طريق التحلل، والتي لا تحتوي على ما يكاد يكون من حل."}, {"q": "ما هي المكونات الرئيسية التي حلت في مياه البحر؟", "r": "وتحتوي مياه البحر على حوالي خمسة وثلاثين غراما من الملح المذوب للتر الواحد."}, {"q": "ما الغاز الموجود في الماء المشتعل؟", "r": "ويحتوي الماء السائل على ثاني أكسيد الكربون، المعروف أيضا بثاني أكسيد الكربون."}, {"q": "كيف يتم اكتشاف ثاني أكسيد الكربون في الماء؟", "r": "ماء الليم يُستخدم في الغيوم ويصبح أبيض وحليب"}, {"q": "ما هو PH؟", "r": "The pH measures acidity, ranging from zero to ten, with zero for acid, seven for neutral acid and more than seven for basic acid."}, {"q": "هل الماء النقي؟", "r": "لا، مياه الصنبور خليط من الماء والملح والغاز المذوب"}, {"q": "ما هي الأدوات المستخدمة لتحليل المياه؟", "r": "وتستخدم اختبارات مثل كبريت النحاس والتبخر ومياه الليمون لتحليل المياه."}, {"q": "من يفحص نوعية مياه الصنبور؟", "r": "التقنيون والمختبرات والهيدرولوجيون يفحصون نوعية مياه الصنبور"}, {"q": "ما هي الحالة التي تستخدم فيها المياه المختلة؟", "r": "وتستخدم المياه المزروعة في المختبر أو الحديد."}, {"q": "ما الغرض من هذا الفيديو؟", "r": "هذا الفيديو يفسر كيفية إثبات ما حل في الماء ولماذا الماء الذي نشربه خليط"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
