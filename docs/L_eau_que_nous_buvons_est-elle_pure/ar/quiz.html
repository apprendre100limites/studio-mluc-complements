<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كروز - هل الماء نقي؟</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>Quiz</h1><p class="sous">هل الماء نقي؟</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ما لون الكبريت الكبريتي للنحاس عندما يتصل بالماء؟", "choix": ["أبيض", "الأخضر", "أحمر", "الأزرق"], "bonne": 3, "explication": "وفقاً للنص، على اتصال بالماء، يصبح أزرق."}, {"question": "كم من الماء في طماطم وفقاً للنص؟", "choix": ["كل شيء تقريبا", "أقل من نصف", "أكثر من تسع عرائس", "حوالي الثلثين"], "bonne": 2, "explication": ""}, {"question": "ماهو الحل؟", "choix": ["تركيز الأوكسجين", "حجم الملح المذوب", "درجة حرارة المياه", "تحية الحل"], "bonne": 3, "explication": "ضغط الدم يقيس الحموضة بين صفر وسبعة، هو حمض، سبعة محايد، أكثر من سبعة أساسيات."}, {"question": "لماذا لا نشرب الماء المزيل كل يوم؟", "choix": ["إنها مثيرة جداً", "إنها ليست خليط", "إنها تفتقر للمعادن", "إنها حمضية"], "bonne": 2, "explication": "المياه المزروعة تحتوي على تقريباً لا شيء مُحلل، لذا فهي تفتقر للمعادن لتشرب كل يوم."}, {"question": "أي سائل يمكن أن يكشف ثاني أكسيد الكربون في الماء الغازي؟", "choix": ["المياه المعدنية", "مياه ليلية", "مياه البحر", "المياه المزروعة"], "bonne": 1, "explication": "ماء اللوم يستخدم لكشف ثاني أكسيد الكربون إنها مضطربة عندما تمرر الغاز"}, {"question": "ما هو مبدأ إيجاد ما حل في الماء؟", "choix": ["تسخين الماء لتبخر وتبقي الملح", "إضافة مسحوق أبيض", "حرك الماء حتى يصبح أزرق", "Measure pH"], "bonne": 0, "explication": "والمبدأ هو الحرارة: تترك المياه في البخار، وتظل الأملاح موجودة كودائع."}, {"question": "ماذا يعني مصطلح \"بقايا الدراي\" على بطاقة شراب ناعمة؟", "choix": ["بقايا السكر", "ما تبقى عندما تتبخر المياه", "بقايا كالسيوم", "بقايا الغاز"], "bonne": 1, "explication": "وتشير البطاقة أيضاً إلى وجود بقايا جافة، وهو ما يبقى عندما تتبخر المياه كلها."}, {"question": "لماذا السمك يحتاج إلى أكسجين مذوب في الماء؟", "choix": ["لاستعادة الملح", "لشرب الماء", "لحرق الماء", "للتنفس"], "bonne": 3, "explication": "النص يشير إلى أن الأسماك تتنفس"}, {"question": "هل الماء المعدني جسم نقي؟", "choix": ["أجل، لأنّه يحتوي على رشاش في السابعة.", "لا، لأنه خليط من الماء، وأملاح معدنية وغاز معزول.", "لا، لأنه غازي", "نعم، لأنها واضحة."], "bonne": 1, "explication": "ويخلص النص إلى أنه خليط من المياه وأملاح المعادن والغاز المذاب."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
