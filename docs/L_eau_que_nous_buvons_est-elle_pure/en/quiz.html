<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Is the water we drink pure?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}

</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Quiz</h1><p class="sous">Is the water we drink pure?</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What color does anhydrous copper sulphate colour when in contact with water?", "choix": ["White", "Green", "Red", "Blue"], "bonne": 3, "explication": "According to the text, in contact with water, it becomes blue."}, {"question": "How much water is in a tomato according to the text?", "choix": ["Almost everything", "Less than half", "More than nine tenths", "About two-thirds"], "bonne": 2, "explication": ""}, {"question": "What is the pH of a solution?", "choix": ["Oxygen concentration", "Volume of dissolved salt", "Water temperature", "Acidity of the solution"], "bonne": 3, "explication": "The pH measures acidity. Between zero and seven, it's acidic, seven neutral, over seven basics."}, {"question": "Why don't we drink distilled water every day?", "choix": ["She's too hot.", "She's not a mix", "It lacks minerals", "She's acidic."], "bonne": 2, "explication": "Distilled water contains almost nothing dissolved, so it lacks minerals to drink every day."}, {"question": "What liquid can detect carbon dioxide in gaseous water?", "choix": ["Mineral water", "Lime water", "Seawater", "Distilled water"], "bonne": 1, "explication": "Lime water is used to detect carbon dioxide; She's troubled when you pass that gas."}, {"question": "What is the principle of finding what was dissolved in water?", "choix": ["Heat the water to vapor and keep the salts", "Add white powder", "Heat the water so it becomes blue", "Measure pH"], "bonne": 0, "explication": "The principle is to heat: the water leaves in steam, and the salts remain in place as a deposit."}, {"question": "What does the term 'dry residue' mean on a soft drink label?", "choix": ["Sugar residue", "What's left when all the water has evaporated", "Calcium residue", "The gaseous residue"], "bonne": 1, "explication": "The label also indicates the dry residue, which is what remains when all the water has evaporated."}, {"question": "Why do fish need oxygen dissolved in water?", "choix": ["To recover the salt", "To drink water", "To burn in water", "To breathe"], "bonne": 3, "explication": "The text indicates that fish breathe."}, {"question": "Is mineral water a pure body?", "choix": ["Yes, because it has a pH at seven.", "No, because it's a mixture of water, mineral salts and dissolved gas.", "No, because it's gaseous.", "Yes, because she's clear."], "bonne": 1, "explication": "The text concludes that it is a mixture of water, mineral salts and dissolved gas."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
