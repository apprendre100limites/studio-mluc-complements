<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory cards — Is the water we drink pure?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Memory cards</h1><p class="sous">Is the water we drink pure?</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "Does water in food contain water?", "r": "Yes, almost everything you eat or drink contains water."}, {"q": "How can we prove water in a tomato?", "r": "Anhydrous copper sulphate, which becomes blue in contact with water, can be used."}, {"q": "What is distilled water?", "r": "Distilled water is the purest water obtained by distillation, which contains almost nothing dissolved."}, {"q": "What are the main components dissolved in seawater?", "r": "Seawater contains about thirty-five grams of dissolved salt per litre."}, {"q": "What gas is present in sparkling water?", "r": "Sparkling water contains carbon dioxide, also known as carbon dioxide."}, {"q": "How is carbon dioxide detected in water?", "r": "Lime water is used that is cloudy and becomes white and milky."}, {"q": "What is pH?", "r": "The pH measures acidity, ranging from zero to ten, with zero for acid, seven for neutral acid and more than seven for basic acid."}, {"q": "Is the tap water pure?", "r": "No, tap water is a mixture of water, salts and dissolved gas."}, {"q": "What are the tools used to analyze water?", "r": "Tests such as copper sulphate, evaporation and lime water are used to analyze water."}, {"q": "Who checks the quality of tap water?", "r": "Technicians, labs and hydrologists check the quality of tap water."}, {"q": "In what situation is distilled water used?", "r": "Distilled water is used in the laboratory or irons."}, {"q": "What is the purpose of this video?", "r": "This video explains how to prove what is dissolved in water and why the water we drink is a mixture."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
