<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी — क्या हम शुद्ध पानी पीते हैं?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>प्रश्नोत्तरी</h1><p class="sous">क्या हम शुद्ध पानी पीते हैं?</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "पानी के संपर्क में आने पर क्या रंग निर्जल तांबा सल्फेट रंग होता है?", "choix": ["सफेद", "ग्रीन", "लाल", "नीला"], "bonne": 3, "explication": "पाठ के अनुसार, पानी के संपर्क में, यह नीला हो जाता है।"}, {"question": "पाठ के अनुसार टमाटर में कितना पानी होता है?", "choix": ["लगभग सब कुछ", "आधे से कम", "नौ दसवीं से अधिक", "दो तिहाई"], "bonne": 2, "explication": ""}, {"question": "एक समाधान का पीएच क्या है?", "choix": ["ऑक्सीजन एकाग्रता", "भंग नमक की मात्रा", "जल तापमान", "समाधान की अम्लता"], "bonne": 3, "explication": "पीएच अम्लता को मापता है। शून्य और सात के बीच, यह अम्लीय, सात तटस्थ, सात मूल बातें हैं।"}, {"question": "क्यों हम हर दिन आसवनी पानी पीते हैं?", "choix": ["वह बहुत गर्म है।", "वह मिश्रण नहीं है", "इसमें खनिजों की कमी है", "वह अम्लीय है।"], "bonne": 2, "explication": "डिस्टिल्ड वॉटर में लगभग कुछ भंग नहीं होता है, इसलिए यह हर दिन पीने के लिए खनिजों की कमी है।"}, {"question": "क्या तरल गैसीय पानी में कार्बन डाइऑक्साइड का पता लगा सकता है?", "choix": ["खनिज पानी", "नींबू पानी", "समुद्री जल", "आसवनी पानी"], "bonne": 1, "explication": "कार्बन डाइऑक्साइड का पता लगाने के लिए लाइम पानी का उपयोग किया जाता है; जब आप उस गैस को पास करते हैं तो वह परेशान होती है।"}, {"question": "पानी में क्या भंग किया गया?", "choix": ["पानी को वाष्प के लिए गर्म करें और नमक रखें", "सफेद पाउडर जोड़ें", "पानी को गर्म करें ताकि यह नीला हो जाए", "PH"], "bonne": 0, "explication": "सिद्धांत गर्मी के लिए है: पानी भाप में छोड़ देता है, और नमक एक जमा के रूप में जगह में रहते हैं।"}, {"question": "एक सॉफ्ट ड्रिंक लेबल पर 'सूखी अवशेष' शब्द का क्या मतलब है?", "choix": ["चीनी अवशेष", "क्या है जब सभी पानी वाष्पित हो गया है", "कैल्शियम अवशेष", "गैसीय अवशेष"], "bonne": 1, "explication": "लेबल सूखे अवशेषों को भी इंगित करता है, जो तब बनी रहती है जब सभी पानी वाष्पित हो जाता है।"}, {"question": "क्यों मछली को पानी में भंग कर सकते हैं?", "choix": ["नमक को ठीक करने के लिए", "पानी पीने के लिए", "पानी में जलाने के लिए", "सांस लेने के लिए"], "bonne": 3, "explication": "पाठ इंगित करता है कि मछली सांस लेती है।"}, {"question": "क्या खनिज पानी शुद्ध शरीर है?", "choix": ["हाँ, क्योंकि यह सात पर एक pH है।", "नहीं, क्योंकि यह पानी, खनिज लवण और भंग गैस का मिश्रण है।", "नहीं, क्योंकि यह गैसीय है।", "हाँ, क्योंकि वह स्पष्ट है।"], "bonne": 1, "explication": "पाठ यह निष्कर्ष निकाला है कि यह पानी, खनिज लवण और भंग गैस का मिश्रण है।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
