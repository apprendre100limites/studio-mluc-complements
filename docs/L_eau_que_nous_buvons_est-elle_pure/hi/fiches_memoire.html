<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी कार्ड — क्या हम शुद्ध पानी पीते हैं?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>मेमोरी कार्ड</h1><p class="sous">क्या हम शुद्ध पानी पीते हैं?</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "क्या भोजन में पानी पानी होता है?", "r": "हाँ, लगभग सब कुछ आप खाने या पीने में पानी होता है।"}, {"q": "हम कैसे एक टमाटर में पानी साबित कर सकते हैं?", "r": "निर्जल तांबा सल्फेट, जो पानी के संपर्क में नीला हो जाता है, का उपयोग किया जा सकता है।"}, {"q": "आसुत जल क्या है?", "r": "डिस्टिल्ड वॉटर आसवन द्वारा प्राप्त शुद्धतम पानी है, जिसमें लगभग कुछ भंग नहीं होता है।"}, {"q": "समुद्री जल में भंग मुख्य घटक क्या हैं?", "r": "समुद्री जल में प्रति लीटर लगभग तीस ग्राम भंग नमक होता है।"}, {"q": "क्या गैस स्पार्कलिंग पानी में मौजूद है?", "r": "स्पार्कलिंग पानी में कार्बन डाइऑक्साइड भी शामिल है जिसे कार्बन डाइऑक्साइड भी कहा जाता है।"}, {"q": "पानी में कार्बन डाइऑक्साइड का पता कैसे लगाया जाता है?", "r": "लाइम पानी का उपयोग किया जाता है जो बादल है और सफेद और दूधिया हो जाता है।"}, {"q": "PH क्या है?", "r": "पीएच मापता है अम्लता, शून्य से दस तक, एसिड के लिए शून्य, तटस्थ अम्ल के लिए सात से अधिक और बुनियादी अम्ल के लिए सात से अधिक।"}, {"q": "क्या नल का पानी शुद्ध है?", "r": "नहीं, नल का पानी पानी, नमक और भंग गैस का मिश्रण है।"}, {"q": "क्या उपकरण पानी का विश्लेषण करने के लिए इस्तेमाल कर रहे हैं?", "r": "तांबा सल्फेट, वाष्पीकरण और चूना पानी जैसे टेस्ट का उपयोग पानी का विश्लेषण करने के लिए किया जाता है।"}, {"q": "कौन नल के पानी की गुणवत्ता की जांच करता है?", "r": "तकनीशियनों, प्रयोगशालाओं और हाइड्रोलॉजिस्ट नल के पानी की गुणवत्ता की जांच करते हैं।"}, {"q": "किस स्थिति में पानी का उपयोग किया जाता है?", "r": "डिस्टिल्ड वॉटर का उपयोग प्रयोगशाला या लोहे में किया जाता है।"}, {"q": "इस वीडियो का उद्देश्य क्या है?", "r": "यह वीडियो बताता है कि पानी में क्या भंग हो जाता है और हम किस पानी को पीते हैं, उसका मिश्रण क्यों है।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
