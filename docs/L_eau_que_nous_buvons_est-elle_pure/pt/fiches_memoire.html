<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões de memória — A água que bebemos é pura?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Cartões de memória</h1><p class="sous">A água que bebemos é pura?</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "A água nos alimentos contém água?", "r": "Sim, quase tudo o que você come ou bebe contém água."}, {"q": "Como podemos provar água num tomate?", "r": "Pode ser utilizado sulfato de cobre anidro, que se torna azul em contacto com água."}, {"q": "O que é água destilada?", "r": "Água destilada é a água mais pura obtida por destilação, que não contém quase nada dissolvido."}, {"q": "Quais são os principais componentes dissolvidos na água do mar?", "r": "Água do mar contém cerca de 35 gramas de sal dissolvido por litro."}, {"q": "Que gás está presente na água com gás?", "r": "A água cintilante contém dióxido de carbono, também conhecido como dióxido de carbono."}, {"q": "Como o dióxido de carbono é detectado na água?", "r": "Água de cal é usada que está turva e torna-se branca e leitosa."}, {"q": "O que é pH?", "r": "O pH mede acidez, variando de zero a dez, com zero para ácido, sete para ácido neutro e mais de sete para ácido básico."}, {"q": "A água da torneira é pura?", "r": "Não, a água da torneira é uma mistura de água, sais e gás dissolvido."}, {"q": "Quais são as ferramentas utilizadas para analisar a água?", "r": "Testes como sulfato de cobre, evaporação e água de cal são usados para analisar a água."}, {"q": "Quem verifica a qualidade da água da torneira?", "r": "Técnicos, laboratórios e hidrologistas verificam a qualidade da água da torneira."}, {"q": "Em que situação é utilizada água destilada?", "r": "Água destilada é utilizada em laboratório ou ferros."}, {"q": "Qual é o propósito deste vídeo?", "r": "Este vídeo explica como provar o que é dissolvido em água e porque a água que bebemos é uma mistura."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
