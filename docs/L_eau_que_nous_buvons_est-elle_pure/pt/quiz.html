<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — A água que bebemos é pura?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Quiz</h1><p class="sous">A água que bebemos é pura?</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Qual a cor do sulfato de cobre anidro quando em contacto com a água?", "choix": ["Branco", "Verde", "Vermelho", "Azul"], "bonne": 3, "explication": "De acordo com o texto, em contato com água, torna-se azul."}, {"question": "Quanta água está num tomate de acordo com o texto?", "choix": ["Quase tudo.", "Menos de metade", "Mais de nove décimos", "Cerca de dois terços"], "bonne": 2, "explication": ""}, {"question": "Qual é o pH de uma solução?", "choix": ["Concentração de oxigénio", "Volume de sal dissolvido", "Temperatura da água", "Acidez da solução"], "bonne": 3, "explication": "O pH mede a acidez. Entre zero e sete, é ácido, sete neutro, sobre sete básicos."}, {"question": "Porque não bebemos água destilada todos os dias?", "choix": ["Ela é muito boa.", "Ela não é uma mistura.", "Faltam-lhe minerais", "Ela é ácida."], "bonne": 2, "explication": "A água destilada não contém quase nada dissolvido, por isso não tem minerais para beber todos os dias."}, {"question": "Que líquido pode detectar dióxido de carbono na água gasosa?", "choix": ["Água mineral", "Água de cal", "Água do mar", "Água destilada"], "bonne": 1, "explication": "A água de cal é usada para detectar dióxido de carbono; ela fica perturbada quando se passa o gás."}, {"question": "Qual é o princípio de encontrar o que foi dissolvido na água?", "choix": ["Aqueça a água para vapor e mantenha os sais", "Adicionar pó branco", "Aqueça a água para que fique azul", "Medir o pH"], "bonne": 0, "explication": "O princípio é aquecer: a água deixa no vapor, e os sais permanecem no lugar como depósito."}, {"question": "O que significa o termo \"resíduo seco\" num rótulo de refrigerantes?", "choix": ["Resíduos de açúcar", "O que resta quando toda a água evapora", "Resíduo de cálcio", "O resíduo gasoso"], "bonne": 1, "explication": "O rótulo também indica o resíduo seco, que é o que permanece quando toda a água evapora."}, {"question": "Por que os peixes precisam de oxigênio dissolvido na água?", "choix": ["Para recuperar o sal", "Beber água", "Queimar na água", "Para respirar"], "bonne": 3, "explication": "O texto indica que os peixes respiram."}, {"question": "A água mineral é um corpo puro?", "choix": ["Sim, porque tem pH a sete.", "Não, porque é uma mistura de água, sais minerais e gás dissolvido.", "Não, porque é gasoso.", "Sim, porque ela está livre."], "bonne": 1, "explication": "O texto conclui que é uma mistura de água, sais minerais e gás dissolvido."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
