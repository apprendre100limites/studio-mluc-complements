<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Volume et masse : mesurer la matière</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}

h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}

a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Quiz</h1><p class="sous">Volume et masse : mesurer la matière</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Quelle unité est utilisée dans le système international pour mesurer le volume ?", "choix": ["C) litre", "D) gramme", "B) mètre cube", "A) kilogramme"], "bonne": 2, "explication": "Le volume se mesure en mètres cubes dans le système international."}, {"question": "Comment détermine-t-on le volume d'un caillou en utilisant une éprouvette graduée ?", "choix": ["B) On lit la graduation au-dessous du niveau du liquide", "A) On lit la graduation au-dessus du niveau du liquide", "C) On lit la graduation juste avant de plonger le caillou", "D) On lit la différence entre le volume avant et après le plongement du caillou"], "bonne": 3, "explication": "Le volume du caillou est la différence entre le volume d'eau avant et après son plongement."}, {"question": "Quelle est la masse d'un litre d'eau ?", "choix": ["B) 100 grammes", "A) 1000 grammes", "D) 1 gramme", "C) 10 grammes"], "bonne": 1, "explication": "Un litre d'eau a une masse d'un kilogramme, donc 1000 grammes."}, {"question": "Quel est le volume d'un litre d'eau en millilitres ?", "choix": ["D) 10000 millilitres", "B) 100 millilitres", "C) 1000 millilitres", "A) 10 millilitres"], "bonne": 2, "explication": "Un litre est égal à mille millilitres."}, {"question": "Quelle substance a une masse volumique différente de l'eau ?", "choix": ["B) Huile", "A) Plumes", "C) Caillou", "D) Eau"], "bonne": 0, "explication": "L'huile a une masse volumique différente de celle de l'eau."}, {"question": "Quelle est la masse d'un millilitre d'eau ?", "choix": ["D) 100 grammes", "B) 1 gramme", "A) 0,1 gramme", "C) 10 grammes"], "bonne": 1, "explication": "Un millilitre d'eau pèse un gramme."}, {"question": "Pourquoi l'huile flotte sur l'eau ?", "choix": ["C) Parce qu'elle a une masse volumique plus grande", "B) Parce qu'elle est plus légère", "D) Parce qu'elle a une masse volumique plus petite", "A) Parce qu'elle est plus lourde"], "bonne": 2, "explication": "L'huile flotte sur l'eau car elle a une masse volumique plus petite."}, {"question": "Quelle est la masse d'un litre d'eau en grammes ?", "choix": ["B) 1000 grammes", "D) 1020 grammes", "A) 920 grammes", "C) 980 grammes"], "bonne": 0, "explication": "Un litre d'eau a une masse d'un kilogramme, donc 1000 grammes."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
