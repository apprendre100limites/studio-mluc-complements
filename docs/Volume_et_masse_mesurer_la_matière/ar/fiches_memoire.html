<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheets Memory Sheets — Volume and Mass: Measuring Matter</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>بطاقات الذاكرة</h1><p class="sous">الحجم والكتلة: قياس المسألة</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "ما هو الحجم؟", "r": "(فولومي) هو المكان الذي يتطلبه الأمر"}, {"q": "كيف يمكن قياس حجم السائل مع قطعة اختبار؟", "r": "وضعت قطعة الاختبار على طاولة مسطحة، العين توضع على السائل وتقرأ التخرج في أسفل المنحنى الذي شكله السائل."}, {"q": "كيف تحدد حجم الصخرة؟", "r": "ملاحظة حجم المياه وحدها، الغوص الصخرة ثم ملاحظة الحجم الجديد. حجم الصخرة هو الفرق بين المجلدين"}, {"q": "ما هي ولايات الأمور الثلاث المذكورة في الفيديو؟", "r": "ولايات الأمور الثلاث صلبة وسائلة وغازية"}, {"q": "لماذا لا يزن الزيت كيلوغراما للتر؟", "r": "لأن الزيت لديه كثافة مختلفة من الماء يزن حوالي تسعمائة وعشرون غراماً للتر الواحد"}, {"q": "ما هو الكثافة؟", "r": "الكثافة هي النسبة بين الكتلة وحجم المادة"}, {"q": "كيف يقاس الحجم في النظام الدولي؟", "r": "ويقاس الحجم بالمترات المكعبة أو باللتر."}, {"q": "ما فائدة قياس حجم السائل مع قطعة اختبار متخرجة؟", "r": "وهذا يجعل من الممكن قياس حجم السائل بدقة دون أن يصبه."}, {"q": "لماذا من المهم موازنة سائل مع توازن مريض؟", "r": "لزن السائل فقط وليس الحاوية"}, {"q": "ما هي الحالات التي ذكرت في الفيديو؟", "r": "ولايات المواد الصلبة والسائلة والغاز."}, {"q": "كيف يمكن تحديد كتلة السائل مع التوازن؟", "r": "أولاً ضع الحاوية الفارغة على الميزان، اضغط على \"التار\" لإعادة العرض إلى الصفر، ثم صب السائل والتوازن يشير إلى كتلته."}, {"q": "ما هو كتلة 500 ميليتري من الماء؟", "r": "كتلة 500 ملليتري من الماء 500 غرام"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
