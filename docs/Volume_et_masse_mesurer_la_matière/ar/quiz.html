<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Volume and Mass: Measuring Matter</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}

h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}

a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>Quiz</h1><p class="sous">الحجم والكتلة: قياس المسألة</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ما هي الوحدة المستخدمة في النظام الدولي لقياس الحجم؟", "choix": ["جيم - الأدب", "D) gram", "B) cubic metre", "ألف - كيلوغرام"], "bonne": 2, "explication": "ويقاس هذا الحجم بمسافات مكعبة في النظام الدولي."}, {"question": "كيف يحدد المرء حجم الصخرة باستخدام قطعة اختبار متخرجة؟", "choix": ["B) Graduation below the liquid level is read", "A) Graduation above liquid level is read", "C) Read the graduation just before diving the rock", "D) The difference between the volume before and after the rock dive is read"], "bonne": 3, "explication": "حجم الصخرة هو الفرق بين حجم الماء قبل الغوص وبعده"}, {"question": "ما هو كتلة من لتر من الماء؟", "choix": ["باء - 100 غرام", "ألف - 000 1 غرام", "دال - غرام واحد", "جيم - 10 غرامات"], "bonne": 1, "explication": "لتر من الماء يحتوي على كتلة كيلوغرام واحد لذا 1000 غرام"}, {"question": "ما هو حجم لتر من الماء في المطاحن؟", "choix": ["D) 10,000 millilitres", "باء - 100 ميليتري", "جيم - 000 1 ميليتري", "ألف - 10 ملليترات"], "bonne": 2, "explication": "لتر واحد يساوي ألف ميليتري"}, {"question": "أي مادة لديها كثافة مختلفة من الماء؟", "choix": [")باء( النفط", "A) Plums", "C) Ceillou", "دال - المياه"], "bonne": 0, "explication": "النفط لديه كثافة مختلفة من الماء"}, {"question": "ما هو كتلة من ملليتر الماء؟", "choix": ["دال - 100 غرام", "باء - غرام واحد", "ألف - 0.1 غرام", "جيم - 10 غرامات"], "bonne": 1, "explication": "ملليتر من الماء يزن جرام واحد"}, {"question": "لماذا يطفو النفط على الماء؟", "choix": ["جيم - لأن لديها كثافة أكبر", "لأنها أخف", "دال - لأن لديها كثافة أصغر", "لأنه أثقل"], "bonne": 2, "explication": "النفط يطفو على الماء لأنه يحتوي على كثافة أصغر"}, {"question": "ما هو كتلة من لتر من الماء في غرامات؟", "choix": ["باء - 000 1 غرام", "D) 1020 grams", "ألف - 920 غراما", "جيم - 980 غراما"], "bonne": 0, "explication": "لتر من الماء يحتوي على كتلة كيلوغرام واحد لذا 1000 غرام"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
