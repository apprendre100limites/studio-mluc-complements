<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionário — Volume e Massa: Matéria de Medição</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Quiz</h1><p class="sous">Volume e massa: matéria de medição</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Que unidade é usada no sistema internacional para medir o volume?", "choix": ["C) Litro", "D) grama", "B) Metro cúbico", "A) quilograma"], "bonne": 2, "explication": "O volume é medido em metros cúbicos no sistema internacional."}, {"question": "Como se determina o volume de uma rocha usando uma peça de teste graduada?", "choix": ["B) A graduação abaixo do nível líquido é lida", "A) A graduação acima do nível líquido é lida", "C) Leia a formatura pouco antes de mergulhar na rocha", "D) A diferença entre o volume antes e depois do mergulho em rocha é lida"], "bonne": 3, "explication": "O volume da rocha é a diferença entre o volume de água antes e depois do mergulho."}, {"question": "Qual é a massa de um litro de água?", "choix": ["B) 100 gramas", "A) 1000 gramas", "D) 1 grama", "C) 10 gramas"], "bonne": 1, "explication": "Um litro de água tem uma massa de um quilograma, por isso 1000 gramas."}, {"question": "Qual é o volume de um litro de água em mililitros?", "choix": ["D) 10.000 mililitros", "B) 100 mililitros", "C) 1000 mililitros", "A) 10 mililitros"], "bonne": 2, "explication": "Um litro é igual a mil milímetros."}, {"question": "Que substância tem uma densidade diferente de água?", "choix": ["B) Óleo", "A) Ameixas", "C) Ceillou", "D) Água"], "bonne": 0, "explication": "O óleo tem uma densidade diferente da água."}, {"question": "Qual é a massa de um mililitro de água?", "choix": ["D) 100 gramas", "B) 1 grama", "A) 0,1 gramas", "C) 10 gramas"], "bonne": 1, "explication": "Um mililitro de água pesa um grama."}, {"question": "Porque é que o petróleo flutua na água?", "choix": ["C) Porque tem uma densidade maior", "B) Porque ela é mais leve", "D) Porque tem uma densidade menor", "A) Porque é mais pesado"], "bonne": 2, "explication": "O óleo flutua sobre a água porque tem uma densidade menor."}, {"question": "Qual é a massa de um litro de água em gramas?", "choix": ["B) 1000 gramas", "D) 1020 gramas", "A) 920 gramas", "C) 980 gramas"], "bonne": 0, "explication": "Um litro de água tem uma massa de um quilograma, por isso 1000 gramas."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
