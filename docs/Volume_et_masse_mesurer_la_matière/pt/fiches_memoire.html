<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folhas de memória — Volume e massa: matéria de medição</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Cartões de memória</h1><p class="sous">Volume e massa: matéria de medição</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "Qual é o volume?", "r": "O volume é o lugar que a matéria toma."}, {"q": "Como medir o volume de um líquido com um provete?", "r": "O provete é colocado sobre uma mesa plana, o olho é colocado sobre o líquido e a graduação é lida no fundo da curva formada pelo líquido."}, {"q": "Como determinar o volume de uma rocha?", "r": "Observe o volume da água sozinho, mergulhar a rocha e, em seguida, notar o novo volume. O volume da rocha é a diferença entre os dois volumes."}, {"q": "Quais são os três estados da matéria mencionados no vídeo?", "r": "Os três estados da matéria são sólidos, líquidos e gasosos."}, {"q": "Porque é que o óleo não pesa um quilo para um litro?", "r": "Como o óleo tem uma densidade de água diferente, pesa cerca de novecentos e vinte gramas por litro."}, {"q": "O que é densidade?", "r": "Densidade é a razão entre massa e volume de uma substância."}, {"q": "Como o volume é medido no sistema internacional?", "r": "O volume é medido em metros cúbicos ou em litros."}, {"q": "Qual é a vantagem de medir o volume de um líquido com uma peça de teste graduada?", "r": "Isto permite medir com precisão o volume de um líquido sem o derramar."}, {"q": "Por que é importante pesar um líquido com um equilíbrio doente?", "r": "Pesar apenas o líquido e não o recipiente."}, {"q": "Que estados de matéria são mencionados no vídeo?", "r": "Os estados de matéria são sólidos, líquidos e gasosos."}, {"q": "Como determinar a massa de um líquido com um equilíbrio?", "r": "Primeiro coloque o recipiente vazio na balança, pressione \"tar\" para reiniciar o visor para zero, depois despeje o líquido e o balanço indica sua massa."}, {"q": "Qual é a massa de 500 mililitros de água?", "r": "A massa de 500 mililitros de água é de 500 gramas."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
