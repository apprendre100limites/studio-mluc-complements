<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Sheets — Volume and Mass: Measuring Matter</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Memory cards</h1><p class="sous">Volume and mass: measuring matter</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "What is the volume?", "r": "Volume is the place that matter takes."}, {"q": "How to measure the volume of a liquid with a test piece?", "r": "The test piece is placed on a flat table, the eye is placed on the liquid and the graduation is read at the bottom of the curve formed by the liquid."}, {"q": "How to determine the volume of a rock?", "r": "Note the volume of the water alone, dive the rock and then note the new volume. The volume of the rock is the difference between the two volumes."}, {"q": "What are the three states of matter mentioned in the video?", "r": "The three states of matter are solid, liquid and gas."}, {"q": "Why doesn't the oil weigh a kilogram for a litre?", "r": "Because oil has a different density of water, it weighs about nine hundred and twenty grams per litre."}, {"q": "What is density?", "r": "Density is the ratio between mass and volume of a substance."}, {"q": "How is volume measured in the international system?", "r": "The volume is measured in cubic metres or litres."}, {"q": "What is the advantage of measuring the volume of a liquid with a graduated test piece?", "r": "This makes it possible to accurately measure the volume of a liquid without pouring it."}, {"q": "Why is it important to weigh a liquid with a sick balance?", "r": "To weigh only the liquid and not the container."}, {"q": "What states of matter are mentioned in the video?", "r": "The states of matter are solid, liquid and gas."}, {"q": "How to determine the mass of a liquid with a balance?", "r": "First place the empty container on the balance, press \"tar\" to reset the display to zero, then pour the liquid and the balance indicates its mass."}, {"q": "What is the mass of 500 millilitres of water?", "r": "The mass of 500 millilitres of water is 500 grams."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
