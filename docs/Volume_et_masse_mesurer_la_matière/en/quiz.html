<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Volume and Mass: Measuring Matter</title><style>

</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Quiz</h1><p class="sous">Volume and mass: measuring matter</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What unit is used in the international system to measure volume?", "choix": ["C) Liter", "D) gram", "B) cubic metre", "A) kilogram"], "bonne": 2, "explication": "The volume is measured in cubic metres in the international system."}, {"question": "How does one determine the volume of a rock using a graduated test piece?", "choix": ["B) Graduation below the liquid level is read", "A) Graduation above liquid level is read", "C) Read the graduation just before diving the rock", "D) The difference between the volume before and after the rock dive is read"], "bonne": 3, "explication": "The volume of the rock is the difference between the volume of water before and after diving."}, {"question": "What is the mass of a litre of water?", "choix": ["B) 100 grams", "A) 1000 grams", "D) 1 gram", "C) 10 grams"], "bonne": 1, "explication": "A litre of water has a mass of one kilogram, so 1000 grams."}, {"question": "What is the volume of a litre of water in millilitres?", "choix": ["D) 10,000 millilitres", "B) 100 millilitres", "C) 1000 millilitres", "A) 10 millilitres"], "bonne": 2, "explication": "One litre is equal to a thousand millilitres."}, {"question": "Which substance has a different density of water?", "choix": ["(B) Oil", "A) Plums", "C) Ceillou", "D) Water"], "bonne": 0, "explication": "Oil has a different density than water."}, {"question": "What is the mass of a millilitre of water?", "choix": ["D) 100 grams", "B) 1 gram", "A) 0.1 grams", "C) 10 grams"], "bonne": 1, "explication": "A millilitre of water weighs one gram."}, {"question": "Why does oil float on water?", "choix": ["C) Because it has a larger density", "B) Because she's lighter", "D) Because it has a smaller density", "A) Because it's heavier"], "bonne": 2, "explication": "Oil floats on water because it has a smaller density."}, {"question": "What is the mass of a litre of water in grams?", "choix": ["B) 1000 grams", "D) 1020 grams", "A) 920 grams", "C) 980 grams"], "bonne": 0, "explication": "A litre of water has a mass of one kilogram, so 1000 grams."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
