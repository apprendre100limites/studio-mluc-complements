<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherblätter — Volumen und Masse: Messmaterie</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Speicherkarten</h1><p class="sous">Volumen und Masse: Messsubstanz</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Was ist das Volumen?", "r": "Volumen ist der Ort, an dem Materie stattfindet."}, {"q": "Wie wird das Volumen einer Flüssigkeit mit einem Teststück gemessen?", "r": "Das Prüfmuster wird auf einen flachen Tisch gestellt, das Auge auf die Flüssigkeit gelegt und die Teilung am unteren Ende der durch die Flüssigkeit gebildeten Kurve abgelesen."}, {"q": "Wie bestimme ich das Volumen eines Felsens?", "r": "Beachten Sie das Volumen des Wassers allein, tauchen Sie den Felsen und dann beachten Sie das neue Volumen. Das Volumen des Gesteins ist der Unterschied zwischen den beiden Volumen."}, {"q": "Was sind die drei Zustände der Materie, die im Video erwähnt werden?", "r": "Die drei Zustände der Materie sind fest, flüssig und gasförmig."}, {"q": "Warum wiegt das Öl nicht ein Kilogramm für einen Liter?", "r": "Da Öl eine andere Dichte von Wasser hat, wiegt es etwa neunhundertzwanzig Gramm pro Liter."}, {"q": "Was ist Dichte?", "r": "Dichte ist das Verhältnis zwischen Masse und Volumen einer Substanz."}, {"q": "Wie wird das Volumen im internationalen System gemessen?", "r": "Das Volumen wird in Kubikmetern oder Litern gemessen."}, {"q": "Was ist der Vorteil der Messung des Volumens einer Flüssigkeit mit einem graduierten Prüfling?", "r": "Dies ermöglicht es, das Volumen einer Flüssigkeit genau zu messen, ohne sie zu gießen."}, {"q": "Warum ist es wichtig, eine Flüssigkeit mit einem kranken Gleichgewicht zu wiegen?", "r": "Nur die Flüssigkeit und nicht den Behälter wiegen."}, {"q": "Welche Zustände der Materie werden im Video erwähnt?", "r": "Die Zustände der Materie sind fest, flüssig und gasförmig."}, {"q": "Wie man die Masse einer Flüssigkeit mit einem Gleichgewicht bestimmt?", "r": "Stellen Sie zuerst den leeren Behälter auf die Waage, drücken Sie \"Teer\", um das Display auf Null zurückzusetzen, dann gießen Sie die Flüssigkeit und die Waage zeigt ihre Masse an."}, {"q": "Was ist die Masse von 500 Millilitern Wasser?", "r": "Die Masse von 500 Millilitern Wasser beträgt 500 Gramm."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
