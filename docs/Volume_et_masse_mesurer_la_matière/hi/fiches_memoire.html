<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी शीट्स - वॉल्यूम और मास: मापने मैटर</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>मेमोरी कार्ड</h1><p class="sous">वॉल्यूम और द्रव्यमान: मापने का मामला</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "मात्रा क्या है?", "r": "वॉल्यूम वह स्थान है जो मामला लेता है।"}, {"q": "एक परीक्षण टुकड़े के साथ एक तरल की मात्रा को कैसे मापें?", "r": "परीक्षण टुकड़ा एक फ्लैट टेबल पर रखा जाता है, आंख को तरल पर रखा जाता है और स्नातक तरल द्वारा गठित वक्र के नीचे पढ़ा जाता है।"}, {"q": "कैसे एक चट्टान की मात्रा निर्धारित करने के लिए?", "r": "अकेले पानी की मात्रा को नोट करें, चट्टान को डुबोएं और फिर नई मात्रा पर ध्यान दें। चट्टान की मात्रा दो संस्करणों के बीच अंतर है।"}, {"q": "वीडियो में उल्लिखित तीन राज्यों क्या हैं?", "r": "पदार्थ के तीन राज्य ठोस, तरल और गैस हैं।"}, {"q": "क्यों नहीं, तेल एक लीटर के लिए एक किलोग्राम वजन?", "r": "चूंकि तेल में पानी का एक अलग घनत्व होता है, इसलिए इसका वजन लगभग नौ सौ बीस ग्राम प्रति लीटर होता है।"}, {"q": "घनत्व क्या है?", "r": "घनत्व एक पदार्थ के द्रव्यमान और मात्रा के बीच अनुपात है।"}, {"q": "अंतर्राष्ट्रीय प्रणाली में मात्रा को कैसे मापा जाता है?", "r": "मात्रा घन मीटर या लीटर में मापा जाता है।"}, {"q": "एक स्नातक परीक्षण टुकड़ा के साथ एक तरल की मात्रा को मापने का क्या लाभ है?", "r": "इससे तरल की मात्रा को सटीक रूप से मापना संभव हो जाता है।"}, {"q": "यह क्यों एक बीमार संतुलन के साथ एक तरल वजन करने के लिए महत्वपूर्ण है?", "r": "केवल तरल वजन करने के लिए और कंटेनर नहीं।"}, {"q": "वीडियो में किस राज्य का उल्लेख किया गया है?", "r": "पदार्थ के राज्य ठोस, तरल और गैस हैं।"}, {"q": "एक संतुलन के साथ एक तरल के द्रव्यमान को कैसे निर्धारित किया जाए?", "r": "सबसे पहले खाली कंटेनर को बैलेंस पर रखें, डिस्प्ले को शून्य करने के लिए रीसेट करने के लिए \"tar\" दबाएं, फिर तरल डालें और संतुलन इसके द्रव्यमान को इंगित करता है।"}, {"q": "500 मिलीलीटर पानी का द्रव्यमान क्या है?", "r": "500 मिलीलीटर पानी का द्रव्यमान 500 ग्राम है।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
