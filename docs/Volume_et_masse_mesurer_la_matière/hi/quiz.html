<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी - वॉल्यूम और मास: मापने मैटर</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>प्रश्नोत्तरी</h1><p class="sous">वॉल्यूम और द्रव्यमान: मापने का मामला</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "वॉल्यूम को मापने के लिए अंतर्राष्ट्रीय प्रणाली में किस इकाई का उपयोग किया जाता है?", "choix": ["C) लीटर", "D) ग्राम", "B) घन मीटर", "A) किलोग्राम"], "bonne": 2, "explication": "मात्रा अंतरराष्ट्रीय प्रणाली में घन मीटर में मापा जाता है।"}, {"question": "कैसे एक स्नातक परीक्षण टुकड़ा का उपयोग कर एक चट्टान की मात्रा निर्धारित करता है?", "choix": ["B) तरल स्तर के नीचे स्नातक पढ़ा जाता है", "A) तरल स्तर के ऊपर स्नातक पढ़ा जाता है", "C) रॉक डाइविंग से पहले स्नातक पढ़ें", "D) पहले और बाद में रॉक गोता पढ़ने के बाद मात्रा के बीच का अंतर"], "bonne": 3, "explication": "चट्टान की मात्रा डाइविंग से पहले और बाद में पानी की मात्रा के बीच अंतर है।"}, {"question": "एक लीटर पानी का द्रव्यमान क्या है?", "choix": ["B) 100 ग्राम", "A 1000 ग्राम", "D) 1 ग्राम", "C) 10 ग्राम"], "bonne": 1, "explication": "एक लीटर पानी में एक किलोग्राम होता है, इसलिए 1000 ग्राम होता है।"}, {"question": "मिलीलीटर में पानी की मात्रा क्या है?", "choix": ["D) 10,000 मिलीलीटर", "B) 100 मिलीलीटर", "C) 1000 मिलीलीटर", "A) 10 मिलीलीटर"], "bonne": 2, "explication": "एक लीटर एक हजार मिलीलीटर के बराबर है।"}, {"question": "किस पदार्थ में पानी का एक अलग घनत्व होता है?", "choix": ["(B) तेल", "A) Plum", "C) Ceillou", "D) पानी"], "bonne": 0, "explication": "तेल में पानी की तुलना में अलग घनत्व होता है।"}, {"question": "पानी के एक मिलीलीटर का द्रव्यमान क्या है?", "choix": ["D) 100 ग्राम", "B) 1 ग्राम", "A) 0.1 ग्राम", "C) 10 ग्राम"], "bonne": 1, "explication": "पानी की एक मिलीलीटर का वजन एक ग्राम है।"}, {"question": "क्यों तेल पानी पर तैरता है?", "choix": ["C) क्योंकि यह एक बड़ा घनत्व है", "B) क्योंकि वह हल्का है", "D) क्योंकि यह एक छोटा घनत्व है", "A) क्योंकि यह भारी है"], "bonne": 2, "explication": "तेल पानी पर तैरता है क्योंकि इसका छोटा घनत्व होता है।"}, {"question": "ग्राम में एक लीटर पानी का द्रव्यमान क्या है?", "choix": ["B) 1000 ग्राम", "D) 1020 ग्राम", "A) 920 ग्राम", "C) 980 ग्राम"], "bonne": 0, "explication": "एक लीटर पानी में एक किलोग्राम होता है, इसलिए 1000 ग्राम होता है।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
