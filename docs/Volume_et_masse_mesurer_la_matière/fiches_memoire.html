<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Volume et masse : mesurer la matière</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Fiches mémoire</h1><p class="sous">Volume et masse : mesurer la matière</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Qu'est-ce que le volume ?", "r": "Le volume est la place que prend la matière."}, {"q": "Comment mesurer le volume d'un liquide avec une éprouvette ?", "r": "On place l'éprouvette sur une table plane, on pose l'œil au niveau du liquide et on lit la graduation en bas de la courbe formée par le liquide."}, {"q": "Comment déterminer le volume d'un caillou ?", "r": "On note le volume de l'eau seule, on plonge le caillou puis on note le nouveau volume. Le volume du caillou est la différence entre les deux volumes."}, {"q": "Quels sont les trois états de la matière mentionnés dans la vidéo ?", "r": "Les trois états de la matière sont le solide, le liquide et le gaz."}, {"q": "Pourquoi l'huile ne pèse-t-elle pas un kilogramme pour un litre ?", "r": "Parce que l'huile a une masse volumique différente de l'eau, elle pèse environ neuf cent vingt grammes pour un litre."}, {"q": "Qu'est-ce que la masse volumique ?", "r": "La masse volumique est le rapport entre la masse et le volume d'une substance."}, {"q": "Comment se mesure le volume dans le système international ?", "r": "Le volume se mesure en mètres cubes ou en litres."}, {"q": "Quel est l'avantage de mesurer le volume d'un liquide avec une éprouvette graduée ?", "r": "Cela permet de mesurer avec précision le volume d'un liquide sans le verser."}, {"q": "Pourquoi est-il important de peser un liquide avec une balance tarée ?", "r": "Pour ne peser que le liquide et pas le récipient."}, {"q": "Quels sont les états de la matière mentionnés dans la vidéo ?", "r": "Les états de la matière sont le solide, le liquide et le gaz."}, {"q": "Comment déterminer la masse d'un liquide avec une balance ?", "r": "On place d'abord le récipient vide sur la balance, on appuie sur « tare » pour remettre l'affichage à zéro, on verse ensuite le liquide et la balance indique sa masse."}, {"q": "Quelle est la masse de cinq cents millilitres d'eau ?", "r": "La masse de cinq cents millilitres d'eau est de cinq cents grammes."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
