<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hojas de memoria — Volumen y misa: Measuring Matter</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}

h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}

@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Tarjetas de memoria</h1><p class="sous">Volumen y masa: materia de medición</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Cuál es el volumen?", "r": "El volumen es el lugar que la materia toma."}, {"q": "¿Cómo medir el volumen de un líquido con una pieza de prueba?", "r": "La pieza de prueba se coloca sobre una mesa plana, el ojo se coloca sobre el líquido y la graduación se lee en la parte inferior de la curva formada por el líquido."}, {"q": "¿Cómo determinar el volumen de una roca?", "r": "Tenga en cuenta el volumen del agua sola, bucee la roca y luego note el nuevo volumen. El volumen de la roca es la diferencia entre los dos volúmenes."}, {"q": "¿Cuáles son los tres estados de materia mencionados en el vídeo?", "r": "Los tres estados de materia son sólidos, líquidos y gas."}, {"q": "¿Por qué el aceite no pesa un kilo para un litro?", "r": "Debido a que el aceite tiene una densidad diferente de agua, pesa alrededor de novecientos veinte gramos por litro."}, {"q": "¿Qué es la densidad?", "r": "La densidad es la relación entre masa y volumen de una sustancia."}, {"q": "¿Cómo se mide el volumen en el sistema internacional?", "r": "El volumen se mide en metros cúbicos o litros."}, {"q": "¿Cuál es la ventaja de medir el volumen de un líquido con una pieza de prueba graduada?", "r": "Esto hace posible medir con precisión el volumen de un líquido sin verterlo."}, {"q": "¿Por qué es importante pesar un líquido con un balance enfermo?", "r": "Pesar sólo el líquido y no el contenedor."}, {"q": "¿Qué estados de materia se mencionan en el vídeo?", "r": "Los estados de la materia son sólidos, líquidos y gas."}, {"q": "¿Cómo determinar la masa de un líquido con un equilibrio?", "r": "En primer lugar el contenedor vacío en el balance, presione \"tar\" para restablecer la pantalla a cero, luego verter el líquido y el saldo indica su masa."}, {"q": "¿Cuál es la masa de 500 mililitros de agua?", "r": "La masa de 500 mililitros de agua es de 500 gramos."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
