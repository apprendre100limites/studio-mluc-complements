<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطاقات الذاكرة - التغييرات في حالة المسألة</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>بطاقات الذاكرة</h1><p class="sous">التغييرات في الحالة</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "ما هو اسم الدولة الصلبة تغيير إلى السائل؟", "r": "الدمج عند الضغط الطبيعي، الجليد يذوب إلى درجة الصفر سيليسوس."}, {"q": "ما هو اسم التغيير في الحالة السائلة إلى الغاز؟", "r": "الإختفاء"}, {"q": "ما اسم تغيير الدولة من الغاز إلى السائل؟", "r": "السخرية"}, {"q": "ما هو اسم الدولة السائلة إلى صلب؟", "r": "التهدئة"}, {"q": "عندما تنتهي المياه، في أي درجة الحرارة تبقى مستقرة؟", "r": "لا تزال مستقرة عند 100 درجة مئوية إنه يغلي"}, {"q": "ما هو مستوى الحرارة؟", "r": "وهي درجة الحرارة التي لا تزال مستقرة خلال تغيير الدولة."}, {"q": "ما الفرق بين التبخر والتغلي؟", "r": "الإجلاء بطيء، فقط على السطح، بأي درجة حرارة. الغليان يتم في كل السائل، وبدرجة حرارة دقيقة."}, {"q": "في أي درجة حرارة تذوب المياه النقية وتنتهي؟", "r": "إنه يذوب إلى درجة صفر وينتهي إلى مائة درجة مئوية"}, {"q": "ماذا يحدث عندما تبرد سائل نقي مثل الماء؟", "r": "درجة حرارته تنخفض إلى درجة الصفر، ثم تظل مستقرة مثل أشكال الجليد. إنه التدعيم"}, {"q": "لماذا خليط مثل الماء المالح لديه درجة حرارة؟", "r": "لأن درجة الحرارة لا تزال ترتفع أثناء الغليان"}, {"q": "كيف لي أن أعرف إذا كان السائل هو جسد نقي؟", "r": "إذا استقرت درجة الحرارة أثناء تغيير الدولة، السائل هو جسم نقي. خلاف ذلك، هو مزيج."}, {"q": "ماذا يحدث للماء عندما ينخفض الضغط؟", "r": "درجة الحرارة المغلية تنخفض في مونت بلانك، حوالي أربعة آلاف ثمانمائة متر، المياه تنتهي حوالي ثمانية وأربعون درجة."}, {"q": "ماذا يحدث للماء في الطبق؟", "r": "الضغط أعلى، لذلك الماء ينتهي أكثر من مائة درجة، حوالي مائة وعشرين، والطعام يطهو أسرع."}, {"q": "أين البرد في الثلاجة أو تكييف الهواء؟", "r": "تغيير الدولة: سائل يتبخر ويبرد، وسوائل الغاز المضغطة."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
