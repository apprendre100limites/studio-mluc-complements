<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كويز - التغييرات في حالة المسألة</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>Quiz</h1><p class="sous">التغييرات في الحالة</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ما اسم تغيير الدولة عندما يصبح الصلب سائلاً؟", "choix": ["الترسيب", "سوء التصرف", "الاندماج", "رش"], "bonne": 2, "explication": "والانتقال من الصلب إلى السائل يسمى الاندماج."}, {"question": "ماذا يحدث مع درجة حرارة المياه النقية عندما تصل إلى 100 درجة مئوية عند الضغط الطبيعي؟", "choix": ["إنه ينقص", "يصبح الصفر", "يبقى ثابتا", "لا تزال تتسلق"], "bonne": 2, "explication": "درجة حرارته ترتفع ثم تتوقف عند 100 درجة مئوية"}, {"question": "ما هو التحول الذي وصفه الطين على مرآة الحمام؟", "choix": ["الترسيب", "رش", "سوء التصرف", "الاندماج"], "bonne": 2, "explication": "إنها مهزلة"}, {"question": "ما هي درجة الحرارة التي تظل مستقرة خلال تغيير الدولة؟", "choix": ["نقطة الغليان", "درجة الحرارة المحيطة", "درجة الحرارة", "نقطة الاندماج"], "bonne": 2, "explication": "وهذه درجة الحرارة التي لا تزال مستقرة خلال تغيير الدولة تسمى درجة حرارة."}, {"question": "أي بيان يميز التهرب من الغليان؟", "choix": ["التبخر يتم فقط على السطح، يغلي في جميع السائل", "كلاهما يحدثان بنفس درجة الحرارة", "الغليان فقط على السطح", "يتم التبخر في جميع أنحاء السائل"], "bonne": 0, "explication": "الغليان يتم في كل السائل، وبدرجة حرارة دقيقة."}, {"question": "أين ينتهي الماء بحوالي 84 درجة مئوية وفقاً للفيديو؟", "choix": ["عند درجة حرارة صفر مئوية", "إلى البحر", "in a casserole", "في قمة مونت بلانك"], "bonne": 3, "explication": "في قمة جبل بلانك، حوالي أربعة آلاف ثمانمائة متر، الماء ينتهي بحوالي 48 درجة."}, {"question": "في خليط مثل الماء المالح ماذا يحدث عند درجة الحرارة أثناء الغليان؟", "choix": ["إنها تصعد باستمرار", "يبقى ثابتا", "تذبذب بشكل عشوائي", "إنه ينقص"], "bonne": 0, "explication": "إنه اختبار نقاء جيد إذا استقرت درجة الحرارة أثناء تغيير الدولة، السائل هو جسم نقي. خلاف ذلك، هو مزيج."}, {"question": "ما هو تأثير زيادة الضغط على نقطةغلي الماء؟", "choix": ["الانخفاض", "الزيادة", "يبقى نفسه", "يصبح الصفر"], "bonne": 1, "explication": "ودرجة حرارة الماء المغلية تنخفض بالضغط"}, {"question": "في دقيقة واحدة، ما درجة الحرارة التي تنتهي بها المياه تقريبا؟", "choix": ["بالضبط صفر درجة مئوية", "أقل من 100 درجة مئوية", "حوالي 100 درجة مئوية", "أعلى من 100 درجة مئوية حتى 120 درجة مئوية"], "bonne": 3, "explication": "الماء يغلي أكثر من مائة درجة، حوالي مائة وعشرين، والطعام يطبخ أسرع."}, {"question": "أي موجز يصور أفضل محتوى الفيديو الرئيسي؟", "choix": ["الجسم النقي لديه درجة حرارة، خليط لا.", "الماء ينتهي دائماً عند درجة صفر", "الضغط لا يؤثر على نقطة الغليان", "والإجلاء والتغليان هما نفس الظاهرة."], "bonne": 0, "explication": "لتلخيص: الجسم النقي له مستوى حرارة، خليط ليس لديه واحد."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
