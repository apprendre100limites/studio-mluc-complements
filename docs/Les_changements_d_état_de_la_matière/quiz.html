<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Les changements d&#x27;état de la matière</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Quiz</h1><p class="sous">Les changements d&#x27;état de la matière</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Quel est le nom du changement d'état lorsqu'un solide devient un liquide ?", "choix": ["solidification", "liquéfaction", "fusion", "vaporisation"], "bonne": 2, "explication": "Le passage de solide à liquide s'appelle la fusion."}, {"question": "Que se passe-t-il avec la température de l'eau pure lorsqu'elle atteint 100 °C à pression normale ?", "choix": ["elle diminue", "elle devient zéro", "elle reste constante", "elle continue à monter"], "bonne": 2, "explication": "Sa température monte, puis elle s'arrête à cent degrés Celsius."}, {"question": "Quelle transformation est décrite par la buée sur un miroir de salle de bain ?", "choix": ["solidification", "vaporisation", "liquéfaction", "fusion"], "bonne": 2, "explication": "C'est une liquéfaction."}, {"question": "Quel terme désigne la température qui reste stable pendant un changement d'état ?", "choix": ["point d'ébullition", "température ambiante", "palier de température", "point de fusion"], "bonne": 2, "explication": "Cette température qui reste stable pendant le changement d'état s'appelle un palier de température."}, {"question": "Quelle affirmation différencie l'évaporation de l'ébullition ?", "choix": ["l'évaporation se fait uniquement à la surface, l'ébullition dans tout le liquide", "les deux se produisent à la même température", "l'ébullition se fait uniquement à la surface", "l'évaporation se fait dans tout le liquide"], "bonne": 0, "explication": "L'ébullition se fait dans tout le liquide, à une température précise."}, {"question": "À quel endroit l'eau bout à environ 84 °C selon la vidéo ?", "choix": ["à 0 °C", "à la mer", "dans une cocotte-minute", "au sommet du Mont Blanc"], "bonne": 3, "explication": "Au sommet du mont Blanc, à environ quatre mille huit cents mètres, l'eau bout vers quatre-vingt-quatre degrés."}, {"question": "Dans un mélange comme l'eau salée, que se passe-t-il à la température pendant l'ébullition ?", "choix": ["elle monte continuellement", "elle reste constante", "elle fluctue aléatoirement", "elle diminue"], "bonne": 0, "explication": "C'est un bon test de pureté. Si la température se stabilise pendant le changement d'état, le liquide est un corps pur. Sinon, c'est un mélange."}, {"question": "Quel est l'effet d'une augmentation de la pression sur le point d'ébullition de l'eau ?", "choix": ["diminue", "augmente", "reste identique", "devient zéro"], "bonne": 1, "explication": "Et la température d'ébullition de l'eau diminue avec la pression."}, {"question": "Dans une cocotte-minute, à quelle température l'eau bout approximativement ?", "choix": ["exactement 0 °C", "en dessous de 100 °C", "autour de 100 °C", "au-dessus de 100 °C jusqu'à 120 °C"], "bonne": 3, "explication": "L'eau bout au-dessus de cent degrés, vers cent vingt, et les aliments cuitent plus vite."}, {"question": "Quel résumé capture le mieux le contenu principal de la vidéo ?", "choix": ["Un corps pur a un palier de température, un mélange n'en a pas.", "L'eau bout toujours à 0 degré.", "La pression n'influe pas sur le point d'ébullition.", "Évaporation et ébullition sont le même phénomène."], "bonne": 0, "explication": "Pour résumer : un corps pur a un palier de température, un mélange n'en a pas."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
