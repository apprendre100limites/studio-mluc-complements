<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी कार्ड - मामले की स्थिति में बदलाव</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>मेमोरी कार्ड</h1><p class="sous">मामले की स्थिति में परिवर्तन</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "तरल में ठोस राज्य परिवर्तन का नाम क्या है?", "r": "विलय। सामान्य दबाव में, बर्फ शून्य डिग्री सेल्सियस तक पिघल जाती है।"}, {"q": "तरल राज्य में गैस में परिवर्तन का नाम क्या है?", "r": "वाष्पीकरण।"}, {"q": "गैस से तरल राज्य परिवर्तन का नाम क्या है?", "r": "द्रवीकरण।"}, {"q": "तरल राज्य का नाम क्या ठोस है?", "r": "ठोसकरण।"}, {"q": "जब पानी समाप्त हो जाता है, तो क्या तापमान स्थिर रहता है?", "r": "यह 100 डिग्री सेल्सियस पर स्थिर रहता है। यह उबलते है।"}, {"q": "तापमान स्तर क्या है?", "r": "यह तापमान राज्य परिवर्तन के दौरान स्थिर रहता है।"}, {"q": "वाष्पीकरण और उबलते के बीच क्या अंतर है?", "r": "वाष्पीकरण धीमी है, केवल सतह पर, किसी भी तापमान पर। उबलते सभी तरल में सटीक तापमान पर किया जाता है।"}, {"q": "क्या तापमान शुद्ध पानी पिघलता है और समाप्त होता है?", "r": "यह शून्य डिग्री तक पिघल जाता है और एक सौ डिग्री सेल्सियस तक समाप्त होता है।"}, {"q": "जब आप पानी की तरह शुद्ध तरल ठंडा करते हैं तो क्या होता है?", "r": "इसका तापमान शून्य डिग्री तक गिर जाता है, फिर बर्फ के रूप में स्थिर रहता है। यह ठोसकरण है।"}, {"q": "नमक के पानी की तरह मिश्रण क्यों नहीं है?", "r": "क्योंकि तापमान उबलते के दौरान बढ़ रहा है।"}, {"q": "मैं कैसे जानता हूँ कि क्या तरल शुद्ध शरीर है?", "r": "यदि तापमान राज्य परिवर्तन के दौरान स्थिर हो जाता है, तो तरल एक शुद्ध शरीर है। अन्यथा, यह एक मिश्रण है।"}, {"q": "जब दबाव गिर जाता है तो पानी क्या होता है?", "r": "उबलते तापमान कम हो जाता है। मॉन्ट ब्लैंक में लगभग चार हजार आठ सौ मीटर पानी आठ डिग्री के बारे में समाप्त होता है।"}, {"q": "पानी में क्या होता है?", "r": "दबाव अधिक होता है, इसलिए पानी सौ डिग्री से अधिक होता है, लगभग एक सौ बीस, और भोजन तेजी से सूख जाता है।"}, {"q": "फ्रिज या एयर कंडीशनिंग में ठंड कहाँ है?", "r": "राज्य का एक परिवर्तन: एक तरल जो ठंडा हो जाता है, और एक संपीड़ित गैस liquefies।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
