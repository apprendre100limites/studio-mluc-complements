<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>क्विज़ - मामले की स्थिति में परिवर्तन</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>प्रश्नोत्तरी</h1><p class="sous">मामले की स्थिति में परिवर्तन</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "जब एक ठोस तरल हो जाता है तो राज्य परिवर्तन का नाम क्या है?", "choix": ["ठोसकरण", "मदिरा", "विलय", "छिड़काव"], "bonne": 2, "explication": "ठोस से तरल तक संक्रमण को संलयन कहा जाता है।"}, {"question": "जब यह सामान्य दबाव में 100 °C तक पहुंच जाता है तो शुद्ध पानी के तापमान के साथ क्या होता है?", "choix": ["यह कमी", "यह शून्य हो जाता है", "यह स्थिर रहता है", "वह चढ़ाई करना जारी रखता है"], "bonne": 2, "explication": "इसका तापमान बढ़ जाता है, फिर यह 100 डिग्री सेल्सियस पर रुक जाता है।"}, {"question": "क्या परिवर्तन एक बाथरूम दर्पण पर मिट्टी द्वारा वर्णित है?", "choix": ["ठोसकरण", "छिड़काव", "मदिरा", "विलय"], "bonne": 2, "explication": "यह एक द्रव्य है।"}, {"question": "राज्य परिवर्तन के दौरान किस अवधि का तापमान स्थिर रहता है?", "choix": ["उबलते बिंदु", "परिवेश तापमान", "तापमान स्तर", "विलय का बिंदु"], "bonne": 2, "explication": "राज्य परिवर्तन के दौरान स्थिर रहने वाले इस तापमान को तापमान स्तर कहा जाता है।"}, {"question": "क्या बयान उबलते से वाष्पीकरण को अलग करता है?", "choix": ["वाष्पीकरण केवल सतह पर किया जाता है, सभी तरल पदार्थ में उबलते हैं", "दोनों समान तापमान पर होते हैं", "केवल सतह पर उबालना", "वाष्पीकरण पूरे तरल में होता है"], "bonne": 0, "explication": "उबलते सभी तरल में सटीक तापमान पर किया जाता है।"}, {"question": "वीडियो के अनुसार पानी का अंत लगभग 84°C होता है?", "choix": ["0 °C पर", "समुद्र", "एक casserole में", "मॉन्ट ब्लैंक के शीर्ष पर"], "bonne": 3, "explication": "माउंट ब्लैंक के शीर्ष पर, लगभग चार हजार आठ सौ मीटर, पानी आठवीं-चार डिग्री के बारे में समाप्त होता है।"}, {"question": "नमक के पानी की तरह मिश्रण में, उबलते समय तापमान पर क्या होता है?", "choix": ["वह लगातार चल रही है", "यह स्थिर रहता है", "यह बेतरतीब ढंग से fluctuates", "यह कमी"], "bonne": 0, "explication": "यह एक अच्छा शुद्धता परीक्षण है। यदि तापमान राज्य परिवर्तन के दौरान स्थिर हो जाता है, तो तरल एक शुद्ध शरीर है। अन्यथा, यह एक मिश्रण है।"}, {"question": "पानी के उबलते बिंदु पर बढ़ते दबाव का क्या प्रभाव है?", "choix": ["कमी", "वृद्धि", "वही रहता है", "शून्य हो गया"], "bonne": 1, "explication": "और पानी का उबलते तापमान दबाव के साथ कम हो जाता है।"}, {"question": "क्या तापमान लगभग समाप्त होता है?", "choix": ["बिल्कुल 0 °C", "100 °C", "लगभग 100 °C", "100 °C से ऊपर 120 °C तक"], "bonne": 3, "explication": "पानी एक सौ डिग्री से अधिक उबालता है, लगभग एक सौ बीस, और भोजन तेजी से पकाता है।"}, {"question": "कौन सा सारांश सर्वश्रेष्ठ वीडियो की मुख्य सामग्री पर कब्जा करता है?", "choix": ["एक शुद्ध शरीर में तापमान का स्तर होता है, मिश्रण नहीं होता है।", "पानी हमेशा 0 डिग्री पर समाप्त होता है।", "दबाव उबलते बिंदु को प्रभावित नहीं करता है।", "वाष्पीकरण और उबलते समान घटना हैं।"], "bonne": 0, "explication": "संक्षेप में: एक शुद्ध शरीर में तापमान का स्तर होता है, एक मिश्रण में एक नहीं होता है।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
