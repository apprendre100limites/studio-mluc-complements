<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionário — Mudanças no estado da matéria</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Quiz</h1><p class="sous">Alterações no estado da matéria</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Qual é o nome do estado muda quando um sólido se torna um líquido?", "choix": ["solidificação", "liquefação", "fusão", "pulverização"], "bonne": 2, "explication": "A transição do sólido para o líquido é chamada fusão."}, {"question": "O que acontece com a temperatura da água pura quando atinge 100 °C à pressão normal?", "choix": ["diminui", "torna-se zero", "permanece constante", "Ela continua a subir"], "bonne": 2, "explication": "A sua temperatura sobe e pára a 100 graus Celsius."}, {"question": "Que transformação é descrita pela lama no espelho do banheiro?", "choix": ["solidificação", "pulverização", "liquefação", "fusão"], "bonne": 2, "explication": "É uma liquefação."}, {"question": "Que termo é a temperatura que permanece estável durante uma mudança de estado?", "choix": ["ponto de ebulição", "temperatura ambiente", "nível de temperatura", "ponto de fusão"], "bonne": 2, "explication": "Esta temperatura que permanece estável durante a mudança de estado é chamada de nível de temperatura."}, {"question": "Que declaração diferencia a evaporação da ebulição?", "choix": ["a evaporação é feita apenas na superfície, fervendo em todo o líquido", "ambos ocorrem na mesma temperatura", "ebulição apenas à superfície", "evaporação ocorre em todo o líquido"], "bonne": 0, "explication": "A ebulição é feita em todo o líquido, a uma temperatura precisa."}, {"question": "Onde termina a água em cerca de 84°C de acordo com o vídeo?", "choix": ["A 0 °C", "para o mar", "em uma caçarola", "no topo de Mont Blanc"], "bonne": 3, "explication": "No topo do Monte Blanc, cerca de quatro mil oitocentos metros, a água termina cerca de oitenta e quatro graus."}, {"question": "Numa mistura como água salgada, o que acontece à temperatura durante a ebulição?", "choix": ["Ela está sempre a subir.", "permanece constante", "flutua aleatoriamente", "diminui"], "bonne": 0, "explication": "É um bom teste de pureza. Se a temperatura se estabilizar durante a mudança de estado, o líquido é um corpo puro. Caso contrário, é uma mistura."}, {"question": "Qual é o efeito do aumento da pressão no ponto de ebulição da água?", "choix": ["diminuição", "aumentada", "permanece o mesmo", "torna-se zero"], "bonne": 1, "explication": "E a temperatura de ebulição da água diminui com a pressão."}, {"question": "Em um minuto de caçarola, a que temperatura a água termina aproximadamente?", "choix": ["exactamente 0 °C", "inferior a 100 °C", "cerca de 100 °C", "acima de 100 °C até 120 °C"], "bonne": 3, "explication": "A água ferve mais de cem graus, cerca de cento e vinte, e a comida cozinha mais rápido."}, {"question": "Qual resumo melhor captura o conteúdo principal do vídeo?", "choix": ["Um corpo puro tem um nível de temperatura, uma mistura não.", "A água termina sempre a 0 graus.", "A pressão não afeta o ponto de ebulição.", "Evaporação e ebulição são o mesmo fenômeno."], "bonne": 0, "explication": "Resumindo: um corpo puro tem um nível de temperatura, uma mistura não tem um."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
