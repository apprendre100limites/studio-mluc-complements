<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões de memória — Alterações no estado da matéria</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Cartões de memória</h1><p class="sous">Alterações no estado da matéria</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "Qual é o nome da mudança de estado sólido para líquido?", "r": "A fusão. À pressão normal, o gelo derrete a zero graus Celsius."}, {"q": "Qual é o nome da mudança de estado líquido para gás?", "r": "Vaporização."}, {"q": "Qual é o nome da mudança de estado gás-líquido?", "r": "A liquefação."}, {"q": "Qual é o nome da mudança do estado líquido para sólido?", "r": "Solidificação."}, {"q": "Quando a água termina, em que temperatura permanece estável?", "r": "Permanece estável a 100 graus Celsius. Está a ferver."}, {"q": "O que é um nível de temperatura?", "r": "É a temperatura que permanece estável durante a mudança de estado."}, {"q": "Qual é a diferença entre evaporação e ebulição?", "r": "A evaporação é lenta, apenas na superfície, a qualquer temperatura. A ebulição é feita em todo o líquido, a uma temperatura precisa."}, {"q": "A que temperatura derrete e termina a água pura?", "r": "Ele derrete a zero graus e termina a cem graus Celsius."}, {"q": "O que acontece quando você arrefece um líquido puro como água?", "r": "Sua temperatura cai para zero graus, então permanece estável à medida que o gelo se forma. É solidificação."}, {"q": "Porque é que uma mistura como água salgada não tem um intervalo de temperatura?", "r": "Porque a temperatura continua a subir durante a ebulição."}, {"q": "Como sei se um líquido é um corpo puro?", "r": "Se a temperatura se estabilizar durante a mudança de estado, o líquido é um corpo puro. Caso contrário, é uma mistura."}, {"q": "O que acontece com a água quando a pressão cai?", "r": "A temperatura de ebulição diminui. Em Mont Blanc, cerca de quatro mil oitocentos metros, a água termina cerca de oitenta e quatro graus."}, {"q": "O que acontece à água numa caçarola?", "r": "A pressão é maior, de modo que a água termina mais de cem graus, cerca de cento e vinte, e o alimento cozinha mais rápido."}, {"q": "Onde está o frio no frigorífico ou o ar condicionado?", "r": "Uma mudança de estado: um líquido que evapora esfria, e um gás comprimido liquefeito."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
