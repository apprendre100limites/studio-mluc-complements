<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Cambios en el estado de la materia</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Quiz</h1><p class="sous">Cambios en el estado de la materia</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Cuál es el nombre del estado cuando un sólido se convierte en líquido?", "choix": ["solidificación", "liquefacción", "fusión", "rociado"], "bonne": 2, "explication": "La transición de sólido a líquido se llama fusión."}, {"question": "¿Qué pasa con la temperatura del agua pura cuando alcanza 100 °C a presión normal?", "choix": ["disminuye", "se convierte en cero", "sigue siendo constante", "Sigue subiendo."], "bonne": 2, "explication": "Su temperatura aumenta, entonces se detiene a 100 grados Celsius."}, {"question": "¿Qué transformación es descrita por el barro en un espejo de baño?", "choix": ["solidificación", "rociado", "liquefacción", "fusión"], "bonne": 2, "explication": "Es una licuefacción."}, {"question": "¿Qué término es la temperatura que permanece estable durante un cambio estatal?", "choix": ["punto de ebullición", "Temperatura ambiente", "nivel de temperatura", "punto de fusión"], "bonne": 2, "explication": "Esta temperatura que permanece estable durante el cambio estatal se llama nivel de temperatura."}, {"question": "¿Qué declaración diferencia la evaporación de la ebullición?", "choix": ["evaporación se hace sólo en la superficie, hirviendo en todo líquido", "ambos ocurren a la misma temperatura", "hervir sólo en la superficie", "evaporación tiene lugar a lo largo del líquido"], "bonne": 0, "explication": "El hirviendo se hace en todo el líquido, a una temperatura precisa."}, {"question": "¿Dónde termina el agua a unos 84°C según el vídeo?", "choix": ["A 0 °C", "al mar", "en una cacerola", "en la parte superior de Mont Blanc"], "bonne": 3, "explication": "En la parte superior del Monte Blanc, unos cuatro mil ochocientos metros, el agua termina unos ochenta y cuatro grados."}, {"question": "En una mezcla como agua salada, ¿qué sucede a la temperatura durante la ebullición?", "choix": ["Está subiendo constantemente.", "sigue siendo constante", "fluctúa aleatoriamente", "disminuye"], "bonne": 0, "explication": "Es una buena prueba de pureza. Si la temperatura se estabiliza durante el cambio del estado, el líquido es un cuerpo puro. De lo contrario, es una mezcla."}, {"question": "¿Cuál es el efecto de una mayor presión en el punto de ebullición del agua?", "choix": ["disminución", "Aumento", "sigue siendo el mismo", "se convierte en cero"], "bonne": 1, "explication": "Y la temperatura hirviendo del agua disminuye con presión."}, {"question": "En un minuto de cacerola, ¿a qué temperatura termina el agua aproximadamente?", "choix": ["exactamente 0 °C", "debajo de 100 °C", "alrededor de 100 °C", "arriba 100 °C hasta 120 °C"], "bonne": 3, "explication": "El agua hierve más de cien grados, cerca de ciento veinte, y la comida cocina más rápido."}, {"question": "¿Qué resumen mejor captura el contenido principal del vídeo?", "choix": ["Un cuerpo puro tiene un nivel de temperatura, una mezcla no.", "El agua siempre termina a 0 grados.", "La presión no afecta el punto de ebullición.", "La evaporación y la ebullición son el mismo fenómeno."], "bonne": 0, "explication": "Para resumir: un cuerpo puro tiene un nivel de temperatura, una mezcla no tiene uno."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
