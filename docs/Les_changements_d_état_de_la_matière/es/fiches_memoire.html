<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas de memoria — Cambios en el estado de la materia</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Tarjetas de memoria</h1><p class="sous">Cambios en el estado de la materia</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Cuál es el nombre del cambio de estado sólido al líquido?", "r": "La fusión. A presión normal, el hielo se derrite a cero grados Celsius."}, {"q": "¿Cuál es el nombre del cambio de estado líquido a gas?", "r": "Vaporización."}, {"q": "¿Cuál es el nombre del cambio estatal de gas a líquido?", "r": "La licuefacción."}, {"q": "¿Cuál es el nombre del estado líquido cambio a sólido?", "r": "Solidificación."}, {"q": "Cuando el agua termina, ¿a qué temperatura permanece estable?", "r": "Se mantiene estable a 100 grados Celsius. Está hirviendo."}, {"q": "¿Qué es un nivel de temperatura?", "r": "Es la temperatura que permanece estable durante el cambio estatal."}, {"q": "¿Cuál es la diferencia entre evaporación y ebullición?", "r": "La evaporación es lenta, sólo en la superficie, a cualquier temperatura. El hirviendo se hace en todo el líquido, a una temperatura precisa."}, {"q": "¿A qué temperatura se derrite y termina el agua pura?", "r": "Se derrite a cero grados y termina a cien grados Celsius."}, {"q": "¿Qué pasa cuando enfrias un líquido puro como el agua?", "r": "Su temperatura baja a cero grados, y luego permanece estable como las formas de hielo. Es solidificación."}, {"q": "¿Por qué una mezcla como agua salada no tiene un rango de temperatura?", "r": "Debido a que la temperatura sigue aumentando durante la ebullición."}, {"q": "¿Cómo sé si un líquido es un cuerpo puro?", "r": "Si la temperatura se estabiliza durante el cambio del estado, el líquido es un cuerpo puro. De lo contrario, es una mezcla."}, {"q": "¿Qué le pasa al agua cuando la presión cae?", "r": "La temperatura de ebullición disminuye. En Mont Blanc, unos cuatro mil ochocientos metros, el agua termina unos ochenta y cuatro grados."}, {"q": "¿Qué le pasa al agua en una cazuela?", "r": "La presión es más alta, así que el agua termina más de cien grados, cerca de ciento veinte, y la comida cocina más rápido."}, {"q": "¿Dónde está el frío en la nevera o el aire acondicionado?", "r": "Un cambio de estado: un líquido que se evapora se enfría, y un licuado de gas comprimido."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
