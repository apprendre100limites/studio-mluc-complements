<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Les changements d&#x27;état de la matière</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Fiches mémoire</h1><p class="sous">Les changements d&#x27;état de la matière</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Quel est le nom du changement d'état solide en liquide ?", "r": "La fusion. À pression normale, la glace fond à zéro degré Celsius."}, {"q": "Quel est le nom du changement d'état liquide en gaz ?", "r": "La vaporisation."}, {"q": "Quel est le nom du changement d'état gaz en liquide ?", "r": "La liquéfaction."}, {"q": "Quel est le nom du changement d'état liquide en solide ?", "r": "La solidification."}, {"q": "Quand l'eau bout, à quelle température reste-t-elle stable ?", "r": "Elle reste stable à cent degrés Celsius. C'est l'ébullition."}, {"q": "Qu'est-ce qu'un palier de température ?", "r": "C'est la température qui reste stable pendant le changement d'état."}, {"q": "Quelle est la différence entre évaporation et ébullition ?", "r": "L'évaporation est lente, elle se fait seulement à la surface, à n'importe quelle température. L'ébullition se fait dans tout le liquide, à une température précise."}, {"q": "À quelle température l'eau pure fond et bout-elle ?", "r": "Elle fond à zéro degré et bout à cent degré Celsius."}, {"q": "Que se passe-t-il quand on refroidit un liquide pur comme l'eau ?", "r": "Sa température baisse jusqu'à zéro degré, puis reste stable pendant que la glace se forme. C'est la solidification."}, {"q": "Pourquoi un mélange comme l'eau salée n'a-t-il pas de palier de température ?", "r": "Parce que la température continue de monter pendant l'ébullition."}, {"q": "Comment savoir si un liquide est un corps pur ?", "r": "Si la température se stabilise pendant le changement d'état, le liquide est un corps pur. Sinon, c'est un mélange."}, {"q": "Que se passe-t-il de l'eau quand la pression diminue ?", "r": "La température d'ébullition diminue. Au mont Blanc, à environ quatre mille huit cents mètres, l'eau bout vers quatre-vingt-quatre degrés."}, {"q": "Que se passe-t-il de l'eau dans une cocotte-minute ?", "r": "La pression est plus grande, donc l'eau bout au-dessus de cent degrés, vers cent vingt, et les aliments cuisent plus vite."}, {"q": "D'où vient le froid dans le frigo ou la climatisation ?", "r": "D'un changement d'état : un liquide qui s'évapore refroidit, et un gaz comprimé se liquéfie."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
