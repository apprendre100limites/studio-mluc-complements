<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Changes in the state of matter</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}

</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Quiz</h1><p class="sous">Changes in the state of matter</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What is the name of the change of state when a solid becomes a liquid?", "choix": ["solidification", "liquefaction", "merger", "spraying"], "bonne": 2, "explication": "The transition from solid to liquid is called fusion."}, {"question": "What happens with the temperature of pure water when it reaches 100°C at normal pressure?", "choix": ["it decreases", "it becomes zero", "it remains constant", "it keeps going up"], "bonne": 2, "explication": "Its temperature rises, then it stops at one hundred degrees Celsius."}, {"question": "What transformation is described by mist on a bathroom mirror?", "choix": ["solidification", "spraying", "liquefaction", "merger"], "bonne": 2, "explication": "It is a liquefaction."}, {"question": "Which term refers to the temperature that remains stable during a change of state?", "choix": ["boiling point", "ambient temperature", "temperature plateau", "melting point"], "bonne": 2, "explication": "This temperature, which remains stable during the change of state, is called a temperature plateau."}, {"question": "What statement differentiates evaporation from boiling?", "choix": ["evaporation occurs only at the surface, boiling in all the liquid", "both occur at the same temperature", "boiling only at the surface", "evaporation occurs throughout the liquid"], "bonne": 0, "explication": "The boiling is done in all the liquid, at a precise temperature."}, {"question": "Where does the water boil at around 84°C according to the video?", "choix": ["at 0°C", "to the sea", "in a pressure cooker", "at the top of Mont Blanc"], "bonne": 3, "explication": "At the top of Mount Blanc, about four thousand eight hundred meters, the water ends about eighty-four degrees."}, {"question": "In a mixture like salt water, what happens at the temperature during boiling?", "choix": ["She's constantly going up", "it remains constant", "it fluctuates randomly", "it decreases"], "bonne": 0, "explication": "It's a good purity test. If the temperature stabilizes during the state change, the liquid is a pure body. Otherwise, it's a mixture."}, {"question": "What is the effect of increased pressure on the boiling point of water?", "choix": ["decrease", "increased", "remains the same", "becomes zero"], "bonne": 1, "explication": "And the boiling temperature of the water decreases with pressure."}, {"question": "In a casserole-minute, at what temperature does the water end approximately?", "choix": ["exactly 0 °C", "below 100 °C", "around 100 °C", "above 100 °C up to 120 °C"], "bonne": 3, "explication": "Water boils over a hundred degrees, about one hundred and twenty, and food cooks faster."}, {"question": "Which summary best captures the main content of the video?", "choix": ["A pure body has a temperature level, a mixture does not.", "Water always ends at 0 degrees.", "The pressure does not affect the boiling point.", "Evaporation and boiling are the same phenomenon."], "bonne": 0, "explication": "To sum up: a pure body has a temperature level, a mixture does not have one."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
