<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory sheets — Changes in the state of matter</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Memory Sheets</h1><p class="sous">Changes in the state of matter</p><p class="sous">Read the question, answer in your head, then click on the card to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide All</button></p><div id="c"></div></main><script>const C=[{"q": "What is the name of the change from solid to liquid state?", "r": "Melting. At normal pressure, ice melts at zero degrees Celsius."}, {"q": "What is the name of the change of state from liquid to gas?", "r": "Vaporization."}, {"q": "What is the name of the change of state from gas to liquid?", "r": "Liquefaction."}, {"q": "What is the name of the change from liquid to solid state?", "r": "Solidification."}, {"q": "When water boils, at what temperature does it remain stable?", "r": "It remains stable at one hundred degrees Celsius. It's boiling."}, {"q": "What is a temperature plateau?", "r": "This is the temperature that remains stable during the change of state."}, {"q": "What is the difference between evaporation and boiling?", "r": "Evaporation is slow, it is only at the surface, at any temperature. The boiling is done in all the liquid, at a precise temperature."}, {"q": "At what temperature does pure water melt and boil?", "r": "It melts at zero degrees and boils at one hundred degrees Celsius."}, {"q": "What happens when you cool a pure liquid like water?", "r": "Its temperature drops to zero degrees, then remains stable as ice forms. It's solidification."}, {"q": "Why doesn't a mixture like salt water have a temperature plateau?", "r": "Because the temperature continues to rise during boiling."}, {"q": "How do you know if a liquid is a pure body?", "r": "If the temperature stabilizes during the change of state, the liquid is a pure body. Otherwise, it's a mixture."}, {"q": "What happens to the water when the pressure decreases?", "r": "The boiling temperature decreases. At Mont Blanc, about four thousand eight hundred meters, the water boils at about eighty-four degrees."}, {"q": "What happens to the water in a pressure cooker?", "r": "The pressure is greater, so the water boils above one hundred degrees, around one hundred and twenty, and the food cooks faster."}, {"q": "Where does the cold in the fridge or air conditioning come from?", "r": "A change of state: a liquid that evaporates cools, and a compressed gas liquefies."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
