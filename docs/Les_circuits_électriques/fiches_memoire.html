<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Les circuits électriques</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Fiches mémoire</h1><p class="sous">Les circuits électriques</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Quelle condition est nécessaire pour qu'une lampe s'allume dans un circuit ?", "r": "Il faut que les deux bornes de la lampe soient reliées aux deux bornes de la pile par des fils conducteurs formant une boucle fermée."}, {"q": "Que se passe-t-il si la chaîne conductrice est coupée par un interrupteur ouvert ?", "r": "Le courant ne circule pas et la lampe ne s'allume pas."}, {"q": "Combien de fils sont nécessaires pour relier une pile à une lampe ?", "r": "Il en faut deux car le courant doit faire une boucle complète et ne s'arrête pas dans la lampe."}, {"q": "Comment appelle-t-on les composants à deux bornes comme une pile ou une lampe ?", "r": "On les appelle des dipôles."}, {"q": "Quelles sont les trois règles pour faire un bon schéma de circuit ?", "r": "Utiliser les symboles normalisés, tracer les fils en lignes droites avec des angles droits, et vérifier que le schéma forme une boucle fermée."}, {"q": "Comment sont disposés des dipôles en série ?", "r": "Ils se suivent sur la même boucle unique."}, {"q": "Quelle est la conséquence si un dipôle grille ou si l'interrupteur s'ouvre dans un circuit en série ?", "r": "La boucle est coupée et tous les dipôles s'éteignent."}, {"q": "Comment sont disposés des dipôles en dérivation ?", "r": "Chaque dipôle est sur sa propre branche, et chaque branche forme une boucle indépendante avec la pile."}, {"q": "Que se passe-t-il si on ouvre l'interrupteur sur une branche d'un circuit en dérivation ?", "r": "Seule la lampe de cette branche s'éteint, l'autre continue de briller car leurs fonctionnements sont indépendants."}, {"q": "Pourquoi les prises électriques d'une maison sont-elles câblées en dérivation ?", "r": "Pour que chaque appareil fonctionne indépendamment : une lampe qui grille n'éteint pas le réfrigérateur."}, {"q": "Comment est constitué un circuit complexe selon la vidéo ?", "r": "Des dipôles en série forment des branches, et ces branches sont associées entre elles en dérivation."}, {"q": "Donne un exemple de métier qui utilise le câblage en série ou en dérivation pour obtenir une tension et une intensité précises.", "r": "Un technicien photovoltaïque relie des panneaux solaires en série ou en dérivation."}, {"q": "Pourquoi coupe-t-on le courant avant de réparer une installation électrique ?", "r": "Parce qu'un circuit est une boucle fermée de conducteurs ; couper le courant ouvre la boucle et stoppe la circulation du courant."}, {"q": "Deux lampes sont en dérivation et l'une grille. Que devient l'autre ?", "r": "Elle continue de briller car chaque lampe est sur sa propre branche indépendante."}, {"q": "Qu'est-ce qui circule dans les fils d'un circuit fermé ?", "r": "Le courant électrique circule, transférant de l'énergie électrique de la pile vers la lampe."}, {"q": "Les symboles des dipôles sont-ils les mêmes dans tous les pays ?", "r": "Oui, ce sont des symboles normalisés, identiques dans le monde entier."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
