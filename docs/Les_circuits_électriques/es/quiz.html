<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Circuitos eléctricos</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Quiz</h1><p class="sous">Circuitos eléctricos</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Para que una lámpara se encienda en un circuito eléctrico, ¿qué debe la forma del circuito?", "choix": ["Un zigzag", "Una línea recta", "Un bucle cerrado", "Una espiral"], "bonne": 2, "explication": "Tan pronto como la cadena se cierra y forma un bucle, la corriente circula y la lámpara brilla."}, {"question": "¿Cuántos cables de conductor son necesarios para conectar una batería a una lámpara para formar un circuito completo?", "choix": ["Un hilo", "Tres hijos", "Sin cable", "Dos hijos"], "bonne": 3, "explication": "En realidad, toma dos: la corriente hace un bucle, no se detiene en la lámpara."}, {"question": "¿Cuáles son los nombres de los componentes eléctricos que tienen dos terminales, como una batería, lámpara o interruptor?", "choix": ["Dipoles", "Multipoles", "Monopoles", "Tripoles"], "bonne": 0, "explication": "Los componentes de dos puntos se llaman dipoles: batería, lámpara, interruptor, motor."}, {"question": "¿Cuál es la regla para dibujar alambres en un esquema eléctrico estándar?", "choix": ["En líneas diagonales solamente", "Dotted", "En líneas rectas con ángulos rectos", "En líneas curvas"], "bonne": 2, "explication": "Para hacer un buen esquema: utiliza símbolos estandarizados, rastrea hilos en líneas rectas con ángulos rectos."}, {"question": "En un circuito de serie, ¿qué pasa si se abre una de las lámparas de red o el interruptor?", "choix": ["Sólo la lámpara a la parrilla sale", "Otras lámparas brillan más fuerte", "Nada cambia", "Todas las lámparas salen"], "bonne": 3, "explication": "Si abres el interruptor, o si una lámpara de parrilla, todo se apaga, porque la hebilla está apagada."}, {"question": "¿Cuál es la característica principal de un circuito de bypass (paralelo) sobre el funcionamiento de las lámparas?", "choix": ["Ellos flash alternativamente", "Están todos fuera si una cuadrícula", "Comparten el mismo hilo único", "Su funcionamiento es independiente"], "bonne": 3, "explication": "Abra el interruptor en una rama: esta lámpara se apaga, pero la otra sigue brillando. Sus operaciones son independientes."}, {"question": "¿Por qué las salidas eléctricas en una casa conectada a un bypass?", "choix": ["Así que una lámpara a la parrilla no apaga la nevera", "Aumentar la tensión", "Para que todos los dispositivos se enciendan al mismo tiempo", "Para salvar el cable"], "bonne": 0, "explication": "Es por eso que las tomas de tu casa se pasan por alto: una lámpara que las parrillas no apagan la nevera."}, {"question": "¿Cómo es un circuito eléctrico complejo formado según el video?", "choix": ["Dipoles en serie solamente", "Dipoles in diversion only", "Dipoles de serie que forman ramas asociadas con la desviación", "Celdas solamente"], "bonne": 2, "explication": "En un circuito complejo, las dipoles serie forman ramas, y estas ramas están asociadas por bypass."}, {"question": "Un técnico fotovoltaico conecta paneles solares en serie o by-pass. ¿Para qué propósito?", "choix": ["Para hacerlos más ligeros", "Para cambiar el color actual", "Para obtener el voltaje e intensidad requerido", "Para girar los paneles"], "bonne": 2, "explication": "Un técnico fotovoltaico conecta paneles solares en serie o by-pass para obtener el voltaje e intensidad requerido."}, {"question": "Dos lámparas se montan en una sola batería. Una de las dos lámparas. ¿Qué le pasa a la segunda lámpara?", "choix": ["También se ha ido.", "Sigue brillando normalmente", "Ella explota.", "Se llama"], "bonne": 1, "explication": "Sigue brillando: cada lámpara está en su propia rama."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
