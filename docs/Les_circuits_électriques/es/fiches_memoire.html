<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas de memoria — Circuitos eléctricos</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Tarjetas de memoria</h1><p class="sous">Circuitos eléctricos</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Qué condición es necesaria para que una lámpara se encienda en un circuito?", "r": "Los dos terminales de la lámpara deben conectarse a los dos terminales de la batería mediante cables conductores que forman un bucle cerrado."}, {"q": "¿Qué pasa si la cadena conductiva es cortada por un interruptor abierto?", "r": "La corriente no circula y la lámpara no se enciende."}, {"q": "¿Cuántos cables se necesitan para conectar una batería a una lámpara?", "r": "Se necesita dos porque la corriente debe hacer un bucle completo y no se detiene en la lámpara."}, {"q": "¿Cuáles son los componentes de dos puntos llamados una batería o una lámpara?", "r": "Se llaman dipoles."}, {"q": "¿Cuáles son las tres reglas para hacer un buen diagrama de circuito?", "r": "Utilice los símbolos estándar, dibujar los alambres en líneas rectas con ángulos rectos, y comprobar que el diagrama forma un bucle cerrado."}, {"q": "¿Cómo se arreglan las dipoles en serie?", "r": "Se siguen en el mismo bucle."}, {"q": "¿Cuál es la consecuencia si se abre una cuadrícula o el interruptor en un circuito de serie?", "r": "El bucle se corta y todas las dipoles se apagan."}, {"q": "¿Cómo se arreglan las dipoles en bypass?", "r": "Cada dipolo está en su propia rama, y cada rama forma un bucle independiente con la batería."}, {"q": "¿Qué pasa si abres el interruptor en una rama de un circuito de bypass?", "r": "Sólo la lámpara de esta rama se apaga, la otra sigue brillando porque sus funciones son independientes."}, {"q": "¿Por qué las tomas eléctricas de una casa conectadas por carretera?", "r": "Así que cada dispositivo funciona independientemente: una lámpara que parrilla no apaga el refrigerador."}, {"q": "¿Cómo es un circuito complejo formado según el video?", "r": "Las dipoles de serie forman ramas, y estas ramas están asociadas en derivación."}, {"q": "Da un ejemplo de un comercio que utiliza cableado de serie o bypass para lograr un voltaje e intensidad precisos.", "r": "Un técnico fotovoltaico conecta paneles solares en serie o by-pass."}, {"q": "¿Por qué apagamos la energía antes de reparar una instalación eléctrica?", "r": "Debido a que un circuito es un bucle cerrado de conductores; cortar la corriente abre el bucle y detiene la circulación actual."}, {"q": "Dos lámparas están pasadas y una rejilla. ¿Qué le pasa al otro?", "r": "Sigue brillando porque cada lámpara está en su propia rama independiente."}, {"q": "¿Qué circula en los cables de un circuito cerrado?", "r": "La corriente eléctrica circula, transfiriendo energía eléctrica de la batería a la lámpara."}, {"q": "¿Los símbolos dipoles son los mismos en todos los países?", "r": "Sí, son símbolos estandarizados, idénticos en todo el mundo."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
