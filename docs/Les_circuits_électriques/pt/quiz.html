<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Circuitos eléctricos</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Quiz</h1><p class="sous">Circuitos eléctricos</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Para uma lâmpada acender - se num circuito elétrico, o que deve formar o circuito?", "choix": ["Um zigzag", "Uma linha reta", "Um ciclo fechado", "Uma espiral"], "bonne": 2, "explication": "Assim que a corrente se fecha e forma um laço, a corrente circula e a lâmpada brilha."}, {"question": "Quantos fios condutores são necessários para conectar uma bateria a uma lâmpada para formar um circuito completo?", "choix": ["Uma linha", "Três filhos.", "Sem fio", "Dois filhos"], "bonne": 3, "explication": "Na realidade, é preciso dois: a corrente faz um loop, não pára na lâmpada."}, {"question": "Quais são os nomes dos componentes elétricos que têm dois terminais, como uma bateria, lâmpada ou interruptor?", "choix": ["Dipolas", "Multipoles", "Monopolos", "Tripé"], "bonne": 0, "explication": "Os componentes de dois pontos são chamados dipolos: bateria, lâmpada, interruptor, motor."}, {"question": "Qual é a regra para desenhar fios em um esquema elétrico padrão?", "choix": ["Apenas em linhas diagonais", "Dotado", "Em linhas retas com ângulos retos", "Em linhas curvas"], "bonne": 2, "explication": "Para fazer um bom esquema: usa símbolos padronizados, linhas trilha em linhas retas com ângulos retos."}, {"question": "Em um circuito serial, o que acontece se uma das lâmpadas da grade ou o interruptor for aberto?", "choix": ["Só a lâmpada grelhada se apaga.", "Outras lâmpadas brilham mais forte", "Nada muda", "Todas as lâmpadas se apagam"], "bonne": 3, "explication": "Se você abrir o interruptor, ou se uma lâmpada de grade, tudo vai explodir, porque a fivela está desligada."}, {"question": "Qual é a principal característica de um circuito de bypass (paralelo) relativo ao funcionamento de lâmpadas?", "choix": ["Eles piscam alternadamente.", "Eles estão todos fora se uma rede", "Eles compartilham a mesma linha única", "O seu funcionamento é independente"], "bonne": 3, "explication": "Abra o interruptor em um ramo: esta lâmpada apaga, mas a outra continua a brilhar. As suas operações são independentes."}, {"question": "Porque é que as tomadas eléctricas numa casa estão ligadas a um bypass?", "choix": ["Para que uma lâmpada grelhada não desligue o frigorífico.", "Aumentar a tensão", "Para que todos os dispositivos liguem ao mesmo tempo", "Para salvar o fio"], "bonne": 0, "explication": "É por isso que as tomadas da sua casa são contornadas: uma lâmpada que grelha não desliga o frigorífico."}, {"question": "Como é que um circuito elétrico complexo é feito de acordo com o vídeo?", "choix": ["Apenas dipolos em série", "Apenas dipolos em desvio", "Dipolos em série que formam ramos associados ao desvio", "Apenas células"], "bonne": 2, "explication": "Em um circuito complexo, dipolos seriais formam ramos, e esses ramos são eles mesmos associados por bypass."}, {"question": "Um técnico fotovoltaico conecta painéis solares em série ou by-pass. Com que propósito?", "choix": ["Para torná-los mais leves", "Para alterar a cor actual", "Para obter a tensão e intensidade necessárias", "Para virar os painéis"], "bonne": 2, "explication": "Um técnico fotovoltaico conecta painéis solares em série ou by-pass para obter a tensão e intensidade necessárias."}, {"question": "Duas lâmpadas são montadas em uma única bateria. Uma das duas lâmpadas. O que acontece à segunda lâmpada?", "choix": ["Ela também se foi.", "Continua a brilhar normalmente", "Ela explode.", "Ele pisca"], "bonne": 1, "explication": "Continua a brilhar: cada lâmpada está no seu próprio ramo."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
