<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões de memória — Circuitos eléctricos</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Cartões de memória</h1><p class="sous">Circuitos eléctricos</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "Que condição é necessária para que uma lâmpada se ilumine num circuito?", "r": "Os dois terminais da lâmpada devem ser ligados aos dois terminais da bateria por fios condutores que formam um circuito fechado."}, {"q": "O que acontece se a corrente condutora for cortada por um interruptor aberto?", "r": "A corrente não circula e a lâmpada não acende."}, {"q": "Quantos fios são necessários para ligar uma bateria a uma lâmpada?", "r": "É preciso dois porque a corrente deve fazer um loop completo e não parar na lâmpada."}, {"q": "Quais são os componentes de dois pontos chamados de bateria ou lâmpada?", "r": "Chamam-se dipolos."}, {"q": "Quais são as três regras para fazer um bom diagrama de circuito?", "r": "Use os símbolos padrão, desenhe os fios em linhas retas com ângulos retos, e verifique se o diagrama forma um laço fechado."}, {"q": "Como se arranjam dipolos em série?", "r": "Eles seguem-se no mesmo circuito."}, {"q": "Qual é a consequência se um dipolo de grade ou o interruptor se abrir em um circuito serial?", "r": "O laço é cortado e todos os dipolos são extintos."}, {"q": "Como os dipolos são dispostos em bypass?", "r": "Cada dipolo está em seu próprio ramo, e cada ramo forma um laço independente com a bateria."}, {"q": "O que acontece se abrires o interruptor num ramo de um circuito de bypass?", "r": "Apenas a lâmpada deste ramo é extinta, o outro continua a brilhar porque suas funções são independentes."}, {"q": "Porque é que as tomadas elétricas numa casa com fios passam?", "r": "Para que cada dispositivo funcione de forma independente: uma lâmpada que grelha não desliga o frigorífico."}, {"q": "Como um circuito complexo é feito de acordo com o vídeo?", "r": "Dipolos seriais formam ramos, e estes ramos estão associados na derivação."}, {"q": "Dá um exemplo de um comércio que usa fiação serial ou bypass para alcançar tensão e intensidade precisas.", "r": "Um técnico fotovoltaico conecta painéis solares em série ou by-pass."}, {"q": "Porque desligamos a energia antes de reparar uma instalação eléctrica?", "r": "Porque um circuito é um circuito fechado de condutores; cortar a corrente abre o laço e pára a circulação da corrente."}, {"q": "Duas lâmpadas são contornadas e uma grade. O que acontece com o outro?", "r": "Ele continua a brilhar porque cada lâmpada está em seu próprio ramo independente."}, {"q": "O que circula nos fios de um circuito fechado?", "r": "A corrente elétrica circula, transferindo energia elétrica da bateria para a lâmpada."}, {"q": "Os símbolos dipolo são os mesmos em todos os países?", "r": "Sim, são símbolos padronizados, idênticos em todo o mundo."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
