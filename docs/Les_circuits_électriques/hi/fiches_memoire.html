<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी कार्ड - इलेक्ट्रिकल सर्किट</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>मेमोरी कार्ड</h1><p class="sous">विद्युत सर्किट</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "एक सर्किट में प्रकाश देने के लिए दीपक के लिए क्या शर्त आवश्यक है?", "r": "दीपक के दो टर्मिनलों को एक बंद लूप बनाने वाले प्रवाहकीय तारों द्वारा बैटरी के दो टर्मिनलों से जोड़ा जाना चाहिए।"}, {"q": "क्या होता है अगर प्रवाहकीय श्रृंखला को खुले स्विच द्वारा काट दिया जाता है?", "r": "चालू नहीं होता है और दीपक चालू नहीं होता है।"}, {"q": "बैटरी को दीपक से जोड़ने के लिए कितने तारों की आवश्यकता होती है?", "r": "यह दो लेता है क्योंकि वर्तमान में पूर्ण लूप बनाना चाहिए और दीपक में रुकना नहीं है।"}, {"q": "दो बिंदु घटकों को बैटरी या दीपक कहा जाता है?", "r": "उन्हें द्विध्रुव कहा जाता है।"}, {"q": "एक अच्छा सर्किट आरेख बनाने के लिए तीन नियम क्या हैं?", "r": "मानक प्रतीकों का उपयोग करें, सीधे कोणों के साथ सीधे लाइनों में तारों को आकर्षित करें और जांचें कि आरेख एक बंद लूप बनाता है।"}, {"q": "कैसे क्रमिक द्विध्रुवीय व्यवस्था कर रहे हैं?", "r": "वे एक दूसरे को एक ही लूप पर फॉलो करते हैं।"}, {"q": "यदि ग्रिड द्विध्रुवीय या स्विच एक सीरियल सर्किट में खुलता है तो क्या परिणाम है?", "r": "लूप को काट दिया जाता है और सभी द्विध्रुवियों को बुझा दिया जाता है।"}, {"q": "बायपास में द्विध्रुवीय व्यवस्था कैसे की जाती है?", "r": "प्रत्येक द्विध्रुव अपनी शाखा पर है और प्रत्येक शाखा बैटरी के साथ एक स्वतंत्र पाश बनाती है।"}, {"q": "यदि आप एक बायपास सर्किट की एक शाखा पर स्विच खोलते हैं तो क्या होता है?", "r": "केवल इस शाखा के दीपक को बहिष्कृत किया जाता है, अन्य लोग चमकते रहते हैं क्योंकि उनके कार्य स्वतंत्र हैं।"}, {"q": "क्यों एक घर में बिजली के आउटलेट द्वारा पारित वायर्ड हैं?", "r": "इसलिए कि प्रत्येक उपकरण स्वतंत्र रूप से काम करता है: एक दीपक जो ग्रिल्स रेफ्रिजरेटर को बंद नहीं करता है।"}, {"q": "वीडियो के अनुसार एक जटिल सर्किट कैसे बनाया गया है?", "r": "सीरियल द्विध्रुवीय शाखाओं के रूप में, और ये शाखाएं निष्क्रियता में जुड़ी हुई हैं।"}, {"q": "एक व्यापार का एक उदाहरण देता है जो सटीक वोल्टेज और तीव्रता को प्राप्त करने के लिए सीरियल या बायपास वायरिंग का उपयोग करता है।", "r": "एक फोटोवोल्टिक तकनीशियन श्रृंखला या बाईपास में सौर पैनलों को जोड़ता है।"}, {"q": "हम बिजली की स्थापना की मरम्मत से पहले बिजली बंद क्यों करते हैं?", "r": "चूंकि एक सर्किट कंडक्टर का एक बंद लूप है; वर्तमान में कटौती लूप को खोलती है और वर्तमान परिसंचरण को रोकती है।"}, {"q": "दो लैंप बायपास और एक ग्रिड हैं। क्या होता है?", "r": "यह चमकना जारी है क्योंकि प्रत्येक दीपक अपनी स्वतंत्र शाखा पर है।"}, {"q": "एक बंद सर्किट के तारों में क्या फैलता है?", "r": "विद्युत प्रवाहित होता है, बैटरी से दीपक तक विद्युत ऊर्जा को स्थानांतरित करता है।"}, {"q": "क्या द्विध्रुवीय प्रतीक सभी देशों में समान हैं?", "r": "हां, वे दुनिया भर में समान रूप से मानकीकृत प्रतीक हैं।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
