<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी - इलेक्ट्रिकल सर्किट</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>प्रश्नोत्तरी</h1><p class="sous">विद्युत सर्किट</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "बिजली के सर्किट में प्रकाश के लिए एक दीपक के लिए, सर्किट फॉर्म क्या होना चाहिए?", "choix": ["एक zigzag", "एक सीधी रेखा", "एक बंद लूप", "एक सर्पिल"], "bonne": 2, "explication": "जैसे ही श्रृंखला खुद को बंद कर देती है और एक लूप बनाती है, वर्तमान में फैलता है और दीपक चमकता है।"}, {"question": "एक पूर्ण सर्किट बनाने के लिए बैटरी को दीपक से जोड़ने के लिए कितने कंडक्टर तारों की आवश्यकता होती है?", "choix": ["एक धागा", "तीन बेटे", "कोई तार नहीं", "दो बेटे"], "bonne": 3, "explication": "वास्तव में, यह दो लेता है: वर्तमान एक लूप बनाता है, यह दीपक में बंद नहीं होता है।"}, {"question": "विद्युत घटकों के नाम क्या हैं जिनमें दो टर्मिनल हैं, जैसे बैटरी, लैंप या स्विच?", "choix": ["डिपो", "मल्टीपोल", "मोनोपोल", "Tripoles"], "bonne": 0, "explication": "दो बिंदु घटकों को द्विध्रुवीय कहा जाता है: बैटरी, दीपक, स्विच, मोटर।"}, {"question": "एक मानक विद्युत योजना पर तारों को खींचने का नियम क्या है?", "choix": ["केवल विकर्ण लाइनों में", "बिन्दु", "सीधे कोणों के साथ सीधी रेखाओं में", "घुमावदार लाइनों में"], "bonne": 2, "explication": "एक अच्छा स्कीमा बनाने के लिए: मानकीकृत प्रतीकों का उपयोग करता है, सीधे कोणों के साथ सीधे लाइनों में धागे को ट्रैक करता है।"}, {"question": "एक सीरियल सर्किट में क्या होता है अगर ग्रिड लैंप में से एक या स्विच खोला जाता है?", "choix": ["केवल ग्रिल्ड लैंप बाहर निकलता है", "अन्य लैंप मजबूत चमकते हैं", "कुछ बदलाव", "सभी लैंप बाहर जाते हैं"], "bonne": 3, "explication": "यदि आप स्विच खोलते हैं, या यदि कोई ग्रिल लैंप, तो सब कुछ बंद हो जाता है, क्योंकि बकसुआ बंद हो जाता है।"}, {"question": "लैंप के संचालन से संबंधित बाईपास सर्किट (parallel) की मुख्य विशेषता क्या है?", "choix": ["वे वैकल्पिक रूप से फ्लैश करते हैं", "अगर वे एक ग्रिड हैं", "वे एक ही अद्वितीय धागा साझा करते हैं", "उनका कार्य स्वतंत्र है"], "bonne": 3, "explication": "एक शाखा पर स्विच खोलें: यह दीपक बंद हो जाता है, लेकिन दूसरा चमक जारी रहता है। उनके कार्य स्वतंत्र हैं।"}, {"question": "एक घर में बिजली के आउटलेट क्यों बाईपास से जुड़े हैं?", "choix": ["इसलिए एक ग्रील्ड लैंप फ्रिज को बंद नहीं करता है", "तनाव बढ़ाने के लिए", "इसलिए कि सभी डिवाइस उसी समय चालू हो जाते हैं", "तार को बचाने के लिए"], "bonne": 0, "explication": "यही कारण है कि आपके घर के सॉकेट बायपास हैं: एक दीपक जो ग्रिल्स फ्रिज को बंद नहीं करता है।"}, {"question": "वीडियो के अनुसार एक जटिल विद्युत सर्किट कैसे बनाया गया है?", "choix": ["केवल सीरियल द्विध्रुवीय", "केवल मोड़ में द्विध्रुवीय", "सीरियल द्विध्रुवीय रूपांतर से जुड़ी शाखाओं के गठन", "केवल सेल"], "bonne": 2, "explication": "एक जटिल सर्किट में, सीरियल द्विध्रुवीय शाखाओं का निर्माण करते हैं और ये शाखाएं स्वयं बाईपास से जुड़ी हुई हैं।"}, {"question": "एक फोटोवोल्टिक तकनीशियन श्रृंखला या बाईपास में सौर पैनलों को जोड़ता है। किस उद्देश्य के लिए?", "choix": ["उन्हें हल्का बनाने के लिए", "वर्तमान रंग बदलने के लिए", "आवश्यक वोल्टेज और तीव्रता प्राप्त करने के लिए", "पैनलों को बदलने के लिए"], "bonne": 2, "explication": "एक फोटोवोल्टिक तकनीशियन आवश्यक वोल्टेज और तीव्रता प्राप्त करने के लिए श्रृंखला में सौर पैनलों को जोड़ता है।"}, {"question": "एक बैटरी पर दो लैंप लगाए जाते हैं। दो ग्रिड लैंप में से एक। दूसरा दीपक क्या होता है?", "choix": ["वह भी चला गया।", "यह सामान्य रूप से चमकना जारी रखता है", "वह विस्फोट करती है।", "यह चमकती है"], "bonne": 1, "explication": "यह चमकना जारी रखता है: प्रत्येक दीपक अपनी शाखा पर है।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
