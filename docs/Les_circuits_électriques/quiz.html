<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Les circuits électriques</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Quiz</h1><p class="sous">Les circuits électriques</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Pour qu'une lampe s'allume dans un circuit électrique, que doit former le circuit ?", "choix": ["Un zigzag", "Une ligne droite", "Une boucle fermée", "Une spirale"], "bonne": 2, "explication": "Dès que la chaîne se referme sur elle-même et forme une boucle, le courant circule et la lampe brille."}, {"question": "Combien de fils conducteurs sont nécessaires pour relier une pile à une lampe afin de former un circuit complet ?", "choix": ["Un seul fil", "Trois fils", "Aucun fil", "Deux fils"], "bonne": 3, "explication": "En réalité, il en faut deux : le courant fait une boucle, il ne s'arrête pas dans la lampe."}, {"question": "Comment s'appellent les composants électriques qui possèdent deux bornes, comme une pile, une lampe ou un interrupteur ?", "choix": ["Dipôles", "Multipôles", "Monopôles", "Tripôles"], "bonne": 0, "explication": "Les composants à deux bornes s'appellent des dipôles : pile, lampe, interrupteur, moteur."}, {"question": "Quelle est la règle pour tracer les fils sur un schéma électrique normalisé ?", "choix": ["En lignes diagonales uniquement", "En pointillés", "En lignes droites avec des angles droits", "En lignes courbes"], "bonne": 2, "explication": "Pour faire un bon schéma : utilise les symboles normalisés, trace les fils en lignes droites avec des angles droits."}, {"question": "Dans un circuit en série, que se passe-t-il si l'une des lampes grille ou si l'interrupteur est ouvert ?", "choix": ["Seule la lampe grillée s'éteint", "Les autres lampes brillent plus fort", "Rien ne change", "Toutes les lampes s'éteignent"], "bonne": 3, "explication": "Si tu ouvres l'interrupteur, ou si une lampe grille, tout s'éteint, parce que la boucle est coupée."}, {"question": "Quelle est la caractéristique principale d'un circuit en dérivation (parallèle) concernant le fonctionnement des lampes ?", "choix": ["Elles clignotent alternativement", "Elles sont toutes éteintes si l'une grille", "Elles partagent le même fil unique", "Leur fonctionnement est indépendant"], "bonne": 3, "explication": "Ouvre l'interrupteur sur une branche : cette lampe s'éteint, mais l'autre continue de briller. Leurs fonctionnements sont indépendants."}, {"question": "Pourquoi les prises électriques d'une maison sont-elles branchées en dérivation ?", "choix": ["Pour qu'une lampe qui grille n'éteigne pas le frigo", "Pour augmenter la tension", "Pour que tous les appareils s'allument en même temps", "Pour économiser du fil"], "bonne": 0, "explication": "C'est pourquoi les prises de ta maison sont en dérivation : une lampe qui grille n'éteint pas le frigo."}, {"question": "Comment est constitué un circuit électrique complexe selon la vidéo ?", "choix": ["Uniquement des dipôles en série", "Uniquement des dipôles en dérivation", "Des dipôles en série formant des branches associées en dérivation", "Des piles uniquement"], "bonne": 2, "explication": "Dans un circuit complexe, des dipôles en série forment des branches, et ces branches sont elles-mêmes associées en dérivation."}, {"question": "Un technicien photovoltaïque relie des panneaux solaires en série ou en dérivation. Dans quel but ?", "choix": ["Pour les rendre plus légers", "Pour changer la couleur du courant", "Pour obtenir la tension et l'intensité voulues", "Pour faire tourner les panneaux"], "bonne": 2, "explication": "Un technicien photovoltaïque relie des panneaux solaires en série ou en dérivation pour obtenir la tension et l'intensité voulues."}, {"question": "Deux lampes sont montées en dérivation sur une même pile. L'une des deux lampes grille. Que devient la seconde lampe ?", "choix": ["Elle s'éteint aussi", "Elle continue de briller normalement", "Elle explose", "Elle clignote"], "bonne": 1, "explication": "Elle continue de briller : chaque lampe est sur sa propre branche."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
