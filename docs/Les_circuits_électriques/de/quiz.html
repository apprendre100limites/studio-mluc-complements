<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Stromkreise</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Quiz</h1><p class="sous">Elektrische Stromkreise</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Damit eine Lampe in einem Stromkreis aufleuchtet, was muss der Stromkreis bilden?", "choix": ["A Zickzack", "Eine gerade Linie", "Ein geschlossener Regelkreis", "Eine Spirale"], "bonne": 2, "explication": "Sobald sich die Kette von selbst schließt und eine Schleife bildet, zirkuliert der Strom und die Lampe scheint."}, {"question": "Wie viele Leiterdrähte werden benötigt, um eine Batterie mit einer Lampe zu verbinden, um eine vollständige Schaltung zu bilden?", "choix": ["Ein Thread", "Drei Söhne", "Kein Draht", "Zwei Söhne"], "bonne": 3, "explication": "In Wirklichkeit braucht es zwei: Der Strom macht eine Schleife, er hört nicht in der Lampe auf."}, {"question": "Wie heißen elektrische Komponenten, die zwei Anschlüsse haben, wie Batterie, Lampe oder Schalter?", "choix": ["Dipole", "Multipole", "Monopole", "Tripole"], "bonne": 0, "explication": "Die Zweipunktkomponenten werden als Dipole bezeichnet: Batterie, Lampe, Schalter, Motor."}, {"question": "Was ist die Regel für das Ziehen von Drähten auf einem Standard-Elektrikschema?", "choix": ["Nur in diagonalen Linien", "gepunktet", "in geraden Linien mit geraden Winkeln", "in gekrümmten Linien"], "bonne": 2, "explication": "Um ein gutes Schema zu erstellen: Verwendet standardisierte Symbole, verfolgt Threads in geraden Linien mit geraden Winkeln."}, {"question": "Was passiert in einer seriellen Schaltung, wenn eine der Gitterlampen oder der Schalter geöffnet ist?", "choix": ["Nur die gegrillte Lampe geht aus", "Andere Lampen leuchten stärker", "Nichts ändert sich", "Alle Lampen gehen aus"], "bonne": 3, "explication": "Wenn Sie den Schalter öffnen, oder wenn eine Grilllampe, geht alles aus, weil die Schnalle ausgeschaltet ist."}, {"question": "Was ist das Hauptmerkmal einer Bypassschaltung (parallel) für den Betrieb von Lampen?", "choix": ["Sie blinken abwechselnd", "Sie sind alle aus, wenn ein Raster", "Sie teilen den gleichen einzigartigen Thread", "Ihre Funktionsweise ist unabhängig"], "bonne": 3, "explication": "Öffnen Sie den Schalter an einem Zweig: Diese Lampe geht aus, aber die andere leuchtet weiter. Ihre Operationen sind unabhängig."}, {"question": "Warum sind die Steckdosen in einem Haus an einen Bypass angeschlossen?", "choix": ["Eine gegrillte Lampe schaltet den Kühlschrank nicht aus", "Spannungen erhöhen", "Damit sich alle Geräte gleichzeitig einschalten", "Um Draht zu sparen"], "bonne": 0, "explication": "Deshalb werden die Steckdosen Ihres Hauses umgangen: Eine Lampe, die grillt, schaltet den Kühlschrank nicht aus."}, {"question": "Wie ist eine komplexe elektrische Schaltung gemäß dem Video aufgebaut?", "choix": ["Nur serielle Dipole", "Dipole nur in Umleitung", "Serielle Dipole, die mit Umleitung assoziierte Zweige bilden", "Nur Zellen"], "bonne": 2, "explication": "In einer komplexen Schaltung bilden serielle Dipole Zweige, die ihrerseits durch Bypass zugeordnet sind."}, {"question": "Ein Photovoltaik-Techniker verbindet Solarmodule in Serie oder Bypass. Zu welchem Zweck?", "choix": ["um sie leichter zu machen", "Um die aktuelle Farbe zu ändern", "Um die erforderliche Spannung und Intensität zu erhalten", "Um die Panels zu drehen"], "bonne": 2, "explication": "Ein Photovoltaiktechniker verbindet Solarmodule in Reihe oder Bypass, um die erforderliche Spannung und Intensität zu erhalten."}, {"question": "Zwei Lampen sind an einer einzigen Batterie montiert. Eine der beiden Rasterleuchten. Was passiert mit der zweiten Lampe?", "choix": ["Sie ist auch weg.", "Es leuchtet normal weiter", "Sie explodiert.", "Es blinkt"], "bonne": 1, "explication": "Es leuchtet weiter: Jede Lampe befindet sich auf ihrem eigenen Ast."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
