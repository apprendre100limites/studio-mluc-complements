<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherkarten — Stromkreise</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Speicherkarten</h1><p class="sous">Elektrische Stromkreise</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Welche Bedingung ist notwendig, damit eine Lampe in einem Stromkreis leuchtet?", "r": "Die beiden Anschlüsse der Lampe müssen mit den beiden Anschlüssen der Batterie durch leitfähige Drähte verbunden sein, die einen geschlossenen Kreislauf bilden."}, {"q": "Was passiert, wenn die leitfähige Kette durch einen offenen Schalter abgeschnitten wird?", "r": "Der Strom zirkuliert nicht und die Lampe schaltet sich nicht ein."}, {"q": "Wie viele Drähte werden benötigt, um eine Batterie an eine Lampe anzuschließen?", "r": "Es dauert zwei, weil der Strom eine vollständige Schleife machen muss und nicht in der Lampe stoppt."}, {"q": "Was sind Zwei-Punkt-Komponenten, die als Batterie oder Lampe bezeichnet werden?", "r": "Sie werden Dipole genannt."}, {"q": "Was sind die drei Regeln, um ein gutes Schaltbild zu erstellen?", "r": "Verwenden Sie die Standardsymbole, zeichnen Sie die Drähte in geraden Linien mit geraden Winkeln und überprüfen Sie, ob das Diagramm eine geschlossene Schleife bildet."}, {"q": "Wie sind serielle Dipole angeordnet?", "r": "Sie folgen einander auf derselben einzigen Schleife."}, {"q": "Was ist die Folge, wenn ein Gitterdipol oder der Schalter in einer seriellen Schaltung öffnet?", "r": "Die Schleife wird geschnitten und alle Dipole werden gelöscht."}, {"q": "Wie sind Dipole im Bypass angeordnet?", "r": "Jeder Dipol befindet sich auf seinem eigenen Zweig, und jeder Zweig bildet eine unabhängige Schleife mit der Batterie."}, {"q": "Was passiert, wenn Sie den Schalter an einem Zweig einer Bypass-Schaltung öffnen?", "r": "Nur die Lampe dieses Zweiges ist erloschen, der andere leuchtet weiter, weil ihre Funktionen unabhängig sind."}, {"q": "Warum sind die Steckdosen in einem Haus verdrahtet Bypass?", "r": "Damit jedes Gerät unabhängig arbeitet: Eine Lampe, die grillt, schaltet den Kühlschrank nicht aus."}, {"q": "Wie ist eine komplexe Schaltung gemäß dem Video aufgebaut?", "r": "Serielle Dipole bilden Zweige, und diese Zweige sind in der Ableitung assoziiert."}, {"q": "Gibt ein Beispiel für einen Handel, der serielle oder Bypass-Verdrahtung verwendet, um eine präzise Spannung und Intensität zu erzielen.", "r": "Ein Photovoltaik-Techniker verbindet Solarmodule in Serie oder Bypass."}, {"q": "Warum schalten wir den Strom ab, bevor wir eine elektrische Installation reparieren?", "r": "Weil eine Schaltung eine geschlossene Schleife von Leitern ist; Schneiden Sie den Strom öffnet die Schleife und stoppt den Stromfluss."}, {"q": "Zwei Lampen werden umgangen und ein Gitter. Was passiert mit dem anderen?", "r": "Es leuchtet weiter, weil sich jede Lampe auf ihrem eigenen unabhängigen Zweig befindet."}, {"q": "Was zirkuliert in den Drähten eines geschlossenen Stromkreises?", "r": "Der elektrische Strom zirkuliert und überträgt elektrische Energie von der Batterie zur Lampe."}, {"q": "Sind die Dipolsymbole in allen Ländern gleich?", "r": "Ja, es sind standardisierte Symbole, die auf der ganzen Welt identisch sind."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
