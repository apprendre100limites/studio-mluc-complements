<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطاقات الذاكرة - دوائر كهربائية</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>بطاقات الذاكرة</h1><p class="sous">الدوائر الكهربائية</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "ما هو الشرط الضروري للمصباح لإضاءة في دائرة؟", "r": "ويجب أن تكون محطتا المصباح متصلتين بمحطة البطارية بواسطة أسلاك موصلية تشكل حلقة مغلقة."}, {"q": "ماذا يحدث لو تم قطع سلسلة السلوك بواسطة مفتاح مفتوح؟", "r": "التيار لا يعمم ولا يتحول المصباح"}, {"q": "كم عدد الأسلاك اللازمة لربط البطارية بمصباح؟", "r": "يتطلب الأمر إثنين لأن التيار يجب أن يكون حلقة كاملة ولا يتوقف في المصباح"}, {"q": "ما هي المكونات ذات النقطتين التي تسمى البطارية أو المصباح؟", "r": "يُدعى (ديبولز)"}, {"q": "ما هي القواعد الثلاثة لصنع رسم بياني لدائرة جيدة؟", "r": "استخدم الرموز القياسية، ورسم الأسلاك في خطوط مستقيمة مع زوايا مستقيمة، والتحقق من أن الرسم البياني يشكل حلقة مغلقة."}, {"q": "كيف يتم ترتيب الأقراص المتسلسلة؟", "r": "يتبعون بعضهم البعض على نفس الحلقة الواحدة"}, {"q": "ما هي النتيجة إذا فتحت شبكة أو التبديل في دائرة متسلسلة؟", "r": "الحلقة مقطوعة وكل الأقطاب مهجورة"}, {"q": "كيف يتم ترتيب ديبوليس في التفافية؟", "r": "كل ديبول في فرعه الخاص وكل فرع يشكل حلقة مستقلة مع البطارية"}, {"q": "ماذا يحدث إذا فتحت مفتاح على فرع من دائرة التفاف؟", "r": "ومصباح هذا الفرع هو الوحيد الذي ينهى، والآخر لا يزال يلمع لأن وظائفه مستقلة."}, {"q": "لماذا المنافذ الكهربائية في منزل محمول بالطرق الجانبية؟", "r": "بحيث يعمل كل جهاز بشكل مستقل: مصباح لا يغلق الثلاجة."}, {"q": "كيف هي الدائرة المعقدة التي تتكون وفقا للفيديو؟", "r": "وتشكل الأقطاب المتسلسلة فروعاً، وترتبط هذه الفروع بالتنشيط."}, {"q": "يقدم مثالاً على التجارة التي تستخدم أسلاك متسلسلة أو متقطعة لتحقيق الفولط والكثافة الدقيقتين.", "r": "تقني فولتايك يربط الألواح الشمسية في سلسلة أو عبرية."}, {"q": "لماذا نغلق الكهرباء قبل إصلاح تركيب كهربائي؟", "r": "لأن الدائرة هي حلقة مغلقة من الموصلين؛ وقطع الحلقة الحالية ووقف التداول الحالي."}, {"q": "مصباحان مخترقان وشبكة واحدة ماذا يحدث للآخر؟", "r": "وهي لا تزال تشرق لأن كل مصباح على فرعها المستقل."}, {"q": "ما الذي يدور في أسلاك دائرة مغلقة؟", "r": "التيار الكهربائي يعمّم، ينقل الطاقة الكهربائية من البطارية إلى المصباح."}, {"q": "هل رموز ديبول هي نفسها في جميع البلدان؟", "r": "نعم، إنها رموز موحدة، متطابقة في جميع أنحاء العالم."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
