<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كوز - دوائر كهربائية</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>Quiz</h1><p class="sous">الدوائر الكهربائية</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "من أجل مصباح للضوء في دائرة كهربائية، ماذا يجب أن شكل الدائرة؟", "choix": ["سحابة", "خط مستقيم", "حلقة مغلقة", "دوامة"], "bonne": 2, "explication": "بمجرد أن تغلق السلسلة على نفسها وتشكل حلقة، يعمّم حاليا والمصباح."}, {"question": "كم عدد الأسلاك الموصلية اللازمة لربط البطارية بمصباح لتكوين دائرة كاملة؟", "choix": ["خيط واحد", "ثلاثة أبناء", "لا سلك", "ولدان"], "bonne": 3, "explication": "وفي الواقع، يتطلب الأمر اثنين: فالتيار يجعل حلقة، ولا يتوقف في المصباح."}, {"question": "ما هي أسماء المكونات الكهربائية التي لديها محطتين طرفيتين، مثل البطارية أو المصباح أو التبديل؟", "choix": ["Dipoles", "Multipoles", "الأورام", "Tripoles"], "bonne": 0, "explication": "وتسمى العناصر المكونة من نقطتين: البطارية، والمصباح، والمفتاح، والمحرك."}, {"question": "ما هي قاعدة رسم الأسلاك على نظام كهربائي موحد؟", "choix": ["في خطوط تشخيصية فقط", "Dotted", "في خطوط مستقيمة مع زوايا مستقيمة", "في خطوط منحنية"], "bonne": 2, "explication": "لجعل الشيمة جيدة: استخدام الرموز الموحدة، المسارات خيوط في خطوط مستقيمة مع زوايا مستقيمة."}, {"question": "في دائرة متسلسلة، ماذا سيحدث لو فتح أحد مصابيح الشبكة أو مفتاح التبديل؟", "choix": ["فقط المصباح المشوي يخرج", "مصابيح أخرى تشرق بقوة", "لا شيء يتغير", "جميع المصابيح تخرج"], "bonne": 3, "explication": "إذا فتحت المفتاح، أو إذا كان مصباحاً رمادياً، كل شيء ينفجر، لأن الدوق مطفأ."}, {"question": "ما هي السمة الرئيسية للدائرة التفافية (الموازية) فيما يتعلق بتشغيل المصابيح؟", "choix": ["يَضْربونَ بالتناوب", "جميعهم مغادرون إذا كانت شبكة واحدة", "يتشاركون نفس الخيط الفريد", "عملها مستقل"], "bonne": 3, "explication": "افتح المفتاح على فرع واحد هذا المصباح ينفجر لكن الآخر لا يزال يلمع عملياتهم مستقلة"}, {"question": "لماذا المنافذ الكهربائية في منزل متصل بمجاز؟", "choix": ["لذا المصباح المشوي لا يطفئ الثلاجة", "زيادة التوتر", "حتى تتحول جميع الأجهزة في نفس الوقت", "لإنقاذ الأسلاك"], "bonne": 0, "explication": "هذا هو السبب في أن جوارب منزلك تم تجاوزها: مصباح لا يغلق الثلاجة."}, {"question": "كيف هي دائرة كهربائية معقدة مصنوعة وفقا للفيديو؟", "choix": ["الأقراص المتسلسلة فقط", "الأقراص في التحويل فقط", "الأقطاب المتسلسلة التي تشكل فروعا مرتبطة بالتحويل", "الخلايا فقط"], "bonne": 2, "explication": "In a complex circuit, sequence dipoles form branches, and these branches are themselves associated by by by by bypass."}, {"question": "تقني فولتايك يربط الألواح الشمسية في سلسلة أو عبرية. لأي غرض؟", "choix": ["لجعلها خفيفة", "لتغيير اللون الحالي", "الحصول على الفولط والكثافة المطلوبة", "لتحويل الألواح"], "bonne": 2, "explication": "ويربط تقني فولطية الضوئية الألواح الشمسية في سلسلة أو عبرية للحصول على الفولط والكثافة المطلوبة."}, {"question": "مصباحان على بطارية واحدة واحد من مصباحي الشبكة ماذا يحدث للمصباح الثاني؟", "choix": ["لقد رحلت أيضاً", "انها لا تزال تشرق عادة", "إنها تنفجر", "إنه يلمض"], "bonne": 1, "explication": "وهي لا تزال تشرق: كل مصباح على فرعه الخاص."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
