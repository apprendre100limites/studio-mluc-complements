<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Electrical circuits</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Quiz</h1><p class="sous">Electrical circuits</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "For a lamp to light up in an electric circuit, what must the circuit form?", "choix": ["A zigzag", "A straight line", "A closed loop", "A spiral"], "bonne": 2, "explication": "As soon as the chain closes on itself and forms a loop, the current circulates and the lamp shines."}, {"question": "How many conductor wires are needed to connect a battery to a lamp to form a complete circuit?", "choix": ["One thread", "Three sons", "No wire", "Two sons"], "bonne": 3, "explication": "In reality, it takes two : the current makes a loop, it does not stop in the lamp."}, {"question": "What are the names of electrical components that have two terminals, such as a battery, lamp or switch?", "choix": ["Dipoles", "Multipoles", "Monopoles", "Tripoles"], "bonne": 0, "explication": "The two-point components are called dipoles: battery, lamp, switch, motor."}, {"question": "What is the rule for drawing wires on a standard electrical scheme?", "choix": ["In diagonal lines only", "Dotted", "In straight lines with straight angles", "In curved lines"], "bonne": 2, "explication": "To make a good schema: uses standardized symbols, tracks threads in straight lines with straight angles."}, {"question": "In a serial circuit, what happens if one of the grid lamps or the switch is opened?", "choix": ["Only the grilled lamp goes out", "Other lamps shine stronger", "Nothing changes", "All lamps go out"], "bonne": 3, "explication": "If you open the switch, or if a grille lamp, everything goes off, because the buckle is off."}, {"question": "What is the main feature of a bypass circuit (parallel) concerning the operation of lamps?", "choix": ["They flash alternately", "They're all off if one grid", "They share the same unique thread", "Their functioning is independent"], "bonne": 3, "explication": "Open the switch on one branch: this lamp goes off, but the other one continues to shine. Their operations are independent."}, {"question": "Why are the electrical outlets in a house connected to a bypass?", "choix": ["So a grilled lamp doesn't turn off the fridge", "To increase tension", "So that all devices turn on at the same time", "To save wire"], "bonne": 0, "explication": "That's why the sockets of your house are bypassed: a lamp that grills does not turn off the fridge."}, {"question": "How is a complex electrical circuit made up according to the video?", "choix": ["Serial dipoles only", "Dipoles in diversion only", "Serial dipoles forming branches associated with diversion", "Cells only"], "bonne": 2, "explication": "In a complex circuit, serial dipoles form branches, and these branches are themselves associated by bypass."}, {"question": "A photovoltaic technician connects solar panels in series or by-pass. For what purpose?", "choix": ["To make them lighter", "To change the current color", "To obtain the required voltage and intensity", "To turn the panels"], "bonne": 2, "explication": "A photovoltaic technician connects solar panels in series or by-pass to obtain the required voltage and intensity."}, {"question": "Two lamps are mounted on a single battery. One of the two grid lamps. What happens to the second lamp?", "choix": ["She's also gone.", "It continues to shine normally", "She explodes.", "It flashes"], "bonne": 1, "explication": "It continues to shine: each lamp is on its own branch."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
