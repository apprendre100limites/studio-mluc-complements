<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory cards — Electrical circuits</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Memory cards</h1><p class="sous">Electrical circuits</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "What condition is necessary for a lamp to light up in a circuit?", "r": "The two terminals of the lamp must be connected to the two terminals of the battery by conductive wires forming a closed loop."}, {"q": "What happens if the conductive chain is cut off by an open switch?", "r": "The current does not circulate and the lamp does not turn on."}, {"q": "How many wires are needed to connect a battery to a lamp?", "r": "It takes two because the current must make a complete loop and does not stop in the lamp."}, {"q": "What are two-point components called a battery or a lamp?", "r": "They're called dipoles."}, {"q": "What are the three rules for making a good circuit diagram?", "r": "Use the standard symbols, draw the wires in straight lines with straight angles, and check that the diagram forms a closed loop."}, {"q": "How are serial dipoles arranged?", "r": "They follow each other on the same single loop."}, {"q": "What is the consequence if a grid dipole or the switch opens in a serial circuit?", "r": "The loop is cut and all the dipoles are extinguished."}, {"q": "How are dipoles arranged in bypass?", "r": "Each dipole is on its own branch, and each branch forms an independent loop with the battery."}, {"q": "What happens if you open the switch on a branch of a bypass circuit?", "r": "Only the lamp of this branch is extinguished, the other one continues to shine because their functions are independent."}, {"q": "Why are the electrical outlets in a house wired by-pass?", "r": "So that each device works independently: a lamp that grills does not turn off the refrigerator."}, {"q": "How is a complex circuit made up according to the video?", "r": "Serial dipoles form branches, and these branches are associated in derivation."}, {"q": "Gives an example of a trade that uses serial or bypass wiring to achieve precise voltage and intensity.", "r": "A photovoltaic technician connects solar panels in series or by-pass."}, {"q": "Why do we shut down the power before repairing an electrical installation?", "r": "Because a circuit is a closed loop of conductors; cut the current opens the loop and stops the current circulation."}, {"q": "Two lamps are bypassed and one grid. What happens to the other one?", "r": "It continues to shine because each lamp is on its own independent branch."}, {"q": "What circulates in the wires of a closed circuit?", "r": "The electric current circulates, transferring electrical energy from the battery to the lamp."}, {"q": "Are the dipole symbols the same in all countries?", "r": "Yes, they are standardized symbols, identical throughout the world."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
