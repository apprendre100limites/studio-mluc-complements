<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionário — Pharos 1/4: O arquivo</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências </div><h1>Quiz</h1><p class="sous">Caso Pharos 1/4: O arquivo</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Qual é o nome da ilha onde estava localizado o farol de Alexandria?", "choix": ["A ilha de Creta", "Chipre", "A ilha de Pharos", "A ilha de Rodes"], "bonne": 2, "explication": "O texto diz: \"Onde está ele? Na ilha de Pharos, fora do porto de Alexandria.\""}, {"question": "De onde vem a palavra \"luz\" na nossa língua?", "choix": ["Do nome da ilha de Pharos", "Da palavra grega que significa \"luz\"", "Pelo nome de Rei Ptolomeu Primeiro", "Pelo nome do arquiteto que a construiu"], "bonne": 0, "explication": "O texto afirma: \"É por este nome que a nossa palavra \"luz\" vem.\""}, {"question": "Sob qual rei o farol começou por volta de 297 A.C.?", "choix": ["Ptolomeu Segundo", "Cleópatra", "Alexandre, o Grande", "Ptolomeu Primeiro"], "bonne": 3, "explication": "O texto menciona: \"O local de construção começa cerca de duzentos e noventa e sete antes de Jesus Cristo, sob o Rei Ptolomeu Primeiro.\""}, {"question": "Quanto tempo durou a construção do farol de acordo com o texto?", "choix": ["Cerca de 15 anos", "Um século", "Cerca de 50 anos", "Dois anos"], "bonne": 0, "explication": "O texto afirma: \"Levou apenas 15 anos para erguer esta torre.\""}, {"question": "Que evento causou a queda do farol em 8 de agosto de 1303?", "choix": ["Tsunami", "Fogo", "Um terremoto", "Uma guerra"], "bonne": 2, "explication": "O texto afirma: \"Uma nota escrita nos anais [...] diz que um grande terremoto atingiu Alexandria e derrubou o farol.\""}, {"question": "Qual é a altura aproximada do farol dada pelos pesquisadores de Pharos?", "choix": ["Cerca de 30 metros", "Cerca de 50 metros", "Cerca de 150 metros", "Cerca de 103 metros"], "bonne": 3, "explication": "O texto afirma: \"De acordo com os pesquisadores do projeto Pharos, tinha cerca de cento e três metros de altura.\""}, {"question": "Quantas famílias de pistas usam para realizar o inquérito ao farol?", "choix": ["Quatro", "Três", "Dois", "Cinco"], "bonne": 0, "explication": "O texto lista explicitamente: \"Então os pesquisadores realizam a pesquisa com quatro famílias de pistas.\""}, {"question": "Qual dessas propostas NÃO é uma das quatro famílias de índices utilizadas pelos pesquisadores?", "choix": ["Vídeo testemunhos da época", "Textos antigos", "Moeda", "Os restos submarinos"], "bonne": 0, "explication": "O texto lista textos, moedas, vestígios e modelos numéricos. Não se trata de provas em vídeo."}, {"question": "Segundo Pline, o farol custou 800 talentos. Se um talento pesa 21,4 kg, que massa de dinheiro representa?", "choix": ["8 toneladas", "12 toneladas", "17 toneladas", "25 toneladas"], "bonne": 2, "explication": "O texto calcula: \"Oitocentos talentos, portanto, representam cerca de dezessete toneladas de dinheiro.\""}, {"question": "Qual é a principal função do farol de acordo com as especificações descritas no vídeo?", "choix": ["Trigo para a cidade", "Guia navios noturnos ao longo de uma costa perigosa", "Serviu como Palácio Real", "Serviu como torre de vigia militar"], "bonne": 1, "explication": "O texto define: \"Função principal: orientar navios. Em outras palavras, guiar navios de noite ao longo de uma costa perigosa.\""}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
