<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folhas de factos — Processo Pharos 1/4: O processo</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências </div><h1>Cartões de memória</h1><p class="sous">Caso Pharos 1/4: O arquivo</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "Onde estava o farol de Alexandria e de onde veio a palavra \"luz principal\"?", "r": "Estava localizado na ilha de Pharos, em frente ao porto de Alexandria, e a palavra \"luz frontal\" vem do nome desta ilha."}, {"q": "Qual era o status do farol de Alexandria entre as maravilhas do mundo antigo?", "r": "Ele foi considerado uma das sete maravilhas do mundo antigo."}, {"q": "Quando começou o farol e sob que governante?", "r": "O site começou por volta de 297 a.C. sob o rei Ptolomeu I."}, {"q": "Quem completou a construção do farol e entre que anos?", "r": "Foi concluído sob Ptolomeu II, entre 283 e 281 BC."}, {"q": "Quanto tempo durou o farol?", "r": "Cerca de quinze anos, que foi um tempo recorde para o tempo."}, {"q": "Qual foi o custo do farol de talentos e quanto é em toneladas de dinheiro?", "r": "O custo era oitocentos talentos, ou cerca de dezessete toneladas de dinheiro."}, {"q": "Como é que este custo se compara ao do Parthenon de Atenas?", "r": "O farol era mais caro, com o Partenon custando pouco mais de 12 toneladas de dinheiro."}, {"q": "Qual era a altura aproximada do farol e a que correspondia em número de andares?", "r": "Tinha cerca de 103 metros de altura, a altura de um edifício de trinta andares."}, {"q": "Qual era a característica arquitetônica do farol de Alexandria?", "r": "Consistiu em três seções sobrepostas e terminou com uma estátua no topo."}, {"q": "Que evento causou a queda do farol em 8 de agosto de 1303?", "r": "Um grande terremoto causou o colapso do farol e um terço de Alexandria."}, {"q": "O que aconteceu com as pedras do farol depois da queda?", "r": "Eles primeiro serviram como uma carreira, e eventualmente desapareceram sob as águas do Mediterrâneo."}, {"q": "Quais são as quatro famílias de pistas usadas pelos pesquisadores para estudar o farol?", "r": "Textos, moedas, permanecem no fundo da água e no modelo digital."}, {"q": "Quais são as três principais perguntas que orientam a pesquisa do farol?", "r": "Como era o farol, como foi construído e porque caiu."}, {"q": "Qual é a principal função do farol de acordo com as especificações?", "r": "Sua principal função é guiar navios noturnos ao longo de uma costa perigosa."}, {"q": "Identificar uma das restrições que o farol teve de cumprir para desempenhar a sua função.", "r": "Tinha de ser visível de uma longa distância, visível à noite, resistindo ao mar e ao vento, ou em pé por muito tempo."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
