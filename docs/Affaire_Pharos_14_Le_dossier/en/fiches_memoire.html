<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fact sheets — Pharos 1/4 case: The file</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Memory cards</h1><p class="sous">Pharos 1/4 case: The file</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "Where was Alexandria's lighthouse and where did the word \"headlight\" come from?", "r": "It was located on the island of Pharos, in front of the port of Alexandria, and the word \"headlight\" comes from the name of this island."}, {"q": "What was the status of Alexandria's lighthouse among the wonders of the ancient world?", "r": "He was considered one of the seven wonders of the ancient world."}, {"q": "When did the lighthouse start and under what ruler?", "r": "The site started around 297 B.C. under King Ptolemy I."}, {"q": "Who completed the construction of the lighthouse and between what years?", "r": "It was completed under Ptolemy II, between 283 and 281 BC."}, {"q": "How long did the lighthouse last?", "r": "About fifteen years, which was a record time for the time."}, {"q": "What was the cost of the talent lighthouse and how much is it in tons of money?", "r": "The cost was eight hundred talents, or about seventeen tons of money."}, {"q": "How does this cost compare to that of the Athens Parthenon?", "r": "The lighthouse was more expensive, with the Parthenon costing just over 12 tons of money."}, {"q": "What was the approximate height of the lighthouse and what did it correspond to in number of floors?", "r": "It was about 103 metres high, the height of a thirty-storey building."}, {"q": "What was the architectural feature of Alexandria's lighthouse?", "r": "It consisted of three superimposed sections and ended with a statue at the top."}, {"q": "What event caused the fall of the lighthouse on August 8, 1303?", "r": "A large earthquake caused the lighthouse and one third of Alexandria to collapse."}, {"q": "What became of the lighthouse stones after its fall?", "r": "They first served as a career, and eventually disappeared under the waters of the Mediterranean."}, {"q": "What are the four families of clues used by researchers to study the lighthouse?", "r": "Texts, coins, remains at the bottom of the water and the digital model."}, {"q": "What are the three main questions that guide the lighthouse survey?", "r": "What the lighthouse looked like, how it was built, and why it fell."}, {"q": "What is the main function of the lighthouse according to the specifications?", "r": "Its main function is to guide night ships along a dangerous coast."}, {"q": "Identify one of the constraints that the lighthouse had to meet to perform its function.", "r": "It had to be visible from a long distance, visible at night, resisting the sea and the wind, or standing for a long time."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
