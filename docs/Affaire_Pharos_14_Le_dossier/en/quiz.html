<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Pharos 1/4: The file</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}

@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Quiz</h1><p class="sous">Pharos 1/4 case: The file</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What is the name of the island on which Alexandria's lighthouse was located?", "choix": ["The island of Crete", "Cyprus", "The island of Pharos", "The island of Rhodes"], "bonne": 2, "explication": "The text states: \"Where is he? On the island of Pharos, just outside the port of Alexandria.\""}, {"question": "Where does the word \"light\" come from in our language?", "choix": ["From the name of the island of Pharos", "From the Greek word meaning \"light\"", "By the name of King Ptolemy First", "By the name of the architect who built it"], "bonne": 0, "explication": "The text states: \"It is by this name that our word \"headlight\" comes.\""}, {"question": "Under which king did the lighthouse site start around 297 B.C.?", "choix": ["Ptolemy Second", "Cleopatra", "Alexander the Great", "Ptolemy First"], "bonne": 3, "explication": "The text mentions: \"The construction site starts about two hundred and ninety-seven before Jesus Christ, under King Ptolemy First.\""}, {"question": "How long did the construction of the lighthouse last according to the text?", "choix": ["About 15 years", "A century", "About 50 years", "Two years"], "bonne": 0, "explication": "The text states: \"It took only 15 years to raise this tower.\""}, {"question": "What event caused the fall of the lighthouse on August 8, 1303?", "choix": ["Tsunami", "Fire", "An earthquake", "A war"], "bonne": 2, "explication": "The text states: \"A note written in the annals [...] says that a great earthquake struck Alexandria and dropped the lighthouse.\""}, {"question": "What is the approximate height of the lighthouse given by Pharos researchers?", "choix": ["About 30 meters", "About 50 meters", "About 150 metres", "About 103 meters"], "bonne": 3, "explication": "The text states: \"According to the researchers of the Pharos project, it was about one hundred and three metres tall.\""}, {"question": "How many families of clues do researchers use to conduct the lighthouse survey?", "choix": ["Four", "Three", "Two", "Five"], "bonne": 0, "explication": "The text explicitly lists: \"Then the researchers conduct the survey with four families of clues.\""}, {"question": "Which of these proposals is NOT one of the four families of indices used by researchers?", "choix": ["Video testimonies of the time", "Ancient texts", "Currency", "The underwater remains"], "bonne": 0, "explication": "The text lists texts, currencies, vestiges and numerical models. It's not about video evidence."}, {"question": "According to Pline the Elder, the lighthouse cost 800 talents. If a talent weighs 21.4 kg, what mass of money does it represent?", "choix": ["8 tonnes", "12 tonnes", "17 tonnes", "25 tonnes"], "bonne": 2, "explication": "The text calculates: \"Eight hundred talents, therefore, represent about seventeen tons of money.\""}, {"question": "What is the main function of the lighthouse according to the specifications described in the video?", "choix": ["Stocking wheat for the city", "Guide night ships along a dangerous coast", "Served as Royal Palace", "Served as military watchtower"], "bonne": 1, "explication": "The text defines: \"Main function: to guide ships. In other words, guide ships by night along a dangerous coast.\""}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
