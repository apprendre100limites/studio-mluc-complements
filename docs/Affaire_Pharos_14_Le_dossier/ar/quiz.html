<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Pharos 1/4: The file</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>Quiz</h1><p class="sous">قضية الصور 1/4: الملف</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ما اسم الجزيرة التي يوجد عليها منارة (أليكساندريا)؟", "choix": ["جزيرة كريت", "قبرص", "جزيرة بهاروس", "جزيرة رودس"], "bonne": 2, "explication": "النص يقول: \"أين هو؟ على جزيرة (بهاروس) خارج ميناء (ألكسندريا)"}, {"question": "من أين تأتي كلمة \"الضوء\" بلغتنا؟", "choix": ["من اسم جزيرة بهاروس", "من الكلمة اليونانية تعني \"الضوء\"", "باسم الملك (بتوليمي) أولاً", "بإسم المعماري الذي بنيه"], "bonne": 0, "explication": "النص يقول: \"بهذا الاسم تأتي كلمة \"الضوء\""}, {"question": "تحت أي ملك بدأ موقع المنارة حوالي 297 بي سي؟", "choix": ["المرحلة الثانية", "Cleopatra", "الكسندر العظيم", "أولاً"], "bonne": 3, "explication": "النص يذكر: \"موقع البناء يبدأ بحوالي مئتين وسبعة وتسعين قبل المسيح تحت الملك (بتوليمي) أولاً\""}, {"question": "منذ متى بناء المنارة وفقاً للنص؟", "choix": ["حوالي 15 سنة", "قرن", "حوالي 50 سنة", "سنتان"], "bonne": 0, "explication": "النص يقول: \"لم يستغرق سوى 15 عاما لرفع هذا البرج.\""}, {"question": "أي حدث سبب سقوط المنارة في 8 آب/أغسطس 1303؟", "choix": ["تسونامي", "النار", "زلزال", "حرب"], "bonne": 2, "explication": "النص ينص على: \"مذكرة مكتوبة في الأناليس [...] تقول أن زلزال عظيم ضرب أليكساندريا وأسقط المنارة.\""}, {"question": "ما هو الارتفاع التقريبي للمنارة التي أعطاها باحثو (فيروس)؟", "choix": ["حوالي 30 مترا", "حوالي 50 متر", "حوالي 150 مترا", "حوالي 103 أمتار"], "bonne": 3, "explication": "النص ينص على: \"وفقاً لباحثي مشروع (فيروس) كان طوله حوالي مائة و ثلاثة أمتار\""}, {"question": "كم عدد أسر الدلائل التي يستخدمها الباحثون لإجراء مسح للمنارة؟", "choix": ["أربعة", "ثلاثة", "اثنان", "خمسة"], "bonne": 0, "explication": "النص يذكر بوضوح: \"ثم يقوم الباحثون بإجراء الدراسة الاستقصائية مع أربع عائلات من الأدلة.\""}, {"question": "أي من هذه المقترحات ليست واحدة من أربع أسر من المؤشرات التي يستخدمها الباحثون؟", "choix": ["شهادات الفيديو", "النصوص البارزة", "العملة", "تبقى تحت الماء"], "bonne": 0, "explication": "ويتضمن النص قائمة بالنصوص والعملات والملابس والنماذج العددية. الأمر لا يتعلق بأدلة الفيديو"}, {"question": "وفقاً لـ (بلاين) الكبير، المنارة تكلف 800 موهبة. إذا كانت الموهبة تزن 21.4 كيلوغراماً، ما هي كمية المال التي تمثلها؟", "choix": ["8 أطنان", "12 طنا", "17 طنا", "25 طناً"], "bonne": 2, "explication": "النص يحسب: \"ثمانمائة موهبة، لذلك، تمثل حوالي سبعة عشر طنا من المال.\""}, {"question": "ما هي الوظيفة الرئيسية للمنارة وفقا للمواصفات المبينة في الفيديو؟", "choix": ["قمح تخزين للمدينة", "السفن الليلية على طول ساحل خطير", "خدم في القصر الملكي", "خدم كبرج مراقبة عسكري"], "bonne": 1, "explication": "النص يُعرّفُ: \"عمل ماين: لإرشاد السفنِ. وبعبارة أخرى، توجيه السفن في الليل على طول ساحل خطير.\""}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
