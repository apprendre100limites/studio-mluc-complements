<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صحيفة وقائع - قضية Pharos 1/4: الملف</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>بطاقات الذاكرة</h1><p class="sous">قضية الصور 1/4: الملف</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "من أين كان منزل (أليكساندريا) ومن أين جاءت كلمة \"الضوء\" ؟", "r": "كانت موجودة في جزيرة (باروس) أمام ميناء (ألكسندريا) و كلمة \"الضوء\" تأتي من اسم هذه الجزيرة"}, {"q": "ما كان وضع منارة أليكساندريا بين عجائب العالم القديم؟", "r": "كان يعتبر أحد العجائب السبعة للعالم القديم"}, {"q": "متى بدأ المنارة وتحت أي حاكم؟", "r": "The site started around 297 B.C. under King Ptolemy I."}, {"q": "من أكمل بناء المنارة وما بين السنوات؟", "r": "وقد أُنجزت في إطار المرحلة الثانية، بين 283 و 281 BC."}, {"q": "كم مضى من الوقت على المنارة؟", "r": "حوالي خمسة عشر عاماً، وهو وقت قياسي للوقت"}, {"q": "ما هي تكلفة منارة المواهب وكم هو في طن من المال؟", "r": "وكانت التكلفة ثمانمائة موهبة، أو نحو سبعة عشر طنا من المال."}, {"q": "كيف تقارن هذه التكلفة مع تكلفة أثينا بارتينون؟", "r": "المنارة كانت أكثر تكلفة، مع باستنون تكلف فقط أكثر من 12 طن من المال."}, {"q": "ما هو الارتفاع التقريبي للمنارة وما هو المقابل في عدد الطوابق؟", "r": "كان مرتفعاً بحوالي 103 أمتار، طول مبنى بطابق ثلاثين."}, {"q": "ما هي السمة المعمارية في منارة أليكساندريا؟", "r": "وتألفت من ثلاثة أقسام زائدة عن الحاجة وانتهت بتمثال في القمة."}, {"q": "أي حدث سبب سقوط المنارة في 8 آب/أغسطس 1303؟", "r": "زلزال كبير تسبب في انهيار المنارة وثلث الكساندريا"}, {"q": "ماذا أصبح من الحجارة المنارة بعد سقوطها؟", "r": "وقد عملوا أول مرة كمهنة، وفي نهاية المطاف اختفوا تحت مياه البحر الأبيض المتوسط."}, {"q": "ما هي الأسر الأربع التي تستخدمها الباحثون لدراسة المنارة؟", "r": "ولا تزال النصوص والعملات في قاع المياه والنموذج الرقمي."}, {"q": "ما هي الأسئلة الرئيسية الثلاثة التي تسترشد بها الدراسة الاستقصائية عن المنارة؟", "r": "كيف كان شكل المنارة وكيف تم بناؤه ولماذا سقط"}, {"q": "ما هي الوظيفة الرئيسية للمنارة وفقاً للمواصفات؟", "r": "مهمتها الرئيسية هي توجيه السفن الليلية على طول ساحل خطير."}, {"q": "تحديد أحد القيود التي يتعين على المنارة أن تلبيها لأداء وظيفتها.", "r": "كان يجب أن يكون مرئياً من مسافة طويلة، مرئياً في الليل، ومقاوماً للبحر والريح، أو واقفاً لفترة طويلة."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
