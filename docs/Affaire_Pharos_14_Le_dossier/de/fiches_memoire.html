<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fact Sheets — Pharos 1/4 Fall: Die Datei</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften </div><h1>Speicherkarten</h1><p class="sous">Pharos 1/4 Fall: Die Datei</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Wo war Alexandrias Leuchtturm und woher kam das Wort \"Scheinwerfer\"?", "r": "Es befand sich auf der Insel Pharos, vor dem Hafen von Alexandria, und das Wort \"Scheinwerfer\" kommt vom Namen dieser Insel."}, {"q": "Was war der Status von Alexandrias Leuchtturm unter den Wundern der antiken Welt?", "r": "Er galt als eines der sieben Wunder der antiken Welt."}, {"q": "Wann begann der Leuchtturm und unter welchem Herrscher?", "r": "Die Website begann um 297 v. Chr. unter König Ptolemäus I."}, {"q": "Wer hat den Bau des Leuchtturms abgeschlossen und zwischen welchen Jahren?", "r": "Es wurde unter Ptolemäus II, zwischen 283 und 281 BC abgeschlossen."}, {"q": "Wie lange hat der Leuchtturm gedauert?", "r": "Etwa fünfzehn Jahre, was eine Rekordzeit für die Zeit war."}, {"q": "Was kostete der Talent-Leuchtturm und wie viel ist er in Tonnen Geld?", "r": "Die Kosten waren achthundert Talente oder etwa siebzehn Tonnen Geld."}, {"q": "Wie hoch sind diese Kosten im Vergleich zum Athener Parthenon?", "r": "Der Leuchtturm war teurer, der Parthenon kostete etwas mehr als 12 Tonnen Geld."}, {"q": "Was war die ungefähre Höhe des Leuchtturms und was entsprach er in der Anzahl der Etagen?", "r": "Es war etwa 103 Meter hoch, die Höhe eines dreißigstöckigen Gebäudes."}, {"q": "Was war das architektonische Merkmal des Leuchtturms von Alexandria?", "r": "Es bestand aus drei übereinanderliegenden Abschnitten und endete mit einer Statue an der Spitze."}, {"q": "Welches Ereignis verursachte den Fall des Leuchtturms am 8. August 1303?", "r": "Ein großes Erdbeben ließ den Leuchtturm und ein Drittel von Alexandria zusammenbrechen."}, {"q": "Was wurde aus den Leuchtturmsteinen nach seinem Fall?", "r": "Sie dienten zuerst als Karriere und verschwanden schließlich unter den Gewässern des Mittelmeers."}, {"q": "Was sind die vier Familien von Hinweisen, die von Forschern verwendet werden, um den Leuchtturm zu studieren?", "r": "Texte, Münzen, bleiben am Boden des Wassers und des digitalen Modells."}, {"q": "Was sind die drei Hauptfragen, die die Lighthouse-Umfrage leiten?", "r": "Wie der Leuchtturm aussah, wie er gebaut wurde und warum er fiel."}, {"q": "Was ist die Hauptfunktion des Leuchtturms gemäß den Spezifikationen?", "r": "Seine Hauptfunktion ist es, Nachtschiffe entlang einer gefährlichen Küste zu führen."}, {"q": "Identifizieren Sie eine der Einschränkungen, die der Leuchtturm erfüllen musste, um seine Funktion zu erfüllen.", "r": "Es musste aus großer Entfernung sichtbar sein, nachts sichtbar, dem Meer und dem Wind widerstehend oder lange stehend."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
