<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Pharos 1/4: Die Datei</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften </div><h1>Quiz</h1><p class="sous">Pharos 1/4 Fall: Die Datei</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Wie heißt die Insel, auf der sich Alexandrias Leuchtturm befand?", "choix": ["Die Insel Kreta", "Zypern", "Die Insel Pharos", "Die Insel Rhodos"], "bonne": 2, "explication": "Der Text sagt: \"Wo ist er?\" Auf der Insel Pharos, direkt vor dem Hafen von Alexandria."}, {"question": "Woher kommt das Wort \"Licht\" in unserer Sprache?", "choix": ["Aus dem Namen der Insel Pharos", "Aus dem griechischen Wort \"Licht\"", "Mit dem Namen König Ptolemäus Erster", "Nach dem Namen des Architekten, der es gebaut hat"], "bonne": 0, "explication": "Der Text sagt: \"Es ist durch diesen Namen, dass unser Wort \"Scheinwerfer\" kommt.\""}, {"question": "Unter welchem König begann der Leuchtturm um 297 v. Chr.?", "choix": ["Ptolemäus Zweiter", "Kleopatra", "Alexander der Große", "Ptolemäus zuerst"], "bonne": 3, "explication": "Der Text erwähnt: \"Die Baustelle beginnt etwa zweihundertsiebenundneunzig vor Jesus Christus, unter König Ptolemäus zuerst.\""}, {"question": "Wie lange dauerte der Bau des Leuchtturms laut Text?", "choix": ["Etwa 15 Jahre", "Ein Jahrhundert", "Etwa 50 Jahre", "Zwei Jahre"], "bonne": 0, "explication": "Im Text heißt es: \"Es hat nur 15 Jahre gedauert, diesen Turm zu errichten.\""}, {"question": "Welches Ereignis verursachte den Fall des Leuchtturms am 8. August 1303?", "choix": ["Tsunami", "Feuer", "Ein Erdbeben", "Ein Krieg"], "bonne": 2, "explication": "Der Text besagt: \"Eine Notiz in den Annalen geschrieben [...] sagt, dass ein großes Erdbeben Alexandria getroffen und den Leuchtturm fallen gelassen.\""}, {"question": "Was ist die ungefähre Höhe des Leuchtturms, die von Pharos-Forschern angegeben wird?", "choix": ["Etwa 30 Meter", "Etwa 50 Meter", "Etwa 150 Meter", "Etwa 103 Meter"], "bonne": 3, "explication": "Im Text heißt es: \"Nach Angaben der Forscher des Pharos-Projekts war es etwa einhundertdrei Meter hoch.\""}, {"question": "Wie viele Familien von Hinweisen verwenden Forscher, um die Lighthouse-Umfrage durchzuführen?", "choix": ["Vier", "Drei", "Zwei", "Fünf"], "bonne": 0, "explication": "Der Text listet explizit auf: \"Dann führen die Forscher die Umfrage mit vier Hinweisfamilien durch.\""}, {"question": "Welcher dieser Vorschläge ist NICHT eine der vier von Forschern verwendeten Indexfamilien?", "choix": ["Video-Zeugnisse der Zeit", "Alte Texte", "Währung", "Das Unterwasser bleibt"], "bonne": 0, "explication": "Der Text listet Texte, Währungen, Überreste und numerische Modelle auf. Es geht nicht um Videobeweise."}, {"question": "Laut Pline dem Älteren kostete der Leuchtturm 800 Talente. Wenn ein Talent 21,4 kg wiegt, welche Geldmasse stellt es dar?", "choix": ["8 Tonnen", "12 Tonnen", "17 Tonnen", "25 Tonnen"], "bonne": 2, "explication": "Der Text berechnet: \"Achthundert Talente repräsentieren daher etwa siebzehn Tonnen Geld.\""}, {"question": "Was ist die Hauptfunktion des Leuchtturms gemäß den im Video beschriebenen Spezifikationen?", "choix": ["Weizen für die Stadt", "Führe Nachtschiffe entlang einer gefährlichen Küste", "diente als königlicher Palast", "diente als militärischer Wachturm"], "bonne": 1, "explication": "Der Text definiert: \"Hauptfunktion: Schiffe zu führen.\" Mit anderen Worten, führen Sie Schiffe bei Nacht entlang einer gefährlichen Küste."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
