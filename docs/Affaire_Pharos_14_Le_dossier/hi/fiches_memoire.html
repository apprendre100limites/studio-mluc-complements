<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>तथ्य पत्रक - Pharos 1/4 मामले: फ़ाइल</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान </div><h1>मेमोरी कार्ड</h1><p class="sous">Pharos 1/4 मामले: फ़ाइल</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "अलेक्जेंड्रिया का लाइटहाउस कहाँ था और \"हेडलाइट\" शब्द कहां से आया?", "r": "यह Pharos द्वीप पर स्थित था, अलेक्जेंड्रिया बंदरगाह के सामने, और \"हेडलाइट\" शब्द इस द्वीप के नाम से आता है।"}, {"q": "प्राचीन दुनिया के चमत्कारों के बीच अलेक्जेंड्रिया के प्रकाशघर की स्थिति क्या थी?", "r": "उन्हें प्राचीन दुनिया के सात आश्चर्यों में से एक माना गया था।"}, {"q": "जब लाइटहाउस शुरू हो गया और किस शासक के तहत?", "r": "साइट ने किंग Ptolemy I के तहत 297 B.C. के आसपास शुरू किया।"}, {"q": "किसने लाइटहाउस का निर्माण पूरा किया और किस साल के बीच?", "r": "यह 283 और 281 BC के बीच Ptolemy II के तहत पूरा किया गया था।"}, {"q": "लंबे समय तक चलने वाले लाइटहाउस कितने समय तक थे?", "r": "पंद्रह वर्षों के बारे में, जो समय के लिए रिकॉर्ड समय था।"}, {"q": "प्रतिभा लाइटहाउस की लागत क्या थी और यह कितना पैसा है?", "r": "लागत आठ सौ प्रतिभा थी, या लगभग सत्रह टन धन था।"}, {"q": "इस लागत की तुलना एथेंस पार्टेनोन की तुलना कैसे की जाती है?", "r": "लाइटहाउस अधिक महंगा था, जिसमें पार्टेनन ने 12 टन से अधिक पैसे खर्च किए थे।"}, {"q": "लाइटहाउस की लगभग ऊंचाई क्या थी और यह मंजिलों की संख्या में क्या था?", "r": "यह लगभग 103 मीटर ऊंचा था, तीस मंजिला इमारत की ऊंचाई।"}, {"q": "अलेक्जेंड्रिया के प्रकाशघर की वास्तुशिल्प विशेषता क्या थी?", "r": "इसमें तीन अतिरिक् त अनुभाग शामिल थे और शीर्ष पर एक प्रतिमा के साथ समाप्त हो गए।"}, {"q": "क्या घटना 8 अगस्त 1303 को लाइटहाउस के पतन का कारण बना?", "r": "एक बड़े भूकंप ने प्रकाशस्तंभ और अलेक्जेंड्रिया का एक तिहाई पतन हुआ।"}, {"q": "इसके पतन के बाद लाइटहाउस स्टोन्स क्या बन गए?", "r": "वे पहले एक कैरियर के रूप में काम करते थे और अंततः भूमध्य सागर के पानी के नीचे गायब हो गए।"}, {"q": "शोधकर्ताओं द्वारा उपयोग किए जाने वाले कुल्लू के चार परिवार क्या हैं?", "r": "पाठ, सिक्के, पानी के नीचे और डिजिटल मॉडल के नीचे रहता है।"}, {"q": "तीन मुख्य प्रश्न क्या हैं जो प्रकाश गृह सर्वेक्षण का मार्गदर्शन करते हैं?", "r": "क्या प्रकाशघर की तरह देखा गया, यह कैसे बनाया गया था, और यह क्यों गिर गया।"}, {"q": "विनिर्देशों के अनुसार लाइटहाउस का मुख्य कार्य क्या है?", "r": "इसका मुख्य कार्य एक खतरनाक तट के साथ रात के जहाजों को निर्देशित करना है।"}, {"q": "उन बाधाओं में से एक की पहचान करें जिन्हें प्रकाशघर अपने कार्य को करने के लिए पूरा करना था।", "r": "यह एक लंबी दूरी से दृश्यमान होना चाहिए, रात में दिखाई देना, समुद्र और हवा का विरोध करना, या लंबे समय तक खड़ा होना चाहिए।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
