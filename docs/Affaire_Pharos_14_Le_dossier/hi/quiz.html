<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी - Pharos 1/4: फ़ाइल</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान </div><h1>प्रश्नोत्तरी</h1><p class="sous">Pharos 1/4 मामले: फ़ाइल</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "द्वीप का नाम क्या है?", "choix": ["क्रेते द्वीप", "साइप्रस", "Pharos द्वीप", "रोड्स द्वीप"], "bonne": 2, "explication": "\"वह कहां है? Pharos द्वीप पर, अलेक्जेंड्रिया के बंदरगाह के बाहर।"}, {"question": "हमारी भाषा में \"प्रकाश\" शब्द कहां से आता है?", "choix": ["Pharos द्वीप के नाम से", "ग्रीक शब्द से जिसका अर्थ है \"प्रकाश\"", "राजा Ptolemy First के नाम से", "वास्तुकार के नाम से जिन्होंने इसे बनाया"], "bonne": 0, "explication": "पाठ कहता है: \"यह इस नाम से है कि हमारा शब्द \"हेडलाइट\" आता है।"}, {"question": "किसके तहत राजा ने लाइटहाउस साइट को 297 B.C. के आसपास शुरू किया?", "choix": ["Ptolemy दूसरा", "क्लियोपेट्रा", "अलेक्जेंडर द ग्रेट", "Ptolemy First"], "bonne": 3, "explication": "पाठ का उल्लेख: \"निर्माण स्थल किंग Ptolemy First के तहत यीशु मसीह के सामने लगभग दो सौ और नब्बे-सात शुरू होता है।"}, {"question": "कैसे लंबे समय तक पाठ के अनुसार प्रकाशस्तंभ का निर्माण किया?", "choix": ["लगभग 15 साल", "A सदी", "लगभग 50 साल", "दो साल"], "bonne": 0, "explication": "पाठ में कहा गया है: \"इस टावर को बढ़ाने के लिए केवल 15 साल लगते हैं।"}, {"question": "क्या घटना 8 अगस्त 1303 को लाइटहाउस के पतन का कारण बना?", "choix": ["सुनामी", "आग", "भूकंप", "युद्ध"], "bonne": 2, "explication": "पाठ कहता है कि एक महान भूकंप अलेक्जेंड्रिया फड़ गया और लाइटहाउस गिरा दिया।"}, {"question": "Pharos शोधकर्ताओं द्वारा दिए गए प्रकाशघर की लगभग ऊंचाई क्या है?", "choix": ["लगभग 30 मीटर", "लगभग 50 मीटर", "लगभग 150 मीटर", "लगभग 103 मीटर"], "bonne": 3, "explication": "पाठ में कहा गया है: \"Pharos परियोजना के शोधकर्ताओं के अनुसार, यह लगभग एक सौ मीटर लंबा था।"}, {"question": "कितने परिवारों के clues अनुसंधानकर्ताओं का उपयोग करने के लिए lighthouse सर्वेक्षण?", "choix": ["चार", "तीन", "दो", "पांच"], "bonne": 0, "explication": "पाठ स्पष्ट रूप से सूचीबद्ध करता है:"}, {"question": "इनमें से कौन से प्रस्ताव शोधकर्ताओं द्वारा उपयोग किए जाने वाले सूचकांकों के चार परिवारों में से एक नहीं है?", "choix": ["समय की वीडियो गवाही", "प्राचीन ग्रंथ", "मुद्रा", "पानी के नीचे रहता है"], "bonne": 0, "explication": "पाठ पाठ, मुद्राओं, vestiges और संख्यात्मक मॉडल को सूचीबद्ध करता है। यह वीडियो सबूत के बारे में नहीं है।"}, {"question": "Pline the Elder के अनुसार, Lighthouse की लागत 800 प्रतिभा है। यदि प्रतिभा का वजन 21.4 किलोग्राम है, तो यह किस राशि का प्रतिनिधित्व करता है?", "choix": ["8 टन", "12 टन", "17 टन", "25 टन"], "bonne": 2, "explication": "पाठ की गणना: \"आठ सौ प्रतिभा, इसलिए, लगभग सत्रह टन धन का प्रतिनिधित्व करते हैं।"}, {"question": "वीडियो में वर्णित विनिर्देशों के अनुसार लाइटहाउस का मुख्य कार्य क्या है?", "choix": ["शहर के लिए स्टॉकिंग गेहूं", "एक खतरनाक तट के साथ रात के जहाज गाइड", "रॉयल पैलेस के रूप में सेवा की", "सैन्य चौकीदार के रूप में सेवा की"], "bonne": 1, "explication": "पाठ परिभाषित करता है: \"मुख्य कार्य: जहाज गाइड करने के लिए। दूसरे शब्दों में, एक खतरनाक तट के साथ रात में गाइड जहाजों।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
