<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Pharos 1/4: El archivo</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}

@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Quiz</h1><p class="sous">Caso Pharos 1/4: El archivo</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Cuál es el nombre de la isla en la que se ubicaba el faro de Alejandría?", "choix": ["La isla de Creta", "Chipre", "La isla de Pharos", "La isla de Rodas"], "bonne": 2, "explication": "El texto dice: \"¿Dónde está? En la isla de Pharos, justo fuera del puerto de Alejandría.\""}, {"question": "¿De dónde viene la palabra \"luz\" en nuestro lenguaje?", "choix": ["Desde el nombre de la isla de Pharos", "De la palabra griega que significa \"luz\"", "Por el nombre del rey Ptolomeo", "Por el nombre del arquitecto que lo construyó"], "bonne": 0, "explication": "El texto dice: \"Es por este nombre que nuestra palabra \"luz\" viene.\""}, {"question": "¿De qué rey comenzó el faro alrededor de 297 A.C.?", "choix": ["Ptolemy Second", "Cleopatra", "Alexander el Grande", "Ptolomeo primero"], "bonne": 3, "explication": "El texto menciona: \"El sitio de construcción comienza alrededor de doscientos noventa y siete antes de Jesucristo, bajo el rey Ptolomeo Primero\"."}, {"question": "¿Cuánto tiempo duró la construcción del faro según el texto?", "choix": ["Cerca de 15 años", "Un siglo", "Cerca de 50 años", "Dos años"], "bonne": 0, "explication": "El texto dice: \"Hace falta sólo 15 años para levantar esta torre.\""}, {"question": "¿Qué evento causó la caída del faro el 8 de agosto de 1303?", "choix": ["Tsunami", "Fuego", "Un terremoto", "Una guerra"], "bonne": 2, "explication": "El texto dice: \"Una nota escrita en los anales [...] dice que un gran terremoto golpeó a Alejandría y dejó caer el faro.\""}, {"question": "¿Cuál es la altura aproximada del faro dado por los investigadores de Pharos?", "choix": ["A unos 30 metros", "Cerca de 50 metros", "Unos 150 metros", "Alrededor de 103 metros"], "bonne": 3, "explication": "El texto dice: \"Según los investigadores del proyecto Pharos, era de unos cien y tres metros de altura\"."}, {"question": "¿Cuántas familias de pistas usan los investigadores para realizar la encuesta del faro?", "choix": ["Cuatro.", "Tres.", "Dos.", "Cinco"], "bonne": 0, "explication": "El texto enumera explícitamente: \"Entonces los investigadores realizan la encuesta con cuatro familias de pistas\"."}, {"question": "¿Cuál de estas propuestas es NO una de las cuatro familias de índices utilizados por los investigadores?", "choix": ["Video testimonios del tiempo", "Textos antiguos", "Moneda", "Los restos submarinos"], "bonne": 0, "explication": "El texto enumera textos, monedas, vestigios y modelos numéricos. No se trata de pruebas de vídeo."}, {"question": "Según Pline el Viejo, el faro costó 800 talentos. Si un talento pesa 21.4 kg, ¿qué masa de dinero representa?", "choix": ["8 toneladas", "12 toneladas", "17 toneladas", "25 toneladas"], "bonne": 2, "explication": "El texto calcula: \"Otros cien talentos, por lo tanto, representan alrededor de diecisiete toneladas de dinero\"."}, {"question": "¿Cuál es la función principal del faro según las especificaciones descritas en el vídeo?", "choix": ["Stock de trigo para la ciudad", "Guía de barcos nocturnos a lo largo de una costa peligrosa", "Servido como Palacio Real", "Servido como vigilante militar"], "bonne": 1, "explication": "El texto define: \"La función principal: guiar los barcos. En otras palabras, guía barcos de noche a lo largo de una costa peligrosa.\""}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
