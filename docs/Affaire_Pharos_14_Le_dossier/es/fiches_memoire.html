<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fichas de datos — Caso Pharos 1/4: El archivo</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Tarjetas de memoria</h1><p class="sous">Caso Pharos 1/4: El archivo</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿De dónde vino el faro de Alejandría y de dónde vino la palabra \"luz\"?", "r": "Se encuentra en la isla de Pharos, frente al puerto de Alejandría, y la palabra \"luz de cabeza\" viene del nombre de esta isla."}, {"q": "¿Cuál era el estado del faro de Alejandría entre las maravillas del mundo antiguo?", "r": "Fue considerado una de las siete maravillas del mundo antiguo."}, {"q": "¿Cuándo comenzó el faro y bajo qué regla?", "r": "El sitio comenzó alrededor de 297 B.C. bajo el rey Ptolemy I."}, {"q": "¿Quién completó la construcción del faro y entre qué años?", "r": "Se completó bajo Ptolomeo II, entre 283 y 281 A.C."}, {"q": "¿Cuánto tiempo duró el faro?", "r": "Unos quince años, que fue un tiempo récord para el tiempo."}, {"q": "¿Cuál era el costo del faro de talento y cuánto es en toneladas de dinero?", "r": "El costo era ochocientos talentos, o cerca de diecisiete toneladas de dinero."}, {"q": "¿Cómo se compara este costo con el del Partenón de Atenas?", "r": "El faro era más caro, con el Parthenon costando sólo más de 12 toneladas de dinero."}, {"q": "¿Cuál era la altura aproximada del faro y a qué correspondía en número de pisos?", "r": "Era de unos 103 metros de altura, la altura de un edificio de treinta plantas."}, {"q": "¿Cuál era la característica arquitectónica del faro de Alejandría?", "r": "Consistió en tres secciones superpuestas y terminó con una estatua en la parte superior."}, {"q": "¿Qué evento causó la caída del faro el 8 de agosto de 1303?", "r": "Un gran terremoto hizo que el faro y un tercio de Alejandría colapsaran."}, {"q": "¿Qué pasó con las piedras del faro después de su caída?", "r": "Primero sirvieron de carrera, y eventualmente desaparecieron bajo las aguas del Mediterráneo."}, {"q": "¿Cuáles son las cuatro familias de pistas utilizadas por los investigadores para estudiar el faro?", "r": "Textos, monedas, permanece en la parte inferior del agua y el modelo digital."}, {"q": "¿Cuáles son las tres preguntas principales que guían la encuesta del faro?", "r": "Como era el faro, cómo se construyó, y por qué cayó."}, {"q": "¿Cuál es la función principal del faro según las especificaciones?", "r": "Su función principal es guiar barcos nocturnos a lo largo de una costa peligrosa."}, {"q": "Identificar una de las limitaciones que el faro tuvo que cumplir para realizar su función.", "r": "Tenía que ser visible desde una larga distancia, visible por la noche, resistiendo el mar y el viento, o de pie durante mucho tiempo."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
