<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Affaire Pharos 1/4 : Le dossier</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Quiz</h1><p class="sous">Affaire Pharos 1/4 : Le dossier</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Quel est le nom de l'île sur laquelle se trouvait le phare d'Alexandrie ?", "choix": ["L'île de Crète", "L'île de Chypre", "L'île de Pharos", "L'île de Rhodes"], "bonne": 2, "explication": "Le texte précise : \"Où se trouve-t-il ? Sur l'île de Pharos, juste devant le port d'Alexandrie.\""}, {"question": "D'où vient le mot « phare » dans notre langue ?", "choix": ["Du nom de l'île de Pharos", "Du mot grec signifiant « lumière »", "Du nom du roi Ptolémée Premier", "Du nom de l'architecte qui l'a construit"], "bonne": 0, "explication": "Le texte indique : \"C'est d'ailleurs de ce nom que vient notre mot « phare ».\""}, {"question": "Sous quel roi le chantier du phare a-t-il démarré vers 297 avant Jésus-Christ ?", "choix": ["Ptolémée Deuxième", "Cléopâtre", "Alexandre le Grand", "Ptolémée Premier"], "bonne": 3, "explication": "Le texte mentionne : \"Le chantier démarre vers deux cent quatre-vingt-dix-sept avant Jésus-Christ, sous le roi Ptolémée Premier.\""}, {"question": "Combien de temps a duré la construction du phare selon le texte ?", "choix": ["Une quinzaine d'années", "Un siècle", "Une cinquantaine d'années", "Deux ans"], "bonne": 0, "explication": "Le texte précise : \"Il a fallu seulement une quinzaine d'années pour élever cette tour.\""}, {"question": "Quel événement a causé la chute du phare le 8 août 1303 ?", "choix": ["Un tsunami", "Un incendie", "Un tremblement de terre", "Une guerre"], "bonne": 2, "explication": "Le texte rapporte : \"Une note écrite dans les annales [...] raconte qu'un grand tremblement de terre a frappé Alexandrie et fait tomber le phare.\""}, {"question": "Quelle est la hauteur approximative du phare donnée par les chercheurs du projet Pharos ?", "choix": ["Environ 30 mètres", "Environ 50 mètres", "Environ 150 mètres", "Environ 103 mètres"], "bonne": 3, "explication": "Le texte indique : \"Selon les chercheurs du projet Pharos, il mesurait environ cent trois mètres.\""}, {"question": "Combien de familles d'indices les chercheurs utilisent-ils pour mener l'enquête sur le phare ?", "choix": ["Quatre", "Trois", "Deux", "Cinq"], "bonne": 0, "explication": "Le texte liste explicitement : \"Alors les chercheurs mènent l'enquête avec quatre familles d'indices.\""}, {"question": "Laquelle de ces propositions n'est PAS une des quatre familles d'indices utilisées par les chercheurs ?", "choix": ["Les témoignages vidéo de l'époque", "Les textes antiques", "Les monnaies", "Les vestiges sous-marins"], "bonne": 0, "explication": "Le texte énumère : textes, monnaies, vestiges et modèle numérique. Il n'est pas question de témoignages vidéo."}, {"question": "Selon Pline l'Ancien, le phare a coûté 800 talents. Si un talent pèse 21,4 kg, quelle masse d'argent cela représente-t-il environ ?", "choix": ["8 tonnes", "12 tonnes", "17 tonnes", "25 tonnes"], "bonne": 2, "explication": "Le texte calcule : \"Huit cents talents, cela représente donc environ dix-sept tonnes d'argent.\""}, {"question": "Quelle est la fonction principale du phare selon le cahier des charges décrit dans la vidéo ?", "choix": ["Stocker du blé pour la ville", "Guider les navires de nuit le long d'une côte dangereuse", "Servir de palais royal", "Servir de tour de guet militaire"], "bonne": 1, "explication": "Le texte définit : \"Fonction principale : guider les navires. Autrement dit, guider les navires, de nuit, le long d'une côte dangereuse.\""}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
