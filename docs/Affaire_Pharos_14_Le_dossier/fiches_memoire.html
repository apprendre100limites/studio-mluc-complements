<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Affaire Pharos 1/4 : Le dossier</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Fiches mémoire</h1><p class="sous">Affaire Pharos 1/4 : Le dossier</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Où se trouvait le phare d'Alexandrie et d'où vient le mot « phare » ?", "r": "Il était situé sur l'île de Pharos, devant le port d'Alexandrie, et le mot « phare » vient du nom de cette île."}, {"q": "Quel était le statut du phare d'Alexandrie parmi les merveilles du monde antique ?", "r": "Il était considéré comme l'une des sept merveilles du monde antique."}, {"q": "Quand le chantier du phare a-t-il commencé et sous quel souverain ?", "r": "Le chantier a démarré vers 297 avant J.-C. sous le roi Ptolémée Ier."}, {"q": "Qui a achevé la construction du phare et entre quelles années ?", "r": "Il a été terminé sous Ptolémée II, entre 283 et 281 avant J.-C."}, {"q": "Combien de temps a duré la construction du phare ?", "r": "Environ quinze ans, ce qui était un temps record pour l'époque."}, {"q": "Quel était le coût du phare en talents et combien cela représente-t-il en tonnes d'argent ?", "r": "Le coût était de huit cents talents, soit environ dix‑sept tonnes d'argent."}, {"q": "Comment ce coût se compare-t-il à celui du Parthénon d'Athènes ?", "r": "Le phare était plus cher, le Parthénon ayant coûté un peu plus de douze tonnes d'argent."}, {"q": "Quelle était la hauteur approximative du phare et à quoi cela correspondait‑il en nombre d'étages ?", "r": "Il mesurait environ 103 mètres, soit la hauteur d'un immeuble de trente étages."}, {"q": "Quelle était la particularité architecturale du phare d'Alexandrie ?", "r": "Il était composé de trois sections superposées et se terminait par une statue au sommet."}, {"q": "Quel événement a provoqué la chute du phare le 8 août 1303 ?", "r": "Un grand tremblement de terre a fait s'effondrer le phare et un tiers de la ville d'Alexandrie."}, {"q": "Que sont devenues les pierres du phare après sa chute ?", "r": "Elles ont d'abord servi de carrière, puis ont fini par disparaître sous les eaux de la Méditerranée."}, {"q": "Quelles sont les quatre familles d'indices utilisées par les chercheurs pour étudier le phare ?", "r": "Les textes, les monnaies, les vestiges au fond de l'eau et le modèle numérique."}, {"q": "Quelles sont les trois questions principales qui guident l'enquête sur le phare ?", "r": "À quoi ressemblait le phare, comment a‑t‑il été construit, et pourquoi est‑il tombé."}, {"q": "Quelle est la fonction principale du phare selon le cahier des charges ?", "r": "Sa fonction principale est de guider les navires de nuit le long d’une côte dangereuse."}, {"q": "Citez une des contraintes que le phare devait respecter pour remplir sa fonction.", "r": "Il devait être visible de très loin, être visible de nuit, résister à la mer et au vent, ou tenir debout très longtemps."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
