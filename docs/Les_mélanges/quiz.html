<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Les mélanges</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Quiz</h1><p class="sous">Les mélanges</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Dans une solution, quel est le nom de la substance qui se dissout ?", "choix": ["solution", "soluté", "solvant", "phase"], "bonne": 1, "explication": "La substance qui se dissout s'appelle le soluté"}, {"question": "Quel est le nom du liquide qui dissout le soluté ?", "choix": ["soluté", "phase", "solution", "solvant"], "bonne": 3, "explication": "Le liquide qui la dissout s'appelle le solvant"}, {"question": "Comment s'appelle le mélange obtenu après la dissolution ?", "choix": ["soluté", "solution", "phase", "solvant"], "bonne": 1, "explication": "et le mélange obtenu s'appelle la solution"}, {"question": "Quel terme décrit un mélange où l'on ne voit qu'un seul liquide à l'œil nu ?", "choix": ["homogène", "hétérogène", "miscible", "phase"], "bonne": 0, "explication": "Une solution est un mélange homogène"}, {"question": "Comment appelle-t-on la masse maximale de soluté qu'on peut dissoudre dans un litre de solvant ?", "choix": ["solubilité", "saturation", "densité", "miscibilité"], "bonne": 0, "explication": "On l'appelle la solubilité"}, {"question": "Que se passe-t-il quand la limite de solubilité est atteinte ?", "choix": ["Le soluté se transforme en gaz", "La solution devient saturée", "Le solvant s'évapore", "Le soluté change de couleur"], "bonne": 1, "explication": "Quand cette limite est atteinte, la solution est saturée"}, {"question": "Peut-on dissoudre 50 g de sel dans un demi‑litre d'eau à 20 °C ?", "choix": ["Oui", "Non", "Seulement si on chauffe", "Impossible à dire"], "bonne": 0, "explication": "Cinquante est en dessous : oui"}, {"question": "Quel type de mélange obtient‑on en mélangeant de l'eau et du sirop de menthe ?", "choix": ["non miscible", "homogène", "hétérogène", "immiscible"], "bonne": 1, "explication": "tu obtiens un seul liquide : un mélange homogène"}, {"question": "Pourquoi l'huile flotte au-dessus de l'eau dans un mélange d'eau et d'huile ?", "choix": ["Parce qu'elle est miscible", "Parce qu'elle est moins dense", "Parce qu'elle est plus dense", "Parce qu'elle se dissout"], "bonne": 1, "explication": "L'huile flotte au-dessus, parce qu'elle est moins dense"}, {"question": "Quel professionnel utilise la notion de soluté et solvant pour préparer des quantités exactes de solutions ?", "choix": ["un peintre", "un architecte", "un agriculteur", "un pharmacien"], "bonne": 3, "explication": "Un pharmacien prépare des solutions dont la quantité de soluté doit être exacte"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
