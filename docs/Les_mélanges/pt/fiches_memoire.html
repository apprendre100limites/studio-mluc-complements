<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões de memória — Misturas</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Cartões de memória</h1><p class="sous">Misturas</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "O que é o soluto?", "r": "Soluto é a substância que se dissolve no solvente."}, {"q": "O que é o solvente?", "r": "O solvente é o líquido que dissolve o soluto."}, {"q": "O que é uma solução?", "r": "Uma solução é uma mistura homogénea de solvente e soluto."}, {"q": "O que é solubilidade?", "r": "A solubilidade é a massa máxima de soluto que pode ser dissolvida num litro de solvente."}, {"q": "O que é saturação?", "r": "Saturação é o estado onde a solução contém a solubilidade máxima de soluto."}, {"q": "O que é água doce?", "r": "Água doce é uma solução de água e açúcar."}, {"q": "O que são líquidos miscíveis?", "r": "Os líquidos miscíveis são aqueles que se misturam para formar um único líquido homogêneo."}, {"q": "O que são líquidos não miscíveis?", "r": "Os líquidos não miscíveis são aqueles que não se misturam e se separam em duas camadas."}, {"q": "Como reconhecemos uma mistura?", "r": "Uma mistura é reconhecida pela contagem do número de fases: uma fase para uma mistura homogênea, várias fases para uma mistura heterogênea."}, {"q": "O que é cozinhar sal?", "r": "O sal da cozinha é uma substância solúvel em água."}, {"q": "O que é açúcar?", "r": "O açúcar é uma substância solúvel na água, mas não no óleo."}, {"q": "Quando 50 gramas de sal podem ser dissolvidos em meio litro de água?", "r": "Sim, porque o limite de solubilidade do sal na água é de trezentos e sessenta gramas por litro, ou cento e oitenta gramas por meio litro."}, {"q": "Porque é que o petróleo flutua na água?", "r": "O óleo flutua na água porque é menos denso do que a água."}, {"q": "Qual é o sentido da dissolução?", "r": "Esses conceitos são utilizados em saúde, construção, agricultura e pesquisa, por exemplo, para preparar soluções precisas ou escolher solventes adequados."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
