<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionário — Misturas</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Quiz</h1><p class="sous">Misturas</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Numa solução, qual é o nome da substância que se dissolve?", "choix": ["solução", "soluto", "solvente", "fase"], "bonne": 1, "explication": "A substância dissolvida chama-se soluto"}, {"question": "Qual é o nome do líquido que dissolve o soluto?", "choix": ["soluto", "fase", "solução", "solvente"], "bonne": 3, "explication": "O líquido que o dissolve é chamado de solvente"}, {"question": "Qual é o nome da mistura obtida após a dissolução?", "choix": ["soluto", "solução", "fase", "solvente"], "bonne": 1, "explication": "e a mistura obtida é chamada de solução"}, {"question": "Que termo descreve uma mistura onde se vê apenas um líquido a olho nu?", "choix": ["homogêneo", "heterogéneo", "miscível", "fase"], "bonne": 0, "explication": "Uma solução é uma mistura homogênea"}, {"question": "Qual é a massa máxima de soluto que pode ser dissolvida num litro de solvente?", "choix": ["solubilidade", "saturação", "densidade", "miscibilidade"], "bonne": 0, "explication": "Chamamos-lhe solubilidade."}, {"question": "O que acontece quando o limite de solubilidade é alcançado?", "choix": ["Soluto transforma-se em gás", "A solução fica saturada", "O solvente evapora", "O soluto muda de cor"], "bonne": 1, "explication": "Quando este limite é atingido, a solução é saturada"}, {"question": "50 g de sal podem ser dissolvidos em meio litro de água a 20 °C?", "choix": ["Sim.", "Não", "Só se aquecermos", "Não foi possível dizer"], "bonne": 0, "explication": "Cinquenta está abaixo: sim"}, {"question": "Que tipo de mistura é obtida misturando água e xarope de hortelã?", "choix": ["não miscível", "homogêneo", "heterogéneo", "Imissível"], "bonne": 1, "explication": "obter um único líquido: uma mistura homogénea"}, {"question": "Por que o óleo flutua sobre a água numa mistura de água e óleo?", "choix": ["Porque ela é miscível.", "Porque é menos denso", "Porque é mais denso", "Porque ela se dissolve."], "bonne": 1, "explication": "O óleo flutua acima, porque é menos denso"}, {"question": "Qual profissional utiliza o conceito de soluto e solvente para preparar quantidades exatas de soluções?", "choix": ["um pintor", "um arquiteto", "um agricultor", "um farmacêutico"], "bonne": 3, "explication": "Um farmacêutico prepara soluções cuja quantidade de soluto deve ser precisa"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
