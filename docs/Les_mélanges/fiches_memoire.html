<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Les mélanges</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Fiches mémoire</h1><p class="sous">Les mélanges</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Qu'est-ce que le soluté ?", "r": "Le soluté est la substance qui se dissout dans le solvant."}, {"q": "Qu'est-ce que le solvant ?", "r": "Le solvant est le liquide qui dissout le soluté."}, {"q": "Qu'est-ce qu'une solution ?", "r": "Une solution est un mélange homogène de solvant et de soluté."}, {"q": "Qu'est-ce que la solubilité ?", "r": "La solubilité est la masse maximale de soluté qu'on peut dissoudre dans un litre de solvant."}, {"q": "Qu'est-ce que la saturation ?", "r": "La saturation est l'état où la solution contient la solubilité maximale de soluté."}, {"q": "Qu'est-ce que l'eau sucrée ?", "r": "L'eau sucrée est une solution d'eau et de sucre."}, {"q": "Qu'est-ce que des liquides miscibles ?", "r": "Des liquides miscibles sont ceux qui se mélangent pour former un seul liquide homogène."}, {"q": "Qu'est-ce que des liquides non miscibles ?", "r": "Des liquides non miscibles sont ceux qui ne se mélangent pas et se séparent en deux couches."}, {"q": "Comment reconnaît-on un mélange ?", "r": "On reconnaît un mélange en comptant le nombre de phases : une seule phase pour un mélange homogène, plusieurs phases pour un mélange hétérogène."}, {"q": "Qu'est-ce que le sel de cuisine ?", "r": "Le sel de cuisine est une substance soluble dans l'eau."}, {"q": "Qu'est-ce que le sucre ?", "r": "Le sucre est une substance soluble dans l'eau mais pas dans l'huile."}, {"q": "Quand peut-on dissoudre cinquante grammes de sel dans un demi-litre d'eau ?", "r": "Oui, car la limite de solubilité du sel dans l'eau est de trois cent soixante grammes par litre, soit cent quatre-vingts grammes pour un demi-litre."}, {"q": "Pourquoi l'huile flotte sur l'eau ?", "r": "L'huile flotte sur l'eau parce qu'elle est moins dense que l'eau."}, {"q": "À quoi servent les notions de dissolution ?", "r": "Ces notions servent dans la santé, le bâtiment, l'agriculture et la recherche, par exemple pour préparer des solutions exactes ou choisir des solvants adaptés."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
