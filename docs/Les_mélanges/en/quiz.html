<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Mixtures</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Quiz</h1><p class="sous">Mixtures</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "In a solution, what is the name of the substance that dissolves?", "choix": ["solution", "solute", "solvent", "phase"], "bonne": 1, "explication": "The dissolved substance is called the solute"}, {"question": "What is the name of the liquid that dissolves the solute?", "choix": ["solute", "phase", "solution", "solvent"], "bonne": 3, "explication": "The liquid that dissolves it is called the solvent"}, {"question": "What is the name of the mixture obtained after dissolution?", "choix": ["solute", "solution", "phase", "solvent"], "bonne": 1, "explication": "and the mixture obtained is called the solution"}, {"question": "What term describes a mixture where one sees only one liquid with the naked eye?", "choix": ["homogeneous", "heterogeneous", "miscible", "phase"], "bonne": 0, "explication": "A solution is a homogeneous mixture"}, {"question": "What is the maximum solute mass that can be dissolved in a litre of solvent?", "choix": ["solubility", "saturation", "density", "miscibility"], "bonne": 0, "explication": "We call it solubility."}, {"question": "What happens when the solubility limit is reached?", "choix": ["Solute transforms into gas", "The solution becomes saturated", "The solvent evaporates", "The solute changes color"], "bonne": 1, "explication": "When this limit is reached, the solution is saturated"}, {"question": "Can 50 g of salt be dissolved in half a litre of water at 20 °C?", "choix": ["Yes", "No", "Only if we heat up", "Unable to say"], "bonne": 0, "explication": "Fifty is below: yes"}, {"question": "What type of mixture is obtained by mixing water and mint syrup?", "choix": ["non-miscible", "homogeneous", "heterogeneous", "Immissible"], "bonne": 1, "explication": "you get a single liquid: a homogeneous mixture"}, {"question": "Why does oil float above water in a mixture of water and oil?", "choix": ["Because she's miscible.", "Because it's less dense", "Because it's denser", "Because she dissolves"], "bonne": 1, "explication": "The oil floats above, because it is less dense"}, {"question": "Which professional uses the concept of solute and solvent to prepare exact quantities of solutions?", "choix": ["a painter", "an architect", "a farmer", "a pharmacist"], "bonne": 3, "explication": "A pharmacist prepares solutions whose amount of solute must be accurate"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
