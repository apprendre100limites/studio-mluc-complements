<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory cards — Mixtures</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Memory cards</h1><p class="sous">Mixtures</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "What is the solute?", "r": "Solute is the substance that dissolves in the solvent."}, {"q": "What is the solvent?", "r": "The solvent is the liquid that dissolves the solute."}, {"q": "What is a solution?", "r": "A solution is a homogeneous mixture of solvent and solute."}, {"q": "What is solubility?", "r": "Solubility is the maximum solute mass that can be dissolved in a litre of solvent."}, {"q": "What is saturation?", "r": "Saturation is the state where the solution contains the maximum solubility of solute."}, {"q": "What is sweet water?", "r": "Sweet water is a solution of water and sugar."}, {"q": "What are miscible liquids?", "r": "Miscible liquids are those that mix to form a single homogeneous liquid."}, {"q": "What are unmiscible liquids?", "r": "Unmiscible liquids are those that do not mix and separate into two layers."}, {"q": "How do we recognize a mixture?", "r": "A mixture is recognized by counting the number of phases: one phase for a homogeneous mixture, several phases for a heterogeneous mixture."}, {"q": "What is cooking salt?", "r": "Kitchen salt is a water soluble substance."}, {"q": "What is sugar?", "r": "Sugar is a soluble substance in water but not in oil."}, {"q": "When can 50 grams of salt be dissolved in half a litre of water?", "r": "Yes, because the solubility limit of salt in water is three hundred and sixty grams per litre, or one hundred and eighty grams per half litre."}, {"q": "Why does oil float on water?", "r": "Oil floats on water because it is less dense than water."}, {"q": "What is the point of dissolution?", "r": "These concepts are used in health, construction, agriculture and research, for example to prepare accurate solutions or to choose suitable solvents."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
