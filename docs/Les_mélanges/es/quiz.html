<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Mezclas</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Quiz</h1><p class="sous">Mezclas</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "En una solución, ¿cuál es el nombre de la sustancia que se disuelve?", "choix": ["solución", "Solute", "solvente", "fase"], "bonne": 1, "explication": "La sustancia disuelta se llama el soluto"}, {"question": "¿Cuál es el nombre del líquido que disuelve el soluto?", "choix": ["Solute", "fase", "solución", "solvente"], "bonne": 3, "explication": "El líquido que se disuelve se llama solvente"}, {"question": "¿Cuál es el nombre de la mezcla obtenida después de la disolución?", "choix": ["Solute", "solución", "fase", "solvente"], "bonne": 1, "explication": "y la mezcla obtenida se llama la solución"}, {"question": "¿Qué término describe una mezcla donde se ve sólo un líquido con el ojo desnudo?", "choix": ["homogénea", "heterogénea", "miscible", "fase"], "bonne": 0, "explication": "Una solución es una mezcla homogénea"}, {"question": "¿Cuál es la masa máxima de soluto que se puede disolver en un litro de solvente?", "choix": ["solubilidad", "saturación", "densidad", "Miscibilidad"], "bonne": 0, "explication": "Lo llamamos solubilidad."}, {"question": "¿Qué sucede cuando se alcanza el límite de solubilidad?", "choix": ["Solute se transforma en gas", "La solución se vuelve saturada", "El solvente se evapora", "El soluto cambia de color"], "bonne": 1, "explication": "Cuando se alcanza este límite, la solución está saturada"}, {"question": "¿Se puede disolver 50 g de sal en medio litro de agua a 20 °C?", "choix": ["Sí.", "No", "Sólo si calentamos", "Incapaz de decir"], "bonne": 0, "explication": "Cincuenta está abajo: sí"}, {"question": "¿Qué tipo de mezcla se obtiene mezclando agua y jarabe de menta?", "choix": ["non-miscible", "homogénea", "heterogénea", "Immissible"], "bonne": 1, "explication": "se obtiene un solo líquido: una mezcla homogénea"}, {"question": "¿Por qué el aceite flota sobre el agua en una mezcla de agua y aceite?", "choix": ["Porque es insolente.", "Porque es menos denso", "Porque es denser", "Porque se disuelve"], "bonne": 1, "explication": "El aceite flota por encima, porque es menos denso"}, {"question": "¿Qué profesional utiliza el concepto de soluto y solvente para preparar cantidades exactas de soluciones?", "choix": ["un pintor", "un arquitecto", "un granjero", "un farmacéutico"], "bonne": 3, "explication": "Un farmacéutico prepara soluciones cuya cantidad de soluto debe ser exacta"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
