<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas de memoria — Mezclas</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Tarjetas de memoria</h1><p class="sous">Mezclas</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Cuál es el soluto?", "r": "Soluto es la sustancia que se disuelve en el solvente."}, {"q": "¿Cuál es el solvente?", "r": "El solvente es el líquido que disuelve el soluto."}, {"q": "¿Qué es una solución?", "r": "Una solución es una mezcla homogénea de solvente y soluto."}, {"q": "¿Qué es la solubilidad?", "r": "Solubilidad es la masa máxima de soluto que se puede disolver en un litro de solvente."}, {"q": "¿Qué es la saturación?", "r": "La saturación es el estado donde la solución contiene la máxima solubilidad del soluto."}, {"q": "¿Qué es el agua dulce?", "r": "El agua dulce es una solución de agua y azúcar."}, {"q": "¿Qué son los líquidos forzosos?", "r": "Los líquidos miscibles son los que se mezclan para formar un solo líquido homogéneo."}, {"q": "¿Qué son líquidos inmiscibles?", "r": "Los líquidos inmiscibles son aquellos que no se mezclan y se separan en dos capas."}, {"q": "¿Cómo reconocemos una mezcla?", "r": "Una mezcla se reconoce contando el número de fases: una fase para una mezcla homogénea, varias fases para una mezcla heterogénea."}, {"q": "¿Qué es cocinar sal?", "r": "La sal de la cocina es una sustancia soluble en agua."}, {"q": "¿Qué es el azúcar?", "r": "El azúcar es una sustancia soluble en agua pero no en aceite."}, {"q": "¿Cuándo se pueden disolver 50 gramos de sal en medio litro de agua?", "r": "Sí, porque el límite de solubilidad de la sal en el agua es de trescientos sesenta gramos por litro, o ciento ochenta gramos por medio litro."}, {"q": "¿Por qué el aceite flota en el agua?", "r": "El aceite flota en el agua porque es menos denso que el agua."}, {"q": "¿Cuál es el punto de disolución?", "r": "Estos conceptos se utilizan en salud, construcción, agricultura e investigación, por ejemplo para preparar soluciones precisas o para elegir solventes adecuados."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
