<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी कार्ड - मिश्रण</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>मेमोरी कार्ड</h1><p class="sous">मिश्रण</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "क्या है?", "r": "Solute पदार्थ है कि विलायक में भंग कर देता है।"}, {"q": "विलायक क्या है?", "r": "विलायक वह तरल है जो घुलनशील को भंग कर देता है।"}, {"q": "समाधान क्या है?", "r": "एक समाधान विलायक और घुलनशील का एक समरूप मिश्रण है।"}, {"q": "घुलनशीलता क्या है?", "r": "घुलनशीलता अधिकतम सोल्युट द्रव्यमान है जिसे विलायक के एक लीटर में भंग किया जा सकता है।"}, {"q": "संतृप्ति क्या है?", "r": "संतृप्ति राज्य है जहां समाधान में सोल्यूट की अधिकतम घुलनशीलता होती है।"}, {"q": "मीठे पानी क्या है?", "r": "मीठा पानी पानी और चीनी का एक समाधान है।"}, {"q": "गलत तरल पदार्थ क्या हैं?", "r": "विविध तरल पदार्थ उन हैं जो एक एकल समरूप तरल बनाने के लिए मिश्रण करते हैं।"}, {"q": "अयोग्य तरल पदार्थ क्या हैं?", "r": "Unmiscible तरल पदार्थ उन हैं जो दो परतों में मिश्रण और अलग नहीं होते हैं।"}, {"q": "हम कैसे एक मिश्रण को पहचानते हैं?", "r": "एक मिश्रण को चरणों की संख्या की गणना करके मान्यता प्राप्त है: एक समरूप मिश्रण के लिए एक चरण, एक विषम मिश्रण के लिए कई चरणों।"}, {"q": "खाना पकाने का नमक क्या है?", "r": "रसोई नमक एक पानी घुलनशील पदार्थ है।"}, {"q": "चीनी क्या है?", "r": "चीनी पानी में घुलनशील पदार्थ है लेकिन तेल में नहीं।"}, {"q": "50 ग्राम नमक को आधा लीटर पानी में भंग किया जा सकता है?", "r": "हां, क्योंकि पानी में नमक की घुलनशीलता सीमा तीन सौ साठ ग्राम प्रति लीटर है, या एक सौ आठ ग्राम प्रति आधा लीटर है।"}, {"q": "क्यों तेल पानी पर तैरता है?", "r": "तेल पानी पर तैरता है क्योंकि यह पानी से कम घनी है।"}, {"q": "विघटन का बिंदु क्या है?", "r": "इन अवधारणाओं का उपयोग स्वास्थ्य, निर्माण, कृषि और अनुसंधान में किया जाता है, उदाहरण के लिए सटीक समाधान तैयार करने या उपयुक्त सॉल्वैंट्स चुनने के लिए।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
