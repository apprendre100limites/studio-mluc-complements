<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी - मिश्रण</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>प्रश्नोत्तरी</h1><p class="sous">मिश्रण</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "एक समाधान में, पदार्थ का नाम क्या है?", "choix": ["समाधान", "घुलनशील", "विलायक", "चरण"], "bonne": 1, "explication": "भंग पदार्थ को घुलनशील कहा जाता है"}, {"question": "तरल पदार्थ का नाम क्या है?", "choix": ["घुलनशील", "चरण", "समाधान", "विलायक"], "bonne": 3, "explication": "तरल जो इसे भंग कर देता है उसे विलायक कहा जाता है"}, {"question": "विघटन के बाद प्राप्त मिश्रण का नाम क्या है?", "choix": ["घुलनशील", "समाधान", "चरण", "विलायक"], "bonne": 1, "explication": "और प्राप्त मिश्रण को समाधान कहा जाता है"}, {"question": "क्या शब्द एक मिश्रण का वर्णन करता है जहां कोई केवल एक तरल को नग्न आंखों के साथ देखता है?", "choix": ["सजातीय", "विषम", "गलत", "चरण"], "bonne": 0, "explication": "एक समाधान एक समरूप मिश्रण है"}, {"question": "अधिकतम सोल्यूट द्रव्यमान क्या है जिसे विलायक के एक लीटर में भंग किया जा सकता है?", "choix": ["घुलनशीलता", "संतृप्ति", "घनत्व", "गलतफहमी"], "bonne": 0, "explication": "हम इसे घुलनशीलता कहते हैं।"}, {"question": "जब घुलनशीलता सीमा तक पहुंच जाती है तो क्या होता है?", "choix": ["Solute गैस में बदल देता है", "समाधान संतृप्त हो जाता है", "विलायक वाष्पीकरण", "solute रंग बदलता है"], "bonne": 1, "explication": "जब यह सीमा पहुंच जाती है, तो समाधान संतृप्त होता है"}, {"question": "20 °C पर आधा लीटर पानी में 50 ग्राम नमक भंग किया जा सकता है?", "choix": ["हाँ", "नहीं", "अगर हम गर्मी करते हैं", "कहने में असमर्थ"], "bonne": 0, "explication": "Fifty नीचे है: हाँ"}, {"question": "मिश्रण पानी और टकसाल सिरप द्वारा किस प्रकार का मिश्रण प्राप्त किया जाता है?", "choix": ["गैर-लाभकारी", "सजातीय", "विषम", "स्वीकार्य"], "bonne": 1, "explication": "आप एक एकल तरल प्राप्त करते हैं: एक समरूप मिश्रण"}, {"question": "तेल पानी और तेल के मिश्रण में पानी से ऊपर क्यों तैरता है?", "choix": ["क्योंकि वह गलत है।", "क्योंकि यह कम घने है", "क्योंकि यह घनी है", "क्योंकि वह भंग हो जाती है"], "bonne": 1, "explication": "तेल ऊपर तैरता है क्योंकि यह कम घनी है"}, {"question": "कौन से पेशेवर समाधानों की सटीक मात्रा तैयार करने के लिए सोल्यूट और विलायक की अवधारणा का उपयोग करता है?", "choix": ["एक चित्रकार", "एक वास्तुकार", "किसान", "एक फार्मासिस्ट"], "bonne": 3, "explication": "एक फार्मासिस्ट उन समाधानों को तैयार करता है जिनकी मात्रा सॉल्यूशंस को सटीक होना चाहिए"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
