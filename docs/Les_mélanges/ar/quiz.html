<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Mixtures</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>Quiz</h1><p class="sous">التركيبات</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "في حل ما، ما هو اسم المادة التي تحل؟", "choix": ["الحل", "لطيف", "المذيبات", "المرحلة"], "bonne": 1, "explication": "المادة المعزولة تسمّى بالحب"}, {"question": "ما هو اسم السائل الذي يحل الوحي؟", "choix": ["لطيف", "المرحلة", "الحل", "المذيبات"], "bonne": 3, "explication": "السائل الذي حله يسمى المذيب"}, {"question": "ما اسم المخلوط الذي تم الحصول عليه بعد حل؟", "choix": ["لطيف", "الحل", "المرحلة", "المذيبات"], "bonne": 1, "explication": "والمزيج المستخرج يسمى الحل"}, {"question": "أي مصطلح يصف خليط حيث يرى المرء سائلاً واحداً بعينه العارية؟", "choix": ["المتجانسات", "متجانسات", "غير معقول", "المرحلة"], "bonne": 0, "explication": "الحل هو خليط متجانس"}, {"question": "ما هو أقصى كتلة منعزلة يمكن حلها في لتر من المذيبات؟", "choix": ["القابلية للذوبان", "التشبع", "الكثافة", "عدم الجدوى"], "bonne": 0, "explication": "نسميها عزوبية"}, {"question": "ماذا يحدث عندما يتم بلوغ الحد الأقصى للذوبان؟", "choix": ["تحول العزل إلى غاز", "يصبح الحل مشبعة", "التهرب المذيب", "تغير اللون"], "bonne": 1, "explication": "عندما يتم التوصل إلى هذا الحد، يتم تهدئة الحل"}, {"question": "هل يمكن حل 50 غرام من الملح في نصف لتر من الماء عند 20 درجة مئوية؟", "choix": ["نعم", "لا", "فقط إذا حررنا", "غير قادر على قول"], "bonne": 0, "explication": "50 أدناه: نعم"}, {"question": "أي نوع من المخلوط يتم الحصول عليه بخلط الماء و شراب النعناع؟", "choix": ["غير قابلة للاشتراك", "المتجانسات", "متجانسات", "مسموح به"], "bonne": 1, "explication": "تحصل على سائل واحد: خليط متجانس"}, {"question": "لماذا يطفو النفط فوق الماء في خليط من الماء والنفط؟", "choix": ["لأنها غير معقولة", "لأنه أقل كثافة", "لأنه (دينسر)", "لأنها تذوب"], "bonne": 1, "explication": "الزيت يطفو فوق لأنه أقل كثافة"}, {"question": "أي مهني يستخدم مفهوم العزلة والمذيبة لإعداد كميات محددة من الحلول؟", "choix": ["رسام", "مهندس معماري", "مزارع", "صيدلي"], "bonne": 3, "explication": "الصيدلي يجهز الحلول التي يجب أن يكون حجمها دقيقا"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
