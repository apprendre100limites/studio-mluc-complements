<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطاقات الذاكرة - التركيبات</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم · الصف السابع · 12–13 سنة</div><h1>بطاقات الذاكرة</h1><p class="sous">التركيبات</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "ما هو الوحي؟", "r": "الحل هو المادة التي تحل في المذيب."}, {"q": "ما هو المذيب؟", "r": "المذيب هو السائل الذي يحل اللحية"}, {"q": "ما هو الحل؟", "r": "والحل هو مزيج متجانس من المذيبات واللحية."}, {"q": "ما هو العزيمة؟", "r": "العزلة هي الكتلة القصوى التي يمكن حلها في لتر من المذيبات."}, {"q": "ما هو التشبع؟", "r": "والقلق هو الحالة التي يتضمن فيها الحل أقصى قدر من المرونة في الحكمة."}, {"q": "ما هو الماء الحلو؟", "r": "الماء الحلو هو حل الماء والسكر"}, {"q": "ما هي السوائل الخاطئة؟", "r": "السوائل الخفيفة هي تلك التي تخلط لتشكيل سائل وحيد متجانس"}, {"q": "ما هي السوائل غير المريحة؟", "r": "السوائل غير المتناظرة هي تلك التي لا تخلط وتفصل بين طبقةين."}, {"q": "كيف نتعرف على المخلوط؟", "r": "A mixture is recognized by counting the number of phases: one phase for a homogeneous mixture, several phases for a heterogeneous mixture."}, {"q": "ما هو ملح الطهي؟", "r": "ملح المطبخ مادة قابلة للذوبان"}, {"q": "ما هو السكر؟", "r": "السكر مادة قابلة للذوبان في الماء لكن ليس في النفط"}, {"q": "متى يمكن حل 50 غرام من الملح في نصف لتر من الماء؟", "r": "نعم، لأن الحد الأقصى للذوبان من الملح في الماء هو ثلاثمائة وستون غراماً للتر الواحد، أو مائة وثمانون غراماً لكل نصف لتر."}, {"q": "لماذا يطفو النفط على الماء؟", "r": "النفط يطفو على الماء لأنه أقل كثافة من الماء"}, {"q": "ما الفائدة من الحل؟", "r": "وتستخدم هذه المفاهيم في مجالات الصحة والتشييد والزراعة والبحث، مثلا لإعداد حلول دقيقة أو اختيار المذيبات المناسبة."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
