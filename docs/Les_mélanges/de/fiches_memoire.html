<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherkarten — Mischungen</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Speicherkarten</h1><p class="sous">Mischungen</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Was ist der gelöste?", "r": "Solute ist die Substanz, die sich im Lösungsmittel löst."}, {"q": "Was ist das Lösungsmittel?", "r": "Das Lösungsmittel ist die Flüssigkeit, die den gelösten Stoff auflöst."}, {"q": "Was ist eine Lösung?", "r": "Eine Lösung ist eine homogene Mischung aus Lösungsmittel und gelöstem Stoff."}, {"q": "Was ist Löslichkeit?", "r": "Löslichkeit ist die maximale gelöste Masse, die in einem Liter Lösungsmittel gelöst werden kann."}, {"q": "Was ist Sättigung?", "r": "Die Sättigung ist der Zustand, in dem die Lösung die maximale Löslichkeit des gelösten Stoffes enthält."}, {"q": "Was ist Süßwasser?", "r": "Süßes Wasser ist eine Lösung aus Wasser und Zucker."}, {"q": "Was sind mischbare Flüssigkeiten?", "r": "Mischbare Flüssigkeiten sind solche, die sich zu einer einzigen homogenen Flüssigkeit vermischen."}, {"q": "Was sind unvermischbare Flüssigkeiten?", "r": "Unmischbare Flüssigkeiten sind solche, die sich nicht vermischen und in zwei Schichten trennen."}, {"q": "Wie erkennen wir eine Mischung?", "r": "Eine Mischung wird durch Zählen der Anzahl der Phasen erkannt: eine Phase für eine homogene Mischung, mehrere Phasen für eine heterogene Mischung."}, {"q": "Was ist Kochsalz?", "r": "Küchensalz ist eine wasserlösliche Substanz."}, {"q": "Was ist Zucker?", "r": "Zucker ist eine lösliche Substanz in Wasser, aber nicht in Öl."}, {"q": "Wann können 50 Gramm Salz in einem halben Liter Wasser gelöst werden?", "r": "Ja, denn die Löslichkeitsgrenze für Salz in Wasser beträgt dreihundertsechzig Gramm pro Liter oder hundertachtzig Gramm pro halben Liter."}, {"q": "Warum schwimmt Öl auf dem Wasser?", "r": "Öl schwimmt auf Wasser, weil es weniger dicht ist als Wasser."}, {"q": "Was ist der Sinn der Auflösung?", "r": "Diese Konzepte kommen in den Bereichen Gesundheit, Bauwesen, Landwirtschaft und Forschung zum Einsatz, um z.B. genaue Lösungen herzustellen oder geeignete Lösungsmittel auszuwählen."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
