<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Gemische</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Quiz</h1><p class="sous">Mischungen</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Wie heißt in einer Lösung die Substanz, die sich auflöst?", "choix": ["Lösung", "gelöst", "Lösungsmittel", "Phase"], "bonne": 1, "explication": "Die gelöste Substanz wird als gelöste Substanz bezeichnet"}, {"question": "Wie heißt die Flüssigkeit, die den gelösten Stoff auflöst?", "choix": ["gelöst", "Phase", "Lösung", "Lösungsmittel"], "bonne": 3, "explication": "Die Flüssigkeit, die es auflöst, wird als Lösungsmittel bezeichnet"}, {"question": "Wie heißt die nach Auflösung erhaltene Mischung?", "choix": ["gelöst", "Lösung", "Phase", "Lösungsmittel"], "bonne": 1, "explication": "und die erhaltene Mischung wird als Lösung bezeichnet"}, {"question": "Welcher Begriff beschreibt eine Mischung, bei der man mit bloßem Auge nur eine Flüssigkeit sieht?", "choix": ["homogen", "heterogen", "mischbar", "Phase"], "bonne": 0, "explication": "Eine Lösung ist eine homogene Mischung"}, {"question": "Was ist die maximale gelöste Masse, die in einem Liter Lösungsmittel gelöst werden kann?", "choix": ["Löslichkeit", "Sättigung", "Dichte", "Mischbarkeit"], "bonne": 0, "explication": "Wir nennen es Löslichkeit."}, {"question": "Was passiert, wenn die Löslichkeitsgrenze erreicht ist?", "choix": ["Solute verwandelt sich in Gas", "Die Lösung wird gesättigt", "Das Lösungsmittel verdampft", "Die gelöste Farbe ändert sich"], "bonne": 1, "explication": "Wenn dieser Grenzwert erreicht ist, ist die Lösung gesättigt"}, {"question": "Können 50 g Salz bei 20 °C in einem halben Liter Wasser gelöst werden?", "choix": ["Ja", "Nein", "Nur wenn wir uns erwärmen", "Unfähig zu sagen"], "bonne": 0, "explication": "Fünfzig ist unten: ja"}, {"question": "Welche Art von Mischung wird durch Mischen von Wasser und Minzsirup erhalten?", "choix": ["nicht mischbar", "homogen", "heterogen", "Unzulässig"], "bonne": 1, "explication": "Sie erhalten eine einzige Flüssigkeit: eine homogene Mischung"}, {"question": "Warum schwimmt Öl über Wasser in einer Mischung aus Wasser und Öl?", "choix": ["Weil sie mischbar ist.", "Weil es weniger dicht ist", "Weil es dichter ist", "Weil sie sich auflöst"], "bonne": 1, "explication": "Das Öl schwimmt oben, weil es weniger dicht ist"}, {"question": "Welcher Fachmann verwendet das Konzept von gelöstem und Lösungsmittel, um genaue Mengen von Lösungen vorzubereiten?", "choix": ["Maler", "ein Architekt", "ein Landwirt", "ein Apotheker"], "bonne": 3, "explication": "Ein Apotheker bereitet Lösungen vor, deren gelöste Menge genau sein muss"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
