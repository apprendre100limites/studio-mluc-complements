<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Affaire Pharos 3/4 : Les pièces à conviction</title><style>

</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Quiz</h1><p class="sous">Affaire Pharos 3/4 : Les pièces à conviction</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Quelle est la fonction principale décrite dans la mission ?", "choix": ["B) Numériser un objet", "D) Mesurer l'eau", "A) Documenter la lumière", "C) Sculpter une statue"], "bonne": 0, "explication": "Fonction principale : numériser un objet."}, {"question": "Quel fort médiéval est mentionné comme étant près du port d'Alexandrie ?", "choix": ["C) Phare de Pharos", "A) Fort de Qaitbay", "D) Château de Saladin", "B) Fort d'Alexandrie"], "bonne": 1, "explication": "Imaginez que vous plongez dans le port d'Alexandrie, tout près d'un fort médiéval, le fort de Qaitbay."}, {"question": "Quelle est la taille approximative du site sous-marin ?", "choix": ["C) Deux hectares", "B) Un hectare et demi", "A) Un hectare", "D) Trois hectares"], "bonne": 1, "explication": "Aujourd'hui, ce site sous-marin couvre environ un hectare et demi, à peu près deux terrains de football."}, {"question": "Quels matériaux étaient utilisés pour sceller les pierres ?", "choix": ["C) Or et argent", "A) Pierre et sable", "B) Plomb, de fer et de bronze", "D) Charbon et huile"], "bonne": 2, "explication": "...ainsi que de plomb, de fer et de bronze qui servaient à sceller les pierres."}, {"question": "À quelle fréquence l'équipe du Céalex effectue-t-elle des fouilles ?", "choix": ["D) Une fois tous les dix ans", "A) Chaque mois", "B) Une à deux fois par an", "C) Chaque semaine"], "bonne": 2, "explication": "Depuis mille neuf cent quatre-vingt-quatorze, l'équipe du Céalex y fouille une à deux fois par an."}, {"question": "Quel est le principe clé de la photogrammétrie selon la vidéo ?", "choix": ["A) Utiliser un scanner laser", "C) Plonger avec des marqueurs", "B) Prendre de très nombreuses photos sous tous les angles", "D) Utiliser un magnétomètre"], "bonne": 2, "explication": "On prend de très nombreuses photos d'un même objet, sous tous les angles, en s'assurant que chaque photo recouvre en partie la précédente."}, {"question": "En janvier 2020, quel pourcentage du site avait été numérisé ?", "choix": ["C) 75 %", "D) 90 %", "A) 50 %", "B) 65 %"], "bonne": 3, "explication": "Au premier janvier deux mille vingt, l'équipe avait numérisé la surface d'environ soixante-cinq pour cent du site, et enregistré trois mille quarante blocs dans sa base de données."}, {"question": "Combien de blocs étaient enregistrés dans la base de données en janvier 2020 ?", "choix": ["B) 3 040", "A) 2 500", "C) 3 500", "D) 4 000"], "bonne": 0, "explication": "Au premier janvier deux mille vingt, l'équipe avait numérisé la surface d'environ soixante-cinq pour cent du site, et enregistré trois mille quarante blocs dans sa base de données."}, {"question": "Quelle contrainte exige que l'objet ne bouge pas pendant la prise de vue ?", "choix": ["C) Contrainte trois", "D) Contrainte quatre", "B) Contrainte deux", "A) Contrainte un"], "bonne": 2, "explication": "Contrainte deux : un objet qui ne bouge pas."}, {"question": "Lequel des éléments suivants est cité comme une utilisation de la photogrammétrie ?", "choix": ["B) Prévoir le temps qu'il fera", "A) Dessiner des cartes et des plans", "D) Soigner les patients", "C) Construire des ponts"], "bonne": 1, "explication": "On l'utilise pour dessiner des cartes et des plans, pour conserver le patrimoine, pour fabriquer des décors de jeux vidéo et de films, et pour contrôler des bâtiments sans y monter."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
