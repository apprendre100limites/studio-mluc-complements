<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fact Sheets — Pharos Fall 3/4: Exponate</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften </div><h1>Speicherkarten</h1><p class="sous">Pharos Fall 3/4: Exponate</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Wo befinden sich die Ruinen des Alexandria Lighthouse?", "r": "Sie befinden sich am Fuße des Hafens von Alexandria, in der Nähe der mittelalterlichen Festung von Qaitbay, unter dem Mittelmeer."}, {"q": "Warum ist der Leuchtturm heute unter Wasser?", "r": "Denn die Küste von Alexandria hat seit der Antike eine langsame Absenkung erfahren, was den Standort des Leuchtturms zum Tauchen bringt."}, {"q": "Wie groß ist der Leuchtturm unter Wasser?", "r": "Das Gelände umfasst etwa eineinhalb Hektar, was etwa zwei Fußballfeldern entspricht."}, {"q": "Aus welchen Materialien besteht der Unterwasserstandort hauptsächlich?", "r": "Es besteht aus Blöcken und Bruchstücken aus Hartstein sowie Blei, Eisen und Bronze, die zum Versiegeln von Steinen verwendet werden."}, {"q": "Was sind die drei Gebäude, die von Archäologen auf dem Gelände unterschieden werden?", "r": "Der Leuchtturm im Nordwesten, eine römische Konstruktion im Nordosten und ein Schutzdamm im Süden aus Granitsäulen."}, {"q": "Was ist das maximale Gewicht, das für die kolossalen Blöcke und Statuen des Leuchtturms erwähnt wird?", "r": "Diese kolossalen Blöcke und Statuen können bis zu vierzig Tonnen wiegen."}, {"q": "Wie oft durchsucht das Céalex-Team diese Website?", "r": "Das Team sucht ein- bis zweimal im Jahr, je nach Wetter und Seebedingungen."}, {"q": "Was ist die größte Herausforderung, die durch Photogrammetrie auf dieser Website gelöst wird?", "r": "Es ermöglicht, Tausende von Blöcken unter Wasser zu studieren, zu messen und zu vergleichen, ohne sie physisch entfernen zu müssen."}, {"q": "Wie erstellt die Photogrammetrie ein 3D-Modell eines Objekts?", "r": "Viele Fotos werden aus verschiedenen Blickwinkeln mit Abdeckungen aufgenommen, und die Software berechnet die Position der Punkte, um das Modell zu erstellen."}, {"q": "Was können wir mit dem digitalen Doppel eines Objekts oder Blocks tun?", "r": "Es kann auf einem Computer gedreht, gemessen und bewegt werden, ohne es jemals physisch zu berühren."}, {"q": "Was waren die Digitalisierungsstatistiken zum 1. Januar 2020?", "r": "Etwa 65 Prozent der Oberfläche wurde digitalisiert, mit 3040 Blöcken aufgezeichnet, von denen 154 digitale Doppel waren."}, {"q": "Was war die außergewöhnliche Operation im Juni 2025?", "r": "Etwa 20 der größten Blöcke wurden an die Oberfläche gehoben, um untersucht, digitalisiert und virtuell als Puzzle zusammengebaut zu werden."}, {"q": "Welche Art von Objekt sollte für die Photogrammetrie-Übung in der Klasse ausgewählt werden?", "r": "Ein kleines mattes Objekt, mit Relief und ohne Reflexionen, wie ein Stein, eine Schale oder eine Figur."}, {"q": "Was sind die wichtigsten Einschränkungen für Fotos?", "r": "Nehmen Sie 20 bis 30 Fotos eines bewegungslosen Objekts mit einem einheitlichen Hintergrund, weichem Licht und überlappenden Fotos auf."}, {"q": "Was ist der Zweck der Photogrammetrie nach dem Video, außerhalb der archäologischen Domäne?", "r": "Es wird verwendet, um Pläne zu zeichnen, das Erbe zu bewahren, Videospiele oder Filme zu erstellen und Gebäude zu kontrollieren, ohne zu steigen."}, {"q": "Welche spezifischen Berufe werden im Zusammenhang mit Photogrammetrie und Topographie genannt?", "r": "Der Taucherarchäologe, der Topograph, das Geometer und der dreidimensionale Digitalisierungsspezialist."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
