<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Pharos 3/4: Ausstellungen</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften </div><h1>Quiz</h1><p class="sous">Pharos Fall 3/4: Exponate</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Was ist die Hauptfunktion, die in der Mission beschrieben wird?", "choix": ["B Scannen eines Objekts", "D Messwasser", "A) Dokumentation des Lichts", "C) Bildhauerei einer Statue"], "bonne": 0, "explication": "Hauptfunktion: Scannen eines Objekts."}, {"question": "Welche mittelalterliche Festung wird in der Nähe des Hafens von Alexandria erwähnt?", "choix": ["C Pharos Leuchtturm", "A Qaitbay Fort", "D. Schloss Saladin", "B. Fort von Alexandria"], "bonne": 1, "explication": "Stellen Sie sich vor, Sie tauchen in den Hafen von Alexandria ein, in der Nähe einer mittelalterlichen Festung, der Festung von Qaitbay."}, {"question": "Wie groß ist der Unterwasserstandort ungefähr?", "choix": ["C 2 ha", "B) Eineinhalb Hektar", "A) 1 Hektar", "D. Drei Hektar"], "bonne": 1, "explication": "Heute umfasst dieses Unterwassergelände etwa anderthalb Hektar, etwa zwei Fußballfelder."}, {"question": "Welche Materialien wurden verwendet, um die Steine zu versiegeln?", "choix": ["c Gold und Geld", "A) Stein und Sand", "B) Blei, Eisen und Bronze", "D Kohle und Öl"], "bonne": 2, "explication": "...sowie Blei, Eisen und Bronze, die zum Versiegeln von Steinen verwendet werden."}, {"question": "Wie oft sucht das Céalex-Team?", "choix": ["D. Einmal alle zehn Jahre", "A jeden Monat", "B. Ein- oder zweimal jährlich", "C jede Woche"], "bonne": 2, "explication": "Seit eintausendneunhundertvierundneunzig hat das Céalex-Team es ein- bis zweimal im Jahr durchsucht."}, {"question": "Was ist das Schlüsselprinzip der Photogrammetrie nach Video?", "choix": ["A. Verwendung eines Laserscanners", "C. Tauchen mit Markern", "B) Machen Sie viele Fotos aus allen Blickwinkeln", "D. Verwenden Sie ein Magnetometer"], "bonne": 2, "explication": "Wir machen viele Fotos des gleichen Objekts aus allen Blickwinkeln und stellen sicher, dass jedes Foto das vorherige teilweise abdeckt."}, {"question": "Wie viel Prozent der Website wurde im Januar 2020 digitalisiert?", "choix": ["C 75 %", "D 90 %", "A) 50 %", "B 65 %"], "bonne": 3, "explication": "Bis zum 1. Januar zweitausendzwanzig hatte das Team die Oberfläche von etwa fünfundsechzig Prozent der Website digitalisiert und dreitausendvierzig Blöcke in seiner Datenbank aufgezeichnet."}, {"question": "Wie viele Blöcke wurden im Januar 2020 in der Datenbank registriert?", "choix": ["B 3,040", "A 2500", "C 3500", "D 4 000"], "bonne": 0, "explication": "Bis zum 1. Januar zweitausendzwanzig hatte das Team die Oberfläche von etwa fünfundsechzig Prozent der Website digitalisiert und dreitausendvierzig Blöcke in seiner Datenbank aufgezeichnet."}, {"question": "Welche Einschränkung erfordert, dass sich das Objekt während des Schießens nicht bewegt?", "choix": ["C Einschränkung drei", "D. Einschränkung vier", "B Einschränken von zwei", "A) Einschränkung"], "bonne": 2, "explication": "Einschränkung zwei: ein Objekt, das sich nicht bewegt."}, {"question": "Welche der folgenden wird als Verwendung der Photogrammetrie zitiert?", "choix": ["B) Zulässige Zeit", "A) Karten und Pläne zeichnen", "D) Betreuung von Patienten", "C Brücken bauen"], "bonne": 1, "explication": "Es wird verwendet, um Karten und Pläne zu zeichnen, das Erbe zu bewahren, Videospiele und Filmsets zu machen und Gebäude zu kontrollieren, ohne dorthin zu gehen."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
