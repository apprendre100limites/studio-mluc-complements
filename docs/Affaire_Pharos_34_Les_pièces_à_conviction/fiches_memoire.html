<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Affaire Pharos 3/4 : Les pièces à conviction</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Fiches mémoire</h1><p class="sous">Affaire Pharos 3/4 : Les pièces à conviction</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Où les ruines du phare d'Alexandrie sont-elles situées ?", "r": "Elles se trouvent au fond du port d'Alexandrie, près du fort médiéval de Qaitbay, sous la Méditerranée."}, {"q": "Pourquoi le site du phare est-il aujourd'hui sous l'eau ?", "r": "Parce que la côte d'Alexandrie subit une lente subsidence depuis l'Antiquité, ce qui fait plonger l'emplacement du phare."}, {"q": "Quelle est la taille approximative du site sous-marin du phare ?", "r": "Le site couvre environ un hectare et demi, ce qui correspond à peu près à deux terrains de football."}, {"q": "De quels matériaux le site sous-marin est-il principalement composé ?", "r": "Il est composé de blocs et fragments de pierre dure, ainsi que de plomb, de fer et de bronze utilisés pour sceller les pierres."}, {"q": "Quelles sont les trois constructions distinguées par les archéologues sur le site ?", "r": "Le phare au nord-ouest, une construction romaine au nord-est, et une digue de protection au sud faite de colonnes en granite."}, {"q": "Quel est le poids maximum mentionné pour les blocs et statues colossales du phare ?", "r": "Ces blocs et statues colossales peuvent peser jusqu'à quarante tonnes."}, {"q": "À quelle fréquence l'équipe du Céalex fouille-t-elle ce site ?", "r": "L'équipe y fouille une à deux fois par an, la durée dépendant de la météo et de l'état de la mer."}, {"q": "Quel est le principal défi résolu par la photogrammétrie sur ce site ?", "r": "Elle permet d'étudier, mesurer et comparer des milliers de blocs sous l'eau sans avoir à les sortir physiquement."}, {"q": "Comment la photogrammétrie crée-t-elle un modèle 3D d'un objet ?", "r": "On prend de nombreuses photos sous différents angles avec des recouvrements, et un logiciel calcule la position des points pour construire le modèle."}, {"q": "Que peut-on faire avec le double numérique d'un objet ou d'un bloc ?", "r": "On peut le tourner, le mesurer et le déplacer sur ordinateur sans jamais le toucher physiquement."}, {"q": "Quelles étaient les statistiques de numérisation au 1er janvier 2020 ?", "r": "Environ 65 % de la surface était numérisée, avec 3040 blocs enregistrés, dont 154 sous forme de double numérique."}, {"q": "Quelle a été l'opération exceptionnelle de juin 2025 ?", "r": "Une vingtaine des blocs les plus imposants ont été remontés à la surface pour être étudiés, numérisés et assemblés virtuellement comme un puzzle."}, {"q": "Quel type d'objet faut-il choisir pour l'exercice de photogrammétrie en classe ?", "r": "Un petit objet mat, avec du relief et sans reflets, comme une pierre, un coquillage ou une figurine."}, {"q": "Quelles sont les contraintes principales à respecter pour les photos ?", "r": "Prendre 20 à 30 photos d'un objet immobile, avec un fond uni, une lumière douce et des photos qui se recouvrent."}, {"q": "À quoi sert la photogrammétrie selon la vidéo, en dehors du domaine archéologique ?", "r": "Elle sert à dessiner des plans, conserver le patrimoine, créer des décors de jeux vidéo ou de films, et contrôler des bâtiments sans monter."}, {"q": "Quels métiers spécifiques sont mentionnés en lien avec la photogrammétrie et la topographie ?", "r": "L'archéologue plongeur, le topographe, le géomètre et le spécialiste de la numérisation en trois dimensions."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
