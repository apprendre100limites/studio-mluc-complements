<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Pharos 3/4: Exhibits</title><style>

</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Quiz</h1><p class="sous">Pharos case 3/4: Exhibits</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What is the main function described in the mission?", "choix": ["B) Scan an object", "D) Measuring water", "A) Documenting Light", "C) Sculpting a statue"], "bonne": 0, "explication": "Main function: Scan an object."}, {"question": "What medieval fort is mentioned as being near the port of Alexandria?", "choix": ["C) Pharos Lighthouse", "A) Qaitbay Fort", "D) Saladin Castle", "B) Fort of Alexandria"], "bonne": 1, "explication": "Imagine diving into the port of Alexandria, near a medieval fort, the fort of Qaitbay."}, {"question": "What is the approximate size of the underwater site?", "choix": ["C) Two hectares", "B) One and a half acres", "A) One hectare", "D) Three hectares"], "bonne": 1, "explication": "Today, this underwater site covers about a hectare and a half, about two football fields."}, {"question": "What materials were used to seal the stones?", "choix": ["(C) Gold and money", "A) Stone and sand", "B) Lead, Iron and Bronze", "(D) Coal and oil"], "bonne": 2, "explication": "...as well as lead, iron and bronze used to seal stones."}, {"question": "How often does the Céalex team search?", "choix": ["D) Once every ten years", "A) Every month", "B) Once or twice a year", "C) Every week"], "bonne": 2, "explication": "Since one thousand nine hundred and ninety-four, the Céalex team has searched it once or twice a year."}, {"question": "What is the key principle of photogrammetry according to video?", "choix": ["A) Using a laser scanner", "C) Dive with markers", "B) Take many photos from all angles", "D) Use a magnetometer"], "bonne": 2, "explication": "We take many photos of the same object from all angles, making sure that each photo partially covers the previous one."}, {"question": "In January 2020, what percentage of the site had been digitized?", "choix": ["C) 75 per cent", "D) 90 %", "A) 50 per cent", "B) 65 %"], "bonne": 3, "explication": "By 1 January two thousand and twenty, the team had digitized the surface of about sixty-five percent of the site, and recorded three thousand and forty blocks in its database."}, {"question": "How many blocks were registered in the database in January 2020?", "choix": ["B) 3,040", "A) 2,500", "C) 3,500", "D) 4 000"], "bonne": 0, "explication": "By 1 January two thousand and twenty, the team had digitized the surface of about sixty-five percent of the site, and recorded three thousand and forty blocks in its database."}, {"question": "What constraint requires the object not to move during shooting?", "choix": ["C) Constraint three", "D) Constraint four", "B) Constraint two", "A) Constraint"], "bonne": 2, "explication": "Constraint two: an object that does not move."}, {"question": "Which of the following is cited as a use of photogrammetry?", "choix": ["B) Allowing time", "A) Drawing maps and plans", "D) Care for patients", "C) Building bridges"], "bonne": 1, "explication": "It is used to draw maps and plans, to preserve heritage, to make video games and movie sets, and to control buildings without going up there."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
