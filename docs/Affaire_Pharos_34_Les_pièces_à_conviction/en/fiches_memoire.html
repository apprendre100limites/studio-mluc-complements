<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fact sheets — Pharos case 3/4: Exhibits</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Memory cards</h1><p class="sous">Pharos case 3/4: Exhibits</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "Where are the ruins of the Alexandria Lighthouse located?", "r": "They are located at the bottom of the port of Alexandria, near the medieval fort of Qaitbay, under the Mediterranean."}, {"q": "Why is the lighthouse site today underwater?", "r": "Because the coast of Alexandria has undergone a slow subsidence since ancient times, which makes the location of the lighthouse dive."}, {"q": "What is the approximate size of the lighthouse underwater site?", "r": "The site covers about one and a half hectares, which corresponds to about two football fields."}, {"q": "What materials is the underwater site mainly composed of?", "r": "It consists of blocks and fragments of hard stone, as well as lead, iron and bronze used to seal stones."}, {"q": "What are the three buildings distinguished by archaeologists on the site?", "r": "The lighthouse to the northwest, a Roman construction to the northeast, and a protection dam to the south made of granite columns."}, {"q": "What is the maximum weight mentioned for the colossal blocks and statues of the lighthouse?", "r": "These colossal blocks and statues can weigh up to forty tons."}, {"q": "How often does the Céalex team search this site?", "r": "The team searches once or twice a year, depending on weather and sea conditions."}, {"q": "What is the main challenge solved by photogrammetry on this site?", "r": "It allows to study, measure and compare thousands of blocks under water without having to physically remove them."}, {"q": "How does photogrammetry create a 3D model of an object?", "r": "Many photos are taken from different angles with covers, and software calculates the position of the points to build the model."}, {"q": "What can we do with the digital double of an object or block?", "r": "It can be rotated, measured and moved on a computer without ever touching it physically."}, {"q": "What were the digitisation statistics as of January 1, 2020?", "r": "Approximately 65 per cent of the surface was digitized, with 3040 blocks recorded, of which 154 were digital doubles."}, {"q": "What was the exceptional June 2025 operation?", "r": "About 20 of the largest blocks were raised to the surface to be studied, digitized and assembled virtually as a puzzle."}, {"q": "What type of object should be chosen for the photogrammetry exercise in class?", "r": "A small matte object, with relief and without reflections, like a stone, a shell or a figurine."}, {"q": "What are the main constraints for photos?", "r": "Take 20 to 30 photos of a motionless object, with a united background, soft light and overlapping photos."}, {"q": "What is the purpose of photogrammetry according to the video, outside the archaeological domain?", "r": "It is used to draw plans, preserve heritage, create video games or movies, and control buildings without going up."}, {"q": "What specific professions are mentioned in connection with photogrammetry and topography?", "r": "The diver archaeologist, the topographer, the geometer and the three-dimensional digitization specialist."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
