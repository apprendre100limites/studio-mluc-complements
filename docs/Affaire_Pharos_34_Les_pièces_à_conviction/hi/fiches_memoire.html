<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>तथ्य पत्रक - Pharos प्रकरण 3/4: प्रदर्शनी</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान </div><h1>मेमोरी कार्ड</h1><p class="sous">Pharos case 3/4: प्रदर्शनी</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "अलेक्जेंड्रिया लाइटहाउस के खंडहर कहाँ स्थित हैं?", "r": "वे अलेक्जेंड्रिया के बंदरगाह के तल पर स्थित हैं, भूमध्यसागरीय के नीचे, क्वाटबे के मध्ययुगीन किले के पास।"}, {"q": "आज पानी के नीचे क्यों है?", "r": "क्योंकि अलेक्जेंड्रिया के तट प्राचीन काल से एक धीमी गति से सब्सिडेंस से गुजर रहा है, जो लाइटहाउस गोता का स्थान बनाता है।"}, {"q": "पानी के नीचे की रोशनी का लगभग आकार क्या है?", "r": "साइट लगभग एक और आधे हेक्टेयर को कवर करती है, जो लगभग दो फुटबॉल क्षेत्रों से मेल खाती है।"}, {"q": "क्या सामग्री मुख्य रूप से पानी के नीचे की साइट से बना है?", "r": "इसमें हार्ड पत्थर के ब्लॉक और टुकड़े होते हैं, साथ ही लीड, आयरन और कांस्य पत्थरों को सील करने के लिए इस्तेमाल किया जाता है।"}, {"q": "साइट पर पुरातत्वविदों द्वारा प्रतिष्ठित तीन इमारतों क्या हैं?", "r": "उत्तर-पश्चिम में लाइटहाउस, उत्तर-पूर्व में रोमन निर्माण, और दक्षिण में ग्रेनाइट स्तंभों से बना सुरक्षा बांध।"}, {"q": "कोलोसल ब्लॉक और लाइटहाउस की मूर्तियों के लिए अधिकतम वजन क्या है?", "r": "इन विशाल ब्लॉकों और मूर्तियों का वजन चालीस टन तक हो सकता है।"}, {"q": "अक्सर Céalex टीम इस साइट को कैसे खोजती है?", "r": "टीम मौसम और समुद्र की स्थिति के आधार पर एक बार या दो बार खोजती है।"}, {"q": "इस साइट पर फोटोग्राममेट्री द्वारा हल की गई मुख्य चुनौती क्या है?", "r": "यह शारीरिक रूप से उन्हें हटाने के बिना पानी के नीचे हजारों ब्लॉकों का अध्ययन, माप और तुलना करने की अनुमति देता है।"}, {"q": "फोटोग्राममेट्री एक ऑब्जेक्ट का 3 डी मॉडल कैसे बनाता है?", "r": "कई तस्वीरें कवर के साथ विभिन्न कोणों से ली जाती हैं, और सॉफ्टवेयर मॉडल बनाने के लिए बिंदुओं की स्थिति की गणना करता है।"}, {"q": "हम किसी ऑब्जेक्ट या ब्लॉक के डिजिटल डबल के साथ क्या कर सकते हैं?", "r": "इसे कभी-कभी इसे शारीरिक रूप से छूने के बिना कंप्यूटर पर घुमाया, मापा और स्थानांतरित किया जा सकता है।"}, {"q": "1 जनवरी, 2020 तक डिजिटाइज़ेशन आँकड़े क्या थे?", "r": "लगभग 65 प्रतिशत सतह को अंकित किया गया था, जिसमें 3040 ब्लॉक दर्ज किए गए थे, जिनमें से 154 डिजिटल डबल थे।"}, {"q": "जून 2025 ऑपरेशन क्या था?", "r": "सबसे बड़े ब्लॉकों में से 20 के बारे में एक पहेली के रूप में लगभग अध्ययन, अंकीय और इकट्ठे होने के लिए सतह पर उठाया गया था।"}, {"q": "वर्ग में फोटोग्राममेट्री व्यायाम के लिए किस प्रकार का ऑब्जेक्ट चुना जाना चाहिए?", "r": "एक छोटी मैट वस्तु, राहत के साथ और प्रतिबिंब के बिना, पत्थर, एक खोल या एक मूर्ति की तरह।"}, {"q": "फोटो के लिए मुख्य बाधाएं क्या हैं?", "r": "एक गतिहीन वस्तु की 20 से 30 तस्वीरें लें, एक एकजुट पृष्ठभूमि, मुलायम प्रकाश और अतिव्यापी फ़ोटो के साथ।"}, {"q": "पुरातात्विक डोमेन के बाहर वीडियो के अनुसार फोटोग्राममेट्री का उद्देश्य क्या है?", "r": "इसका उपयोग योजनाओं को आकर्षित करने, विरासत को संरक्षित करने, वीडियो गेम या फिल्मों को बनाने और इमारतों को नियंत्रित करने के लिए किया जाता है।"}, {"q": "क्या विशिष्ट व्यवसायों photogrammetry और स्थलाकृति के संबंध में उल्लेख किया जाता है?", "r": "गोताखोर पुरातत्वविद्, शीर्षलेखक, भूगर्भीयता और त्रि-आयामी अंकीकरण विशेषज्ञ।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
