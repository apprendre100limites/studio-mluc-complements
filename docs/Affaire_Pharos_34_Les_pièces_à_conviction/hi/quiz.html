<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी - Pharos 3/4: प्रदर्शनी</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान </div><h1>प्रश्नोत्तरी</h1><p class="sous">Pharos case 3/4: प्रदर्शनी</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "मिशन में वर्णित मुख्य कार्य क्या है?", "choix": ["B) किसी ऑब्जेक्ट को स्कैन करें", "D) मापने पानी", "A) दस्तावेज प्रकाश", "C) एक मूर्ति को मूर्तिकला करना"], "bonne": 0, "explication": "मुख्य कार्य: किसी वस्तु को स्कैन करें।"}, {"question": "क्या मध्ययुगीन किले अलेक्जेंड्रिया के बंदरगाह के पास होने के रूप में उल्लेख किया गया है?", "choix": ["C) Pharos Lighthouse", "A) Qaitbay किले", "D) Saladin कैसल", "B) अलेक्जेंड्रिया का किला"], "bonne": 1, "explication": "एक मध्ययुगीन किले के पास अलेक्जेंड्रिया के बंदरगाह में कल्पना डाइविंग, Qaitbay के किले।"}, {"question": "अंडरवाटर साइट का अनुमानित आकार क्या है?", "choix": ["C) दो हेक्टेयर", "B) एक और आधा एकड़", "A) एक हेक्टेयर", "D) तीन हेक्टेयर"], "bonne": 1, "explication": "आज, इस अंडरवाटर साइट में एक हेक्टेयर और लगभग दो फुटबॉल मैदान शामिल हैं।"}, {"question": "क्या सामग्री का उपयोग पत्थरों को सील करने के लिए किया गया था?", "choix": ["(C) सोने और धन", "A) पत्थर और रेत", "बी) लीड, आयरन और कांस्य", "(D) कोयला और तेल"], "bonne": 2, "explication": "... साथ ही लीड, आयरन और कांस्य भी पत्थरों को सील करने के लिए इस्तेमाल किया जाता है।"}, {"question": "कैसे अक्सर Céalex टीम खोज करता है?", "choix": ["हर दस साल", "हर महीने", "B) एक बार या दो बार एक साल", "C) हर सप्ताह"], "bonne": 2, "explication": "एक हजार नौ सौ और नब्बे-चार के बाद से, Céalex टीम ने इसे साल में एक बार या दो बार खोजा है।"}, {"question": "वीडियो के अनुसार फोटोग्राममेट्री का मुख्य सिद्धांत क्या है?", "choix": ["A) लेजर स्कैनर का उपयोग करना", "C) मार्करों के साथ डाइव", "B) सभी कोणों से कई तस्वीरें लें", "D) एक magnetometer का उपयोग करें"], "bonne": 2, "explication": "हम सभी कोणों से समान वस्तु की कई तस्वीरें लेते हैं, यह सुनिश्चित करते हैं कि प्रत्येक तस्वीर आंशिक रूप से पिछले एक को कवर करती है।"}, {"question": "जनवरी 2020 में, साइट का क्या प्रतिशत अंकित किया गया था?", "choix": ["C) 75 प्रतिशत", "D) 90 %", "A) 50 प्रतिशत", "B) 65 %"], "bonne": 3, "explication": "1 जनवरी दो हजार बीस तक, टीम ने साइट के लगभग साठ प्रतिशत की सतह को अंकित किया था, और इसके डेटाबेस में तीन हजार और चालीस ब्लॉक दर्ज किए थे।"}, {"question": "जनवरी 2020 में डेटाबेस में कितने ब्लॉक पंजीकृत थे?", "choix": ["B) 3,040", "A) 2,500", "C) 3,500", "D) 4 000"], "bonne": 0, "explication": "1 जनवरी दो हजार बीस तक, टीम ने साइट के लगभग साठ प्रतिशत की सतह को अंकित किया था, और इसके डेटाबेस में तीन हजार और चालीस ब्लॉक दर्ज किए थे।"}, {"question": "क्या बाधा को गोलीबारी के दौरान नहीं जाने की आवश्यकता है?", "choix": ["C) तीन", "D) चार", "B (B)", "A) Constraint"], "bonne": 2, "explication": "एक वस्तु जो चलती नहीं है।"}, {"question": "निम्नलिखित में से कौन से फोटोग्राममेट्री के उपयोग के रूप में उद्धृत किया गया है?", "choix": ["B) समय की अनुमति", "A) ड्राइंग नक्शे और योजना", "D) रोगियों के लिए देखभाल", "C) बिल्डिंग पुल"], "bonne": 1, "explication": "इसका उपयोग मानचित्र और योजनाओं को आकर्षित करने के लिए किया जाता है, विरासत को संरक्षित करने के लिए, वीडियो गेम और फिल्म सेट बनाने के लिए, और वहां जाने के बिना इमारतों को नियंत्रित करने के लिए किया जाता है।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
