<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صحائف وقائع - قضية Pharos 3/4: المعارض</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>بطاقات الذاكرة</h1><p class="sous">قضية الصور 3/4: المعارض</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "أين تقع أدمغة الـ(أليكساندريا لايتهاوس)؟", "r": "وتقع في قاع ميناء ألكسندريا، بالقرب من قلعة القرون الوسطى في القيتابي، تحت البحر الأبيض المتوسط."}, {"q": "لماذا موقع المنارة اليوم تحت الماء؟", "r": "لأن ساحل (أليكساندريا) قد خضّع أرضية بطيئة منذ الأزمنة القديمة، مما يجعل موقع الغطس في المنارة."}, {"q": "ما هو الحجم التقريبي لموقع المنارة تحت الماء؟", "r": "ويغطي الموقع حوالي هكتار ونصف الهكتارات، وهو ما يعادل نحو حقلين لكرة القدم."}, {"q": "ما هي المواد التي يتألف منها الموقع تحت الماء أساسا؟", "r": "It consists of blocks and fragments of hard stone, as well as lead, iron and bronze used to seal stones."}, {"q": "ما هي المباني الثلاثة التي يميزها علماء الآثار في الموقع؟", "r": "المنارة إلى الشمال الغربي، بناء روماني إلى الشمال الشرقي، وسد حماية إلى الجنوب مصنوع من الأعمدة الغرانيت."}, {"q": "ما هو الحد الأقصى للوزن الذي ذُكِر للبنات والتماثيل في المنارة؟", "r": "هذه القطع المعدنية والتماثيل يمكن أن تصل إلى أربعين طنا."}, {"q": "كم مرة يفتش فريق سيالكس هذا الموقع؟", "r": "ويبحث الفريق مرة أو مرتين في السنة، حسب الأحوال الجوية والبحرية."}, {"q": "ما هو التحدي الرئيسي الذي تم حله بواسطة التصوير الضوئي في هذا الموقع؟", "r": "وهو يسمح بدراسة وقياس ومقارنة آلاف القطع تحت الماء دون الحاجة إلى إزالتها جسديا."}, {"q": "كيف يمكن للتصوير التصويري أن يخلق نموذج 3D من الجسم؟", "r": "وتلتقط العديد من الصور من زوايا مختلفة بأغطية، وتحسب البرامجيات موقع النقاط لبناء النموذج."}, {"q": "ماذا يمكننا أن نفعل مع مزدوج الرقمي من الجسم أو الحي؟", "r": "يمكن تناوبها وقياسها ونقلها إلى حاسوب دون لمسها جسدياً"}, {"q": "ما هي إحصاءات الرقمنة في 1 كانون الثاني/يناير 2020؟", "r": "وقد تم رقمنة ما يقرب من 65 في المائة من السطح، حيث سُجلت 3040 قطعة، منها 154 قطعة رقمية مزدوجة."}, {"q": "ما كانت العملية الاستثنائية في يونيو 2025؟", "r": "وقد رُفع نحو 20 من أكبر المباني إلى السطح الذي يتعين دراسته ورقمنه وتجميعه كحجية."}, {"q": "ما نوع الجسم الذي ينبغي اختياره للتمارين التصويرية في الصف؟", "r": "قطعة صغيرة من القماش، مع الغوث وبدون انعكاسات مثل حجر أو قذيفة أو حلوى"}, {"q": "ما هي القيود الرئيسية للصور؟", "r": "خذ 20 إلى 30 صورة من جسم غير متحرك، مع خلفية موحدة، ضوء ناعم وصور متداخلة."}, {"q": "ما هو الغرض من القياس الضوئي وفقا للفيديو، خارج نطاق الآثار؟", "r": "وهي تستخدم في وضع الخطط، والحفاظ على التراث، وخلق ألعاب الفيديو أو الأفلام، ومراقبة المباني دون الصعود."}, {"q": "ما هي المهن المحددة المذكورة فيما يتعلق بالتصوير التصويري والجغرافيا؟", "r": "عالم آثار الغواصات، المطوّر، الجيومتر وأخصائي الهضم الثلاثي الأبعاد."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
