<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Pharos 3/4: Exhibits</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}

.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}

@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>Quiz</h1><p class="sous">قضية الصور 3/4: المعارض</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ما هي الوظيفة الرئيسية الموصوفة في البعثة؟", "choix": ["باء - مسح الجسم", "دال - قياس المياه", "A) Documenting Light", "جيم - نحت تمثال"], "bonne": 0, "explication": "الوظيفة الرئيسية: مسح الجسم."}, {"question": "أي حصن في القرون الوسطى يُذكر بأنه قريب من ميناء (ألكسندريا)؟", "choix": ["C) Pharos Lighthouse", "A) Qaitbay Fort", "دال - قلعة صلاح الدين", "باء - حصن الإسكندرية"], "bonne": 1, "explication": "تخيّل الغوص إلى ميناء (ألكسندريا)، قرب قلعة القرون الوسطى، حصن (قيتاباي)."}, {"question": "ما هو الحجم التقريبي لموقع تحت الماء؟", "choix": ["جيم - هكتاران", "باء - فدان واحد ونصف", "ألف - هكتار واحد", "دال - ثلاثة هكتارات"], "bonne": 1, "explication": "اليوم، هذا الموقع تحت الماء يغطي حوالي الهكتار ونصف، حول حقلين كرة القدم."}, {"question": "ما هي المواد المستخدمة لإغلاق الحجارة؟", "choix": ["(جيم) الذهب والمال", "ألف - الحجر والرمل", "B) Lead, Iron and Bronze", ")د( الفحم والنفط"], "bonne": 2, "explication": "بالإضافة إلى الرصاص، الحديد والبرونز كانا يختمان الحجارة"}, {"question": "كم مرة يبحث فريق سيالكس؟", "choix": ["دال - مرة كل عشر سنوات", "ألف - كل شهر", "باء - مرة أو مرتين في السنة", "جيم - كل أسبوع"], "bonne": 2, "explication": "منذ ألف وتسعمائة وأربعة وتسعون فريق سيالكس قام بتفتيشه مرة أو مرتين في السنة"}, {"question": "ما هو المبدأ الرئيسي للتصوير الضوئي وفقا للفيديو؟", "choix": ["A) Using a laser scanner", "C) Dive with markers", "B) Take many photos from all angles", "D) Use a magnetometer"], "bonne": 2, "explication": "نلتقط صوراً كثيرة لنفس الجسم من جميع الزوايا نتأكد من أن كل صورة تغطي جزئياً الصورة السابقة"}, {"question": "In January 2020, what percentage of the site had been digitized?", "choix": ["جيم - 75 في المائة", "٠٩ في المائة", "ألف - 50 في المائة", "باء - 65 في المائة"], "bonne": 3, "explication": "وبحلول 1 كانون الثاني/يناير، كان الفريق قد وضع رقماً رقمياً لحوالي خمسة وستين في المائة من الموقع، وسجل ثلاثة آلاف وأربعين مبنى في قاعدة بياناته."}, {"question": "كم عدد القطع المسجلة في قاعدة البيانات في كانون الثاني/يناير 2020؟", "choix": ["B) 3,040", "ألف - 500 2", "جيم - 500 3", "دال - ٠٠٠ ٤"], "bonne": 0, "explication": "وبحلول 1 كانون الثاني/يناير، كان الفريق قد وضع رقماً رقمياً لحوالي خمسة وستين في المائة من الموقع، وسجل ثلاثة آلاف وأربعين مبنى في قاعدة بياناته."}, {"question": "ما العائق الذي يتطلب عدم التحرك أثناء إطلاق النار؟", "choix": ["جيم - القيود 3", "D) Constraint four", "باء - القيود", "ألف - القيود"], "bonne": 2, "explication": "Constraint two: an object that does not move."}, {"question": "أي من ما يلي يُشار إليه على أنه استخدام للتصوير الضوئي؟", "choix": ["باء - إتاحة الوقت", "ألف - رسم الخرائط والخطط", "دال - رعاية المرضى", "جيم - جسور البناء"], "bonne": 1, "explication": "It is used to draw maps and plans, to preserve heritage, to make video games and movie sets, and to control buildings without going up there."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
