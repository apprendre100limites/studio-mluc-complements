<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionário — Pharos 3/4: Exposições</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências </div><h1>Quiz</h1><p class="sous">Caso Pharos 3/4: Exposições</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Qual é a função principal descrita na missão?", "choix": ["B) Analisar um objecto", "D) Água de medição", "A) Luz de documentação", "C) Esculpir uma estátua"], "bonne": 0, "explication": "Função principal: Digitalize um objeto."}, {"question": "Que forte medieval é mencionado como estando perto do porto de Alexandria?", "choix": ["C) Farol de Pharos", "A) Forte de Qaitbay", "D) Castelo de Saladino", "B) Forte de Alexandria"], "bonne": 1, "explication": "Imagine mergulhar no porto de Alexandria, perto de um forte medieval, o forte de Qaitbay."}, {"question": "Qual é o tamanho aproximado do local subaquático?", "choix": ["C) Dois hectares", "B) 1 hectare e meio", "A) Um hectare", "D) Três hectares"], "bonne": 1, "explication": "Hoje, este local subaquático cobre cerca de um hectare e meio, cerca de dois campos de futebol."}, {"question": "Que materiais foram usados para selar as pedras?", "choix": ["C) Ouro e dinheiro", "A) Pedra e areia", "B) Chumbo, Ferro e Bronze", "D) Carvão e petróleo"], "bonne": 2, "explication": "...bem como chumbo, ferro e bronze usados para selar pedras."}, {"question": "Com que frequência a equipa Céalex procura?", "choix": ["D) De dez em dez anos", "A) Todos os meses", "B) Uma ou duas vezes por ano", "C) Todas as semanas"], "bonne": 2, "explication": "Desde mil novecentos e noventa e quatro, a equipa do Céalex procurou-o uma ou duas vezes por ano."}, {"question": "Qual é o princípio chave da fotogrametria de acordo com o vídeo?", "choix": ["A) Utilizar um scanner laser", "C) Mergulhar com marcadores", "B) Tire muitas fotos de todos os ângulos", "D) Usar um magnetômetro"], "bonne": 2, "explication": "Tiramos muitas fotos do mesmo objeto de todos os ângulos, certificando-nos de que cada foto cobre parcialmente o anterior."}, {"question": "Em janeiro de 2020, que percentual do site havia sido digitalizado?", "choix": ["C) 75 %", "D) 90 %", "A) 50 %", "B) 65 %"], "bonne": 3, "explication": "Em 1 de janeiro de dois mil e vinte, a equipe tinha digitalizado a superfície de cerca de sessenta e cinco por cento do local, e registrou três mil e quarenta blocos em seu banco de dados."}, {"question": "Quantos blocos foram registrados na base de dados em janeiro de 2020?", "choix": ["B) 3.040", "A) 2.500", "C) 3.500", "D) 4 000"], "bonne": 0, "explication": "Em 1 de janeiro de dois mil e vinte, a equipe tinha digitalizado a superfície de cerca de sessenta e cinco por cento do local, e registrou três mil e quarenta blocos em seu banco de dados."}, {"question": "Que restrição requer que o objeto não se mova durante o tiroteio?", "choix": ["C) Restrição três", "D) Restrição quatro", "B) Restrição dois", "A) Restrição"], "bonne": 2, "explication": "Restrição dois: um objeto que não se move."}, {"question": "Qual dos seguintes é citado como um uso de fotogrametria?", "choix": ["B) Permissão de tempo", "A) Desenho de mapas e planos", "D) Cuidados com os doentes", "C) Construção de pontes"], "bonne": 1, "explication": "É usado para desenhar mapas e planos, para preservar a herança, para fazer jogos de vídeo e jogos de filmes, e para controlar edifícios sem subir lá."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
