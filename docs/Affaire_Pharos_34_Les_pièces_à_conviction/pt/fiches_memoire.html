<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fichas — Processo Pharos 3/4: Exposições</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências </div><h1>Cartões de memória</h1><p class="sous">Caso Pharos 3/4: Exposições</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "Onde estão localizadas as ruínas do Farol de Alexandria?", "r": "Eles estão localizados no fundo do porto de Alexandria, perto do forte medieval de Qaitbay, sob o Mediterrâneo."}, {"q": "Porque é que o farol está hoje debaixo de água?", "r": "Porque a costa de Alexandria passou por um lento subsídio desde os tempos antigos, o que faz com que a localização do mergulho farol."}, {"q": "Qual é o tamanho aproximado do farol subaquático?", "r": "O local abrange cerca de um hectares e meio, o que corresponde a cerca de dois campos de futebol."}, {"q": "De que materiais é o sítio subaquático composto principalmente?", "r": "Consiste em blocos e fragmentos de pedra dura, bem como chumbo, ferro e bronze usados para selar pedras."}, {"q": "Quais são os três edifícios distinguidos pelos arqueólogos no local?", "r": "O farol a noroeste, uma construção romana a nordeste, e uma barragem de proteção a sul feita de colunas de granito."}, {"q": "Qual é o peso máximo mencionado para os blocos colossais e estátuas do farol?", "r": "Estes colossos blocos e estátuas podem pesar até quarenta toneladas."}, {"q": "Com que frequência é que a equipa da Céalex procura neste site?", "r": "A equipe busca uma ou duas vezes por ano, dependendo das condições climáticas e do mar."}, {"q": "Qual é o principal desafio resolvido pela fotogrametria neste site?", "r": "Permite estudar, medir e comparar milhares de blocos debaixo de água sem ter que removê-los fisicamente."}, {"q": "Como a fotogrametria cria um modelo 3D de um objeto?", "r": "Muitas fotos são tiradas de diferentes ângulos com capas, e o software calcula a posição dos pontos para construir o modelo."}, {"q": "O que podemos fazer com o duplo digital de um objeto ou bloco?", "r": "Pode ser girado, medido e movido em um computador sem nunca tocá-lo fisicamente."}, {"q": "Quais foram as estatísticas de digitalização a partir de 1 de janeiro de 2020?", "r": "Aproximadamente 65 por cento da superfície foi digitalizada, com 3040 blocos registrados, dos quais 154 eram duplos digitais."}, {"q": "Qual foi a operação excepcional de junho de 2025?", "r": "Cerca de 20 dos maiores blocos foram levantados à superfície para serem estudados, digitalizados e montados virtualmente como um quebra-cabeça."}, {"q": "Que tipo de objeto deve ser escolhido para o exercício de fotogrametria em classe?", "r": "Um pequeno objeto mate, com alívio e sem reflexos, como uma pedra, uma concha ou uma estatueta."}, {"q": "Quais são as principais restrições para as fotos?", "r": "Tire de 20 a 30 fotos de um objeto imóvel, com um fundo unido, luz suave e fotos sobrepostas."}, {"q": "Qual é o propósito da fotogrametria de acordo com o vídeo, fora do domínio arqueológico?", "r": "É usado para desenhar planos, preservar a herança, criar jogos de vídeo ou filmes, e controlar edifícios sem subir."}, {"q": "Que profissões específicas são mencionadas em relação à fotogrametria e topografia?", "r": "O arqueólogo mergulhador, o topógrafo, o geômetro e o especialista em digitalização tridimensional."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
