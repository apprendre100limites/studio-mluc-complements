<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Pharos 3/4: Exhibiciones</title><style>

</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Quiz</h1><p class="sous">Caso Pharos 3/4: Exhibiciones</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Cuál es la función principal descrita en la misión?", "choix": ["B) Analizar un objeto", "D) Agua de medición", "A) Documentación de la luz", "C) Esculpir una estatua"], "bonne": 0, "explication": "Función principal: Escanear un objeto."}, {"question": "¿Qué fortaleza medieval se menciona como estar cerca del puerto de Alejandría?", "choix": ["C) Faro de Pharos", "A) Fuerza Qaitbay", "D) Castillo de Saladin", "B) Fort of Alexandria"], "bonne": 1, "explication": "Imagínese sumergirse en el puerto de Alejandría, cerca de un fuerte medieval, el fuerte de Qaitbay."}, {"question": "¿Cuál es el tamaño aproximado del sitio submarino?", "choix": ["C) Dos hectáreas", "B) Uno y medio acres", "A) Una hectárea", "D) Tres hectáreas"], "bonne": 1, "explication": "Hoy en día, este sitio subacuático cubre alrededor de una hectárea y medio, cerca de dos campos de fútbol."}, {"question": "¿Qué materiales se utilizaron para sellar las piedras?", "choix": ["(C) Oro y dinero", "A) Piedra y arena", "B) Plomo, hierro y bronce", "(D) Carbón y aceite"], "bonne": 2, "explication": "...así como plomo, hierro y bronce utilizado para sellar piedras."}, {"question": "¿Con qué frecuencia busca el equipo de Céalex?", "choix": ["D) Una vez cada diez años", "A) Cada mes", "B) Una o dos veces al año", "C) Cada semana"], "bonne": 2, "explication": "Desde mil novecientos noventa y cuatro, el equipo de Céalex lo ha buscado una o dos veces al año."}, {"question": "¿Cuál es el principio clave de la fotogrametría según el vídeo?", "choix": ["A) Usando un escáner láser", "C) Buceo con marcadores", "B) Tome muchas fotos desde todos los ángulos", "D) Use un magnetómetro"], "bonne": 2, "explication": "Tomamos muchas fotos del mismo objeto desde todos los ángulos, asegurando que cada foto cubre parcialmente el anterior."}, {"question": "En enero de 2020, ¿qué porcentaje del sitio se había digitalizado?", "choix": ["C) 75%", "D) 90%", "A) 50%", "B) 65%"], "bonne": 3, "explication": "Para el 1 de enero dos mil y veinte, el equipo había digitalizado la superficie de alrededor del sesenta y cinco por ciento del sitio, y registró tres mil y cuarenta bloques en su base de datos."}, {"question": "¿Cuántos bloques se registraron en la base de datos en enero de 2020?", "choix": ["B) 3.040", "A) 2.500", "C) 3.500", "D) 4 000"], "bonne": 0, "explication": "Para el 1 de enero dos mil y veinte, el equipo había digitalizado la superficie de alrededor del sesenta y cinco por ciento del sitio, y registró tres mil y cuarenta bloques en su base de datos."}, {"question": "¿Qué restricción requiere que el objeto no se mueva durante el tiroteo?", "choix": ["C) Limitación tres", "D) Limitación cuatro", "B) Limitación dos", "A) Limitación"], "bonne": 2, "explication": "Constraint dos: un objeto que no se mueve."}, {"question": "¿Cuál de los siguientes es citado como un uso de fotogrametría?", "choix": ["B) Tiempo de asignación", "A) Elaboración de mapas y planes", "D) Atención a pacientes", "C) Puentes de construcción"], "bonne": 1, "explication": "Se utiliza para dibujar mapas y planes, para preservar el patrimonio, para hacer videojuegos y juegos de películas, y para controlar edificios sin subir allí."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
