<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fichas informativas — Caso Pharos 3/4: Exposiciones</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Tarjetas de memoria</h1><p class="sous">Caso Pharos 3/4: Exhibiciones</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Dónde están ubicadas las ruinas del Faro de Alejandría?", "r": "Están situados en la parte inferior del puerto de Alejandría, cerca del fuerte medieval de Qaitbay, bajo el Mediterráneo."}, {"q": "¿Por qué el sitio de faro está hoy bajo el agua?", "r": "Debido a que la costa de Alejandría ha sufrido una lenta subsistencia desde tiempos antiguos, lo que hace la ubicación de la inmersión en el faro."}, {"q": "¿Cuál es el tamaño aproximado del faro bajo el agua sitio?", "r": "El sitio cubre aproximadamente una y media hectáreas, que corresponde a unos dos campos de fútbol."}, {"q": "¿De qué materiales está compuesto principalmente el sitio submarino?", "r": "Se compone de bloques y fragmentos de piedra dura, así como plomo, hierro y bronce usados para sellar piedras."}, {"q": "¿Cuáles son los tres edificios distinguidos por arqueólogos en el sitio?", "r": "El faro al noroeste, una construcción romana al noreste, y una presa de protección al sur hecha de columnas de granito."}, {"q": "¿Cuál es el peso máximo mencionado para los bloques colosales y estatuas del faro?", "r": "Estos bloques y estatuas colosales pueden pesar hasta cuarenta toneladas."}, {"q": "¿Con qué frecuencia el equipo de Céalex busca este sitio?", "r": "El equipo busca una o dos veces al año, dependiendo del clima y las condiciones del mar."}, {"q": "¿Cuál es el principal desafío resuelto por fotogrametría en este sitio?", "r": "Permite estudiar, medir y comparar miles de bloques bajo el agua sin tener que eliminarlos físicamente."}, {"q": "¿Cómo crea fotogrametría un modelo 3D de un objeto?", "r": "Muchas fotos son tomadas desde diferentes ángulos con cubiertas, y el software calcula la posición de los puntos para construir el modelo."}, {"q": "¿Qué podemos hacer con el doble digital de un objeto o bloque?", "r": "Puede ser rotado, medido y movido en un ordenador sin tocarlo físicamente."}, {"q": "¿Cuáles fueron las estadísticas de digitalización a partir del 1 de enero de 2020?", "r": "Aproximadamente el 65% de la superficie fue digitalizada, con 3040 bloques registrados, de los cuales 154 eran dobles digitales."}, {"q": "¿Cuál fue la operación excepcional de junio de 2025?", "r": "Alrededor de 20 de los bloques más grandes se elevaron a la superficie para ser estudiado, digitalizado y montado virtualmente como un rompecabezas."}, {"q": "¿Qué tipo de objeto debe ser elegido para el ejercicio de fotogrametría en clase?", "r": "Un pequeño objeto mate, con relieve y sin reflejos, como una piedra, una cáscara o una figura."}, {"q": "¿Cuáles son las principales limitaciones para las fotos?", "r": "Tome 20 a 30 fotos de un objeto inmóvil, con un fondo unido, luz suave y fotos superpuestas."}, {"q": "¿Cuál es el propósito de la fotogrametría según el vídeo, fuera del dominio arqueológico?", "r": "Se utiliza para dibujar planes, preservar el patrimonio, crear videojuegos o películas, y controlar edificios sin subir."}, {"q": "¿Qué profesiones específicas se mencionan en relación con fotogrametría y topografía?", "r": "El arqueólogo buzo, el topógrafo, el geométrico y el especialista en digitalización tridimensional."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
