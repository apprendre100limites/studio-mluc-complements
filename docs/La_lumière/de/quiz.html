<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Licht</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Quiz</h1><p class="sous">Licht</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Was macht der Mond mit Sonnenlicht?", "choix": ["Sie sendet es.", "Sie verwandelt es in Hitze", "Sie speichert es.", "Sie absorbiert es."], "bonne": 0, "explication": "Es empfängt die Sonne und sendet sie in alle Richtungen zurück: Es wird gesagt, dass es sie verbreitet."}, {"question": "Wie breitet sich Licht in der Luft aus?", "choix": ["Spirale", "Geradeauslinie", "im Zickzack", "in Kurven"], "bonne": 1, "explication": "In der Luft breitet sich Licht in einer geraden Linie aus."}, {"question": "Was ist die ungefähre Lichtgeschwindigkeit?", "choix": ["Etwa dreißigtausend Kilometer pro Sekunde", "Etwa drei Millionen Kilometer pro Sekunde", "Dreihunderttausend Kilometer pro Sekunde", "Etwa dreihundert Kilometer pro Sekunde"], "bonne": 2, "explication": "Das Licht geht sehr schnell: etwa dreihunderttausend Kilometer pro Sekunde."}, {"question": "Wie lange braucht das Licht, um von der Sonne zur Erde zu kommen?", "choix": ["1 Stunde", "Eine Sekunde", "Etwas mehr als acht Minuten", "4 Minuten"], "bonne": 2, "explication": "Es dauert etwas mehr als acht Minuten, um von der Sonne zu kommen."}, {"question": "Was passiert im Schatten eines Objekts, wenn Sie die Lampe wegnehmen, die es beleuchtet?", "choix": ["Der Schatten wird größer", "Der Schatten verengt sich, bis er sich der Größe des Objekts nähert", "Schatten ändert seine Form, behält aber die gleiche Größe", "Der Schatten verschwindet vollständig"], "bonne": 1, "explication": "Hält die Lampe fern: Die Grenzstrahlen werden fast parallel und der Schatten verengt sich, bis er sich der Größe des Objekts nähert."}, {"question": "Welches dieser Elemente wird NICHT als Quelle für schädliches Licht für die Augen erwähnt?", "choix": ["Eine Taschenlampe", "Die Sonne", "Ein Laser der Klasse drei oder vier", "Der Lichtbogen einer Schweißung"], "bonne": 0, "explication": "Drei Fälle: die Sonne, ein Laser der Klasse drei oder vier und der Lichtbogen eines Lots."}, {"question": "Welcher Beruf macht Brillen, indem er dem Weg der Lichtstrahlen folgt?", "choix": ["Ein Astronom", "Ein Architekt", "Ein Optiker", "Ein Welder"], "bonne": 2, "explication": "Ein Optiker stellt Brillen nach dem Weg der Lichtstrahlen her."}, {"question": "Warum sind gewöhnliche Sonnenbrillen nicht genug, um eine Sonnenfinsternis zu sehen?", "choix": ["Weil sie nicht vor dem Wind schützen", "Weil sie nicht speziell dafür geplant sind.", "Weil sie zu dunkel sind.", "Weil sie aus Plastik sind."], "bonne": 1, "explication": "Gewöhnliche Sonnenbrillen sind nicht genug."}, {"question": "Was nennt man ein Objekt, das sein eigenes Licht nicht erzeugt, sondern es verbreitet?", "choix": ["Primärquelle", "Sekundärquelle", "Verbreitung", "Undurchsichtiges Objekt"], "bonne": 2, "explication": "Es ist ein diffuses Objekt."}, {"question": "Welche Aussage fasst die Bedingung für die Betrachtung eines Objekts gemäß dem Video zusammen?", "choix": ["Man sieht ein Objekt nur, wenn es vom Mond beleuchtet wird.", "Wir sehen ein Objekt nur, wenn es in unserer Nähe ist.", "Man sieht ein Objekt, wenn der Schatten, den es wirft, klein ist.", "Man sieht ein Objekt, wenn Licht von ihm in das Auge kommt."], "bonne": 3, "explication": "Man sieht ein Objekt, wenn Licht von ihm in das Auge kommt."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
