<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherkarten — Licht</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 7 · 12–13 Jahre</div><h1>Speicherkarten</h1><p class="sous">Licht</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Woher kommt das Licht, das unsere Augen sehen?", "r": "Es kommt von einer primären Quelle, die es emittiert, wie die Sonne, eine beleuchtete Lampe oder eine Flamme."}, {"q": "Produziert der Mond sein eigenes Licht?", "r": "Nein, der Mond erzeugt kein Licht. Es verbreitet einfach die der Sonne."}, {"q": "Was ist ein diffuses Objekt?", "r": "Es ist ein Objekt, das Licht empfängt und es in alle Richtungen zurückgibt, ohne es zu erschaffen."}, {"q": "Wie siehst du ein Buch?", "r": "Eine Quelle erleuchtet das Buch, das Buch verbreitet das Licht und ein Teil tritt in das Auge ein."}, {"q": "Wie bewegt sich das Licht in der Luft?", "r": "Es breitet sich in einer geraden Linie aus, dargestellt durch einen Lichtstrahl."}, {"q": "Was ist ein Lichtstrahl?", "r": "Es ist eine Reihe von Strahlen aus der gleichen Quelle, begrenzt durch zwei extreme Strahlen."}, {"q": "Was ist die ungefähre Lichtgeschwindigkeit?", "r": "Dreihunderttausend Kilometer pro Sekunde."}, {"q": "Wie lange braucht das Sonnenlicht, um die Erde zu erreichen?", "r": "Etwas mehr als acht Minuten."}, {"q": "Warum wächst der Schatten eines Objekts, wenn die Lampe in der Nähe ist?", "r": "Die Strahlen um die Ränder herum sind weit voneinander entfernt und erweitern den projizierten Schatten."}, {"q": "Warum schrumpft der Schatten, wenn sich die Lampe entfernt?", "r": "Die Grenzstrahlen werden fast parallel, wodurch die Schattengröße verringert wird."}, {"q": "Was sind die drei Fälle von Licht, die Augenschäden verursachen können?", "r": "Die Sonne, ein Laser der Klasse drei oder vier, und der Lichtbogen eines Lots."}, {"q": "Warum sind gewöhnliche Sonnenbrillen nicht genug, um eine Sonnenfinsternis zu sehen?", "r": "Sie sind nicht speziell entwickelt, um die Sonnenintensität einer Sonnenfinsternis zu filtern."}, {"q": "In welchen Bereichen ist die Flugbahn des Lichts nützlich?", "r": "In der Architektur (Schatten vorbereiten), Optik (Brille herstellen), Astronomie (Studiensternlicht) und Schweißen (Augen schützen)."}, {"q": "Warum sehen wir den Mond?", "r": "Weil es das Licht der Sonne verbreitet, ein diffuses Objekt ist, keine primäre Quelle."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
