<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas de memoria — Luz</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Tarjetas de memoria</h1><p class="sous">Luz</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿De dónde viene la luz que ven nuestros ojos?", "r": "Viene de una fuente primaria que la emite, como el Sol, una lámpara iluminada o una llama."}, {"q": "¿La Luna produce su propia luz?", "r": "No, la luna no produce luz; Simplemente difunde la del Sol."}, {"q": "¿Qué es un objeto difuso?", "r": "Es un objeto que recibe luz y la devuelve en todas las direcciones sin crearlo."}, {"q": "¿Cómo ves un libro?", "r": "Una fuente ilumina el libro, el libro difunde la luz y una parte entra en el ojo."}, {"q": "¿Cómo se mueve la luz en el aire?", "r": "Se extiende en una línea recta, representada por un rayo de luz."}, {"q": "¿Qué es un rayo de luz?", "r": "Es un conjunto de rayos de la misma fuente, limitado por dos rayos extremos."}, {"q": "¿Cuál es la velocidad aproximada de la luz?", "r": "Unos trescientos mil kilómetros por segundo."}, {"q": "¿Cuánto tarda la luz solar en llegar a la Tierra?", "r": "Un poco más de ocho minutos."}, {"q": "¿Por qué crece la sombra de un objeto cuando la lámpara está cerca?", "r": "Los rayos alrededor de los bordes están muy separados, ampliando la sombra proyectada."}, {"q": "¿Por qué la sombra se encoge cuando la lámpara se aleja?", "r": "Los rayos límite se vuelven casi paralelos, reduciendo el tamaño de la sombra."}, {"q": "¿Cuáles son los tres casos de luz que pueden causar daño ocular?", "r": "El Sol, una clase tres o cuatro láser, y el arco eléctrico de un soldador."}, {"q": "¿Por qué no son suficientes gafas de sol normales para ver un eclipse?", "r": "No están especialmente diseñados para filtrar la intensidad solar de un eclipse."}, {"q": "¿En qué áreas es útil la trayectoria de la luz?", "r": "En la arquitectura (sombras prepare), la óptica (objetos de tomate), la astronomía (luz estrella del estudio) y la soldadura (ojos protectores)."}, {"q": "¿Por qué vemos la Luna?", "r": "Porque difunde la luz del Sol, siendo un objeto difuso, no una fuente primaria."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
