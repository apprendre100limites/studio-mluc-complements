<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Luz</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 1.º de ESO · 12-13 años</div><h1>Quiz</h1><p class="sous">Luz</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Qué hace la luna con la luz solar?", "choix": ["Lo transmite.", "Ella lo convierte en calor", "Lo guarda.", "Lo absorbe."], "bonne": 0, "explication": "Recibe el Sol y lo envía de nuevo en todas las direcciones: se dice que lo esparce."}, {"question": "¿Cómo se extiende la luz en el aire?", "choix": ["Spiral", "Línea recta", "En zigzag", "En curvas"], "bonne": 1, "explication": "En el aire, la luz se extiende en una línea recta."}, {"question": "¿Cuál es la velocidad aproximada de la luz?", "choix": ["Alrededor de treinta mil kilómetros por segundo", "Unos tres millones de kilómetros por segundo", "Unos trescientos mil kilómetros por segundo", "Unos trescientos kilómetros por segundo"], "bonne": 2, "explication": "La luz va muy rápido: unos trescientos mil kilómetros por segundo."}, {"question": "¿Cuánto tarda la luz en venir del Sol a la Tierra?", "choix": ["Una hora", "Un segundo", "Un poco más de ocho minutos", "Cuatro minutos"], "bonne": 2, "explication": "Se tarda un poco más de ocho minutos en venir del Sol."}, {"question": "¿Qué pasa en la sombra de un objeto cuando se quita la lámpara que lo ilumina?", "choix": ["La sombra se hace más grande", "La sombra se estrecha, hasta que se acerca el tamaño del objeto", "La sombra cambia de forma pero mantiene el mismo tamaño", "La sombra desaparece completamente"], "bonne": 1, "explication": "Mantiene la lámpara de distancia: los rayos límite se vuelven casi paralelos, y la sombra se estrecha, hasta que se acerca el tamaño del objeto."}, {"question": "¿Cuál de estos elementos NO se menciona como una fuente de luz dañina para los ojos?", "choix": ["Una linterna", "El Sol", "Una clase tres o cuatro láser", "El arco eléctrico de una soldadura"], "bonne": 0, "explication": "Tres casos: el Sol, una clase tres o cuatro láser, y el arco eléctrico de un soldador."}, {"question": "¿Qué profesión hace gafas siguiendo el camino de los rayos de luz?", "choix": ["Un astrónomo", "Un arquitecto", "Un óptico", "Un soldador"], "bonne": 2, "explication": "Un óptico hace gafas siguiendo el camino de los rayos de luz."}, {"question": "¿Por qué no son suficientes gafas de sol normales para ver un eclipse?", "choix": ["Porque no protegen contra el viento", "Porque no están específicamente planeados para eso.", "Porque están demasiado oscuros.", "Porque están hechos de plástico."], "bonne": 1, "explication": "Las gafas de sol ordinarias no son suficientes."}, {"question": "¿Qué se llama objeto que no produce su propia luz sino que la difusora?", "choix": ["Fuente primaria", "Fuente secundaria", "Difusión", "Objeto opaco"], "bonne": 2, "explication": "Es un objeto difuso."}, {"question": "¿Qué declaración resume la condición para ver un objeto según el vídeo?", "choix": ["Uno ve un objeto sólo cuando se ilumina por la Luna.", "Sólo vemos un objeto cuando está cerca de nosotros.", "Uno ve un objeto si la sombra que arroja es pequeña.", "Uno ve un objeto si la luz viene de él a los ojos."], "bonne": 3, "explication": "Uno ve un objeto si la luz viene de él a los ojos."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
