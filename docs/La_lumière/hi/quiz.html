<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी - लाइट</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>प्रश्नोत्तरी</h1><p class="sous">प्रकाश</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "सूर्य के प्रकाश के साथ चंद्रमा क्या करता है?", "choix": ["वह इसे प्रसारित करती है।", "वह इसे गर्मी में बदल जाता है", "वह इसे स्टोर करती है।", "वह इसे अवशोषित करती है।"], "bonne": 0, "explication": "यह सूर्य प्राप्त करता है और इसे सभी दिशाओं में वापस भेजता है: इसे फैलाने के लिए कहा जाता है।"}, {"question": "हवा में प्रकाश कैसे फैलता है?", "choix": ["सर्पिल", "सीधी रेखा", "ज़िगज़ैग में", "वक्र में"], "bonne": 1, "explication": "हवा में प्रकाश एक सीधी रेखा में फैलता है।"}, {"question": "प्रकाश की लगभग गति क्या है?", "choix": ["लगभग तीस हजार किलोमीटर प्रति सेकंड", "प्रति सेकंड लगभग तीन मिलियन किलोमीटर", "लगभग तीन हजार किलोमीटर प्रति सेकंड", "प्रति सेकंड तीन सौ किलोमीटर"], "bonne": 2, "explication": "प्रकाश बहुत तेजी से चला जाता है: लगभग तीन सौ हजार किलोमीटर प्रति सेकंड।"}, {"question": "सूर्य से पृथ्वी तक कितनी देर तक प्रकाश आने लगता है?", "choix": ["एक घंटे", "दूसरा", "8 मिनट", "चार मिनट"], "bonne": 2, "explication": "सूर्य से आने के लिए आठ मिनट से अधिक समय लगता है।"}, {"question": "जब आप दीपक को दूर करते हैं तो किसी वस्तु की छाया में क्या होता है?", "choix": ["छाया बड़ा हो जाता है", "जब तक यह वस्तु के आकार तक पहुंच जाता है तब तक छाया संकीर्ण होती है", "छाया परिवर्तन आकार लेकिन एक ही आकार रखता है", "छाया पूरी तरह से गायब हो जाती है"], "bonne": 1, "explication": "दीपक को दूर रखता है: सीमा किरण लगभग समानांतर हो जाती है, और छाया संकीर्ण हो जाती है, जब तक कि यह वस्तु के आकार तक पहुंचती है।"}, {"question": "इनमें से कौन-सा तत्व आंखों के लिए हानिकारक प्रकाश के स्रोत के रूप में उल्लेख नहीं किया गया है?", "choix": ["एक टॉर्च", "सूर्य", "तीन या चार लेजर", "वेल्डिंग का विद्युत चाप"], "bonne": 0, "explication": "तीन मामले: सूर्य, एक वर्ग तीन या चार लेजर, और एक मिलाप के बिजली चाप।"}, {"question": "क्या पेशे प्रकाश किरणों के पथ का पालन करके चश्मा बनाता है?", "choix": ["एक खगोलशास्त्री", "एक वास्तुकार", "एक प्रकाशिकी", "वेल्डर"], "bonne": 2, "explication": "एक प्रकाशिकी प्रकाश किरणों के पथ के बाद चश्मा बनाता है।"}, {"question": "क्यों एक ग्रहण देखने के लिए पर्याप्त साधारण धूप का चश्मा नहीं हैं?", "choix": ["क्योंकि वे हवा के खिलाफ सुरक्षा नहीं करते हैं", "क्योंकि वे इसके लिए विशेष रूप से योजनाबद्ध नहीं हैं।", "क्योंकि वे बहुत अंधेरे हैं।", "क्योंकि वे प्लास्टिक से बने होते हैं।"], "bonne": 1, "explication": "साधारण धूप का चश्मा पर्याप्त नहीं हैं।"}, {"question": "क्या कहा जाता है एक वस्तु जो अपनी खुद की रोशनी का उत्पादन नहीं करता है लेकिन यह फैलता है?", "choix": ["प्राथमिक स्रोत", "माध्यमिक स्रोत", "भेदभाव", "अपारदर्शी वस्तु"], "bonne": 2, "explication": "यह एक फैलाव वस्तु है।"}, {"question": "क्या बयान वीडियो के अनुसार किसी वस्तु को देखने के लिए शर्त को संक्षेप में बताता है?", "choix": ["एक वस्तु को केवल तभी देखता है जब यह चंद्रमा द्वारा प्रकाशित होता है।", "हम केवल एक वस्तु को देखते हैं जब यह हमारे करीब है।", "एक वस्तु को देखता है यदि इसे फेंकना छोटा है।", "यदि प्रकाश उससे आंखों में आता है तो वह एक वस्तु को देखता है।"], "bonne": 3, "explication": "यदि प्रकाश उससे आंखों में आता है तो वह एक वस्तु को देखता है।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
