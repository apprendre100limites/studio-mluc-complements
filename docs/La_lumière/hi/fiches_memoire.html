<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी कार्ड - लाइट</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 7 · आयु 12–13 वर्ष</div><h1>मेमोरी कार्ड</h1><p class="sous">प्रकाश</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "हमारी आँखें कहाँ से आती हैं?", "r": "यह एक प्राथमिक स्रोत से आता है जो इसे उत्सर्जित करता है, जैसे कि सूर्य, एक लीटर दीपक या लौ।"}, {"q": "क्या चंद्रमा अपनी खुद की रोशनी पैदा करता है?", "r": "नहीं, चंद्रमा प्रकाश का उत्पादन नहीं करता है; यह बस सूर्य की है कि फैलता है।"}, {"q": "एक फैलाव वस्तु क्या है?", "r": "यह एक ऐसी वस्तु है जो प्रकाश प्राप्त करती है और इसे बनाने के बिना सभी दिशाओं में वापस आती है।"}, {"q": "आप एक पुस्तक कैसे देख सकते हैं?", "r": "एक स्रोत पुस्तक को प्रकाश देता है, पुस्तक प्रकाश को फैलती है और एक हिस्सा आंख में प्रवेश करती है।"}, {"q": "हवा में प्रकाश कैसे चलता है?", "r": "यह एक सीधी रेखा में फैलता है, जो प्रकाश की किरण द्वारा दर्शाया गया है।"}, {"q": "प्रकाश की किरण क्या है?", "r": "यह एक ही स्रोत से किरणों का एक सेट है, जो दो चरम किरणों तक सीमित है।"}, {"q": "प्रकाश की लगभग गति क्या है?", "r": "लगभग तीन हजार किलोमीटर प्रति सेकंड।"}, {"q": "सूरज की रोशनी कितनी देर तक पृथ्वी तक पहुंचती है?", "r": "आठ मिनट से अधिक समय तक।"}, {"q": "जब दीपक निकट है तो किसी वस्तु की छाया बढ़ती है?", "r": "किनारों के आसपास की किरणें विस्तृत हैं, जो अनुमानित छाया को चौड़ा करती हैं।"}, {"q": "जब दीपक दूर हो जाता है तो छाया सिकुड़ती क्यों होती है?", "r": "सीमा किरण लगभग समानांतर हो जाती है, जो छाया के आकार को कम करती है।"}, {"q": "प्रकाश के तीन मामले क्या हैं?", "r": "सूर्य, एक वर्ग तीन या चार लेजर, और एक मिलाप के बिजली चाप।"}, {"q": "क्यों एक ग्रहण देखने के लिए पर्याप्त साधारण धूप का चश्मा नहीं हैं?", "r": "उन्हें विशेष रूप से ग्रहण की सौर तीव्रता को फ़िल्टर करने के लिए डिज़ाइन नहीं किया गया है।"}, {"q": "किस क्षेत्र में उपयोगी प्रकाश का प्रक्षेप है?", "r": "वास्तुकला (prepare shadows), प्रकाशिकी (मेक ग्लास), खगोल विज्ञान (स्टडी स्टार लाइट) और वेल्डिंग (आंखों की रक्षा) में।"}, {"q": "हम क्यों देखते हैं?", "r": "क्योंकि यह सूर्य की रोशनी को फैलता है, एक फैलाव वस्तु है, प्राथमिक स्रोत नहीं।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
