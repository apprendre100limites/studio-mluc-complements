<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بطاقات الذاكرة - الضوء</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">المستوى 5</div><h1>بطاقات الذاكرة</h1><p class="sous">الضوء</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "من أين يأتي الضوء الذي تراه عيوننا؟", "r": "يأتي من مصدر رئيسي يُصدره، مثل الشمس، مصباح مشتعل أو لهيب."}, {"q": "هل ينتج القمر نوره الخاص؟", "r": "لا، القمر لا ينتج الضوء إنه ينشر ببساطة تلك الشمس"}, {"q": "ما هو الجسم الانتشار؟", "r": "إنّه جسمٌ يُلقي الضوء ويُعيده في جميع الاتجاهات دون خلقه."}, {"q": "كيف ترى كتاب؟", "r": "المصدر ينوّر الكتاب وينشر الضوء ويدخل جزء بعينه"}, {"q": "كيف يتحرك الضوء في الهواء؟", "r": "إنه ينتشر في خط مستقيم يمثله شعاع من الضوء"}, {"q": "ما هو الشعاع من الضوء؟", "r": "إنها مجموعة من الأشعة من نفس المصدر محدودة بأشعة متطرفة"}, {"q": "ما هي سرعة الضوء التقريبية؟", "r": "حوالي ثلاثمائة ألف كيلومتر في الثانية"}, {"q": "كم يستغرق ضوء الشمس للوصول إلى الأرض؟", "r": "أكثر قليلا من ثماني دقائق."}, {"q": "لماذا ينمو ظل الجسم عندما يقترب المصباح؟", "r": "الأشعة حول الحواف متباعدة، توسّع الظل المتوقّع."}, {"q": "لماذا يتقلص الظل عندما ينتقل المصباح؟", "r": "The limit rays become almost parallel, reducing the size of the shadow."}, {"q": "ما هي الحالات الثلاث للضوء التي يمكن أن تسبب ضررا بالعين؟", "r": "الشمس، درجة ثلاثة أو أربعة ليزر، والقوس الكهربائي للمبيعات."}, {"q": "لماذا ليست نظارات شمسية عادية بما فيه الكفاية لمشاهدة الكسوف؟", "r": "إنها ليست مصممة خصيصاً لتصفية الكسوف الشمسي"}, {"q": "في أي مجال يكون مسار الضوء مفيداً؟", "r": "In structure (prepare shadows), optics (make glass), astronomy (study star light) and welding (protect eyes)."}, {"q": "لماذا نرى القمر؟", "r": "لأنه ينشر ضوء الشمس، كونه جسماً منتشراً، ليس مصدر رئيسي."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
