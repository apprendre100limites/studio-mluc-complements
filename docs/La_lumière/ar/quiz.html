<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Light</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">المستوى 5</div><h1>Quiz</h1><p class="sous">الضوء</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ماذا يفعل القمر بضوء الشمس؟", "choix": ["إنها تبثها", "إنها تحولها إلى حرارة", "إنها تخزنها", "إنها تستوعبه"], "bonne": 0, "explication": "It receives the Sun and sends it back in all directions: it is said to spread it."}, {"question": "كيف ينتشر الضوء في الهواء؟", "choix": ["الروح", "خط مستقيم", "In zigzag", "في منحنى"], "bonne": 1, "explication": "في الهواء ينتشر الضوء في خط مستقيم"}, {"question": "ما هي سرعة الضوء التقريبية؟", "choix": ["حوالي ثلاثين ألف كيلومتر في الثانية", "حوالي ثلاثة ملايين كيلومتر في الثانية", "حوالي 300 ألف كيلومتر في الثانية", "حوالي 300 كيلومتر في الثانية"], "bonne": 2, "explication": "الضوء يمر بسرعة كبيرة: حوالي 300 ألف كيلومتر في الثانية."}, {"question": "كم يستغرق الضوء من الشمس إلى الأرض؟", "choix": ["ساعة واحدة", "ثانية واحدة", "أكثر قليلا من ثماني دقائق", "أربع دقائق"], "bonne": 2, "explication": "يتطلب الأمر أكثر من 8 دقائق من الشمس"}, {"question": "ماذا يحدث في ظل الجسم عندما تأخذ المصباح الذي يشعله؟", "choix": ["الظل يصبح أكبر", "الظل يضيق حتى يقترب من حجم الجسم", "الظل يتغيّر الشكل لكن يبقى نفس الحجم", "الظل يختفي تماما"], "bonne": 1, "explication": "يُبقي المصباح بعيداً: الأشعة الحدية تصبح متوازية تقريباً، والظل يضيق، حتى يقترب من حجم الجسم."}, {"question": "أي من هذه العناصر لم يذكر كمصدر للضوء الضار للعين؟", "choix": ["مصباح", "الشمس", "درجة ثلاثة أو أربعة ليزر", "القوس الكهربائي لحام"], "bonne": 0, "explication": "ثلاث حالات: الشمس، درجة ثلاثة أو أربعة ليزر، والقوس الكهربائي للمبيعات."}, {"question": "ما المهنة التي تصنع النظارات من خلال تتبع مسار الأشعة الضوئية؟", "choix": ["عالم فلك", "مهندس معماري", "بصري", "وولدر"], "bonne": 2, "explication": "بصري يصنع نظارات بعد مسار الأشعة الضوئية"}, {"question": "لماذا ليست نظارات شمسية عادية بما فيه الكفاية لمشاهدة الكسوف؟", "choix": ["لأنهم لا يحميون من الرياح", "لأنهم لم يخططوا لذلك بالتحديد", "لأنهم مظلمين جداً", "لأنها مصنوعة من البلاستيك"], "bonne": 1, "explication": "النظارات الشمسية العادية ليست كافية"}, {"question": "ما الذي يُسمّى جسماً لا يُنتج الضوء الخاص به لكن ينشره؟", "choix": ["المصدر الرئيسي", "المصدر الثانوي", "النشر", "الجسم التافه"], "bonne": 2, "explication": "إنّه شيء مُنتشر."}, {"question": "أي بيان يوجز شرط رؤية شيء وفقاً للفيديو؟", "choix": ["واحد يرى غرضاً فقط عندما يُلوّه القمر", "نحن نرى فقط شيء عندما يكون قريبا منا.", "واحد يرى الجسم إذا الظل الذي يرميه صغير", "واحد يرى الجسم إذا الضوء يأتي منه في العين."], "bonne": 3, "explication": "واحد يرى الجسم إذا الضوء يأتي منه في العين."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
