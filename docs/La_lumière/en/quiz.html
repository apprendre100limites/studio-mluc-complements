<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Light</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Quiz</h1><p class="sous">Light</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What does the moon do with sunlight?", "choix": ["She broadcasts it.", "She turns it into heat", "She stores it.", "She absorbs it."], "bonne": 0, "explication": "It receives the Sun and sends it back in all directions: it is said to spread it."}, {"question": "How does light spread in the air?", "choix": ["Spiral", "Straight line", "In zigzag", "In curves"], "bonne": 1, "explication": "In the air, light spreads in a straight line."}, {"question": "What is the approximate speed of light?", "choix": ["About thirty thousand kilometers per second", "About three million kilometres per second", "About three hundred thousand kilometers per second", "About three hundred kilometers per second"], "bonne": 2, "explication": "The light goes very fast: about three hundred thousand kilometers per second."}, {"question": "How long does the light take to come from the Sun to the Earth?", "choix": ["One hour", "One second", "A little over eight minutes", "Four minutes"], "bonne": 2, "explication": "It takes a little more than eight minutes to come from the Sun."}, {"question": "What happens in the shadow of an object when you take away the lamp that lights it?", "choix": ["The shadow becomes bigger", "The shadow narrows, until it approaches the size of the object", "Shadow changes shape but keeps the same size", "The shadow disappears completely"], "bonne": 1, "explication": "Keeps the lamp away: the limit rays become almost parallel, and the shadow narrows, until it approaches the size of the object."}, {"question": "Which of these elements is NOT mentioned as a source of harmful light for the eyes?", "choix": ["A flashlight", "The Sun", "A class three or four laser", "The electric arc of a welding"], "bonne": 0, "explication": "Three cases: the Sun, a class three or four laser, and the electric arc of a solder."}, {"question": "What profession makes glasses by following the path of light rays?", "choix": ["An astronomer", "An architect", "An optician", "A Welder"], "bonne": 2, "explication": "An optician makes glasses following the path of light rays."}, {"question": "Why aren't ordinary sunglasses enough to watch an eclipse?", "choix": ["Because they don't protect against the wind", "Because they're not specifically planned for that.", "Because they're too dark.", "Because they're made of plastic."], "bonne": 1, "explication": "Ordinary sunglasses are not enough."}, {"question": "What is called an object that does not produce its own light but diffuses it?", "choix": ["Primary source", "Secondary source", "Dissemination", "Opaque object"], "bonne": 2, "explication": "It's a diffuse object."}, {"question": "What statement summarizes the condition for viewing an object according to the video?", "choix": ["One sees an object only when it is illuminated by the Moon.", "We only see an object when it is close to us.", "One sees an object if the shadow it throws is small.", "One sees an object if light comes from him into the eye."], "bonne": 3, "explication": "One sees an object if light comes from him into the eye."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
