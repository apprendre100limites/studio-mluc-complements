<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory cards — Light</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 8 · ages 12–13</div><h1>Memory cards</h1><p class="sous">Light</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "Where does the light our eyes see come from?", "r": "It comes from a primary source that emits it, such as the Sun, a lit lamp or a flame."}, {"q": "Does the Moon produce its own light?", "r": "No, the moon does not produce light; It simply diffuses that of the Sun."}, {"q": "What is a diffuse object?", "r": "It is an object that receives light and returns it in all directions without creating it."}, {"q": "How do you see a book?", "r": "A source enlightens the book, the book diffuses the light and a part enters the eye."}, {"q": "How does the light move in the air?", "r": "It spreads in a straight line, represented by a ray of light."}, {"q": "What is a beam of light?", "r": "It is a set of rays from the same source, limited by two extreme rays."}, {"q": "What is the approximate speed of light?", "r": "About three hundred thousand kilometers per second."}, {"q": "How long does the sunlight take to reach Earth?", "r": "A little over eight minutes."}, {"q": "Why does the shadow of an object grow when the lamp is near?", "r": "The rays around the edges are wide apart, widening the projected shadow."}, {"q": "Why does the shadow shrink when the lamp moves away?", "r": "The limit rays become almost parallel, reducing the size of the shadow."}, {"q": "What are the three cases of light that can cause eye damage?", "r": "The Sun, a class three or four laser, and the electric arc of a solder."}, {"q": "Why aren't ordinary sunglasses enough to watch an eclipse?", "r": "They are not specially designed to filter the solar intensity of an eclipse."}, {"q": "In what areas is the trajectory of light useful?", "r": "In architecture (prepare shadows), optics (make glasses), astronomy (study star light) and welding (protect eyes)."}, {"q": "Why do we see the Moon?", "r": "Because it diffuses the light of the Sun, being a diffuse object, not a primary source."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
