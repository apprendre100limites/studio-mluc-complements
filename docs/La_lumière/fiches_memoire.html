<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — La lumière</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Fiches mémoire</h1><p class="sous">La lumière</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "D'où vient la lumière que voit nos yeux ?", "r": "Elle provient d'une source primaire qui l'émet, comme le Soleil, une lampe allumée ou une flamme."}, {"q": "La Lune produit-elle sa propre lumière ?", "r": "Non, la Lune ne produit pas de lumière ; elle diffuse simplement celle du Soleil."}, {"q": "Qu'est‑ce qu'un objet diffusant ?", "r": "C'est un objet qui reçoit la lumière et la renvoie dans toutes les directions sans la créer."}, {"q": "Comment voit‑on un livre ?", "r": "Une source éclaire le livre, le livre diffuse la lumière et une partie entre dans l'œil."}, {"q": "Comment se déplace la lumière dans l'air ?", "r": "Elle se propage en ligne droite, représentée par un rayon de lumière."}, {"q": "Qu'est‑ce qu'un faisceau de lumière ?", "r": "C'est un ensemble de rayons issus de la même source, limité par deux rayons extrêmes."}, {"q": "Quelle est la vitesse approximative de la lumière ?", "r": "Environ trois cent mille kilomètres par seconde."}, {"q": "Combien de temps la lumière du Soleil met‑elle pour arriver sur Terre ?", "r": "Un peu plus de huit minutes."}, {"q": "Pourquoi l'ombre d'un objet grandit quand la lampe est proche ?", "r": "Les rayons qui frôlent les bords s'écartent beaucoup, agrandissant l'ombre projetée."}, {"q": "Pourquoi l'ombre rétrécit quand la lampe s'éloigne ?", "r": "Les rayons limites deviennent presque parallèles, ce qui réduit la taille de l'ombre."}, {"q": "Quels sont les trois cas de lumière pouvant causer des lésions oculaires ?", "r": "Le Soleil, un laser de classe trois ou quatre, et l'arc électrique d'une soudure."}, {"q": "Pourquoi les lunettes de soleil ordinaires ne suffisent pas pour observer une éclipse ?", "r": "Elles ne sont pas spécialement conçues pour filtrer l'intensité solaire d'une éclipse."}, {"q": "Dans quels domaines la trajectoire de la lumière est‑elle utile ?", "r": "En architecture (prévoir les ombres), en optique (fabriquer des lunettes), en astronomie (étudier la lumière des étoiles) et en soudure (protéger les yeux)."}, {"q": "Pourquoi voit‑on la Lune ?", "r": "Parce qu'elle diffuse la lumière du Soleil, étant un objet diffusant, pas une source primaire."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
