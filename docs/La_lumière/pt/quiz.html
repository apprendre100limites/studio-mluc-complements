<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionário — Luz</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Quiz</h1><p class="sous">Luz</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "O que faz a lua com a luz do sol?", "choix": ["Ela transmite-o.", "Ela transforma-o em calor", "Ela guarda-o.", "Ela absorve-o."], "bonne": 0, "explication": "Recebe o Sol e envia-o de volta em todas as direções: diz-se que o espalha."}, {"question": "Como se espalha a luz no ar?", "choix": ["Espiral", "Linha reta", "Em zigzag", "Em curvas"], "bonne": 1, "explication": "No ar, a luz se espalha em linha reta."}, {"question": "Qual é a velocidade aproximada da luz?", "choix": ["Cerca de trinta mil quilômetros por segundo", "Cerca de três milhões de quilómetros por segundo", "Cerca de trezentos mil quilômetros por segundo", "Cerca de 300 quilômetros por segundo"], "bonne": 2, "explication": "A luz vai muito rápido: cerca de trezentos mil quilômetros por segundo."}, {"question": "Quanto tempo leva a luz para vir do Sol para a Terra?", "choix": ["Uma hora", "Um segundo.", "Um pouco mais de oito minutos", "Quatro minutos."], "bonne": 2, "explication": "Leva um pouco mais de oito minutos para vir do Sol."}, {"question": "O que acontece na sombra de um objeto quando você tira a lâmpada que a acende?", "choix": ["A sombra fica maior", "A sombra estreita, até que se aproxime do tamanho do objeto", "Sombra muda de forma, mas mantém o mesmo tamanho", "A sombra desaparece completamente"], "bonne": 1, "explication": "Mantém a lâmpada longe: os raios limite tornam-se quase paralelos, e a sombra estreita, até que se aproxima do tamanho do objeto."}, {"question": "Qual destes elementos NÃO é mencionado como fonte de luz prejudicial para os olhos?", "choix": ["Uma lanterna", "O Sol", "Um laser classe três ou quatro", "O arco elétrico de uma soldagem"], "bonne": 0, "explication": "Três casos: o Sol, um laser classe três ou quatro, e o arco elétrico de uma solda."}, {"question": "Que profissão faz os óculos seguindo o caminho dos raios de luz?", "choix": ["Um astrônomo", "Um arquiteto", "Óptica", "Um soldador"], "bonne": 2, "explication": "Um óptico faz óculos seguindo o caminho dos raios de luz."}, {"question": "Porque é que os óculos de sol normais não são suficientes para ver um eclipse?", "choix": ["Porque eles não protegem contra o vento", "Porque não estão especificamente planeados para isso.", "Porque são muito escuros.", "Porque são feitos de plástico."], "bonne": 1, "explication": "Óculos de sol comuns não são suficientes."}, {"question": "O que é chamado de objeto que não produz sua própria luz, mas a difunde?", "choix": ["Fonte primária", "Fonte secundária", "Divulgação", "Objeto opaco"], "bonne": 2, "explication": "É um objecto difuso."}, {"question": "Que declaração resume a condição para visualizar um objeto de acordo com o vídeo?", "choix": ["Só se vê um objeto quando é iluminado pela Lua.", "Só vemos um objeto quando ele está perto de nós.", "Vê-se um objecto se a sombra que lança é pequena.", "Vê-se um objecto se a luz vier dele para o olho."], "bonne": 3, "explication": "Vê-se um objecto se a luz vier dele para o olho."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
