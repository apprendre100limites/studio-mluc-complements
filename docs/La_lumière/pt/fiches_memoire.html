<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões de memória — Luz</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 7.º ano · 12-13 anos</div><h1>Cartões de memória</h1><p class="sous">Luz</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "De onde vem a luz que os nossos olhos vêem?", "r": "Vem de uma fonte primária que o emite, como o Sol, uma lâmpada acesa ou uma chama."}, {"q": "A Lua produz a sua própria luz?", "r": "Não, a lua não produz luz. Difunde simplesmente o Sol."}, {"q": "O que é um objeto difuso?", "r": "É um objeto que recebe luz e retorna em todas as direções sem criá-la."}, {"q": "Como vês um livro?", "r": "Uma fonte ilumina o livro, o livro difunde a luz e uma parte entra no olho."}, {"q": "Como é que a luz se move no ar?", "r": "Espalha-se em linha reta, representada por um raio de luz."}, {"q": "O que é um raio de luz?", "r": "É um conjunto de raios da mesma fonte, limitado por dois raios extremos."}, {"q": "Qual é a velocidade aproximada da luz?", "r": "Cerca de 300 mil quilómetros por segundo."}, {"q": "Quanto tempo leva a luz solar para chegar à Terra?", "r": "Um pouco mais de oito minutos."}, {"q": "Por que cresce a sombra de um objeto quando a lâmpada está perto?", "r": "Os raios ao redor das bordas estão distantes, ampliando a sombra projetada."}, {"q": "Porque é que a sombra encolhe quando a lâmpada se afasta?", "r": "Os raios limite tornam-se quase paralelos, reduzindo o tamanho da sombra."}, {"q": "Quais são os três casos de luz que podem causar danos nos olhos?", "r": "O Sol, um laser classe três ou quatro, e o arco elétrico de uma solda."}, {"q": "Porque é que os óculos de sol normais não são suficientes para ver um eclipse?", "r": "Eles não são especialmente projetados para filtrar a intensidade solar de um eclipse."}, {"q": "Em que áreas é útil a trajetória da luz?", "r": "Em arquitetura (prepare sombras), óptica (faça óculos), astronomia (estude estrela luz) e soldagem (proteja os olhos)."}, {"q": "Porque vemos a Lua?", "r": "Porque difunde a luz do Sol, sendo um objeto difuso, não uma fonte primária."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
