<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — La lumière</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 5ème</div><h1>Quiz</h1><p class="sous">La lumière</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Que fait la Lune avec la lumière du Soleil ?", "choix": ["Elle la diffuse", "Elle la transforme en chaleur", "Elle la stocke", "Elle l'absorbe"], "bonne": 0, "explication": "Elle reçoit celle du Soleil et la renvoie dans toutes les directions : on dit qu'elle la diffuse."}, {"question": "Comment se propage la lumière dans l'air ?", "choix": ["En spirales", "En ligne droite", "En zigzag", "En courbes"], "bonne": 1, "explication": "Dans l'air, la lumière se propage en ligne droite."}, {"question": "Quelle est la vitesse approximative de la lumière ?", "choix": ["Environ trente mille kilomètres par seconde", "Environ trois millions de kilomètres par seconde", "Environ trois cent mille kilomètres par seconde", "Environ trois cent kilomètres par seconde"], "bonne": 2, "explication": "La lumière va très vite : environ trois cent mille kilomètres par seconde."}, {"question": "Combien de temps la lumière met‑elle pour venir du Soleil jusqu'à la Terre ?", "choix": ["Une heure", "Une seconde", "Un peu plus de huit minutes", "Quatre minutes"], "bonne": 2, "explication": "Elle met un peu plus de huit minutes pour venir du Soleil."}, {"question": "Que se passe-t-il à l'ombre d'un objet quand on éloigne la lampe qui l'éclaire ?", "choix": ["L'ombre devient plus grande", "L'ombre rétrécit, jusqu'à se rapprocher de la taille de l'objet", "L'ombre change de forme mais garde la même taille", "L'ombre disparaît complètement"], "bonne": 1, "explication": "Éloigne la lampe : les rayons limites deviennent presque parallèles, et l'ombre rétrécit, jusqu'à se rapprocher de la taille de l'objet."}, {"question": "Lequel de ces éléments n'est PAS mentionné comme source de lumière dangereuse pour les yeux ?", "choix": ["Une lampe de poche", "Le Soleil", "Un laser de classe trois ou quatre", "L'arc électrique d'une soudure"], "bonne": 0, "explication": "Trois cas : le Soleil, un laser de classe trois ou quatre, et l'arc électrique d'une soudure."}, {"question": "Quel métier fabrique des lunettes en suivant la trajectoire des rayons de lumière ?", "choix": ["Un astronome", "Un architecte", "Un opticien", "Un soudeur"], "bonne": 2, "explication": "Un opticien fabrique des lunettes en suivant la trajectoire des rayons de lumière."}, {"question": "Pourquoi les lunettes de soleil ordinaires ne suffisent pas pour observer une éclipse ?", "choix": ["Parce qu'elles ne protègent pas contre le vent", "Parce qu'elles ne sont pas prévues spécialement pour ça", "Parce qu'elles sont trop sombres", "Parce qu'elles sont faites de plastique"], "bonne": 1, "explication": "Des lunettes de soleil ordinaires ne suffisent pas."}, {"question": "Comment appelle‑t‑on un objet qui ne produit pas sa propre lumière mais la diffuse ?", "choix": ["Source primaire", "Source secondaire", "Objet diffusant", "Objet opaque"], "bonne": 2, "explication": "C'est un objet diffusant."}, {"question": "Quel énoncé résume la condition pour voir un objet selon la vidéo ?", "choix": ["On voit un objet seulement quand il est éclairé par la Lune.", "On voit un objet uniquement lorsqu'il est proche de nous.", "On voit un objet si l'ombre qu'il projette est petite.", "On voit un objet si de la lumière venue de lui entre dans l'œil."], "bonne": 3, "explication": "On voit un objet si de la lumière venue de lui entre dans l'œil."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
