<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuestionario — Del océano al queroseno</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Cuestionario</h1><p class="sous">Del océano al queroseno</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Comprobar mis respuestas</button> <button class="sec" onclick="refaire()">Volver a empezar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Cuál es el objetivo final del proyecto descrito en el vídeo?", "choix": ["Producir queroseno de aviación directamente a partir del océano.", "Sustituir los reactores nucleares por energía solar.", "Producir agua potable para los barcos.", "Construir portaaviones más grandes."], "bonne": 0, "explication": "El objetivo final es extraer queroseno de aviación directamente del océano."}, {"question": "¿Qué impulsa a los gigantescos portaaviones como los de la clase Nimitz?", "choix": ["Motores de queroseno.", "Reactores nucleares.", "Turbinas eólicas.", "Baterías eléctricas."], "bonne": 1, "explication": "Los portaaviones gigantes como los de la clase Nimitz estadounidense están propulsados por reactores nucleares."}, {"question": "¿En cuántas etapas principales se divide el proceso?", "choix": ["Cuatro etapas.", "Una sola etapa.", "Tres etapas.", "Dos etapas: primero extraer, luego construir."], "bonne": 3, "explication": "El proceso se divide en dos grandes etapas: primero se extrae y luego se fabrica."}, {"question": "¿Qué gases disueltos en el agua de mar se utilizan para fabricar el combustible?", "choix": ["El helio y el neón.", "El metano y el propano.", "El dióxido de carbono (CO₂) y el hidrógeno.", "El oxígeno y el nitrógeno."], "bonne": 2, "explication": "El agua de mar está repleta de gases disueltos, en particular dióxido de carbono (CO₂) e hidrógeno."}, {"question": "¿Cómo se llama el filtro de alta tecnología utilizado para la extracción?", "choix": ["Módulo Nimitz.", "Módulo Fischer.", "Módulo NASA.", "Módulo ECEM."], "bonne": 3, "explication": "Este sistema de extracción utiliza un filtro de alta tecnología denominado módulo ECEM."}, {"question": "¿Cuál es la eficiencia de captura de gas del módulo ECEM?", "choix": ["92%.", "50%.", "75%.", "100%."], "bonne": 0, "explication": "El módulo ECEM captura estos gases con una increíble eficiencia del 92%."}, {"question": "¿Qué proceso químico se utiliza para la síntesis de combustible?", "choix": ["Destilación.", "La síntesis de Fischer-Tropsch.", "Fotosíntesis.", "Fermentación."], "bonne": 1, "explication": "El proceso químico utilizado aquí se llama síntesis Fischer-Tropsch."}, {"question": "¿Qué se debe hacer con el dióxido de carbono antes de montarlo?", "choix": ["Mezclelo con sal.", "Congela.", "Agregue un átomo de oxígeno.", "Quitar un átomo de oxígeno y transformarlo en monóxido de carbono (CO)."], "bonne": 3, "explication": "En primer lugar, se debe eliminar un átomo de oxígeno de dióxido de carbono para transformarlo en monóxido de carbono (CO)."}, {"question": "¿De qué material son catalizadores resistentes a la corrosión hechos?", "choix": ["Titanio.", "Oro puro.", "Acero inoxidable.", "Carburo de molibdeno."], "bonne": 3, "explication": "Los catalizadores se desarrollan a partir de un material muy específico: carburo molibdeno."}, {"question": "¿Cuánta electricidad se necesita para producir unos 310 000 litros de combustible al día?", "choix": ["1000 MW.", "200 MW.", "20 MW.", "100 MW."], "bonne": 1, "explication": "Tratar suficiente agua para obtener este volumen requiere 200 MW de electricidad permanentemente."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
