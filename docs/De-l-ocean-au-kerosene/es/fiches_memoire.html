<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fichas informativas — Del océano al queroseno</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Fichas de repaso</h1><p class="sous">Del océano al queroseno</p><p class="sous">Lee la pregunta, responde mentalmente y, a continuación, haz clic en la ficha para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Ocultar todo</button></p><div id="c"></div></main><script>const C=[{"q": "¿Cuál es el concepto principal que se presenta en el vídeo?", "r": "Transformar el agua de mar en queroseno de aviación directamente en los buques mediante un proceso químico."}, {"q": "¿Por qué un portaaviones nuclear sigue necesitando buques cisterna?", "r": "Sus aviones de combate consumen combustible líquido que el reactor nuclear no puede suministrarles directamente."}, {"q": "¿Qué importante ventaja logística ofrece la producción de combustible a bordo?", "r": "El buque se convierte en un circuito energético cerrado, lo que elimina la espera y la vulnerabilidad de los reabastecimientos en el mar."}, {"q": "¿Qué dos gases disueltos en el agua de mar sirven como «elementos básicos» del combustible?", "r": "El dióxido de carbono (CO₂) y el hidrógeno."}, {"q": "¿Cómo se llama el módulo de extracción y cuál es su rendimiento?", "r": "El módulo ECEM captura estos gases con una eficiencia del 92 %."}, {"q": "¿Cómo se llama el proceso químico que combina el carbono y el hidrógeno?", "r": "La síntesis Fischer-Tropsch, comparada con una cadena de montaje atómica tipo Lego."}, {"q": "¿Qué transformación debe sufrir el CO₂ antes de la síntesis final?", "r": "Hay que quitarle un átomo de oxígeno para convertirlo en monóxido de carbono (CO)."}, {"q": "¿Por qué es vital el ajuste preciso de los catalizadores según el profesor Porosoff?", "r": "Un ajuste incorrecto produce metano (un gas inútil) en lugar de queroseno de aviación."}, {"q": "¿Qué potencia eléctrica se necesita para producir 310 000 litros de combustible al día?", "r": "200 MW de forma permanente, es decir, el consumo de una pequeña ciudad."}, {"q": "¿Cómo puede el portaaviones suministrar esta enorme cantidad de energía?", "r": "Su reactor nuclear proporciona exactamente esa potencia de 200 MW."}, {"q": "¿Cuáles son los tres principales desafíos de ingeniería para hacer funcionar este sistema en el mar?", "r": "Una necesidad de energía fenomenal, el bombeo continuo de enormes volúmenes de agua y la corrosión por la sal."}, {"q": "¿Qué material innovador protege a los catalizadores de la corrosión salina?", "r": "El carburo de molibdeno, que actúa como un escudo resistente y económico."}, {"q": "¿Qué impacto podría tener esta tecnología más allá del ámbito militar?", "r": "Una revolución para la aviación civil y el transporte marítimo, que crearía un ciclo del carbono cerrado para sustituir a los combustibles fósiles."}, {"q": "¿Qué pregunta provocadora plantea el vídeo al final?", "r": "¿Acabará convirtiéndose el agua de mar en el petróleo del mañana?"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
