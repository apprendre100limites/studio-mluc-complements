<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>स्मृति शीट — समुद्र से केरोसिन तक</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान </div><h1>स्मृति शीट</h1><p class="sous">समुद्र से केरोसिन तक</p><p class="sous">प्रश्न पढ़ो, अपने मन में उत्तर दो, फिर उत्तर देखने के लिए शीट पर क्लिक करो।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाएँ</button> <button class="sec" onclick="tout(false)">सब छिपाएँ</button></p><div id="c"></div></main><script>const C=[{"q": "वीडियो में प्रस्तुत मुख्य अवधारणा क्या है?", "r": "रासायनिक प्रक्रिया के माध्यम से समुद्री जल को सीधे जहाज़ों पर हवाई केरोसिन में बदलना।"}, {"q": "एक परमाणु विमानवाहक पोत को अभी भी टैंकर जहाज़ों की आवश्यकता क्यों होती है?", "r": "उसके लड़ाकू विमान तरल ईंधन का उपयोग करते हैं, जिसे परमाणु रिएक्टर सीधे नहीं दे सकता।"}, {"q": "जहाज़ पर ईंधन उत्पादन से कौन सा प्रमुख लॉजिस्टिक लाभ मिलता है?", "r": "जहाज़ एक बंद ऊर्जा चक्र बन जाता है, जिससे समुद्र में आपूर्ति की प्रतीक्षा और असुरक्षा समाप्त हो जाती है।"}, {"q": "समुद्री जल में घुले कौन से दो गैसें ईंधन की “बुनियादी ईंटें” के रूप में कार्य करती हैं?", "r": "कार्बन डाइऑक्साइड (CO2) और हाइड्रोजन।"}, {"q": "निकालने वाले मॉड्यूल का नाम क्या है और उसकी दक्षता क्या है?", "r": "ECEM मॉड्यूल इन गैसों को 92 % दक्षता से पकड़ता है।"}, {"q": "कार्बन और हाइड्रोजन को मिलाने वाली रासायनिक प्रक्रिया का नाम क्या है?", "r": "फ़िशर‑ट्रॉप्सच संश्लेषण, जिसे लेगो जैसी परमाणु असेंबली लाइन से तुलना की गई है।"}, {"q": "अंतिम संश्लेषण से पहले CO2 को कौन सा परिवर्तन करना चाहिए?", "r": "इसे एक ऑक्सीजन परमाणु हटाकर कार्बन मोनोऑक्साइड (CO) में बदलना आवश्यक है।"}, {"q": "प्रोफेसर पोरोसोफ़ के अनुसार उत्प्रेरकों की सटीक सेटिंग क्यों महत्वपूर्ण है?", "r": "गलत सेटिंग से हवाई केरोसिन के बजाय मीथेन (अनावश्यक गैस) बनता है।"}, {"q": "क्या विद्युत शक्ति प्रति दिन 310,000 लीटर ईंधन का उत्पादन करती है?", "r": "हर समय 200 मेगावाट, एक छोटे से शहर की खपत।"}, {"q": "कैसे विमान वाहक इस विशाल ऊर्जा प्रदान कर सकते हैं?", "r": "इसके परमाणु रिएक्टर वास्तव में इस 200 मेगावाट की शक्ति प्रदान करते हैं।"}, {"q": "इस प्रणाली को समुद्र में संचालित करने के लिए तीन प्रमुख इंजीनियरिंग चुनौतियां क्या हैं?", "r": "अभूतपूर्व ऊर्जा, विशाल पानी की मात्रा और नमक जंग की निरंतर पंपिंग की आवश्यकता है।"}, {"q": "कौन सा अभिनव सामग्री नमक जंग से उत्प्रेरक की रक्षा करता है?", "r": "मोलिब्डेनम कार्बाइड जो एक प्रतिरोधी और सस्ती ढाल के रूप में कार्य करता है।"}, {"q": "इस तकनीक का क्या प्रभाव हो सकता है?", "r": "नागरिक विमानन और समुद्री परिवहन के लिए एक क्रांति, जीवाश्म ईंधन को बदलने के लिए एक बंद कार्बन चक्र बनाती है।"}, {"q": "कौन से प्रश्न वीडियो को निष्कर्ष में प्रस्तुत करता है?", "r": "अंततः कल का तेल बन जाएगा?"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
