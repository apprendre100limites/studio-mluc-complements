<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी - समुद्र से केरोसीन तक</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान </div><h1>प्रश्नोत्तरी</h1><p class="sous">समुद्र से केरोसिन तक</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "वीडियो में वर्णित परियोजना का अंतिम लक्ष्य क्या है?", "choix": ["सीधे समुद्र से विमानन केरोजेन का उत्पादन करें।", "सौर के साथ परमाणु रिएक्टर बदलें।", "जहाजों के लिए पीने का पानी बनाओ।", "बड़े विमान वाहक बनाएँ।"], "bonne": 0, "explication": "अंतिम लक्ष्य सीधे समुद्र से विमानन केरोजेन निकालने के लिए है।"}, {"question": "क्या Nimitz वर्ग में उन लोगों की तरह विशाल विमान वाहक propels?", "choix": ["केरोसिन इंजन।", "परमाणु रिएक्टर", "पवन टरबाइन", "इलेक्ट्रिक बैटरी।"], "bonne": 1, "explication": "अमेरिकी Nimitz वर्ग में उन लोगों की तरह विशाल विमान वाहक परमाणु रिएक्टरों द्वारा संचालित होते हैं।"}, {"question": "कितने प्रमुख चरणों में विभाजित प्रक्रिया है?", "choix": ["चार चरण", "एक कदम", "तीन चरण", "दो चरणों: पहले निकालने, फिर निर्माण।"], "bonne": 3, "explication": "प्रक्रिया को दो प्रमुख चरणों में विभाजित किया गया है: सबसे पहले, हम निकालने, फिर हम निर्माण करते हैं।"}, {"question": "समुद्री जल में भंग कौन से गैसों का उपयोग ईंधन बनाने के लिए किया जाता है?", "choix": ["हीलियम और नियॉन।", "मीथेन और प्रोपेन।", "कार्बन डाइऑक्साइड (CO2) और हाइड्रोजन।", "ऑक्सीजन और नाइट्रोजन।"], "bonne": 2, "explication": "समुद्री जल कार्बन डाइऑक्साइड (CO2) और हाइड्रोजन सहित भंग गैसों से भरा है।"}, {"question": "क्या अति उच्च तकनीक फिल्टर निष्कर्षण के लिए इस्तेमाल किया है?", "choix": ["Nimitz मॉड्यूल।", "फिशर मॉड्यूल।", "NASA मॉड्यूल।", "ECEM मॉड्यूल"], "bonne": 3, "explication": "यह निष्कर्षण प्रणाली एक अति उच्च तकनीक फ़िल्टर का उपयोग करती है जिसे ECEM मॉड्यूल कहा जाता है।"}, {"question": "ECEM मॉड्यूल की गैस कैप्चर दक्षता क्या है?", "choix": ["92%।", "50%।", "75%।", "100%"], "bonne": 0, "explication": "ECEM मॉड्यूल इन गैसों को अविश्वसनीय 92% दक्षता के साथ कैप्चर करता है।"}, {"question": "क्या रासायनिक प्रक्रिया ईंधन संश्लेषण के लिए प्रयोग किया जाता है?", "choix": ["आसवन।", "फिशर-ट्रॉप्स संश्लेषण।", "प्रकाश संश्लेषण।", "किण्वन।"], "bonne": 1, "explication": "यहां उपयोग की जाने वाली रासायनिक प्रक्रिया को फिशर-ट्रॉप्स संश्लेषण कहा जाता है।"}, {"question": "इससे पहले कि इसे इकट्ठा किया जाए, कार्बन डाइऑक्साइड के साथ क्या किया जाना चाहिए?", "choix": ["इसे नमक के साथ मिलाएं।", "इसे फ्रीज करें।", "इसमें एक ऑक्सीजन परमाणु जोड़ें।", "एक ऑक्सीजन परमाणु निकालें और इसे कार्बन मोनोऑक्साइड (CO) में बदल दें।"], "bonne": 3, "explication": "सबसे पहले, कार्बन डाइऑक्साइड ऑक्सीजन परमाणु को इसे कार्बन मोनोऑक्साइड (CO) में बदलने के लिए हटाया जाना चाहिए।"}, {"question": "क्या सामग्री जंग प्रतिरोधी उत्प्रेरक से बना है?", "choix": ["टाइटेनियम।", "शुद्ध सोने।", "स्टेनलेस स्टील।", "मोलिब्डेनम कार्बाइड"], "bonne": 3, "explication": "उत्प्रेरक एक बहुत ही विशिष्ट सामग्री से विकसित होते हैं: मोलिब्डेनम कार्बाइड।"}, {"question": "प्रति दिन लगभग 310 000 लीटर ईंधन का उत्पादन करने के लिए कितनी बिजली की आवश्यकता होती है?", "choix": ["1000 मेगावाट", "200 मेगावाट", "20 मेगावाट", "100 मेगावाट"], "bonne": 1, "explication": "इस मात्रा को प्राप्त करने के लिए पर्याप्त पानी का इलाज स्थायी रूप से 200 मेगावाट बिजली की आवश्यकता होती है।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
