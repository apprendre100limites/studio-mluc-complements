<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — De l&#x27;océan au kérosène</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Fiches mémoire</h1><p class="sous">De l&#x27;océan au kérosène</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Quel est le concept principal présenté dans la vidéo ?", "r": "Transformer l'eau de mer en kérosène d'aviation directement sur les navires grâce à un procédé chimique."}, {"q": "Pourquoi un porte-avions nucléaire a-t-il encore besoin de navires-citernes ?", "r": "Ses avions de chasse consomment du carburant liquide que le réacteur nucléaire ne peut pas leur fournir directement."}, {"q": "Quel avantage logistique majeur offre la production de carburant à bord ?", "r": "Le navire devient une boucle énergétique fermée, supprimant l'attente et la vulnérabilité des ravitaillements en mer."}, {"q": "Quels deux gaz dissous dans l'eau de mer servent de \"briques de base\" au carburant ?", "r": "Le dioxyde de carbone (CO2) et l'hydrogène."}, {"q": "Comment s'appelle le module d'extraction et quel est son rendement ?", "r": "Le module ECEM capture ces gaz avec une efficacité de 92 %."}, {"q": "Quel est le nom du procédé chimique qui assemble le carbone et l'hydrogène ?", "r": "La synthèse Fischer-Tropsch, comparée à une chaîne d'assemblage atomique type Lego."}, {"q": "Quelle transformation le CO2 doit-il subir avant la synthèse finale ?", "r": "Il faut lui retirer un atome d'oxygène pour le transformer en monoxyde de carbone (CO)."}, {"q": "Pourquoi le réglage précis des catalyseurs est-il vital selon le Pr Porosoff ?", "r": "Un mauvais réglage produit du méthane (gaz inutile) au lieu de kérosène d'aviation."}, {"q": "Quelle puissance électrique faut-il pour produire 310 000 litres de carburant par jour ?", "r": "200 MW en permanence, soit la consommation d'une petite ville."}, {"q": "Comment le porte-avions peut-il fournir cette énergie massive ?", "r": "Son réacteur nucléaire délivre exactement cette puissance de 200 MW."}, {"q": "Quels sont les trois défis d'ingénierie majeurs pour faire fonctionner ce système en mer ?", "r": "Besoin d'énergie phénoménale, pompage continu de volumes d'eau géants, et corrosion par le sel."}, {"q": "Quel matériau innovant protège les catalyseurs de la corrosion saline ?", "r": "Le carbure de molybdène, qui agit comme un bouclier résistant et peu coûteux."}, {"q": "Quel impact cette technologie pourrait-elle avoir au-delà du militaire ?", "r": "Une révolution pour l'aviation civile et le transport maritime, créant un cycle du carbone fermé pour remplacer les énergies fossiles."}, {"q": "Quelle question provocatrice la vidéo pose-t-elle en conclusion ?", "r": "L'eau de mer finira-t-elle par devenir le pétrole de demain ?"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
