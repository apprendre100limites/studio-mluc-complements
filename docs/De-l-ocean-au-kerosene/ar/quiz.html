<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كوز - من المحيط إلى الكيروسين</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>Quiz</h1><p class="sous">من المحيط إلى الكيروسين</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ما هو الهدف النهائي للمشروع الوارد وصفه في الفيديو؟", "choix": ["إنتاج الكيروسين للطيران مباشرة من المحيط", "يستعاض عن المفاعلات النووية بالشمس.", "جعل مياه الشرب للسفن.", "بناء ناقلات طائرات أكبر."], "bonne": 0, "explication": "الهدف النهائي هو استخراج الكيروسين من المحيط مباشرة"}, {"question": "ما الذي يدفع ناقلات الطائرات العملاقة مثل تلك في صف (نيميتز)؟", "choix": ["محركات الكروسين", "مفاعلات نووية", "التوربينات الفائزة.", "البطاريات الكهربائية"], "bonne": 1, "explication": "ناقلات الطائرات العملاقة مثل تلك الموجودة في صف نيميتز الأمريكي تتحكم بها المفاعلات النووية"}, {"question": "كم عدد الخطوات الرئيسية المقسمة؟", "choix": ["أربع خطوات", "خطوة واحدة", "ثلاث خطوات", "خطوتين: المخرج الأول، ثم البناء."], "bonne": 3, "explication": "وتنقسم العملية إلى خطوتين رئيسيتين: أولا، نستخرج، ثم نبني."}, {"question": "أي الغازات التي تم حلها في مياه البحر تستخدم لصنع الوقود؟", "choix": ["هيليوم ونيون", "الميثان والبروبان", "ثاني أكسيد الكربون والهيدروجين.", "Oxygen والنيتروجين."], "bonne": 2, "explication": "ومياه البحار مليئة بالغازات المذوبة، بما في ذلك ثاني أكسيد الكربون والهيدروجين."}, {"question": "ما الذي يستخدمه مرشح التكنولوجيا فوق العالي للاستخراج؟", "choix": ["وحدة نيميتز", "وحدة فيشر", "وحدة ناسا", "وحدة إدارة اللجنة الاقتصادية لأوروبا."], "bonne": 3, "explication": "ويستخدم نظام الاستخراج هذا مرشحا عالي التقنية يسمى وحدة إدارة اللجنة الاقتصادية لأوروبا."}, {"question": "ما هي كفاءة استخدام الغاز في وحدة إدارة اللجنة الاقتصادية لأوروبا؟", "choix": ["92%", "50%", "75٪.", "100%"], "bonne": 0, "explication": "The ECEM module captures these gases with an impressive 92% efficiency."}, {"question": "ما هي العملية الكيميائية المستخدمة في تركيب الوقود؟", "choix": ["توقف", "التليفزيون فيشر-تروبش", "التخدير", "الخصم"], "bonne": 1, "explication": "The chemical process used here is called Fischer-Tropsch synthesis."}, {"question": "ما الذي يجب فعله بثاني أكسيد الكربون قبل أن يتم تجميعه؟", "choix": ["أخلطها بالملح", "توقف", "أضف ذرة الأكسجين إليه", "Remove an oxygen atom and transform it into carbon monoxide (CO)."], "bonne": 3, "explication": "First, a carbon dioxide oxygen atom must be removed to transform it into carbon monoxide (CO)."}, {"question": "ما هي المواد المحفزة المقاومة للتآكل التي صنعت من؟", "choix": ["تيتانيوم", "ذهب نقي", "الصلب اللاصق", "كربايد المولى"], "bonne": 3, "explication": "ويجري تطوير المحفزات من مادة محددة جدا: كربيد المولى."}, {"question": "كم يلزم من الكهرباء لإنتاج حوالي 000 310 لتر من الوقود يوميا؟", "choix": ["1000 MW.", "200 ميغاواط", "20 MW.", "100 MW."], "bonne": 1, "explication": "ويتطلب معالجة المياه الكافية للحصول على هذا الحجم 200 ميغاواط من الكهرباء بصورة دائمة."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
