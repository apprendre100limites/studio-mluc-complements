<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study sheets — From the ocean to jet fuel</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Study sheets</h1><p class="sous">From the ocean to jet fuel</p><p class="sous">Read the question, answer it in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide all</button></p><div id="c"></div></main><script>const C=[{"q": "What is the main concept presented in the video?", "r": "Convert seawater into aviation jet fuel directly on ships using a chemical process."}, {"q": "Why does a nuclear aircraft carrier still need tanker ships?", "r": "Its fighter jets consume liquid fuel that the nuclear reactor cannot supply directly."}, {"q": "What major logistical advantage does onboard fuel production provide?", "r": "The ship becomes a closed energy loop, eliminating waiting and the vulnerability of at‑sea refueling."}, {"q": "Which two gases dissolved in seawater serve as the “building blocks” for the fuel?", "r": "Carbon dioxide (CO₂) and hydrogen."}, {"q": "What is the extraction module called and what is its efficiency?", "r": "The ECEM module captures these gases with a 92 % efficiency."}, {"q": "What is the name of the chemical process that combines carbon and hydrogen?", "r": "The Fischer‑Tropsch synthesis, likened to a Lego‑style atomic assembly line."}, {"q": "What transformation must CO₂ undergo before the final synthesis?", "r": "One oxygen atom must be removed to turn it into carbon monoxide (CO)."}, {"q": "Why is precise catalyst tuning vital according to Prof. Porosoff?", "r": "Improper tuning produces methane (an unwanted gas) instead of aviation jet fuel."}, {"q": "What electric power does it take to produce 310,000 litres of fuel per day?", "r": "200 MW at all times, the consumption of a small town."}, {"q": "How can the aircraft carrier provide this massive energy?", "r": "Its nuclear reactor delivers exactly this 200 MW power."}, {"q": "What are the three major engineering challenges for operating this system at sea?", "r": "Need phenomenal energy, continuous pumping of giant water volumes, and salt corrosion."}, {"q": "Which innovative material protects the catalysts from salt corrosion?", "r": "Molybdenum carbide, which acts as a resistant and inexpensive shield."}, {"q": "What impact could this technology have beyond the military?", "r": "A revolution for civil aviation and maritime transport, creating a closed carbon cycle to replace fossil fuels."}, {"q": "What provocative question does the video pose in conclusion?", "r": "Will seawater eventually become tomorrow's oil?"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
