<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — From the ocean to kerosene</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}

h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}

@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Quiz</h1><p class="sous">From the ocean to kerosene</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What is the ultimate goal of the project described in the video?", "choix": ["Produce aviation kerosene directly from the ocean.", "Replace nuclear reactors with solar.", "Make drinking water for ships.", "Build larger aircraft carriers."], "bonne": 0, "explication": "The ultimate goal is to extract aviation kerosene directly from the ocean."}, {"question": "What propels giant aircraft carriers like those in the Nimitz class?", "choix": ["Kerosene engines.", "Nuclear reactors.", "Wind turbines.", "Electric batteries."], "bonne": 1, "explication": "Giant aircraft carriers like those in the American Nimitz class are powered by nuclear reactors."}, {"question": "How many major steps is the process divided?", "choix": ["Four steps.", "One step.", "Three steps.", "Two steps: first extract, then build."], "bonne": 3, "explication": "The process is divided into two major steps: first, we extract, then we build."}, {"question": "Which gases dissolved in seawater are used to make the fuel?", "choix": ["Helium and neon.", "Methane and propane.", "Carbon dioxide (CO2) and hydrogen.", "Oxygen and nitrogen."], "bonne": 2, "explication": "Seawater is full of dissolved gases, including carbon dioxide (CO2) and hydrogen."}, {"question": "What is the ultra-high-tech filter used for extraction?", "choix": ["Nimitz module.", "Fischer module.", "NASA module.", "ECEM module."], "bonne": 3, "explication": "This extraction system uses an ultra-high-tech filter called the ECEM module."}, {"question": "What is the gas capture efficiency of the ECEM module?", "choix": ["92%.", "50%.", "75%.", "100%."], "bonne": 0, "explication": "The ECEM module captures these gases with an incredible 92% efficiency."}, {"question": "What chemical process is used for fuel synthesis?", "choix": ["Distillation.", "The Fischer-Tropsch synthesis.", "Photosynthesis.", "Fermentation."], "bonne": 1, "explication": "The chemical process used here is called Fischer-Tropsch synthesis."}, {"question": "What should be done with carbon dioxide before it is assembled?", "choix": ["Mix it with salt.", "Freeze it.", "Add an oxygen atom to it.", "Remove an oxygen atom and transform it into carbon monoxide (CO)."], "bonne": 3, "explication": "First, a carbon dioxide oxygen atom must be removed to transform it into carbon monoxide (CO)."}, {"question": "What material are corrosion resistant catalysts made of?", "choix": ["Titanium.", "Pure gold.", "Stainless steel.", "Molybdenum carbide."], "bonne": 3, "explication": "Catalysts are developed from a very specific material: molybdenum carbide."}, {"question": "How much electricity is needed to produce about 310 000 litres of fuel per day?", "choix": ["1000 MW.", "200 MW.", "20 MW.", "100 MW."], "bonne": 1, "explication": "Treating enough water to obtain this volume requires 200 MW of electricity permanently."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
