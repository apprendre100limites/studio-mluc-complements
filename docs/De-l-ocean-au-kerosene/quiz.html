<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — De l&#x27;océan au kérosène</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Quiz</h1><p class="sous">De l&#x27;océan au kérosène</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Quel est le but ultime du projet décrit dans la vidéo ?", "choix": ["Produire du kérosène d'aviation directement depuis l'océan.", "Remplacer les réacteurs nucléaires par du solaire.", "Fabriquer de l'eau potable pour les navires.", "Construire des porte-avions plus grands."], "bonne": 0, "explication": "Le but ultime est d'extraire du kérosène d'aviation directement depuis l'océan."}, {"question": "Qu'est-ce qui propulse les porte-avions géants comme ceux de la classe Nimitz ?", "choix": ["Des moteurs à kérosène.", "Des réacteurs nucléaires.", "Des éoliennes.", "Des batteries électriques."], "bonne": 1, "explication": "Les porte-avions géants comme ceux de la classe Nimitz américaine sont propulsés par des réacteurs nucléaires."}, {"question": "En combien de grandes étapes le procédé est-il divisé ?", "choix": ["Quatre étapes.", "Une seule étape.", "Trois étapes.", "Deux étapes : d'abord extraire, ensuite construire."], "bonne": 3, "explication": "Le procédé est divisé en deux grandes étapes : d'abord on extrait, ensuite on construit."}, {"question": "Quels gaz dissous dans l'eau de mer sont utilisés pour fabriquer le carburant ?", "choix": ["L'hélium et le néon.", "Le méthane et le propane.", "Le dioxyde de carbone (CO2) et l'hydrogène.", "L'oxygène et l'azote."], "bonne": 2, "explication": "L'eau de mer regorge de gaz dissous, notamment du dioxyde de carbone (CO2) et de l'hydrogène."}, {"question": "Comment s'appelle le filtre ultra-high-tech utilisé pour l'extraction ?", "choix": ["Module Nimitz.", "Module Fischer.", "Module NASA.", "Module ECEM."], "bonne": 3, "explication": "Ce système d'extraction utilise un filtre ultra-high-tech appelé module ECEM."}, {"question": "Quelle est l'efficacité de capture des gaz du module ECEM ?", "choix": ["92 %.", "50 %.", "75 %.", "100 %."], "bonne": 0, "explication": "Le module ECEM arrive à capturer ces gaz avec une efficacité incroyable de 92 %."}, {"question": "Quel procédé chimique est utilisé pour la synthèse du carburant ?", "choix": ["La distillation.", "La synthèse Fischer-Tropsch.", "La photosynthèse.", "La fermentation."], "bonne": 1, "explication": "Le procédé chimique utilisé ici est appelé la synthèse Fischer-Tropsch."}, {"question": "Que faut-il faire au dioxyde de carbone avant de l'assembler ?", "choix": ["Le mélanger à du sel.", "Le congeler.", "Lui ajouter un atome d'oxygène.", "Lui enlever un atome d'oxygène pour le transformer en monoxyde de carbone (CO)."], "bonne": 3, "explication": "Il faut d'abord enlever un atome d'oxygène au dioxyde de carbone pour le transformer en monoxyde de carbone (CO)."}, {"question": "De quel matériau sont fabriqués les catalyseurs résistants à la corrosion ?", "choix": ["Titane.", "Or pur.", "Acier inoxydable.", "Carbure de molybdène."], "bonne": 3, "explication": "Les catalyseurs sont développés à partir d'un matériau très spécifique : le carbure de molybdène."}, {"question": "Quelle quantité d'électricité est nécessaire pour produire environ 310 000 litres de carburant par jour ?", "choix": ["1000 MW.", "200 MW.", "20 MW.", "100 MW."], "bonne": 1, "explication": "Traiter assez d'eau pour obtenir ce volume demande 200 MW d'électricité en permanence."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
