<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões de memória — Do oceano ao querosene</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências </div><h1>Cartões de memória</h1><p class="sous">Do oceano ao querosene</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "Qual é o conceito principal apresentado no vídeo?", "r": "Transformar água do mar em querosene de aviação diretamente em navios através de um processo químico."}, {"q": "Porque é que um transportador nuclear ainda precisa de petroleiros?", "r": "Sua aeronave de caça consome combustível líquido que o reator nuclear não pode fornecer diretamente."}, {"q": "Que grande vantagem logística oferece a produção de combustível a bordo?", "r": "O navio torna-se um ciclo de energia fechado, eliminando a espera e vulnerabilidade dos suprimentos no mar."}, {"q": "Que dois gases dissolvidos na água do mar servem de \"tijolos básicos\" para abastecer?", "r": "Dióxido de carbono (CO2) e hidrogénio."}, {"q": "Qual é o módulo de extração chamado e qual é o seu desempenho?", "r": "O módulo ECEM capta esses gases com uma eficiência de 92%."}, {"q": "Qual é o nome do processo químico que reúne carbono e hidrogênio?", "r": "Síntese Fischer-Tropsch, comparada a uma cadeia de montagem atômica tipo Lego."}, {"q": "Que transformação deve sofrer o CO2 antes da síntese final?", "r": "Um átomo de oxigênio deve ser removido para transformá-lo em monóxido de carbono (CO)."}, {"q": "Por que é vital o ajuste preciso dos catalisadores de acordo com o professor Porosoff?", "r": "Um cenário ruim produz metano (gás desnecessário) em vez de querosene de aviação."}, {"q": "Que energia elétrica é necessária para produzir 310.000 litros de combustível por dia?", "r": "200 MW em todos os momentos, o consumo de uma pequena cidade."}, {"q": "Como pode o porta-aviões fornecer essa energia maciça?", "r": "Seu reator nuclear fornece exatamente essa potência de 200 MW."}, {"q": "Quais são os três grandes desafios de engenharia para operar este sistema no mar?", "r": "Precisa de energia fenomenal, bombeamento contínuo de volumes de água gigantes e corrosão de sal."}, {"q": "Que material inovador protege os catalisadores da corrosão do sal?", "r": "Carboneto de molibdênio, que atua como um escudo resistente e barato."}, {"q": "Que impacto pode esta tecnologia ter além dos militares?", "r": "Uma revolução para a aviação civil e transporte marítimo, criando um ciclo fechado de carbono para substituir combustíveis fósseis."}, {"q": "Que pergunta provocativa faz o vídeo em conclusão?", "r": "Será que a água do mar se tornará o petróleo de amanhã?"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
