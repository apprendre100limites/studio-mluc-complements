<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questionário — Do oceano ao querosene</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências </div><h1>Quiz</h1><p class="sous">Do oceano ao querosene</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Verifica as minhas respostas.</button> <button class="sec" onclick="refaire()">Reiniciar</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Qual é o objetivo final do projeto descrito no vídeo?", "choix": ["Produzir querosene de aviação diretamente do oceano.", "Substituir reatores nucleares por solares.", "Faça água potável para os navios.", "Construir porta-aviões maiores."], "bonne": 0, "explication": "O objetivo final é extrair querosene de aviação diretamente do oceano."}, {"question": "O que impulsiona porta-aviões gigantes como os da classe Nimitz?", "choix": ["Motores Kerosene.", "Reactores nucleares.", "Turbinas eólicas.", "Baterias eléctricas."], "bonne": 1, "explication": "Os porta-aviões gigantes como os da classe americana Nimitz são alimentados por reactores nucleares."}, {"question": "Quantos passos principais está dividido o processo?", "choix": ["Quatro passos.", "Um passo.", "Três passos.", "Dois passos: primeiro extrair, depois construir."], "bonne": 3, "explication": "O processo é dividido em duas etapas principais: primeiro, extraímos, depois construímos."}, {"question": "Que gases dissolvidos na água do mar são usados para produzir o combustível?", "choix": ["Hélio e néon.", "Metano e propano.", "Dióxido de carbono (CO2) e hidrogénio.", "Oxigénio e azoto."], "bonne": 2, "explication": "A água do mar está cheia de gases dissolvidos, incluindo dióxido de carbono (CO2) e hidrogênio."}, {"question": "Qual é o filtro ultra-alta tecnologia usado para extração?", "choix": ["Módulo Nimitz.", "Módulo Fischer.", "Módulo da NASA.", "Módulo ECEM."], "bonne": 3, "explication": "Este sistema de extração usa um filtro ultra-alta tecnologia chamado módulo ECEM."}, {"question": "Qual é a eficiência de captura de gás do módulo ECEM?", "choix": ["92%.", "50%.", "75%.", "100%."], "bonne": 0, "explication": "O módulo ECEM captura esses gases com uma incrível eficiência de 92%."}, {"question": "Que processo químico é utilizado para a síntese de combustível?", "choix": ["Destilação.", "A síntese Fischer-Tropsch.", "Fotossíntese.", "Fermentação."], "bonne": 1, "explication": "O processo químico utilizado aqui é chamado de síntese Fischer-Tropsch."}, {"question": "O que deve ser feito com dióxido de carbono antes de ser montado?", "choix": ["Misture com sal.", "Pára.", "Adicione-lhe um átomo de oxigénio.", "Remova um átomo de oxigênio e transforme-o em monóxido de carbono (CO)."], "bonne": 3, "explication": "Primeiro, um átomo de dióxido de carbono oxigênio deve ser removido para transformá-lo em monóxido de carbono (CO)."}, {"question": "De que material são feitos catalisadores resistentes à corrosão?", "choix": ["Titânio.", "Ouro puro.", "Aço inoxidável.", "Carboneto de molibdénio."], "bonne": 3, "explication": "Catalisadores são desenvolvidos a partir de um material muito específico: carboneto de molibdênio."}, {"question": "Quanta electricidade é necessária para produzir cerca de 310 000 litros de combustível por dia?", "choix": ["1000 MW.", "200 MW.", "20 MW.", "100 MW."], "bonne": 1, "explication": "Tratar água suficiente para obter esse volume requer 200 MW de eletricidade permanentemente."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Certo. '+q.explication}else{e.innerHTML='❌ A resposta certa: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Pontuação: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
