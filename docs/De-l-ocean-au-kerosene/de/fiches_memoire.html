<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherkarten - Vom Ozean zum Kerosin</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften </div><h1>Speicherkarten</h1><p class="sous">Vom Ozean zum Kerosin</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Was ist das Hauptkonzept, das im Video vorgestellt wird?", "r": "Umwandlung von Meerwasser in Luftfahrtkerosin direkt auf Schiffen durch einen chemischen Prozess."}, {"q": "Warum braucht ein Atomträger noch Tanker?", "r": "Seine Kampfflugzeuge verbrauchen flüssigen Brennstoff, den der Kernreaktor nicht direkt liefern kann."}, {"q": "Welchen großen logistischen Vorteil bietet die Kraftstoffproduktion an Bord?", "r": "Das Schiff wird zu einem geschlossenen Energiekreislauf, der das Warten und die Anfälligkeit der Versorgung auf See eliminiert."}, {"q": "Welche zwei im Meerwasser gelösten Gase dienen als \"Basissteine\" zum Kraftstoffen?", "r": "Kohlendioxid (CO2) und Wasserstoff."}, {"q": "Wie heißt das Extraktionsmodul und wie ist seine Leistung?", "r": "Das ECEM-Modul fängt diese Gase mit einem Wirkungsgrad von 92% ein."}, {"q": "Wie heißt der chemische Prozess, der Kohlenstoff und Wasserstoff zusammenführt?", "r": "Fischer-Tropsch-Synthese im Vergleich zu einer atomaren Montagekette vom Lego-Typ."}, {"q": "Welche Umwandlung sollte CO2 vor der endgültigen Synthese durchlaufen?", "r": "Ein Sauerstoffatom muss entfernt werden, um es in Kohlenmonoxid (CO) umzuwandeln."}, {"q": "Warum ist die genaue Einstellung von Katalysatoren nach Professor Porosoff wichtig?", "r": "Eine schlechte Einstellung produziert Methan (unnötiges Gas) anstelle von Flugkerosin."}, {"q": "Welche elektrische Energie braucht es, um 310.000 Liter Kraftstoff pro Tag zu produzieren?", "r": "200 MW zu jeder Zeit, der Verbrauch einer kleinen Stadt."}, {"q": "Wie kann der Flugzeugträger diese massive Energie bereitstellen?", "r": "Sein Kernreaktor liefert genau diese 200 MW Leistung."}, {"q": "Was sind die drei großen technischen Herausforderungen für den Betrieb dieses Systems auf See?", "r": "Benötigen Sie phänomenale Energie, kontinuierliches Pumpen von riesigen Wasservolumina und Salzkorrosion."}, {"q": "Welches innovative Material schützt die Katalysatoren vor Salzkorrosion?", "r": "Molybdäncarbid, das als resistentes und kostengünstiges Schild wirkt."}, {"q": "Welche Auswirkungen könnte diese Technologie über das Militär hinaus haben?", "r": "Eine Revolution für die Zivilluftfahrt und den Seeverkehr, die Schaffung eines geschlossenen Kohlenstoffkreislaufs, um fossile Brennstoffe zu ersetzen."}, {"q": "Welche provokative Frage stellt das Video abschließend?", "r": "Wird Meerwasser irgendwann zum Öl von morgen?"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
