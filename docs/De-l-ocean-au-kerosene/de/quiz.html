<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Vom Ozean zum Kerosin</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}

.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}

ul{padding-left:1.2em}li{margin:.35em 0}

a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften </div><h1>Quiz</h1><p class="sous">Vom Ozean zum Kerosin</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Was ist das ultimative Ziel des im Video beschriebenen Projekts?", "choix": ["Luftfahrtkerosin direkt aus dem Ozean produzieren.", "Ersetzen Sie Kernreaktoren durch Solaranlagen.", "Trinkwasser für Schiffe herstellen.", "Baue größere Flugzeugträger."], "bonne": 0, "explication": "Das ultimative Ziel ist es, Flugkerosin direkt aus dem Ozean zu extrahieren."}, {"question": "Was treibt riesige Flugzeugträger wie die in der Nimitz-Klasse an?", "choix": ["Kerosinmotoren.", "Kernreaktoren.", "Windkraftanlagen.", "Elektrobatterien."], "bonne": 1, "explication": "Riesige Flugzeugträger wie die in der amerikanischen Nimitz-Klasse werden von Kernreaktoren angetrieben."}, {"question": "Wie viele Hauptschritte ist der Prozess unterteilt?", "choix": ["Vier Schritte.", "Ein Schritt.", "Drei Schritte.", "Zwei Schritte: zuerst extrahieren, dann bauen."], "bonne": 3, "explication": "Der Prozess ist in zwei Hauptschritte unterteilt: Zuerst extrahieren wir, dann bauen wir."}, {"question": "Welche im Meerwasser gelösten Gase werden zur Herstellung des Kraftstoffs verwendet?", "choix": ["Helium und Neon.", "Methan und Propan.", "Kohlendioxid (CO2) und Wasserstoff.", "Sauerstoff und Stickstoff."], "bonne": 2, "explication": "Meerwasser ist voller gelöster Gase, einschließlich Kohlendioxid (CO2) und Wasserstoff."}, {"question": "Was ist der Ultra-High-Tech-Filter, der zur Extraktion verwendet wird?", "choix": ["Nimitz-Modul.", "Fischermodul.", "NASA-Modul.", "ECEM-Modul."], "bonne": 3, "explication": "Dieses Extraktionssystem verwendet einen Ultra-High-Tech-Filter namens ECEM-Modul."}, {"question": "Wie hoch ist die Gasabscheidungseffizienz des ECEM-Moduls?", "choix": ["92 %.", "50 %.", "75 %.", "100 %."], "bonne": 0, "explication": "Das ECEM-Modul fängt diese Gase mit einer unglaublichen Effizienz von 92% ein."}, {"question": "Welcher chemische Prozess wird für die Brennstoffsynthese verwendet?", "choix": ["Destillation.", "Die Fischer-Tropsch Synthese.", "Photosynthese.", "Fermentation."], "bonne": 1, "explication": "Der hier verwendete chemische Prozess wird als Fischer-Tropsch-Synthese bezeichnet."}, {"question": "Was sollte mit Kohlendioxid gemacht werden, bevor es zusammengebaut wird?", "choix": ["Mischen Sie es mit Salz.", "Einfrieren.", "Fügen Sie ein Sauerstoffatom hinzu.", "Entfernen Sie ein Sauerstoffatom und verwandeln Sie es in Kohlenmonoxid (CO)."], "bonne": 3, "explication": "Zunächst muss ein Kohlendioxid-Sauerstoffatom entfernt werden, um es in Kohlenmonoxid (CO) umzuwandeln."}, {"question": "Aus welchem Material werden korrosionsbeständige Katalysatoren hergestellt?", "choix": ["Titan.", "Reines Gold.", "Edelstahl.", "Molybdäncarbid."], "bonne": 3, "explication": "Katalysatoren werden aus einem sehr spezifischen Material entwickelt: Molybdäncarbid."}, {"question": "Wie viel Strom wird benötigt, um etwa 310 000 Liter Kraftstoff pro Tag zu produzieren?", "choix": ["1000 MW.", "200 MW.", "20 MW.", "100 MW."], "bonne": 1, "explication": "Die Behandlung von genügend Wasser, um dieses Volumen zu erhalten, erfordert dauerhaft 200 MW Strom."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
