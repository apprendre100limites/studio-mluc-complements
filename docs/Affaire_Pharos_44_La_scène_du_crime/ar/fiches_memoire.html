<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صحائف الوقائع - قضية Pharos 4/4: مسرح الجريمة</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>بطاقات الذاكرة</h1><p class="sous">قضية Pharos 4/4: مسرح الجريمة</p><p class="sous">اقرأ السؤال، اجيب في رأسك ثم اضغط على الورقة لرؤية الجواب</p><p class="noprint"><button class="sec" onclick="tout(true)">أظهر كل شيء</button> <button class="sec" onclick="tout(false)">إخفاء كل شيء</button></p><div id="c"></div></main><script>const C=[{"q": "أي حدث رئيسي حدث في 8 آب/أغسطس 1303 في أليكساندريا على هامش سجل؟", "r": "زلزال كبير أسقط المنارة وثلث المدينة"}, {"q": "ماذا يقول التاريخي (مقريزي) عن مصير المنارة بعد زلزال 1303؟", "r": "يقول أن الزلزال كان سيدمر المنارة بالكامل"}, {"q": "ماذا يقول إيبن تاغريباردي عن المنارة بعد 1303؟", "r": "He said that Princes had begun restoration in 1304 on the orders of Emir Baybars al-Dawadar, but the researchers said that this work had never taken place."}, {"q": "ما هي الشهادة التي يدلي بها إيبن باتوتا عن حالة المنارة في 1349؟", "r": "يكتب أن المنارة في حالة لا يمكنك الدخول من خلال الباب"}, {"q": "ما هي السمة المعمارية في أعلى المنارة مذكورة في نصوص القرون الوسطى؟", "r": "وكانت القمة مغطاة بلعبة خشبية ببنها أحمد بن تولون، وهو ما تم إلغاؤه عدة مرات بسبب هشاشته."}, {"q": "ما هي المهام التي تخدم القبة الخشبية في أعلى المنارة؟", "r": "It housed the highest mosque in the Muslim world and served as an observatory with four doors facing the cardinal points."}, {"q": "ما هو التوأم الرقمي في سياق دراسة المنارة؟", "r": "وهي نسخة ثلاثية الأبعاد من المنارة، مصنوعة من قطع رقمية، التي تحاكي الحمولات والزلازل دون كسر أي شيء."}, {"q": "ما هو دور مؤسسة \"داسو سيستيمز\" في هذا البحث؟", "r": "إنه يدعم الباحثين في بناء توأم المنارة الرقمي"}, {"q": "ما هي الوظيفة الرئيسية للبعثة المعروضة على الطلاب ذوي الكتل الحقيقية؟", "r": "قارن برجين: برج مستقيم وبرج كبير ذو برج خفيف"}, {"q": "ما هي القيود الأربعة المفروضة على بناء واختبار البرجين؟", "r": "نفس عدد الحيات، نفس الطول، الاختبارات المتكررة متطابقة، وإخبار حدود الاختبار."}, {"q": "ما هي الاختبارات المادية الثلاثة التي ستجرى في كل جولة لمقارنة مقاومتها؟", "r": "ضعي حمولة في الأعلى، اغسلي الطاولة بلطف من خلال عد الهزات، وببطء اربطي صينية لملاحظة زاوية البقشيش."}, {"q": "لماذا عليك القيام بكل اختبارات عدة مرات بنفس الطريقة؟", "r": "حتى تكون المقارنة بين البرجين عادلة"}, {"q": "ماذا يجب أن يتضمن حكم المجموعة المؤقت في نهاية التجربة؟", "r": "فما هو الشكل الذي يقاوم الأفضل، ولماذا، وحدود الخبرة (برج من القطع ليس المنارة الحقيقية)."}, {"q": "كم عدد العجائب السبعة في العالم القديم لا يزال واقفا اليوم وفقا للفيديو؟", "r": "الهرم العظيم لـ (جيزا)"}, {"q": "ما هو استخدام المحاكاة الهيكلية العددية للمهندسين الحاليين؟", "r": "وقبل بناء جسر أو بناء أو سد، فإنها تحفيز الحمولات والرياح والزلازل لمعرفة المكان الذي يرجح أن يثمر فيه المبنى وكيفية تعزيزه."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
