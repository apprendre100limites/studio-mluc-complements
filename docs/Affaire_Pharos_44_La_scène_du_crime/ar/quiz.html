<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - Pharos 4/4: The crime scene</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · العلوم </div><h1>Quiz</h1><p class="sous">قضية Pharos 4/4: مسرح الجريمة</p><div id="q"></div><p class="noprint"><button onclick="verifier()">تحقق من إجاباتي</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "ماذا حدث في 8 آب/أغسطس، 1333 في أليكساندريا؟", "choix": ["جيم - الفيضانات", "باء - تسونامي", "دال - النار", "ألف - زلزال"], "bonne": 3, "explication": "ويشير النص إلى أن زلزالا كبيرا أسقط المنارة وثلث المدينة."}, {"question": "وفقاً لتاريخ (مكريزي)، ماذا حدث في المنارة؟", "choix": ["C) He was abandoned.", "D) It has been strengthened", "B) It has been restored", "A) It was completely destroyed."], "bonne": 3, "explication": "ويفيد تاريخي ماكريزي بأن الزلزال دمر المنارة بالكامل."}, {"question": "ماذا كتب إيبن باتوتا عن المنارة؟", "choix": ["C) The lighthouse was completely destroyed", "ألف - المنارة في حالة ممتازة", "D) The stones were reused", "لا يمكننا الدخول من خلال الباب بعد الآن"], "bonne": 3, "explication": "In 1349, Ibn Battuta wrote that the lighthouse was in such a state that one could no longer enter through the door."}, {"question": "وفقاً لنصوص القرون الوسطى، كيف كان مؤتمر قمة المنارة؟", "choix": ["A) Covered with a wooden dome built by Ahmed Ibn Touloun", "باء - صنع حجر فقط", "D) Covered with tiles", "C) Covered with metal sheet"], "bonne": 0, "explication": "وتشير نصوص القرون الوسطى إلى أن مؤتمر القمة كان مغطى بقبعة خشبية بنيها أحمد بن تولون."}, {"question": "ما هو أعلى مسجد في العالم الإسلامي؟", "choix": ["C) The mosque at the top of the lighthouse", "A) Alexandria Lighthouse", "باء - البرج في الطوابق", "دال - المنارة نفسها"], "bonne": 0, "explication": "وأقام هذا البناء الخفيف أعلى مسجد في العالم الإسلامي."}, {"question": "مَنْ كَانَ عِنْدَهُ القبّةُ الخفيفةُ الحمراءُ؟", "choix": ["A) A vizier", "B) Two sultans", "جيم - أمير", "D) Ibn Taghribardi"], "bonne": 0, "explication": "The dome has been redone several times because of its fragility: by a vizier, then by two sultans."}, {"question": "ماذا يفعل الباحثون لفهم المنارة؟", "choix": ["جيم - دراسة المباني الرقمية", "إنهم يبنون توأم رقمي", "دال - مقارنة الشهادات", "B) They test hypotheses on a 3D model"], "bonne": 3, "explication": "يقوم الباحثون ببناء زوج رقمي من المنارة لتحفيز الحمولات وفرضيات الاختبار"}, {"question": "ما هي الوظيفة الرئيسية للنشاط؟", "choix": ["B) Building a lighthouse", "دال - تاريخ المنارة", "A) Compare two rounds", "جيم - قوة برج الاختبار"], "bonne": 2, "explication": "وتتمثل المهمة الرئيسية المبينة في مقارنة برجين لفهم استقرارهما."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ صحيح '+q.explication}else{e.innerHTML='❌ الجواب الصحيح: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='اسكت: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
