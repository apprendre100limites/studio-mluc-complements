<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fichas de datos — Caso Pharos 4/4: La escena del crimen</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Tarjetas de memoria</h1><p class="sous">Caso Pharos 4/4: La escena del crimen</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Qué evento principal tuvo lugar el 8 de agosto de 1303 en Alejandría en las líneas laterales de un registro?", "r": "Un gran terremoto derribó el faro y alrededor de un tercio de la ciudad."}, {"q": "¿Qué dice el historiador Maqrizi sobre el destino del faro después del terremoto de 1303?", "r": "Dice que el terremoto habría destruido completamente el faro."}, {"q": "¿Qué dice Ibn Taghribardi sobre el faro después de 1303?", "r": "Dijo que los príncipes habían comenzado la restauración en 1304 por órdenes de Emir Baybars al-Dawadar, pero los investigadores dijeron que esta obra nunca había tenido lugar."}, {"q": "¿Qué testimonio da Ibn Battuta sobre el estado del faro en 1349?", "r": "Escribe que el faro está en tal estado que ya no puedes entrar por la puerta."}, {"q": "¿Qué peculiaridad arquitectónica en la parte superior del faro se menciona en textos medievales?", "r": "La parte superior estaba cubierta con una cúpula de madera construida por Ahmed Ibn Touloun, que fue redone varias veces debido a su fragilidad."}, {"q": "¿Qué funciones sirvieron la cúpula de madera en la parte superior del faro?", "r": "Alojaba la mezquita más alta del mundo musulmán y servía como observatorio con cuatro puertas frente a los puntos cardinales."}, {"q": "¿Qué es un gemelo digital en el contexto del estudio de faro?", "r": "Es una copia tridimensional del faro, hecha de bloques digitalizados, que simula cargas y terremotos sin romper nada."}, {"q": "¿Cuál es el papel de la Fundación Dassault Systèmes en esta investigación?", "r": "Apoya a los investigadores en la construcción del gemelo digital del faro."}, {"q": "¿Cuál es la función principal de la misión ofrecida a los estudiantes con bloques reales?", "r": "Compare dos torres: una torre recta y una torre de gran base con una cima más ligera."}, {"q": "¿Cuáles son las cuatro restricciones impuestas a la construcción y prueba de las dos torres?", "r": "El mismo número de bloques, la misma altura, las pruebas repetidas idénticas y los límites de la prueba."}, {"q": "¿Cuáles son las tres pruebas físicas a realizar en cada ronda para comparar su resistencia?", "r": "Coloque una carga en la parte superior, mueva suavemente la mesa contando los batidos, y inclina lentamente la bandeja para notar el ángulo de la punta."}, {"q": "¿Por qué tienes que hacer cada prueba varias veces de la misma manera?", "r": "Así que la comparación entre las dos torres es justa."}, {"q": "¿Qué debería contener el veredicto provisional del grupo al final del experimento?", "r": "Qué forma resiste mejor, por qué, y los límites de la experiencia (una torre de bloques no es el verdadero faro)."}, {"q": "¿Cuántas de las siete maravillas del mundo antiguo todavía están de pie hoy según el video?", "r": "Sólo uno: la gran pirámide de Giza."}, {"q": "¿Cuál es el uso de simulaciones estructurales numéricas para los ingenieros actuales?", "r": "Antes de construir un puente, edificio o presa, simulan cargas, vientos y terremotos para averiguar dónde es probable que el edificio ceda y cómo fortalecerlo."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
