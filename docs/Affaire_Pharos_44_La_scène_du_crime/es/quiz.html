</style></head><body><main><div class="marque">M'Luc · Ciencias </div><h1>Quiz</h1><p class="sous">Caso Pharos 4/4: La escena del crimen</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Qué pasó el 8 de agosto de 1333 en Alejandría?", "choix": ["C) Diluvio", "B) Tsunami", "D) Fuego", "A) Un terremoto"], "bonne": 3, "explication": "El texto indica que un gran terremoto derribó el faro y un tercio de la ciudad."}, {"question": "Según el historiador Maqrizi, ¿qué pasó en el faro?", "choix": ["C) Fue abandonado.", "D) Se ha fortalecido", "B) Se ha restaurado", "A) Fue completamente destruido."], "bonne": 3, "explication": "El historiador Maqrizi informa que el terremoto destruyó completamente el faro."}, {"question": "¿Qué escribió Ibn Battuta sobre el faro?", "choix": ["C) El faro fue completamente destruido", "A) El faro está en excelentes condiciones", "D) Las piedras fueron reutilizadas", "B) No podemos entrar más por la puerta."], "bonne": 3, "explication": "En 1349, Ibn Battuta escribió que el faro estaba en tal estado que uno ya no podía entrar por la puerta."}, {"question": "Según los textos medievales, ¿cómo fue la cumbre del faro?", "choix": ["A) Cubierta con una cúpula de madera construida por Ahmed Ibn Touloun", "B) Made of stone only", "D) Cubierta con azulejos", "C) Cubierta con chapa de metal"], "bonne": 0, "explication": "Los textos medievales mencionan que la cumbre estaba cubierta con una cúpula de madera construida por Ahmed Ibn Touloun."}, {"question": "¿Cuál era la mezquita más alta del mundo musulmán?", "choix": ["C) La mezquita en la parte superior del faro", "A) Alexandria Lighthouse", "B) La torre en suelos", "D) El faro en sí"], "bonne": 0, "explication": "Esta construcción de luz albergaba la mezquita más alta del mundo musulmán."}, {"question": "¿Quién tenía el faro dome redone?", "choix": ["A) Un vizier", "B) Dos sultanes", "C) Un Emir", "D) Ibn Taghribardi"], "bonne": 0, "explication": "La cúpula ha sido roja varias veces debido a su fragilidad: por un vizier, luego por dos sultanes."}, {"question": "¿Qué hacen los investigadores para entender el faro?", "choix": ["C) Estudian bloques digitalizados", "A) Están construyendo un gemelo digital", "D) Comparan los testimonios", "B) Prueban hipótesis en un modelo 3D"], "bonne": 3, "explication": "Los investigadores construyen un par digital del faro para simular cargas y probar hipótesis."}, {"question": "¿Cuál es la función principal de la actividad?", "choix": ["B) Construcción de un faro", "D) Historia del faro", "A) Compare dos rondas", "C) Fuerza de torre de prueba"], "bonne": 2, "explication": "La función principal descrita es comparar dos torres para comprender su estabilidad."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
