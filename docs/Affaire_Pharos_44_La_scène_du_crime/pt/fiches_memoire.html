<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fichas — Processo Pharos 4/4: Cena do crime</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências </div><h1>Cartões de memória</h1><p class="sous">Caso Pharos 4/4: A cena do crime</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "Que grande evento ocorreu em 8 de agosto de 1303 em Alexandria, à margem de um registro?", "r": "Um grande terremoto derrubou o farol e cerca de um terço da cidade."}, {"q": "O que diz o historiador Maqrizi sobre o destino do farol depois do terremoto de 1303?", "r": "Ele relata que o terremoto teria destruído completamente o farol."}, {"q": "O que diz Ibn Taghribardi sobre o farol depois de 1303?", "r": "Ele disse que os príncipes tinham começado a restauração em 1304 sob as ordens de Emir Baybars al-Dawadar, mas os pesquisadores disseram que este trabalho nunca tinha acontecido."}, {"q": "Que testemunho dá Ibn Battuta sobre o estado do farol em 1349?", "r": "Ele escreve que o farol está em tal estado que você não pode mais entrar pela porta."}, {"q": "Que peculiaridade arquitetônica no topo do farol é mencionada em textos medievais?", "r": "O topo foi coberto com uma cúpula de madeira construída por Ahmed Ibn Touloun, que foi refeito várias vezes por causa de sua fragilidade."}, {"q": "Que funções serviram a cúpula de madeira no topo do farol?", "r": "Alojava a mesquita mais alta do mundo muçulmano e servia como observatório com quatro portas voltadas para os pontos cardinais."}, {"q": "O que é um gêmeo digital no contexto do estudo do farol?", "r": "É uma cópia tridimensional do farol, feito de blocos digitalizados, que simula cargas e terremotos sem quebrar nada."}, {"q": "Qual é o papel da Fundação Dassault Systèmes nesta pesquisa?", "r": "Apoia pesquisadores na construção do gêmeo digital do farol."}, {"q": "Qual é a principal função da missão oferecida aos alunos com blocos reais?", "r": "Compare duas torres: uma torre reta e uma torre de grande base com um topo mais leve."}, {"q": "Quais são as quatro restrições impostas à construção e teste das duas torres?", "r": "O mesmo número de blocos, mesma altura, testes repetidos idênticos e indicar os limites do ensaio."}, {"q": "Quais são os três testes físicos a serem realizados em cada rodada para comparar sua resistência?", "r": "Coloque uma carga na parte superior, balance suavemente a mesa contando os tremores e incline lentamente a bandeja para notar o ângulo da ponta."}, {"q": "Porque tens de fazer todos os testes várias vezes da mesma maneira?", "r": "Para que a comparação entre as duas torres seja justa."}, {"q": "O que deve conter o veredicto provisório do grupo no final da experiência?", "r": "Que forma resiste melhor, por que, e os limites da experiência (uma torre de blocos não é o verdadeiro farol)."}, {"q": "Quantas das sete maravilhas do mundo antigo ainda existem hoje segundo o vídeo?", "r": "Apenas uma: a grande pirâmide de Gizé."}, {"q": "Qual é o uso de simulações estruturais numéricas para engenheiros atuais?", "r": "Antes de construir uma ponte, construção ou represa, eles simulam cargas, ventos e terremotos para descobrir onde o edifício é provável para ceder e como fortalecê-lo."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
