<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fact Sheets — Pharos Fall 4/4: Der Tatort</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften </div><h1>Speicherkarten</h1><p class="sous">Fall Pharos 4/4: Der Tatort</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Welches große Ereignis fand am 8. August 1303 in Alexandria am Rande eines Registers statt?", "r": "Ein großes Erdbeben brachte den Leuchtturm und etwa ein Drittel der Stadt zum Einsturz."}, {"q": "Was sagt der Historiker Maqrizi über das Schicksal des Leuchtturms nach dem Erdbeben von 1303?", "r": "Er berichtet, dass das Erdbeben den Leuchtturm vollständig zerstört hätte."}, {"q": "Was sagt Ibn Taghribardi über den Leuchtturm nach 1303?", "r": "Er sagte, dass Prinzen 1304 auf Befehl von Emir Baybars al-Dawadar mit der Restaurierung begonnen hatten, aber die Forscher sagten, dass diese Arbeit nie stattgefunden hatte."}, {"q": "Welches Zeugnis gibt Ibn Battuta über den Zustand des Leuchtturms im Jahre 1349?", "r": "Er schreibt, dass der Leuchtturm in einem solchen Zustand ist, dass man nicht mehr durch die Tür eintreten kann."}, {"q": "Welche architektonische Besonderheit an der Spitze des Leuchtturms wird in mittelalterlichen Texten erwähnt?", "r": "Die Oberseite war mit einer hölzernen Kuppel von Ahmed Ibn Touloun bedeckt, die wegen ihrer Zerbrechlichkeit mehrmals erneuert wurde."}, {"q": "Welche Funktionen dienten der Holzkuppel an der Spitze des Leuchtturms?", "r": "Es beherbergte die höchste Moschee der muslimischen Welt und diente als Observatorium mit vier Türen zu den Kardinalpunkten."}, {"q": "Was ist ein digitaler Zwilling im Kontext der Lighthouse-Studie?", "r": "Es ist eine dreidimensionale Kopie des Leuchtturms aus digitalisierten Blöcken, die Lasten und Erdbeben simuliert, ohne etwas zu brechen."}, {"q": "Welche Rolle spielt die Stiftung Dassault Systèmes in dieser Forschung?", "r": "Es unterstützt Forscher beim Bau des digitalen Zwillings des Leuchtturms."}, {"q": "Was ist die Hauptfunktion der Mission, die Studenten mit echten Blöcken angeboten wird?", "r": "Vergleichen Sie zwei Türme: einen geraden Turm und einen großen Basisturm mit einer leichteren Oberseite."}, {"q": "Was sind die vier Einschränkungen für den Bau und die Prüfung der beiden Türme?", "r": "Gleiche Anzahl von Blöcken, gleiche Höhe, wiederholte Tests identisch und geben die Grenzen des Tests an."}, {"q": "Was sind die drei physischen Tests, die in jeder Runde durchgeführt werden müssen, um ihren Widerstand zu vergleichen?", "r": "Stellen Sie eine Last an der Spitze, schütteln Sie den Tisch sanft, indem Sie die Shakes zählen, und kippen Sie langsam das Tablett, um den Spitzenwinkel zu bemerken."}, {"q": "Warum müssen Sie jeden Test mehrmals auf die gleiche Weise durchführen?", "r": "Der Vergleich zwischen den beiden Türmen ist fair."}, {"q": "Was sollte das vorläufige Urteil der Gruppe am Ende des Experiments enthalten?", "r": "Welche Form widersteht am besten, warum und die Grenzen der Erfahrung (ein Turm aus Blöcken ist nicht der wahre Leuchtturm)."}, {"q": "Wie viele der sieben Wunder der antiken Welt stehen heute noch laut dem Video?", "r": "Nur eine: die große Pyramide von Gizeh."}, {"q": "Was nützen numerische Struktursimulationen für aktuelle Ingenieure?", "r": "Bevor sie eine Brücke, ein Gebäude oder einen Damm bauen, simulieren sie Lasten, Winde und Erdbeben, um herauszufinden, wo das Gebäude wahrscheinlich nachgeben und wie es gestärkt werden kann."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
