<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Pharos 4/4: Der Tatort</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften </div><h1>Quiz</h1><p class="sous">Fall Pharos 4/4: Der Tatort</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Überprüfen Sie meine Antworten</button> <button class="sec" onclick="refaire()">Neustart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Was geschah am 8. August 1333 in Alexandria?", "choix": ["C Überschwemmung", "B Tsunami", "D Feuer", "A. Ein Erdbeben"], "bonne": 3, "explication": "Der Text zeigt an, dass ein schweres Erdbeben den Leuchtturm und ein Drittel der Stadt zum Einsturz brachte."}, {"question": "Laut dem Historiker Maqrizi, was geschah am Leuchtturm?", "choix": ["C) Er wurde verlassen.", "D) Es wurde gestärkt", "B) Es wurde restauriert", "A) Es wurde völlig zerstört."], "bonne": 3, "explication": "Der Historiker Maqrizi berichtet, dass das Erdbeben den Leuchtturm vollständig zerstört hat."}, {"question": "Was schrieb Ibn Battuta über den Leuchtturm?", "choix": ["C Der Leuchtturm wurde komplett zerstört", "A) Der Leuchtturm ist in ausgezeichnetem Zustand", "D) Die Steine wurden wiederverwendet", "B) Wir können nicht mehr durch die Tür hinein."], "bonne": 3, "explication": "1349 schrieb Ibn Battuta, dass der Leuchtturm in einem solchen Zustand war, dass man nicht mehr durch die Tür eintreten konnte."}, {"question": "Nach mittelalterlichen Texten, wie war der Gipfel des Leuchtturms?", "choix": ["A) Mit einer hölzernen Kuppel von Ahmed Ibn Touloun bedeckt", "B nur aus Stein", "D) Mit Fliesen bedeckt", "C) mit Metallblech überzogen"], "bonne": 0, "explication": "Die mittelalterlichen Texte erwähnen, dass der Gipfel mit einer hölzernen Kuppel von Ahmed Ibn Touloun bedeckt war."}, {"question": "Was war die höchste Moschee der muslimischen Welt?", "choix": ["C) Die Moschee an der Spitze des Leuchtturms", "A. Alexandria Lighthouse", "B) Der Turm in den Etagen", "D. Der Leuchtturm selbst"], "bonne": 0, "explication": "Diese Lichtkonstruktion beherbergte die höchste Moschee der muslimischen Welt."}, {"question": "Wer hatte die Leuchtturmkuppel erneuert?", "choix": ["A. Wesir", "B. Zwei Sultane", "C. Ein Emir", "D. Ibn Taghribardi"], "bonne": 0, "explication": "Die Kuppel wurde wegen ihrer Zerbrechlichkeit mehrmals erneuert: von einem Wesir, dann von zwei Sultanen."}, {"question": "Was tun Forscher, um den Leuchtturm zu verstehen?", "choix": ["C) Sie studieren digitalisierte Blöcke", "A) Sie bauen einen digitalen Zwilling", "D) Sie vergleichen die Zeugnisse", "B) Sie testen Hypothesen auf einem 3D-Modell"], "bonne": 3, "explication": "Die Forscher bauen ein digitales Leuchtturmpaar, um Lasten zu simulieren und Hypothesen zu testen."}, {"question": "Was ist die Hauptfunktion der Aktivität?", "choix": ["B Bau eines Leuchtturms", "D) Geschichte des Leuchtturms", "A) Vergleichen Sie zwei Runden", "C Prüfturmfestigkeit"], "bonne": 2, "explication": "Die beschriebene Hauptfunktion besteht darin, zwei Türme zu vergleichen, um ihre Stabilität zu verstehen."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Richtig. '+q.explication}else{e.innerHTML='❌ Die richtige Antwort: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Punktzahl: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
