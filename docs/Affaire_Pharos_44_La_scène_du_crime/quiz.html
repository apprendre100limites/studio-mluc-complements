<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Affaire Pharos 4/4 : La scène du crime</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}

@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Quiz</h1><p class="sous">Affaire Pharos 4/4 : La scène du crime</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Qu'est-ce qui s'est passé le 8 août 1333 à Alexandrie ?", "choix": ["C) Une inondation", "B) Un tsunami", "D) Un incendie", "A) Un tremblement de terre"], "bonne": 3, "explication": "Le texte indique qu'un grand tremblement de terre a fait tomber le phare et un tiers de la ville."}, {"question": "Selon l'historien Maqrizi, que s'est-il passé au phare ?", "choix": ["C) Il a été abandonné", "D) Il a été renforcé", "B) Il a été restauré", "A) Il a été entièrement détruit"], "bonne": 3, "explication": "L'historien Maqrizi rapporte que le tremblement de terre aurait entièrement détruit le phare."}, {"question": "Ce qu'a écrit Ibn Battuta sur le phare ?", "choix": ["C) Le phare a été entièrement détruit", "A) Le phare est en excellent état", "D) Les pierres ont été réutilisées", "B) On ne peut plus entrer par la porte"], "bonne": 3, "explication": "En 1349, Ibn Battuta écrit que le phare est dans un tel état qu'on ne peut plus entrer par la porte."}, {"question": "Selon les textes médiévaux, comment était le sommet du phare ?", "choix": ["A) Couvert d'un dôme en bois construit par Ahmed Ibn Touloun", "B) Fabriqué en pierre uniquement", "D) Recouvert de tuiles", "C) Couvert d'une tôle métallique"], "bonne": 0, "explication": "Les textes médiévaux mentionnent que le sommet était couvert d'un dôme en bois construit par Ahmed Ibn Touloun."}, {"question": "Quelle était la plus haute mosquée du monde musulman ?", "choix": ["C) La mosquée du sommet du phare", "A) Le phare d'Alexandrie", "B) La tour en étages", "D) Le phare lui-même"], "bonne": 0, "explication": "Cette construction légère abritait la plus haute mosquée du monde musulman."}, {"question": "Qui a fait refaire le dôme du phare ?", "choix": ["A) Un vizir", "B) Deux sultans", "C) Un emir", "D) Ibn Taghribardi"], "bonne": 0, "explication": "Le dôme a été refait plusieurs fois à cause de sa fragilité : par un vizir, puis par deux sultans."}, {"question": "Que font les chercheurs pour comprendre le phare ?", "choix": ["C) Ils étudient les blocs numérisés", "A) Ils construisent un jumeau numérique", "D) Ils comparent les témoignages", "B) Ils testent des hypothèses sur un modèle 3D"], "bonne": 3, "explication": "Les chercheurs construisent un jumeau numérique du phare pour simuler des charges et tester des hypothèses."}, {"question": "Quelle est la fonction principale de l'activité ?", "choix": ["B) Construire un phare", "D) Historier le phare", "A) Comparer deux tours", "C) Tester la résistance des tours"], "bonne": 2, "explication": "La fonction principale décrite est de comparer deux tours pour comprendre leur stabilité."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
