<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>प्रश्नोत्तरी - Pharos 4/4: अपराध दृश्य</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान </div><h1>प्रश्नोत्तरी</h1><p class="sous">Pharos 4/4 मामले: अपराध दृश्य</p><div id="q"></div><p class="noprint"><button onclick="verifier()">मेरा जवाब चेक करें</button> <button class="sec" onclick="refaire()">शुरू</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "अगस्त 8, 1333 को अलेक्जेंड्रिया में क्या हुआ?", "choix": ["C) बाढ़", "B. Tsunami", "D) आग", "A) भूकंप"], "bonne": 3, "explication": "पाठ इंगित करता है कि एक प्रमुख भूकंप ने लाइटहाउस और एक तिहाई शहर को लाया।"}, {"question": "इतिहासकार Maqrizi के अनुसार, प्रकाशघर में क्या हुआ?", "choix": ["C) उन्हें छोड़ दिया गया।", "D) इसे मजबूत किया गया है", "B) इसे बहाल किया गया है", "A) यह पूरी तरह नष्ट हो गया।"], "bonne": 3, "explication": "इतिहासकार Maqrizi ने बताया कि भूकंप ने पूरी तरह से प्रकाश व्यवस्था को नष्ट कर दिया।"}, {"question": "इब्न बट्टुटा ने लाइटहाउस के बारे में क्या लिखा?", "choix": ["C) लाइटहाउस पूरी तरह से नष्ट हो गया था", "A) लाइटहाउस उत्कृष्ट स्थिति में है", "D) पत्थरों का पुन: उपयोग किया गया था", "B) हम अब दरवाजे के माध्यम से नहीं जा सकते।"], "bonne": 3, "explication": "1349 में, इब्न बट्टुटा ने लिखा कि प्रकाशघर ऐसे राज्य में था जो अब दरवाजे के माध्यम से प्रवेश नहीं कर सकता था।"}, {"question": "मध्ययुगीन ग्रंथों के अनुसार, लाइटहाउस का शिखर कैसे था?", "choix": ["A) अहमद इब्न टुलून द्वारा निर्मित एक लकड़ी के गुंबद के साथ कवर किया गया", "B) केवल पत्थर से बना", "D) टाइल्स के साथ कवर", "C) धातु शीट के साथ कवर"], "bonne": 0, "explication": "मध्ययुगीन ग्रंथों का उल्लेख है कि शिखर को अहमद इब्न टुलून द्वारा निर्मित लकड़ी के गुंबद के साथ कवर किया गया था।"}, {"question": "मुसलमान दुनिया में सबसे ज्यादा मस्जिद क्या थी?", "choix": ["C) लाइटहाउस के शीर्ष पर मस्जिद", "A) Alexandria Lighthouse", "B) फर्श में टॉवर", "D) प्रकाशस्तंभ खुद"], "bonne": 0, "explication": "इस प्रकाश निर्माण ने मुस्लिम दुनिया में उच्चतम मस्जिद का निर्माण किया।"}, {"question": "किसके पास लाइटहाउस गुंबद है?", "choix": ["A vizier", "B) दो सुल्तान", "C. An Emir", "D) Ibn Taghribardi"], "bonne": 0, "explication": "इसकी नाजुकता के कारण गुंबद कई बार फिर से शुरू हो गया है: एक vizier द्वारा, फिर दो सुल्तानों द्वारा।"}, {"question": "क्या शोधकर्ताओं ने प्रकाशघर को समझने के लिए?", "choix": ["C) वे अंकों वाले ब्लॉकों का अध्ययन करते हैं", "A) वे डिजिटल जुड़वाँ बना रहे हैं", "D) वे गवाही की तुलना करते हैं", "बी) वे 3 डी मॉडल पर परिकल्पना का परीक्षण करते हैं"], "bonne": 3, "explication": "शोधकर्ता भार और परीक्षण परिकल्पना को अनुकरण करने के लिए लाइटहाउस की एक डिजिटल जोड़ी का निर्माण करते हैं।"}, {"question": "गतिविधि का मुख्य कार्य क्या है?", "choix": ["B) एक लाइटहाउस का निर्माण", "D) लाइटहाउस का इतिहास", "A) दो राउंड की तुलना करें", "C) टेस्ट टॉवर ताकत"], "bonne": 2, "explication": "वर्णित मुख्य कार्य उनकी स्थिरता को समझने के लिए दो टावरों की तुलना करना है।"}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ अधिकार '+q.explication}else{e.innerHTML='❌ सही उत्तर: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='स्कोर: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
