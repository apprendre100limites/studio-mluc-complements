<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>तथ्य पत्रक - Pharos प्रकरण 4/4: अपराध दृश्य</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान </div><h1>मेमोरी कार्ड</h1><p class="sous">Pharos 4/4 मामले: अपराध दृश्य</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "अगस्त 8, 1303 को एक रजिस्टर के किनारे अलेक्जेंड्रिया में क्या प्रमुख घटना हुई?", "r": "एक बड़े भूकंप ने लाइटहाउस को और शहर के लगभग तीसरे स्थान पर पहुंचाया।"}, {"q": "1303 के भूकंप के बाद इतिहासकार Maqrizi प्रकाशघर के भाग्य के बारे में क्या कहता है?", "r": "उन्होंने बताया कि भूकंप पूरी तरह से प्रकाश व्यवस्था को नष्ट कर देगा।"}, {"q": "Ibn Taghribardi क्या कहते हैं?", "r": "उन्होंने कहा कि राजकुमारों ने 1304 में अमीरात बेबार अल-दवाडार के आदेश पर बहाली शुरू कर दी थी, लेकिन शोधकर्ताओं ने कहा कि यह काम कभी नहीं हुआ था।"}, {"q": "Ibn Battuta क्या गवाही देता है?", "r": "वह लिखते हैं कि लाइटहाउस ऐसी स्थिति में है कि आप अब दरवाजे के माध्यम से प्रवेश नहीं कर सकते हैं।"}, {"q": "लाइटहाउस के शीर्ष पर वास्तुशिल्प विशिष्टता का उल्लेख मध्ययुगीन ग्रंथों में किया गया है?", "r": "शीर्ष को अहमद इब्न टुलुओन द्वारा निर्मित लकड़ी के गुंबद से ढंका गया था, जो इसकी नाजुकता के कारण कई बार फिर से शुरू हुआ था।"}, {"q": "क्या कार्य करता है लकड़ी के गुंबद को लाइटहाउस के शीर्ष पर?", "r": "यह मुस्लिम दुनिया में सबसे ज्यादा मस्जिद रखता है और कार्डिनल बिंदुओं का सामना करने वाले चार दरवाजे के साथ एक संरक्षक के रूप में कार्य करता है।"}, {"q": "प्रकाश गृह अध्ययन के संदर्भ में डिजिटल जुड़वां क्या है?", "r": "यह लाइटहाउस की तीन आयामी प्रति है, जो डिजिटाइज्ड ब्लॉक से बना है, जो किसी भी चीज़ को तोड़ने के बिना भार और भूकंप को अनुकरण करता है।"}, {"q": "इस शोध में दसॉल्ट सिस्टेमेस फाउंडेशन की भूमिका क्या है?", "r": "यह लाइटहाउस के डिजिटल जुड़वां निर्माण में शोधकर्ताओं का समर्थन करता है।"}, {"q": "इस मिशन का मुख्य कार्य वास्तविक ब्लॉक वाले छात्रों को दिया जाता है?", "r": "दो टावरों की तुलना करें: एक सीधा टावर और एक बड़े आधार वाला टावर जिसमें हल्का शीर्ष होता है।"}, {"q": "दो टावरों के निर्माण और परीक्षण पर चार बाधाएं क्या हैं?", "r": "ब्लॉकों की समान संख्या, समान ऊंचाई, बार-बार परीक्षण समान, और परीक्षण की सीमाओं को बताते हैं।"}, {"q": "प्रत्येक दौर में उनके प्रतिरोध की तुलना करने के लिए तीन भौतिक परीक्षण क्या हैं?", "r": "शीर्ष पर एक लोड रखें, धीरे-धीरे हिलाकर तालिका को हिलाएं, और धीरे-धीरे ट्रे को टिप कोण पर ध्यान देने के लिए झुकाएं।"}, {"q": "आपको एक ही तरह से कई बार हर टेस्ट क्यों करना है?", "r": "इसलिए दोनों टावरों के बीच तुलना उचित है।"}, {"q": "समूह के अनंतिम फैसले में प्रयोग के अंत में क्या होना चाहिए?", "r": "क्या आकार सबसे अच्छा प्रतिरोध करता है, क्यों, और अनुभव की सीमा (ब्लॉकों का एक टावर वास्तविक लाइटहाउस नहीं है)।"}, {"q": "प्राचीन दुनिया के सात आश्चर्य अभी भी वीडियो के अनुसार खड़े हैं?", "r": "केवल एक: गिज़ा का महान पिरामिड।"}, {"q": "वर्तमान इंजीनियरों के लिए संख्यात्मक संरचनात्मक सिमुलेशन का उपयोग क्या है?", "r": "एक पुल, इमारत या बांध बनाने से पहले, वे भार, हवाओं और भूकंपों का अनुकरण करते हैं ताकि यह पता लगाया जा सके कि इमारत को कैसे पैदा होने की संभावना है और इसे कैसे मजबूत किया जाए।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
