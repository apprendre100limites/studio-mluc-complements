<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fact sheets — Pharos case 4/4: The crime scene</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Memory cards</h1><p class="sous">Pharos 4/4 case: The crime scene</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "What major event took place on August 8, 1303 in Alexandria on the sidelines of a register?", "r": "A large earthquake brought down the lighthouse and about a third of the city."}, {"q": "What does historian Maqrizi say about the fate of the lighthouse after the earthquake of 1303?", "r": "He reports that the earthquake would have completely destroyed the lighthouse."}, {"q": "What does Ibn Taghribardi say about the lighthouse after 1303?", "r": "He said that princes had begun restoration in 1304 on the orders of Emir Baybars al-Dawadar, but the researchers said that this work had never taken place."}, {"q": "What testimony does Ibn Battuta give about the state of the lighthouse in 1349?", "r": "He writes that the lighthouse is in such a state that you can no longer enter through the door."}, {"q": "What architectural peculiarity at the top of the lighthouse is mentioned in medieval texts?", "r": "The top was covered with a wooden dome built by Ahmed Ibn Touloun, which was redone several times because of its fragility."}, {"q": "What functions served the wooden dome at the top of the lighthouse?", "r": "It housed the highest mosque in the Muslim world and served as an observatory with four doors facing the cardinal points."}, {"q": "What is a digital twin in the context of the lighthouse study?", "r": "It is a three-dimensional copy of the lighthouse, made from digitized blocks, which simulates loads and earthquakes without breaking anything."}, {"q": "What is the role of the Dassault Systèmes Foundation in this research?", "r": "It supports researchers in the construction of the lighthouse's digital twin."}, {"q": "What is the main function of the mission offered to students with real blocks?", "r": "Compare two towers: a straight tower and a large-base tower with a lighter top."}, {"q": "What are the four constraints imposed on the construction and testing of the two towers?", "r": "Same number of blocks, same height, repeated tests identical, and tell the limits of the test."}, {"q": "What are the three physical tests to be performed on each round to compare their resistance?", "r": "Place a load at the top, gently shake the table by counting the shakes, and slowly tilt the tray to note the tip angle."}, {"q": "Why do you have to do every test several times in the same way?", "r": "So that the comparison between the two towers is fair."}, {"q": "What should the group's provisional verdict contain at the end of the experiment?", "r": "What shape resists best, why, and the limits of experience (a tower of blocks is not the real lighthouse)."}, {"q": "How many of the seven wonders of the ancient world are still standing today according to the video?", "r": "Only one: the great pyramid of Giza."}, {"q": "What is the use of numerical structural simulations for current engineers?", "r": "Before building a bridge, building or dam, they simulate loads, winds and earthquakes to find out where the building is likely to yield and how to strengthen it."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
