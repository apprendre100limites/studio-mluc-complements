<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Pharos 4/4: The crime scene</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}

</style></head><body><main><div class="marque">M'Luc · Science </div><h1>Quiz</h1><p class="sous">Pharos 4/4 case: The crime scene</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What happened on August 8, 1333 in Alexandria?", "choix": ["C) Flood", "B) Tsunami", "D) Fire", "A) An earthquake"], "bonne": 3, "explication": "The text indicates that a major earthquake brought down the lighthouse and one third of the city."}, {"question": "According to historian Maqrizi, what happened at the lighthouse?", "choix": ["C) He was abandoned.", "D) It has been strengthened", "B) It has been restored", "A) It was completely destroyed."], "bonne": 3, "explication": "Historian Maqrizi reports that the earthquake completely destroyed the lighthouse."}, {"question": "What did Ibn Battuta write about the lighthouse?", "choix": ["C) The lighthouse was completely destroyed", "A) The lighthouse is in excellent condition", "D) The stones were reused", "B) We can't get in through the door anymore."], "bonne": 3, "explication": "In 1349, Ibn Battuta wrote that the lighthouse was in such a state that one could no longer enter through the door."}, {"question": "According to medieval texts, how was the summit of the lighthouse?", "choix": ["A) Covered with a wooden dome built by Ahmed Ibn Touloun", "B) Made of stone only", "D) Covered with tiles", "C) Covered with metal sheet"], "bonne": 0, "explication": "The medieval texts mention that the summit was covered with a wooden dome built by Ahmed Ibn Touloun."}, {"question": "What was the highest mosque in the Muslim world?", "choix": ["C) The mosque at the top of the lighthouse", "A) Alexandria Lighthouse", "B) The tower in floors", "D) The lighthouse itself"], "bonne": 0, "explication": "This light construction housed the highest mosque in the Muslim world."}, {"question": "Who had the lighthouse dome redone?", "choix": ["A) A vizier", "B) Two sultans", "C) An Emir", "D) Ibn Taghribardi"], "bonne": 0, "explication": "The dome has been redone several times because of its fragility: by a vizier, then by two sultans."}, {"question": "What do researchers do to understand the lighthouse?", "choix": ["C) They study digitized blocks", "A) They're building a digital twin", "D) They compare the testimonies", "B) They test hypotheses on a 3D model"], "bonne": 3, "explication": "Researchers build a digital pair of the lighthouse to simulate loads and test hypotheses."}, {"question": "What is the main function of the activity?", "choix": ["B) Building a lighthouse", "D) History of the lighthouse", "A) Compare two rounds", "C) Test tower strength"], "bonne": 2, "explication": "The main function described is to compare two towers to understand their stability."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
