<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Affaire Pharos 4/4 : La scène du crime</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences </div><h1>Fiches mémoire</h1><p class="sous">Affaire Pharos 4/4 : La scène du crime</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Quel événement majeur a eu lieu le 8 août 1303 à Alexandrie selon la note en marge d'un registre ?", "r": "Un grand tremblement de terre a fait tomber le phare et environ un tiers de la ville."}, {"q": "Que rapporte l'historien Maqrizi sur le sort du phare après le séisme de 1303 ?", "r": "Il rapporte que le tremblement de terre aurait entièrement détruit le phare."}, {"q": "Que raconte Ibn Taghribardi au sujet du phare après 1303 ?", "r": "Il raconte que des princes auraient entamé sa restauration dès 1304 sur ordre de l'émir Baybars al-Dawadar, mais les chercheurs précisent que ces travaux n'ont jamais eu lieu."}, {"q": "Quel témoignage Ibn Battuta donne-t-il sur l'état du phare en 1349 ?", "r": "Il écrit que le phare est dans un tel état qu'on ne peut plus entrer par la porte."}, {"q": "Quelle particularité architecturale au sommet du phare est mentionnée dans les textes médiévaux ?", "r": "Le sommet était couvert d'un dôme en bois construit par Ahmed Ibn Touloun, qui a été refait plusieurs fois à cause de sa fragilité."}, {"q": "Quelles fonctions remplissait le dôme en bois au sommet du phare ?", "r": "Il abritait la plus haute mosquée du monde musulman et servait d'observatoire avec quatre portes tournées vers les points cardinaux."}, {"q": "Qu'est-ce qu'un jumeau numérique dans le contexte de l'étude du phare ?", "r": "C'est une copie en trois dimensions du phare, faite à partir des blocs numérisés, qui permet de simuler des charges et des séismes sans rien casser."}, {"q": "Quel est le rôle de la Fondation Dassault Systèmes dans cette recherche ?", "r": "Elle soutient les chercheurs dans la construction du jumeau numérique du phare."}, {"q": "Quelle est la fonction principale de la mission proposée aux élèves avec de vrais blocs ?", "r": "Comparer deux tours : une tour droite et une tour en étages à base large et sommet plus léger."}, {"q": "Quelles sont les quatre contraintes imposées pour la construction et le test des deux tours ?", "r": "Même nombre de blocs, même hauteur, tests répétés à l'identique, et dire les limites du test."}, {"q": "Quels sont les trois tests physiques à réaliser sur chaque tour pour comparer leur résistance ?", "r": "Poser une charge au sommet, secouer doucement la table en comptant les secousses, et incliner lentement le plateau pour noter l'angle de bascule."}, {"q": "Pourquoi faut-il faire chaque test plusieurs fois de la même manière ?", "r": "Pour que la comparaison entre les deux tours soit juste."}, {"q": "Que doit contenir le verdict provisoire du groupe à la fin de l'expérience ?", "r": "Quelle forme résiste le mieux, pourquoi, et les limites de l'expérience (une tour de blocs n'est pas le vrai phare)."}, {"q": "Combien des sept merveilles du monde antique sont encore debout aujourd'hui selon la vidéo ?", "r": "Une seule : la grande pyramide de Gizeh."}, {"q": "À quoi servent les simulations numériques de structures pour les ingénieurs actuels ?", "r": "Avant de construire un pont, un immeuble ou un barrage, ils simulent les charges, vents et séismes pour savoir où le bâtiment risque de céder et comment le renforcer."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
