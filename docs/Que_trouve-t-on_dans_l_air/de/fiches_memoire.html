<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speicherblätter — Was liegt in der Luft?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Naturwissenschaften · Klasse 8 · 13–14 Jahre</div><h1>Speicherkarten</h1><p class="sous">Was finden wir in der Luft?</p><p class="sous">Lesen Sie die Frage, antworten Sie in Ihrem Kopf und klicken Sie dann auf das Blatt, um die Antwort zu sehen.</p><p class="noprint"><button class="sec" onclick="tout(true)">Alle anzeigen</button> <button class="sec" onclick="tout(false)">Versteckt alles</button></p><div id="c"></div></main><script>const C=[{"q": "Welche Gase machen die Luft aus?", "r": "Die Luft besteht hauptsächlich aus Distickstoff (78%) und Disauerstoff (21%)."}, {"q": "Wie hoch ist der Anteil anderer Gase als Stickstoff und Disauerstoff in der Luft?", "r": "1 %."}, {"q": "Wie verflüssigt man die Luft, um sie zu trennen?", "r": "Es wird auf etwa -196 Grad Celsius abgekühlt."}, {"q": "Wie hoch ist die Temperatur, bei der der verflüssigte Stickstoff in den gasförmigen Zustand zurückkehrt?", "r": "Distickstoff kehrte in den gasförmigen Zustand um -186 Grad Celsius zurück."}, {"q": "Wie wirkt sich Disauerstoff auf die Verbrennung aus?", "r": "Dioxygen speist Verbrennung, wie eine Kerze in einem Glas."}, {"q": "Welche Rolle spielt Stickstoff bei der Verbrennung?", "r": "Distickstoff ist nicht reaktiv und trägt nicht zur Verbrennung bei."}, {"q": "Was ist die ungefähre Masse eines Liters Luft?", "r": "Ein Liter Luft hat eine Masse von etwa 1,2 bis 1,3 Gramm."}, {"q": "Unter welchen Bedingungen kann die Masse eines Liters Luft gemessen werden?", "r": "Unter normalen Bedingungen."}, {"q": "Wie wirkt sich Luftfeuchtigkeit auf ihre Masse aus?", "r": "Nassluft ist etwas leichter als trockene Luft."}, {"q": "Wie wirkt sich die Temperatur auf die Masse eines Liters Luft aus?", "r": "Ein Liter heiße Luft ist leichter als ein Liter kalte Luft."}, {"q": "Wie wird Luft in der Industrie verwendet?", "r": "Disauerstoff wird in Krankenhäusern und Distickstoff in Lebensmittelverpackungen verwendet."}, {"q": "Warum hat die Luft eine Masse?", "r": "Weil es aus Gasen besteht, die eine Masse haben."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
