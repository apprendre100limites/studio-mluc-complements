<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — Que trouve-t-on dans l&#x27;air ?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 4ème</div><h1>Quiz</h1><p class="sous">Que trouve-t-on dans l&#x27;air ?</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Vérifier mes réponses</button> <button class="sec" onclick="refaire()">Recommencer</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "Quelle est la composition approximative de l'air en diazote ?", "choix": ["A) 21%", "D) 50%", "C) 1%", "B) 78%"], "bonne": 3, "explication": "L'air contient environ soixante-dix-huit pour cent de diazote."}, {"question": "Quel gaz est responsable de la rouille ?", "choix": ["D) Dioxyde de carbone", "A) Diazote", "B) Dioxygène", "C) Argon"], "bonne": 2, "explication": "Le dioxygène est responsable de la rouille."}, {"question": "Quelle est la masse approximative d'un litre d'air ?", "choix": ["A) 0.001 g", "D) 2 g", "B) 1 g", "C) 1.2 g"], "bonne": 3, "explication": "Un litre d'air a une masse d'environ un virgule deux à un virgule trois gramme."}, {"question": "Quelle est la proportion de dioxygène dans l'air après avoir regardé la vidéo ?", "choix": ["C) 1%", "D) 50%", "B) 78%", "A) 21%"], "bonne": 3, "explication": "Le dioxygène représente environ vingt et un pour cent de l'air."}, {"question": "Quel est l'exemple donné pour montrer que l'air a une masse ?", "choix": ["C) Un ballon et une balance", "D) Un ballon et un verre d'eau", "A) Un ballon gonflé et dégonflé", "B) Une balance et des poids"], "bonne": 0, "explication": "On pèse le ballon dégonflé, puis on le gonfle sans ajouter d'autre matière et on pèse à nouveau."}, {"question": "Quelle est la masse approximative d'air dans une chambre de 3x4x2.5 mètres ?", "choix": ["B) 10 kg", "C) 200 kg", "D) 500 kg", "A) 36 kg"], "bonne": 3, "explication": "Dans une chambre de trois mètres sur quatre, haute de deux mètres cinquante, il y a trente mille litres d'air, soit environ trente-six kilogrammes."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Juste. '+q.explication}else{e.innerHTML='❌ La bonne réponse : <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score : '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
