<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiches mémoire — Que trouve-t-on dans l&#x27;air ?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Sciences · Cycle 4 · niveau 4ème</div><h1>Fiches mémoire</h1><p class="sous">Que trouve-t-on dans l&#x27;air ?</p><p class="sous">Lis la question, réponds dans ta tête, puis clique sur la fiche pour voir la réponse.</p><p class="noprint"><button class="sec" onclick="tout(true)">Tout montrer</button> <button class="sec" onclick="tout(false)">Tout cacher</button></p><div id="c"></div></main><script>const C=[{"q": "Quels gaz composent principalement l'air ?", "r": "L'air est principalement composé de diazote (78%) et de dioxygène (21%)."}, {"q": "Quel est le pourcentage de gaz autres que le diazote et le dioxygène dans l'air ?", "r": "Un pour cent."}, {"q": "Comment liquéfier l'air pour le séparer ?", "r": "On le refroidit à environ -196 degrés Celsius."}, {"q": "Quelle est la température à laquelle le diazote liquéfié repasse à l'état gazeux ?", "r": "Le diazote repasse à l'état gazeux vers -186 degrés Celsius."}, {"q": "Quel est l'effet du dioxygène sur les combustions ?", "r": "Le dioxygène alimente les combustions, comme pour une bougie dans un bocal."}, {"q": "Quel est le rôle du diazote dans les combustions ?", "r": "Le diazote n'est pas réactif et ne participe pas aux combustions."}, {"q": "Quelle est la masse approximative d'un litre d'air ?", "r": "Un litre d'air a une masse d'environ 1,2 à 1,3 gramme."}, {"q": "Dans quel type de conditions peut-on mesurer la masse d'un litre d'air ?", "r": "Dans les conditions habituelles."}, {"q": "Quel est l'effet de l'humidité de l'air sur sa masse ?", "r": "L'air humide est légèrement plus léger que l'air sec."}, {"q": "Quel est l'effet de la température sur la masse d'un litre d'air ?", "r": "Un litre d'air chaud est plus léger qu'un litre d'air froid."}, {"q": "Comment l'air est-il utilisé dans l'industrie ?", "r": "Le dioxygène est utilisé dans les hôpitaux et le diazote est utilisé dans l'emballage des aliments."}, {"q": "Pourquoi l'air a-t-il une masse ?", "r": "Parce qu'il est composé de gaz qui ont une masse."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
