<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hojas de memoria — ¿Qué hay en el aire?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 2.º de ESO · 13-14 años</div><h1>Tarjetas de memoria</h1><p class="sous">¿Qué encontramos en el aire?</p><p class="sous">Lea la pregunta, responda en la cabeza, luego haga clic en la hoja para ver la respuesta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar todo</button> <button class="sec" onclick="tout(false)">Escóndelo todo.</button></p><div id="c"></div></main><script>const C=[{"q": "¿Qué gases componen el aire?", "r": "El aire consiste principalmente en dinitrógeno (78%) y dioxígeno (21%)."}, {"q": "¿Cuál es el porcentaje de gases distintos del nitrógeno y el dioxígeno en el aire?", "r": "Un por ciento."}, {"q": "¿Cómo licuar el aire para separarlo?", "r": "Está refrigerado a unos -196 grados Celsius."}, {"q": "¿Cuál es la temperatura a la que el nitrógeno licuado regresa al estado gaseoso?", "r": "Dinitrogen regresó al estado gaseoso alrededor de -186 grados Celsius."}, {"q": "¿Cuál es el efecto del dioxígeno en la combustión?", "r": "El dioxigeno alimenta la combustión, como una vela en un frasco."}, {"q": "¿Cuál es el papel del nitrógeno en la combustión?", "r": "El dintrógeno no es reactivo y no contribuye a la combustión."}, {"q": "¿Cuál es la masa aproximada de un litro de aire?", "r": "Un litro de aire tiene una masa de aproximadamente 1,2 a 1,3 gramos."}, {"q": "¿En qué tipo de condiciones se puede medir la masa de un litro de aire?", "r": "En condiciones normales."}, {"q": "¿Cuál es el efecto de la humedad del aire en su masa?", "r": "El aire húmedo es un poco más ligero que el aire seco."}, {"q": "¿Cuál es el efecto de la temperatura en la masa de un litro de aire?", "r": "Un litro de aire caliente es más ligero que un litro de aire frío."}, {"q": "¿Cómo se utiliza el aire en la industria?", "r": "El dioxigeno se utiliza en hospitales y el dinitrógeno se utiliza en envases alimenticios."}, {"q": "¿Por qué el aire tiene una masa?", "r": "Porque está compuesto de gases que tienen una masa."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
