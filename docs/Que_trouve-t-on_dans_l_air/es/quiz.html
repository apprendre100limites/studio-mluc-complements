<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz - ¿Qué hay en el aire?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciencias · 2.º de ESO · 13-14 años</div><h1>Quiz</h1><p class="sous">¿Qué encontramos en el aire?</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Revisa mis respuestas</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "¿Cuál es la composición aproximada del aire en nitrógeno?", "choix": ["A) 21%", "D) 50%", "C) 1%", "B) 78%"], "bonne": 3, "explication": "El aire contiene aproximadamente el setenta y ocho por ciento de nitrógeno."}, {"question": "¿Qué gas es responsable de la oxidación?", "choix": ["(D) Carbon dioxide", "A) Nitrógeno", "(B) Dioxygen", "(C) Argon"], "bonne": 2, "explication": "El dioxigeno es responsable de la oxidación."}, {"question": "¿Cuál es la masa aproximada de un litro de aire?", "choix": ["A) 0,001 g", "D) 2 g", "B) 1 g", "C) 1.2 g"], "bonne": 3, "explication": "Un litro de aire tiene una masa de aproximadamente un decimal de dos a uno decimal tres gramos."}, {"question": "¿Cuál es la proporción de dioxigeno en el aire después de ver el vídeo?", "choix": ["C) 1%", "D) 50%", "B) 78%", "A) 21%"], "bonne": 3, "explication": "El dioxigeno representa alrededor del veintiún por ciento del aire."}, {"question": "¿Cuál es el ejemplo dado para demostrar que el aire tiene una masa?", "choix": ["C) Una pelota y un equilibrio", "D) Un globo y un vaso de agua", "A) Un globo hinchado y deflado", "B) Saldo y pesos"], "bonne": 0, "explication": "Pesamos el globo deflado, luego lo inflamos sin añadir ningún otro material y lo pondremos de nuevo."}, {"question": "¿Cuál es la masa aproximada de aire en una habitación de 3x4x2.5 metros?", "choix": ["B) 10 kg", "C) 200 kg", "D) 500 kg", "A) 36 kg"], "bonne": 3, "explication": "En una habitación de tres por cuatro metros de altura, de dos por cincuenta metros de altura, hay treinta mil litros de aire, unos treinta y seis kilogramos."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Cierto. '+q.explication}else{e.innerHTML='❌ La respuesta correcta: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Puntuación: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
