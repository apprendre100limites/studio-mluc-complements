<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मेमोरी शीट्स — हवा में क्या है?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · विज्ञान · कक्षा 8 · आयु 13–14 वर्ष</div><h1>मेमोरी कार्ड</h1><p class="sous">क्या हम हवा में पाते हैं?</p><p class="sous">प्रश्न पढ़ें, अपने सिर में उत्तर दें, फिर जवाब देखने के लिए शीट पर क्लिक करें।</p><p class="noprint"><button class="sec" onclick="tout(true)">सब दिखाओ</button> <button class="sec" onclick="tout(false)">यह सब</button></p><div id="c"></div></main><script>const C=[{"q": "क्या गैसें हवा को बनाती हैं?", "r": "हवा मुख्य रूप से dinitrogen (78%) और dioxygen (21%) के होते हैं।"}, {"q": "वायु में नाइट्रोजन और डाइऑक्सीजन के अलावा अन्य गैसों का प्रतिशत क्या है?", "r": "एक प्रतिशत।"}, {"q": "हवा को कैसे अलग करने के लिए?", "r": "यह लगभग -196 डिग्री सेल्सियस तक ठंडा है।"}, {"q": "क्या तापमान जिस पर तरलीकृत नाइट्रोजन गैसीय अवस्था में वापस आता है?", "r": "Dinitrogen लगभग -186 डिग्री सेल्सियस के आसपास गैसीय अवस्था में लौट आए।"}, {"q": "दहन पर डाइऑक्सीजन का क्या प्रभाव है?", "r": "Dioxygen एक जार में एक मोमबत्ती की तरह दहन फ़ीड।"}, {"q": "दहन में नाइट्रोजन की भूमिका क्या है?", "r": "Dinitrogen प्रतिक्रियाशील नहीं है और दहन में योगदान नहीं करता है।"}, {"q": "हवा के एक लीटर का अनुमानित द्रव्यमान क्या है?", "r": "हवा का एक लीटर लगभग 1.2 से 1.3 ग्राम है।"}, {"q": "किस प्रकार की स्थितियों में हवा के एक लीटर का द्रव्यमान मापा जा सकता है?", "r": "सामान्य परिस्थितियों में।"}, {"q": "इसके द्रव्यमान पर वायु नमी का प्रभाव क्या है?", "r": "गीले हवा शुष्क हवा से थोड़ा हल्का है।"}, {"q": "हवा के एक लीटर के द्रव्यमान पर तापमान का प्रभाव क्या है?", "r": "गर्म हवा का एक लीटर ठंडी हवा की तुलना में हल्का है।"}, {"q": "उद्योग में हवा का उपयोग कैसे किया जाता है?", "r": "Dioxygen अस्पतालों में प्रयोग किया जाता है और dinitrogen खाद्य पैकेजिंग में प्रयोग किया जाता है।"}, {"q": "क्यों हवा में द्रव्यमान होता है?", "r": "क्योंकि यह उन गैसों से बना है जिनमें द्रव्यमान होता है।"}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
