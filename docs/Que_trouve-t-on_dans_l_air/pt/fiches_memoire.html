<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folhas de memória — O que está no ar?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Ciências · 8.º ano · 13-14 anos</div><h1>Cartões de memória</h1><p class="sous">O que encontramos no ar?</p><p class="sous">Leia a pergunta, responda na cabeça e clique na folha para ver a resposta.</p><p class="noprint"><button class="sec" onclick="tout(true)">Mostrar tudo</button> <button class="sec" onclick="tout(false)">Esconder tudo.</button></p><div id="c"></div></main><script>const C=[{"q": "Que gases compõem o ar?", "r": "O ar consiste principalmente em dinitrogênio (78%) e dioxigênio (21%)."}, {"q": "Qual é a percentagem de gases que não o azoto e o dioxigénio no ar?", "r": "Um por cento."}, {"q": "Como liquefazer o ar para separá-lo?", "r": "É refrigerado a cerca de -196 graus Celsius."}, {"q": "Qual é a temperatura em que o azoto liquefeito regressa ao estado gasoso?", "r": "O dinitrogênio retornou ao estado gasoso em torno de -186 graus Celsius."}, {"q": "Qual é o efeito do dioxigénio na combustão?", "r": "Dioxigênio alimenta combustão, como uma vela num frasco."}, {"q": "Qual é o papel do azoto na combustão?", "r": "O dinitrogénio não é reactivo e não contribui para a combustão."}, {"q": "Qual é a massa aproximada de um litro de ar?", "r": "Um litro de ar tem uma massa de cerca de 1,2 a 1,3 gramas."}, {"q": "Em que tipo de condições se pode medir a massa de um litro de ar?", "r": "Em condições normais."}, {"q": "Qual é o efeito da umidade do ar na sua massa?", "r": "O ar úmido é ligeiramente mais leve do que o ar seco."}, {"q": "Qual é o efeito da temperatura na massa de um litro de ar?", "r": "Um litro de ar quente é mais leve do que um litro de ar frio."}, {"q": "Como o ar é utilizado na indústria?", "r": "O dioxigénio é utilizado em hospitais e o dinitrogénio é utilizado em embalagens de alimentos."}, {"q": "Porque é que o ar tem massa?", "r": "Porque é composto de gases que têm uma massa."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
