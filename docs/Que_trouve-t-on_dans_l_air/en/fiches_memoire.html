<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Sheets — What's in the air?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 9 · ages 13–14</div><h1>Memory cards</h1><p class="sous">What do we find in the air?</p><p class="sous">Read the question, answer in your head, then click on the sheet to see the answer.</p><p class="noprint"><button class="sec" onclick="tout(true)">Show all</button> <button class="sec" onclick="tout(false)">Hide it all</button></p><div id="c"></div></main><script>const C=[{"q": "What gases make up the air?", "r": "The air consists mainly of dinitrogen (78%) and dioxygen (21%)."}, {"q": "What is the percentage of gases other than nitrogen and dioxygen in the air?", "r": "One percent."}, {"q": "How to liquefy the air to separate it?", "r": "It is cooled to about -196 degrees Celsius."}, {"q": "What is the temperature at which the liquefied nitrogen returns to the gaseous state?", "r": "Dinitrogen returned to the gaseous state around -186 degrees Celsius."}, {"q": "What is the effect of dioxygen on combustion?", "r": "Dioxygen feeds combustion, like a candle in a jar."}, {"q": "What is the role of nitrogen in combustion?", "r": "Dinitrogen is not reactive and does not contribute to combustion."}, {"q": "What is the approximate mass of a litre of air?", "r": "A litre of air has a mass of about 1.2 to 1.3 grams."}, {"q": "Under what type of conditions can the mass of a litre of air be measured?", "r": "Under normal conditions."}, {"q": "What is the effect of air moisture on its mass?", "r": "Wet air is slightly lighter than dry air."}, {"q": "What is the effect of temperature on the mass of a litre of air?", "r": "A liter of hot air is lighter than a liter of cold air."}, {"q": "How is air used in industry?", "r": "Dioxygen is used in hospitals and dinitrogen is used in food packaging."}, {"q": "Why does the air have a mass?", "r": "Because it is composed of gases that have a mass."}];let h='';C.forEach((c,i)=>{h+='<div class="carte fiche" onclick="this.classList.toggle(\'ouverte\')" style="cursor:pointer">'
+'<b>'+c.q.replace(/</g,'&lt;')+'</b><div class="rep" style="display:none;margin-top:.5em">'+c.r.replace(/</g,'&lt;')+'</div></div>'});
document.getElementById('c').innerHTML=h;
document.addEventListener('click',()=>{document.querySelectorAll('.fiche').forEach(f=>{f.querySelector('.rep').style.display=f.classList.contains('ouverte')?'block':'none'})});
function tout(v){document.querySelectorAll('.fiche').forEach(f=>f.classList.toggle('ouverte',v));document.querySelectorAll('.fiche .rep').forEach(r=>r.style.display=v?'block':'none')}</script></body></html>
