<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz — What's in the air?</title><style>
:root{--fond:#fbfaf7;--texte:#1d2430;--doux:#5b6574;--trait:#d9d6cc;--accent:#1f6fb2;--carte:#fff}
@media (prefers-color-scheme:dark){:root{--fond:#12161c;--texte:#e8ecf2;--doux:#9aa5b5;--trait:#2c3440;--accent:#6bb6ff;--carte:#1a2029}}
*{box-sizing:border-box}body{margin:0;background:var(--fond);color:var(--texte);font:18px/1.55 -apple-system,"Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.marque{font-size:13px;letter-spacing:.08em;color:var(--doux);text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:.3em 0 .1em}h2{font-size:21px;margin:1.6em 0 .4em;color:var(--accent)}
.sous{color:var(--doux);margin:0 0 1.4em}
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:14px 18px;margin:12px 0}
.retenir{border-left:5px solid var(--accent)}.attention{border-left:5px solid #d9822b}
ul{padding-left:1.2em}li{margin:.35em 0}
button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--accent)}
a{color:var(--accent)}
@media print{body{background:#fff;color:#000;font-size:12pt}.noprint{display:none}main{padding:0}.carte{break-inside:avoid}}
</style></head><body><main><div class="marque">M'Luc · Science · Year 9 · ages 13–14</div><h1>Quiz</h1><p class="sous">What do we find in the air?</p><div id="q"></div><p class="noprint"><button onclick="verifier()">Check my answers</button> <button class="sec" onclick="refaire()">Restart</button></p><h2 id="score"></h2></main><script>const Q=[{"question": "What is the approximate composition of the air in nitrogen?", "choix": ["A) 21%", "D) 50%", "C) 1%", "B) 78%"], "bonne": 3, "explication": "Air contains approximately seventy-eight percent of nitrogen."}, {"question": "What gas is responsible for the rust?", "choix": ["(D) Carbon dioxide", "(A) Nitrogen", "(B) Dioxygen", "(C) Argon"], "bonne": 2, "explication": "Dioxygen is responsible for rust."}, {"question": "What is the approximate mass of a litre of air?", "choix": ["A) 0.001 g", "D) 2 g", "B) 1 g", "C) 1.2 g"], "bonne": 3, "explication": "One litre of air has a mass of approximately one decimal two to one decimal three grams."}, {"question": "What is the proportion of dioxygen in the air after watching the video?", "choix": ["C) 1%", "D) 50%", "B) 78%", "A) 21%"], "bonne": 3, "explication": "Dioxygen represents about twenty-one percent of the air."}, {"question": "What is the example given to show that air has a mass?", "choix": ["C) A ball and a balance", "D) A balloon and a glass of water", "A) A balloon swollen and deflated", "B) Balance and weights"], "bonne": 0, "explication": "We weigh the deflated balloon, then we inflate it without adding any other material and we weigh it again."}, {"question": "What is the approximate mass of air in a room of 3x4x2.5 meters?", "choix": ["B) 10 kg", "C) 200 kg", "D) 500 kg", "A) 36 kg"], "bonne": 3, "explication": "In a three-by-four-metre-high room, two-by-fifty metres high, there are thirty thousand litres of air, about thirty-six kilograms."}];const box=document.getElementById('q');let h='';
Q.forEach((q,i)=>{h+='<div class="carte"><b>'+(i+1)+'. '+q.question.replace(/</g,'&lt;')+'</b>';
q.choix.forEach((c,k)=>{h+='<label style="display:block;margin:.4em 0"><input type="radio" name="q'+i+'" value="'+k+'"> '+c.replace(/</g,'&lt;')+'</label>'});
h+='<div class="ex" id="e'+i+'" style="display:none;margin-top:.5em"></div></div>'});
box.innerHTML=h;
function verifier(){let ok=0;Q.forEach((q,i)=>{const r=document.querySelector('input[name=q'+i+']:checked');const e=document.getElementById('e'+i);
e.style.display='block';if(r&&+r.value===q.bonne){ok++;e.innerHTML='✅ Right. '+q.explication}else{e.innerHTML='❌ The right answer: <b>'+q.choix[q.bonne]+'</b>. '+q.explication}});
document.getElementById('score').textContent='Score: '+ok+' / '+Q.length;window.scrollTo(0,document.body.scrollHeight)}
function refaire(){location.reload()}</script></body></html>
